[package]
name = "mahayana-host-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mahayana-app-host"
path = "src/main.rs"

[dependencies]
mahayana-unified-app-host = { path = "../../third_party/mahayana/mahayana-rs/mahayana-unified-app-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
