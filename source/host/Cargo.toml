[package]
name = "mahayana-host-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
futures = "0.3"
notify = "8.2.0"
fs2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
rcgen = "0.13"
pretty_assertions = "1"
