[package]
name = "mahayana-app-host-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mahayana-app-host"
path = "src/main.rs"

[dependencies]
mahayana-host-runtime = { path = ".." }
mahayana-unified-app-host = { path = "../../mahayana/mahayana-rs/mahayana-unified-app-host" }
serde_json = "1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[profile.ci]
inherits = "test"
debug = 0
incremental = true
codegen-units = 256

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "debuginfo"
