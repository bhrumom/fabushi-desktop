name: Host catalog Mini App verifier
on:
  pull_request:
    paths:
      - 'source/host/src/extensions/mcp/installable_package.rs'
      - 'source/host/src/extensions/mcp/installable_package/**'
      - 'source/host/Cargo.toml'
      - 'docs/specs/desktop-catalog-package-installation.md'
      - '.github/workflows/miniapp-host-ci.yml'
  push:
    branches: [main]
    paths:
      - 'source/host/src/extensions/mcp/installable_package.rs'
      - 'source/host/src/extensions/mcp/installable_package/**'
      - 'source/host/Cargo.toml'
permissions:
  contents: read
  actions: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
      - name: Download immutable production-signed interoperability fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api repos/bhrumom/fabushi-backend/actions/artifacts/11797530939/zip > signed-delivery.zip; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          echo 'b4fb72cfcdec50acd4c4a648f44699813c3b31cbbd0080445a6057fb4578c64e  signed-delivery.zip' | sha256sum -c -
          unzip signed-delivery.zip global-dandelion-0.1.0.fabapp -d signed-fixture
      - name: Read public production signed trust feed
        run: curl --fail --silent --show-error --retry 2 --max-time 20 https://api.ombhrum.com/v1/extensions/install-trust > signed-fixture/production-trust.json
      - name: Check canonical formatting without modifying exact source
        run: rustfmt --check --edition 2024 source/host/src/extensions/mcp/installable_package.rs
      - name: Export canonical formatting repair for review
        if: failure()
        run: |
          rustfmt --edition 2024 source/host/src/extensions/mcp/installable_package.rs
          git diff -- source/host/src/extensions/mcp/installable_package.rs source/host/src/extensions/mcp/installable_package > "$RUNNER_TEMP/host-miniapp-format.patch"
      - name: Verify existing Host library contracts
        if: always()
        env:
          FABUSHI_SIGNED_HOST_FIXTURE: ${{ github.workspace }}/signed-fixture/global-dandelion-0.1.0.fabapp
          FABUSHI_PRODUCTION_TRUST_FIXTURE: ${{ github.workspace }}/signed-fixture/production-trust.json
          FABUSHI_APPROVED_PUBLIC_ACCEPTANCE: '1'
        run: cargo test --manifest-path source/host/Cargo.toml --lib installable_package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-miniapp-verifier-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/host-miniapp-format.patch
            source/host/src/extensions/mcp/installable_package.rs
            source/host/src/extensions/mcp/installable_package/ledger.rs
            source/host/src/extensions/mcp/installable_package/policy.rs
