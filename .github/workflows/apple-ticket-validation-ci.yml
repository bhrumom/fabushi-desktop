name: Apple ticket validation contract
on:
  pull_request:
    paths:
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - '.github/scripts/validate-apple-ticket*'
      - '.github/workflows/apple-ticket-validation-ci.yml'
      - '.github/workflows/release-macos-main.yml'
      - 'docs/specs/macos-ticket-validation-retry.md'
      - '.github/scripts/miniapp-release-evidence*'
      - '.github/scripts/miniapp-save-report.applescript'
      - '.github/scripts/promote-miniapp-candidate*'
  push:
    branches: [main]
    paths:
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - '.github/scripts/validate-apple-ticket*'
      - '.github/scripts/miniapp-release-evidence*'
      - '.github/scripts/miniapp-save-report.applescript'
      - '.github/scripts/promote-miniapp-candidate*'
      - '.github/workflows/release-macos-main.yml'
permissions:
  contents: read
jobs:
  bounded-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test .github/scripts/validate-apple-ticket.test.mjs
      - run: node --test .github/scripts/miniapp-release-evidence.test.mjs
      - run: node --test .github/scripts/promote-miniapp-candidate.test.mjs
