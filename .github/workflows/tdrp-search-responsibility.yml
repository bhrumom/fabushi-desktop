name: TDRP canonical Search responsibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck shipping renderer
        working-directory: desktop
        run: npm run typecheck
      - name: Verify canonical participant replacement and dedupe
        working-directory: desktop
        run: npx playwright test e2e/tdrp-canonical-search-contract.spec.ts --workers=1

      - name: Record exact-head Search evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tdrp-search
          cat > artifacts/tdrp-search/evidence.json <<JSON
          {
            "project_id": "TDRP-001",
            "spec_revision": 9,
            "responsibility_id": "TDRP-R9-SEARCH-ROW-REPLACEMENT-001",
            "head_sha": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_commit": "f23c37857220eb84f8559f0901ea26fb304b564b",
            "implementation_path": "frontend/src/production/command-palette-model.ts",
            "contract_test": "desktop/e2e/tdrp-canonical-search-contract.spec.ts",
            "typecheck": "desktop npm run typecheck",
            "status": "passed"
          }
          JSON

      - name: Upload canonical Search evidence
        uses: actions/upload-artifact@v4
        with:
          name: tdrp-canonical-search-${{ github.sha }}
          path: artifacts/tdrp-search
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  independent-review:
    name: Independent Search responsibility review
    needs: canonical-search
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event SHA independently
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Download producer evidence
        uses: actions/download-artifact@v4
        with:
          name: tdrp-canonical-search-${{ github.sha }}
          path: artifacts/tdrp-search-producer
      - name: Independently review source, contract, and provenance
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('artifacts/tdrp-search-producer/evidence.json', 'utf8'));
          if (evidence.head_sha !== process.env.GITHUB_SHA) throw new Error('Search evidence HEAD drift');
          if (evidence.source_commit !== 'f23c37857220eb84f8559f0901ea26fb304b564b') throw new Error('Search source authority drift');
          if (evidence.status !== 'passed') throw new Error('Search producer did not pass');
          const implementation = fs.readFileSync('frontend/src/production/command-palette-model.ts', 'utf8');
          const contract = fs.readFileSync('desktop/e2e/tdrp-canonical-search-contract.spec.ts', 'utf8');
          for (const required of [
            'const indexById = new Map<string, number>();',
            'deduped[existing] = agent;',
            'const canonicalAgents = dedupeCommandPaletteAgents(agents);'
          ]) if (!implementation.includes(required)) throw new Error('missing canonical Search invariant: ' + required);
          for (const required of [
            'canonical participant identity replaces stale rows without duplicate search results',
            'latest replacement controls hidden/visible projection without parallel participant roots'
          ]) if (!contract.includes(required)) throw new Error('missing Search contract case: ' + required);
          NODE
      - name: Record independent review verdict
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tdrp-search-review
          cat > artifacts/tdrp-search-review/review-verdict.json <<JSON
          {
            "project_id": "TDRP-001",
            "spec_revision": 9,
            "responsibility_id": "TDRP-R9-SEARCH-ROW-REPLACEMENT-001",
            "head_sha": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "review_scope": "independent-downstream-job-clean-checkout",
            "producer_artifact": "tdrp-canonical-search-${GITHUB_SHA}",
            "source_commit": "f23c37857220eb84f8559f0901ea26fb304b564b",
            "verdict": "ACCEPT"
          }
          JSON
      - name: Upload independent Search review
        uses: actions/upload-artifact@v4
        with:
          name: tdrp-canonical-search-review-${{ github.sha }}
          path: artifacts/tdrp-search-review
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
