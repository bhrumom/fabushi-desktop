name: OCRM stage reviewed Git objects

on:
  push:
    branches: ['codex/openclaw-rust-fusion-chat-20261101-writer']
    paths:
      - '.github/ocrm-reviewed-objects/**'
      - '.github/workflows/ocrm-stage-reviewed-objects.yml'

permissions:
  contents: read

jobs:
  stage-reviewed-object:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Stage the frozen channel and fixture Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          folder = Path('.github/ocrm-reviewed-objects')
          declared = json.loads((folder / 'manifest.json').read_text())
          expected_base = '8a4612e2042eefa32f12763c17141daabfd452e3'
          expected_tree = '1a28595296545363c11d5d99452e391c0b9c5f19'
          expected_patch = '9b0fbf2e8f9643d5c921b35364d6eb54d14cbbb4d719c53f480795f83b0e0795'
          target_paths = {
              '.github/workflows/rust-desktop-runtime.yml',
              'projects/openclaw-rust/docs/specs/channel-inbound-worker-handoff.md',
              'projects/openclaw-rust/docs/specs/cron-session-reaper.md',
              'projects/openclaw-rust/parity-ledger.json',
              'projects/openclaw-rust/requirements-traceability-matrix.json',
              'source/host/app/src/main.rs',
              'source/host/app/src/tests/channel_failure_handoff_tests.rs',
              'source/host/app/src/tests/channel_failure_readiness_tests.rs',
              'source/host/app/src/tests/channel_host_lane_tests.rs',
              'source/host/src/extensions/transcript/background_wakes.rs',
              'source/host/tests/automation_spend_guard_runtime_contract.rs',
              'source/host/tests/background_wakes_production_contract.rs',
              'projects/openclaw-rust/docs/specs/memory-append-read-integrity.md',
          }
          part_paths = [f'.github/ocrm-reviewed-objects/scope-{index:02d}.patch' for index in range(8)]
          carrier_paths = set(part_paths) | {
              '.github/ocrm-reviewed-objects/manifest.json',
              '.github/workflows/ocrm-stage-reviewed-objects.yml',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          evidence = Path('.evidence/ocrm-staged-objects.json')
          evidence.parent.mkdir(exist_ok=True)
          receipt = {
              'kind': 'reviewed-git-object-staging',
              'carrier_commit': os.environ['CARRIER_SHA'],
              'base_commit': expected_base, 'candidate_tree': expected_tree,
              'patch_sha256': expected_patch, 'objects': [], 'result': 'incomplete',
              'product_validation_executed_by_staging_job': False,
              'branch_or_commit_mutation_by_staging_job': False,
          }
          def save():
              evidence.write_text(json.dumps(receipt, indent=2) + '\n')
          save()
          assert declared['repository'] == os.environ['GITHUB_REPOSITORY'] == 'bhrumom/fabushi-desktop'
          assert declared['branch'] == 'codex/openclaw-rust-fusion-chat-20261101-writer'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + declared['branch']
          assert declared['task_id'] == 'd56b3d1d-6125-4f6f-a8d8-e7e36728a1ba' and declared['round'] == 2
          assert declared['base_commit'] == expected_base and declared['candidate_tree'] == expected_tree
          assert git('rev-parse', 'HEAD') == os.environ['CARRIER_SHA']
          assert git('rev-list', '--parents', '-n', '1', 'HEAD').split() == [os.environ['CARRIER_SHA'], expected_base]
          carrier_changes = [line.split('\t', 1) for line in git('diff', '--name-status', expected_base, 'HEAD').splitlines()]
          assert len(carrier_changes) == len(carrier_paths) and all(status == 'A' for status, _ in carrier_changes)
          assert {path for _, path in carrier_changes} == carrier_paths
          targets = declared['targets']
          assert len(targets) == len(target_paths) and {target['path'] for target in targets} == target_paths
          assert [part['path'] for part in declared['patch_parts']] == part_paths
          for target in targets:
              assert target['mode'] == '100644'
              before = git('ls-tree', 'HEAD', '--', target['path'])
              if target['before_blob'] is None:
                  assert before == ''
              else:
                  assert before.split('\t', 1) == ['100644 blob ' + target['before_blob'], target['path']]
          chunks = []
          for part in declared['patch_parts']:
              raw = Path(part['path']).read_bytes()
              assert len(raw) == part['bytes'] and hashlib.sha256(raw).hexdigest() == part['sha256']
              chunks.append(raw)
          patch_bytes = b''.join(chunks)
          assert len(patch_bytes) == declared['patch_bytes'] == 242974
          assert hashlib.sha256(patch_bytes).hexdigest() == declared['patch_sha256'] == expected_patch
          patch = evidence.parent / 'reviewed-scope.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert len(changed) == len(target_paths) and set(changed) == target_paths
          subprocess.run(['git', 'update-index', '--force-remove', '--', *sorted(carrier_paths)], check=True)
          assert git('write-tree') == expected_tree
          for target in targets:
              raw = Path(target['path']).read_bytes()
              assert len(raw) == target['after_bytes']
              assert git('hash-object', target['path']) == target['after_blob']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for target in targets:
              raw = Path(target['path']).read_bytes()
              body = json.dumps({'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/bhrumom/fabushi-desktop/git/blobs', data=body,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with opener.open(request, timeout=60) as response:
                  uploaded = json.load(response)
              assert uploaded['sha'] == target['after_blob']
              record = {'path': target['path'], 'git_blob': uploaded['sha'], 'bytes': len(raw)}
              receipt['objects'].append(record)
              save()
              print('GIT_OBJECT_STAGED ' + json.dumps(record, sort_keys=True), flush=True)
          receipt['result'] = 'staged'
          save()
          print('REVIEWED_GIT_OBJECTS_STAGED ' + json.dumps(receipt, sort_keys=True), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ocrm-staged-objects-${{ github.sha }}
          path: .evidence/ocrm-staged-objects.json
          if-no-files-found: error
          retention-days: 30
