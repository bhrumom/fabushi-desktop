name: Round4 retained runtime live transport
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/workflows/round4-retained-runtime-live.yml'
permissions:
  contents: read
jobs:
  retained-runtime-live-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact source and reviewed test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:source/mahayana/mahayana-rs/providers/telegram-runtime/tests/runtime_ffi.rs)" = "f6234339c3a1d644f7f06c08e36635c7a851c882"
          mkdir -p artifacts/retained-runtime-live
          git rev-parse HEAD > artifacts/retained-runtime-live/target-sha.txt
          git ls-tree -r HEAD -- source/mahayana/mahayana-rs/providers/telegram-runtime source/mahayana/mahayana-rs/providers/telegram-protocol source/mahayana/mahayana-rs/providers/telegram-network source/mahayana/mahayana-rs/providers/telegram-core source/mahayana/mahayana-rs/providers/telegram-storage source/mahayana/mahayana-rs/Cargo.toml source/mahayana/mahayana-rs/Cargo.lock projects/telegram-desktop-rust/upstream.lock.json > artifacts/retained-runtime-live/input-git-objects.txt
          sha256sum source/mahayana/mahayana-rs/Cargo.lock source/mahayana/mahayana-rs/providers/telegram-runtime/tests/runtime_ffi.rs > artifacts/retained-runtime-live/input-sha256.txt
          printf '%s\n' 'NMR-FFI-LIVE-01: existing Rust client bootstrap, fresh production DC2 MTProto auth key, encrypted ping, connected status and close. No account login/message, exported C call, persisted restart, installed consumer or final product acceptance.' > artifacts/retained-runtime-live/scope.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/mahayana/mahayana-rs -> target
          shared-key: retained-direct-ffi-ubuntu-1.97.1
      - name: Execute the existing production DC transport case
        shell: bash
        run: |
          set -euo pipefail
          rustc --version > artifacts/retained-runtime-live/toolchain.txt
          cargo --version >> artifacts/retained-runtime-live/toolchain.txt
          printf '%s\n' 'cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-runtime --test runtime_ffi live_runtime_bootstrap_keeps_an_encrypted_transport_session -- --ignored --exact --nocapture --test-threads=1' > artifacts/retained-runtime-live/command.txt
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-runtime --test runtime_ffi live_runtime_bootstrap_keeps_an_encrypted_transport_session -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee artifacts/retained-runtime-live/runtime-live.log
          grep -Fx 'test live_runtime_bootstrap_keeps_an_encrypted_transport_session ... ok' artifacts/retained-runtime-live/runtime-live.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 15 filtered out; finished in [0-9]+([.][0-9]+)?s$' artifacts/retained-runtime-live/runtime-live.log
          git diff --exit-code -- source/mahayana/mahayana-rs/Cargo.lock
      - name: Preserve exact live transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-runtime-live-transport-${{ github.sha }}
          path: artifacts/retained-runtime-live
          if-no-files-found: error
          retention-days: 30
