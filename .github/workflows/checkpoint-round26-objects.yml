name: Round26 exact reviewed objects
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/checkpoint-round26-object-ops.json'
      - '.github/workflows/checkpoint-round26-objects.yml'
permissions:
  contents: read
jobs:
  prepare-reviewed-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare only reviewed deltas from the exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const hash = b => crypto.createHash('sha1').update(Buffer.from('blob ' + b.length + '\0')).update(b).digest('hex');
          const equal = (a,b) => JSON.stringify(a) === JSON.stringify(b);
          const opsBytes = fs.readFileSync('.github/checkpoint-round26-object-ops.json');
          const ops = JSON.parse(opsBytes);
          assert.equal(process.env.GITHUB_REPOSITORY, 'bhrumom/fabushi-desktop');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1');
          assert.equal(ops.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(ops.format_version, 1);
          assert.equal(ops.task_id, '20bf9475-a885-4314-b509-bea53ef8849f');
          assert.equal(ops.round, 26);
          const ids = new Set(['FBCP-NMR-001','TDRP-UPDATER-DISCOVERY-AUTHORITY-001']);
          const keys = new Set(['fabushi_target_paths','requirement_ids','oracle_ids','temporal_case_ids',
            'contract_case_ids','ui_functional_case_ids','accessibility_case_ids','regression_ids',
            'production_evidence','test_evidence','test_execution_evidence']);
          const paths = new Set(['.github/workflows/native-service-contracts.yml',
            'source/host/tests/session_gateway_contract.rs', 'docs/specs/fbcp-native-message-reconciliation.md',
            'projects/fabushi-communication-platform/quality/requirements-traceability-matrix.md',
            'projects/fabushi-communication-platform/current-owner-inventory.md',
            'projects/fabushi-communication-platform/STATUS.md', 'projects/telegram-desktop-rust/STATUS.md']);
          assert.equal(ops.ledger_path, 'projects/telegram-desktop-rust/parity-ledger.json');
          assert.deepEqual(new Set(ops.rows.map(row => row.id)), ids);
          assert.equal(ops.rows.length, ids.size);
          assert.deepEqual(new Set(ops.files.map(file => file.path)), paths);
          assert.equal(ops.files.length, paths.size);
          fs.mkdirSync('artifacts/round26-objects', {recursive:true});
          const objects = [];
          function read(path) {
            const bytes = fs.readFileSync(path);
            const git = execFileSync('git',['rev-parse',process.env.GITHUB_SHA + ':' + path],{encoding:'utf8'}).trim();
            assert.equal(hash(bytes), git, 'checkout differs from exact Git source: ' + path);
            return bytes;
          }
          function prepare(path, input, text) {
            const output = Buffer.from(text);
            const index = objects.length;
            const body = process.env.RUNNER_TEMP + '/round26-object-' + index + '.json';
            fs.writeFileSync(body, JSON.stringify({content:text,encoding:'utf-8'}));
            fs.writeFileSync('artifacts/round26-objects/output-' + index + '.txt', output);
            objects.push({path,input_blob:hash(input),output_blob:hash(output),
              output_sha256:crypto.createHash('sha256').update(output).digest('hex'),body,
              changed:!input.equals(output)});
          }
          const input = read(ops.ledger_path);
          const original = JSON.parse(input);
          assert.equal(original.upstream_commit, ops.fixed_upstream);
          const changed = structuredClone(original);
          for (const op of ops.rows) {
            const rows = changed.rows.filter(row => row.responsibility_id === op.id);
            assert.equal(rows.length,1);
            const row = rows[0];
            assert.equal(row.source_commit,ops.fixed_upstream);
            for (const [key,values] of Object.entries(op.append)) {
              assert.ok(keys.has(key),'undeclared ledger field: ' + key);
              assert.ok(Array.isArray(row[key]) && Array.isArray(values));
              for (const value of values) {
                assert.equal(typeof value,'string');
                if (!row[key].some(old => equal(old,value))) row[key].push(value);
              }
            }
            assert.equal(typeof row.notes,'string');
            assert.equal(typeof op.note,'string');
            if (!row.notes.includes(op.note)) row.notes += op.note;
          }
          for (const key of Object.keys(original)) if (key !== 'rows') assert.deepEqual(changed[key],original[key],key);
          assert.equal(changed.rows.length,original.rows.length);
          for (let index=0; index<original.rows.length; index+=1) {
            const before=original.rows[index], after=changed.rows[index];
            assert.equal(after.responsibility_id,before.responsibility_id);
            if (!ids.has(before.responsibility_id)) { assert.deepEqual(after,before); continue; }
            for (const key of Object.keys(before)) {
              if (key === 'notes') assert.ok(after.notes.startsWith(before.notes));
              else if (keys.has(key)) assert.deepEqual(after[key].slice(0,before[key].length),before[key]);
              else assert.deepEqual(after[key],before[key],key);
            }
          }
          prepare(ops.ledger_path,input,JSON.stringify(changed,null,2)+'\n');
          for (const file of ops.files) {
            const input=read(file.path);
            let text=input.toString('utf8');
            for (const replacement of file.replacements ?? []) {
              assert.equal(typeof replacement.before,'string');
              assert.equal(typeof replacement.after,'string');
              assert.notEqual(replacement.before,replacement.after);
              const count=text.split(replacement.before).length-1;
              if (count === 1) text=text.replace(replacement.before,replacement.after);
              else {
                assert.equal(count,0,'ambiguous old context: '+file.path);
                assert.equal(text.split(replacement.after).length-1,1,'concurrent context conflict: '+file.path);
              }
            }
            if (file.append) {
              assert.equal(typeof file.append.marker,'string');
              assert.equal(typeof file.append.text,'string');
              assert.ok(file.append.text.includes(file.append.marker));
              const count=text.split(file.append.marker).length-1;
              if (count === 0) text+=(text.endsWith('\n')?'':'\n')+file.append.text;
              else { assert.equal(count,1); assert.ok(text.includes(file.append.text),'conflicting append: '+file.path); }
            }
            prepare(file.path,input,text);
          }
          fs.writeFileSync('artifacts/round26-objects/receipt.json',JSON.stringify({
            task_id:ops.task_id,round:26,producer_sha:process.env.GITHUB_SHA,ops_blob:hash(opsBytes),objects,
            source_reviews_preserved:true,unrelated_rows_preserved:true,acceptance_fields_preserved:true,
            product_validation:false,source_acceptance:false,commit_created:false,ref_updated:false,
            integration:'Root reads full blobs and current inputs, then force=false expected_sha CAS; remove only this task transport.'
          },null,2)+'\n');
          NODE
      - name: Create unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const receipt=JSON.parse(fs.readFileSync('artifacts/round26-objects/receipt.json','utf8'));
          for (const object of receipt.objects) {
            if (object.changed) {
              const result=JSON.parse(execFileSync('gh',['api','--method','POST',
                'repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs','--input',object.body],{encoding:'utf8'}));
              assert.equal(result.sha,object.output_blob,'GitHub blob differs from prepared bytes');
            }
            console.log('ROUND26_OBJECT '+JSON.stringify({path:object.path,input_blob:object.input_blob,
              output_blob:object.output_blob,output_sha256:object.output_sha256,changed:object.changed}));
          }
          NODE
      - name: Preserve identities and full prepared bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round26-reviewed-objects-${{ github.sha }}
          path: artifacts/round26-objects
          if-no-files-found: error
