name: NMR50 temporary ledger object preparation
on:
  push:
    branches: [checkpoint/tdrp-nmr50-recovery-20bf9475-r1]
    paths: ['.github/workflows/nmr50-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create only the exact reviewed ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          path = "projects/telegram-desktop-rust/parity-ledger.json"
          expected = "cd4de14d4cfb800185a56cf489a16afc9a433b16"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "checkout must equal this run"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
          assert actual == expected, "reread and reconcile concurrent ledger before retrying"
          before = json.loads(pathlib.Path(path).read_text())
          assert len(before["rows"]) == 184
          assert before["upstream_commit"] == "f985723b552b30fe1c17d377d57f44e61a15a8c4"
          changes = json.loads(r'''{"FBCP-NMR-001":{"requirement_ids":["NMR-50e","NMR-50f","NMR-50g","NMR-50h"],"production_evidence":["path:frontend/src/production/ProductionRenderer.tsx#submit; original rendered account and Human/Agent lane captured before queue admission and retained for resend","path:frontend/src/production/composer-dispatch-scope.ts#sendScopedComposerSubmission; original scope fences attachments, actual Coordinator frame and result/roster projection","path:frontend/src/production/composer-dispatch-scope.ts#reactScopedHumanMessage; reaction retains rendered account and conversation across readiness","path:frontend/src/recovered/features/conversation/workspace/submission.ts#createComposerSubmissionQueue; generic local context retained through callbacks and reset retires tracking without Host cancellation","path:frontend/src/production/ProductionRenderer.tsx#observeAccount; synchronous queue/approval retirement; original staged draft files retained on root retirement"],"test_evidence":["authored-not-run:frontend/src/production/composer-dispatch-scope.contract.test.ts; 18 real Coordinator/queue/approval/draft lifecycle contracts; execution remains separately bound to containing H in projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json"],"notes":"Task20bf round1 NMR-50e-h follow-up: the production composer captures immutable local account generation/slot and target lane before queueing, preserving it through phase/failure callbacks and actual frame admission. Account/root retirement resets only local tracking and approval presentation; new-account same-conversation sends proceed while old work cannot dispatch, clear drafts, publish results or refresh roster. Human reactions retain the same account boundary while ordinary navigation stays valid. Root teardown no longer deletes original staged files referenced by persisted drafts; explicit removal and rejected staging retain cleanup. Existing Agent wire fields and approval lifecycle are retained. Eighteen behavior contracts authored; containing-H execution and independent ACCEPT remain separate. No source identity, source review, schema, coverage or acceptance promotion."}}''')
          after = copy.deepcopy(before)
          changed = []
          for identity, fields in changes.items():
              rows = [row for row in after["rows"] if row["responsibility_id"] == identity]
              assert len(rows) == 1, identity
              row = rows[0]
              for key, additions in fields.items():
                  if key == "notes":
                      assert isinstance(row[key], str) and additions not in row[key]
                      row[key] += "\n" + additions
                  else:
                      assert key in {"requirement_ids", "production_evidence", "test_evidence"}
                      assert isinstance(row[key], list)
                      for value in additions:
                          if value not in row[key]:
                              row[key].append(value)
              changed.append(identity)
          restored = copy.deepcopy(after)
          original = {row["responsibility_id"]: row for row in before["rows"]}
          for row in restored["rows"]:
              identity = row["responsibility_id"]
              if identity in changes:
                  for key in changes[identity]:
                      row[key] = copy.deepcopy(original[identity][key])
          assert restored == before, "only declared existing-row fields may change"
          assert after.get("source_reviews") == before.get("source_reviews")
          assert after["coverage"] == before["coverage"]
          payload = (json.dumps(after, ensure_ascii=False, indent=2) + "\n").encode()
          expected_new = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs",
              data=json.dumps({"content": payload.decode(), "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["sha"] == expected_new
          print(json.dumps({"preparation_head": head, "base_blob": expected,
                            "prepared_blob": result["sha"], "bytes": len(payload),
                            "changed_existing_rows": changed,
                            "source_reviews_preserved": True,
                            "acceptance_changed": False,
                            "refs_written": False}, sort_keys=True))
          PY
