name: NMR50 temporary ledger object preparation
on:
  push:
    branches: [checkpoint/tdrp-nmr50-recovery-20bf9475-r1]
    paths: ['.github/workflows/nmr50-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create only the exact reviewed ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, pathlib, subprocess, urllib.request
          path = "projects/telegram-desktop-rust/parity-ledger.json"
          expected = "e88c75896bd0dce29b2d8b89e949c9231dad872c"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "checkout must equal this run"
          source_commit = "222371af3d0c2241697c5a57b0160ecb336edbab"
          source_request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs/" + expected,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(source_request, timeout=60) as response:
              source_object = json.load(response)
          source_bytes = base64.b64decode(source_object["content"])
          assert source_object["sha"] == expected
          assert hashlib.sha1(b"blob " + str(len(source_bytes)).encode() + b"\0" + source_bytes).hexdigest() == expected
          before = json.loads(source_bytes)
          assert len(before["rows"]) == 184
          assert before["upstream_commit"] == "f985723b552b30fe1c17d377d57f44e61a15a8c4"
          changes = json.loads(r'''{"TDRP-R9-SHARE-FORWARD-PRIVACY-001":{"production_evidence":["path:frontend/src/production/ForwardMessageDialog.tsx#ForwardDispatchScope","path:frontend/src/production/ProductionRenderer.tsx#forwardHumanMessage; optional local scope reaches Coordinator call without entering wire args","path:frontend/src/production/coordinator-client.ts#createCoordinatorClient.call; readiness cannot revive a retired picker/account intent","evidence:projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json"],"test_evidence":["authored-not-run:frontend/src/production/ForwardMessageDialog.behavior.test.mjs; six real-client controlled-port cases cover account/ABA/logout, close/reopen, source replacement, unmount, valid reconnect and post-dispatch preservation","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_forward_active_batch_allows_destination_and_unrelated_history","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_forward_recovery_runs_once_per_invocation"],"requirement_ids":["NMR-50a","NMR-50b","NMR-50d"],"notes":"Task20bf round1 NMR-50d: real Coordinator readiness is now a pre-dispatch boundary of the existing immutable picker intent. Its original account generation/dialog lifetime is checked immediately before the request frame; closing or switching before dispatch produces zero mutation frames. Already posted requests retain Host persistence and reply semantics. Existing 16 Chromium cases plus six authored real-client cases total22; no local execution or independent/product ACCEPT is claimed. Complete source provenance/eligibility, full platform/UI/Bot/service acceptance remain open; see projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json."},"FBCP-NMR-001":{"production_evidence":["path:source/host/src/extensions/session/production.rs#deliver_forward_batch; NMR-50 automatic recovery skips an active batch while explicit delivery remains serialized","path:source/host/src/extensions/session/production.rs#sync_human_conversation_history; NMR-50 top-level roster recovers only once","path:source/host/src/extensions/session/native_messaging.rs#list_friends_for_user; expected account plus complete response-body credential fence","path:frontend/src/production/coordinator-client.ts#createCoordinatorClient.call; original local dispatch scope is checked after readiness before request registration","evidence:projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json","path:frontend/src/production/ProductionRenderer.tsx#submit; original rendered account and Human/Agent lane captured before queue admission and retained for resend","path:frontend/src/production/composer-dispatch-scope.ts#sendScopedComposerSubmission; original scope fences attachments, actual Coordinator frame and result/roster projection","path:frontend/src/production/composer-dispatch-scope.ts#reactScopedHumanMessage; reaction retains rendered account and conversation across readiness","path:frontend/src/recovered/features/conversation/workspace/submission.ts#createComposerSubmissionQueue; generic local context retained through callbacks and reset retires tracking without Host cancellation","path:frontend/src/production/ProductionRenderer.tsx#observeAccount; synchronous queue/approval retirement; original staged draft files retained on root retirement"],"test_evidence":["authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_forward_active_batch_allows_destination_and_unrelated_history","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_forward_recovery_runs_once_per_invocation","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_rejects_wrong_user_before_http","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_rejects_six_credential_rotations_during_response_body","authored-not-run:frontend/src/production/ForwardMessageDialog.behavior.test.mjs; six actual Coordinator readiness/request-frame cases, 22 total picker tests","authored-not-run:frontend/src/production/composer-dispatch-scope.contract.test.ts; 18 real Coordinator/queue/approval/draft lifecycle contracts; execution remains separately bound to containing H in projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json"],"requirement_ids":["NMR-50a","NMR-50b","NMR-50c","NMR-50d","NMR-50e","NMR-50f","NMR-50g","NMR-50h"],"notes":"Task20bf round1 NMR-50: existing Session automatic recovery skips actively executing batches so destination/unrelated history can progress, and one roster invocation recovers once. Bound friends retrieval fences all six private credential fields after body consumption. The existing picker passes its original local lifetime to the actual Coordinator frame boundary; retired unposted intent cannot be reinterpreted after account change, while posted durable intent is retained. Four Host behaviors and six actual-client Chromium cases are authored; execution is recorded separately in projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json. Historical target/run fields are not this batch's execution. Source identities, source_reviews, unknown/unread and all acceptance states are unchanged.\nTask20bf round1 NMR-50e-h follow-up: the production composer captures immutable local account generation/slot and target lane before queueing, preserving it through phase/failure callbacks and actual frame admission. Account/root retirement resets only local tracking and approval presentation; new-account same-conversation sends proceed while old work cannot dispatch, clear drafts, publish results or refresh roster. Human reactions retain the same account boundary while ordinary navigation stays valid. Root teardown no longer deletes original staged files referenced by persisted drafts; explicit removal and rejected staging retain cleanup. Existing Agent wire fields and approval lifecycle are retained. Eighteen behavior contracts authored; containing-H execution and independent ACCEPT remain separate. No source identity, source review, schema, coverage or acceptance promotion."}}''')
          after = copy.deepcopy(before)
          changed = []
          for identity, fields in changes.items():
              rows = [row for row in after["rows"] if row["responsibility_id"] == identity]
              assert len(rows) == 1, identity
              row = rows[0]
              for key, additions in fields.items():
                  if key == "notes":
                      assert isinstance(row[key], str) and additions not in row[key]
                      row[key] += "\n" + additions
                  else:
                      assert key in {"requirement_ids", "production_evidence", "test_evidence"}
                      assert isinstance(row[key], list)
                      for value in additions:
                          if value not in row[key]:
                              row[key].append(value)
              changed.append(identity)
          restored = copy.deepcopy(after)
          original = {row["responsibility_id"]: row for row in before["rows"]}
          for row in restored["rows"]:
              identity = row["responsibility_id"]
              if identity in changes:
                  for key in changes[identity]:
                      row[key] = copy.deepcopy(original[identity][key])
          assert restored == before, "only declared existing-row fields may change"
          assert after.get("source_reviews") == before.get("source_reviews")
          assert after["coverage"] == before["coverage"]
          payload = (json.dumps(after, ensure_ascii=False, indent=2) + "\n").encode()
          expected_new = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs",
              data=json.dumps({"content": payload.decode(), "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["sha"] == expected_new
          print(json.dumps({"preparation_head": head, "source_commit": source_commit, "base_blob": expected,
                            "prepared_blob": result["sha"], "bytes": len(payload),
                            "changed_existing_rows": changed,
                            "source_reviews_preserved": True,
                            "acceptance_changed": False,
                            "refs_written": False}, sort_keys=True))
          PY
