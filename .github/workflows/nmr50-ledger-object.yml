name: NMR50 temporary ledger object preparation
on:
  push:
    branches: [checkpoint/tdrp-nmr50-recovery-20bf9475-r1]
    paths: ['.github/workflows/nmr50-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create only the exact reviewed ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          path = "projects/telegram-desktop-rust/parity-ledger.json"
          expected = "a95d76c46119474e36134456442aebe39f4e9760"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "checkout must equal this run"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
          assert actual == expected, "reread and reconcile concurrent ledger before retrying"
          before = json.loads(pathlib.Path(path).read_text())
          assert len(before["rows"]) == 184
          assert before["upstream_commit"] == "f985723b552b30fe1c17d377d57f44e61a15a8c4"
          changes = json.loads(r'''{"FBCP-NMR-001":{"requirement_ids":["NMR-50a","NMR-50b","NMR-50c","NMR-50d"],"production_evidence":["path:source/host/src/extensions/session/production.rs#deliver_forward_batch; NMR-50 automatic recovery skips an active batch while explicit delivery remains serialized","path:source/host/src/extensions/session/production.rs#sync_human_conversation_history; NMR-50 top-level roster recovers only once","path:source/host/src/extensions/session/native_messaging.rs#list_friends_for_user; expected account plus complete response-body credential fence","path:frontend/src/production/coordinator-client.ts#createCoordinatorClient.call; original local dispatch scope is checked after readiness before request registration","evidence:projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json"],"test_evidence":["authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_forward_active_batch_allows_destination_and_unrelated_history","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_forward_recovery_runs_once_per_invocation","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_rejects_wrong_user_before_http","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_rejects_six_credential_rotations_during_response_body","authored-not-run:frontend/src/production/ForwardMessageDialog.behavior.test.mjs; six actual Coordinator readiness/request-frame cases, 22 total picker tests"],"notes":"Task20bf round1 NMR-50: existing Session automatic recovery skips actively executing batches so destination/unrelated history can progress, and one roster invocation recovers once. Bound friends retrieval fences all six private credential fields after body consumption. The existing picker passes its original local lifetime to the actual Coordinator frame boundary; retired unposted intent cannot be reinterpreted after account change, while posted durable intent is retained. Four Host behaviors and six actual-client Chromium cases are authored; execution is recorded separately in projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json. Historical target/run fields are not this batch's execution. Source identities, source_reviews, unknown/unread and all acceptance states are unchanged."},"TDRP-R9-SHARE-FORWARD-PRIVACY-001":{"requirement_ids":["NMR-50a","NMR-50b","NMR-50d"],"production_evidence":["path:frontend/src/production/ForwardMessageDialog.tsx#ForwardDispatchScope","path:frontend/src/production/ProductionRenderer.tsx#forwardHumanMessage; optional local scope reaches Coordinator call without entering wire args","path:frontend/src/production/coordinator-client.ts#createCoordinatorClient.call; readiness cannot revive a retired picker/account intent","evidence:projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json"],"test_evidence":["authored-not-run:frontend/src/production/ForwardMessageDialog.behavior.test.mjs; six real-client controlled-port cases cover account/ABA/logout, close/reopen, source replacement, unmount, valid reconnect and post-dispatch preservation","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_forward_active_batch_allows_destination_and_unrelated_history","authored-not-run:source/host/tests/session_gateway_contract.rs#shipping_human_roster_forward_recovery_runs_once_per_invocation"],"notes":"Task20bf round1 NMR-50d: real Coordinator readiness is now a pre-dispatch boundary of the existing immutable picker intent. Its original account generation/dialog lifetime is checked immediately before the request frame; closing or switching before dispatch produces zero mutation frames. Already posted requests retain Host persistence and reply semantics. Existing 16 Chromium cases plus six authored real-client cases total22; no local execution or independent/product ACCEPT is claimed. Complete source provenance/eligibility, full platform/UI/Bot/service acceptance remain open; see projects/telegram-desktop-rust/evidence/task20bf-round1-nmr50-recovery.json."}}''')
          after = copy.deepcopy(before)
          changed = []
          for identity, fields in changes.items():
              rows = [row for row in after["rows"] if row["responsibility_id"] == identity]
              assert len(rows) == 1, identity
              row = rows[0]
              for key, additions in fields.items():
                  if key == "notes":
                      assert isinstance(row[key], str) and additions not in row[key]
                      row[key] += "\n" + additions
                  else:
                      assert key in {"requirement_ids", "production_evidence", "test_evidence"}
                      assert isinstance(row[key], list)
                      for value in additions:
                          if value not in row[key]:
                              row[key].append(value)
              changed.append(identity)
          restored = copy.deepcopy(after)
          original = {row["responsibility_id"]: row for row in before["rows"]}
          for row in restored["rows"]:
              identity = row["responsibility_id"]
              if identity in changes:
                  for key in changes[identity]:
                      row[key] = copy.deepcopy(original[identity][key])
          assert restored == before, "only declared existing-row fields may change"
          assert after.get("source_reviews") == before.get("source_reviews")
          assert after["coverage"] == before["coverage"]
          payload = (json.dumps(after, ensure_ascii=False, indent=2) + "\n").encode()
          expected_new = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs",
              data=json.dumps({"content": payload.decode(), "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["sha"] == expected_new
          print(json.dumps({"preparation_head": head, "base_blob": expected,
                            "prepared_blob": result["sha"], "bytes": len(payload),
                            "changed_existing_rows": changed,
                            "source_reviews_preserved": True,
                            "acceptance_changed": False,
                            "refs_written": False}, sort_keys=True))
          PY
