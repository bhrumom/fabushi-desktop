name: Round15 retained-store ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/round15-retained-store-ledger-ops.json'
      - '.github/workflows/round15-retained-store-ledger-object.yml'
      - 'projects/telegram-desktop-rust/parity-ledger.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-ledger-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare only the scoped append at this exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts/round15-retained-store-ledger
          export ROUND15_INPUT_BLOB
          ROUND15_INPUT_BLOB=$(git rev-parse HEAD:projects/telegram-desktop-rust/parity-ledger.json)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const hash = bytes => crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
          const opsBytes = fs.readFileSync('.github/round15-retained-store-ledger-ops.json');
          const ops = JSON.parse(opsBytes);
          assert.equal(process.env.GITHUB_REPOSITORY, 'bhrumom/fabushi-desktop');
          assert.equal(ops.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(ops.task_id, '20bf9475-a885-4314-b509-bea53ef8849f');
          assert.equal(ops.round, 15);
          assert.equal(ops.path, 'projects/telegram-desktop-rust/parity-ledger.json');
          assert.equal(ops.responsibility_id, 'FBCP-NMR-001');
          const bytes = fs.readFileSync(ops.path);
          const inputBlob = hash(bytes);
          assert.equal(inputBlob, process.env.ROUND15_INPUT_BLOB);
          const before = JSON.parse(bytes);
          const after = structuredClone(before);
          const matches = after.rows.filter(row => row.responsibility_id === ops.responsibility_id);
          assert.equal(matches.length, 1);
          const row = matches[0];
          for (const [key, value] of Object.entries(ops.source_identity)) assert.deepEqual(row[key], value, 'source identity conflict: ' + key);
          const allowed = new Set(['requirement_ids', 'fabushi_target_paths', 'fabushi_target_symbols', 'production_entrypoints', 'production_evidence', 'test_evidence', 'fault_recovery_case_ids', 'security_case_ids', 'regression_ids']);
          for (const [key, additions] of Object.entries(ops.append)) {
            assert.ok(allowed.has(key), 'undeclared field: ' + key);
            assert.ok(Array.isArray(row[key]) && Array.isArray(additions));
            for (const addition of additions) {
              assert.equal(typeof addition, 'string');
              if (!row[key].includes(addition)) row[key].push(addition);
            }
          }
          assert.equal(typeof row.notes, 'string');
          assert.equal(typeof ops.note, 'string');
          if (!row.notes.includes(ops.note)) row.notes += ops.note;
          for (const key of Object.keys(before)) if (key !== 'rows') assert.deepEqual(after[key], before[key], 'top-level preservation: ' + key);
          assert.equal(after.rows.length, before.rows.length);
          for (let i = 0; i < before.rows.length; i++) {
            const prior = before.rows[i], changed = after.rows[i];
            assert.equal(prior.responsibility_id, changed.responsibility_id);
            if (prior.responsibility_id !== ops.responsibility_id) { assert.deepEqual(changed, prior); continue; }
            for (const key of Object.keys(prior)) if (key !== 'notes' && !allowed.has(key)) assert.deepEqual(changed[key], prior[key], 'unchanged owner field: ' + key);
            for (const key of allowed) if (Array.isArray(prior[key])) assert.deepEqual(changed[key].slice(0, prior[key].length), prior[key], 'append-only field: ' + key);
            assert.ok(changed.notes.startsWith(prior.notes));
          }
          const content = JSON.stringify(after, null, 2) + '\n';
          const output = Buffer.from(content);
          const outputBlob = hash(output);
          const receipt = {task_id:ops.task_id, round:ops.round, harness_sha:process.env.GITHUB_SHA, input_blob:inputBlob, ops_blob:hash(opsBytes), output_blob:outputBlob, output_sha256:crypto.createHash('sha256').update(output).digest('hex'), changed_rows:[ops.responsibility_id], other_rows_unchanged:true, top_level_source_and_acceptance_unchanged:true, product_validation:false, commit_created:false, ref_updated:false, integration_condition:'Root reads full output, requires latest canonical input equality, then force=false expected-head CAS.'};
          fs.writeFileSync('artifacts/round15-retained-store-ledger/prepared-ledger.json', output);
          fs.writeFileSync('artifacts/round15-retained-store-ledger/receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/round15-ledger-blob.json', JSON.stringify({content, encoding:'utf-8'}));
          console.log(JSON.stringify(receipt));
          NODE
      - name: Create only the unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
            --input "$RUNNER_TEMP/round15-ledger-blob.json" \
            > artifacts/round15-retained-store-ledger/github-blob.json
          expected=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round15-retained-store-ledger/receipt.json','utf8')).output_blob")
          actual=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round15-retained-store-ledger/github-blob.json','utf8')).sha")
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
      - name: Preserve exact object for root readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round15-retained-store-ledger-${{ github.sha }}
          path: artifacts/round15-retained-store-ledger
          if-no-files-found: error
