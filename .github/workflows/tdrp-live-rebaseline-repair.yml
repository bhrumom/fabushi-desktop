name: TDRP live rebaseline repair
on:
  push:
    branches:
      - work/story-slider-view-coverage-20261008
    paths:
      - scripts/rebaseline-tdrp-live.py
      - .github/workflows/tdrp-live-rebaseline-repair.yml
permissions:
  contents: write
jobs:
  rebaseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebaseline exact live authority
        run: python3 scripts/rebaseline-tdrp-live.py
      - name: Validate Revision 9 authority fail-closed
        env:
          TDRP_TARGET_SHA: ${{ github.sha }}
        run: node scripts/validate-tdrp-revision9-authority.mjs
      - name: Commit generated authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/telegram-desktop-rust projects/fabushi-communication-platform docs/specs/telegram-desktop-rust-equivalence-migration.md artifacts/tdrp-authority
          git diff --cached --quiet && { echo "no changes"; exit 1; }
          git commit -m "chore(tdrp): rebaseline live authority to 811b83a1"
          git push origin HEAD:work/story-slider-view-coverage-20261008
