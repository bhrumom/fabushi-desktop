name: OCRM P0 source authority

on:
  push:
    branches:
      - 'codex/openclaw-rust-fusion-chat-20261101-writer'
    paths:
      - '.github/workflows/ocrm-p0-authority.yml'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'projects/openclaw-rust/**'
      - 'source/host/**'
  pull_request:
    paths:
      - '.github/workflows/ocrm-p0-authority.yml'
      - 'projects/openclaw-rust/**'
  workflow_dispatch:
    inputs:
      expected_subject:
        description: 'Optional frozen full SHA; reject a moved dispatch ref'
        type: string
        required: false

permissions:
  contents: read

jobs:
  source-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_REPO: openclaw/openclaw
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_DISPATCH_SHA: ${{ inputs.expected_subject || '' }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checked-out subject and lock
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$subject" = "$expected"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$subject" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock=json.loads(Path("projects/openclaw-rust/upstream.lock.json").read_text())
          assert lock["upstream"]["repository"] == "openclaw/openclaw"
          # Fixed U is independent of later discovery candidates. Structural
          # authority may run with acceptance pending; final acceptance remains
          # gated by validate_p0.py --final-ac02. Never rebind declarations here.
          identity={k: lock["upstream"][k] for k in ("repository", "commit", "tree")}
          for name in ("inventory/index.json", "parity-ledger.json", "requirements-traceability-matrix.json"):
              document=json.loads((Path("projects/openclaw-rust") / name).read_text())
              assert {k: document["upstream"][k] for k in identity} == identity, "fixed source declaration drift: " + name
          assert lock["closure"]["source_closure_ready"] is False
          idx=json.loads(Path("projects/openclaw-rust/inventory/index.json").read_text())
          assert idx["authority"]["source_closure_ready"] is False
          assert idx["inventory"]["omitted_known"] == 0
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"UPSTREAM_COMMIT={lock['upstream']['commit']}\n")
              env.write(f"UPSTREAM_TREE={lock['upstream']['tree']}\n")
          PY

      - name: Exercise risk review contract and fail-closed counterexamples
        run: python3 projects/openclaw-rust/scripts/test_source_review.py

      - name: Acquire exact upstream and verify identity
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "https://github.com/$UPSTREAM_REPO.git"
          git -C upstream fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD^{tree})" = "$UPSTREAM_TREE"

      - name: Generate recursive tracked-source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocrm-evidence
          git -C upstream ls-tree -r -z --full-tree "$UPSTREAM_COMMIT" > ocrm-evidence/ls-tree.z
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw=Path("ocrm-evidence/ls-tree.z").read_bytes()
          entries=[]
          counts={"tracked_entries_total":0,"blob_entries_total":0,"symlink_entries_total":0,"gitlink_entries_total":0}
          for rec in raw.split(b"\0"):
            if not rec:
              continue
            meta,path=rec.split(b"\t",1)
            mode,kind,sha=meta.decode().split(" ")
            p=path.decode("utf-8","surrogateescape")
            if mode == "160000":
              cls="gitlink"; counts["gitlink_entries_total"]+=1
            elif mode == "120000":
              cls="symlink"; counts["symlink_entries_total"]+=1
            else:
              cls="blob"; counts["blob_entries_total"]+=1
            counts["tracked_entries_total"]+=1
            entries.append({"path":p,"mode":mode,"git_type":kind,"sha":sha,"entry_kind":cls,"read_status":"unread","responsibility_status":"unclassified"})
          payload={
            "format_version":1,
            "project_id":"OCRM-001",
            "upstream":{"repository":os.environ["UPSTREAM_REPO"],"commit":os.environ["UPSTREAM_COMMIT"],"tree":os.environ["UPSTREAM_TREE"]},
            "counts":counts,
            "entries":entries
          }
          out=Path("ocrm-evidence/upstream-recursive-inventory.json")
          out.write_text(json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n")
          Path("ocrm-evidence/upstream-recursive-inventory.sha256").write_text(hashlib.sha256(out.read_bytes()).hexdigest()+"\n")
          Path("ocrm-evidence/authority-summary.json").write_text(json.dumps({
            "subject_commit":os.environ["SUBJECT_SHA"],
            "upstream_commit":payload["upstream"]["commit"],
            "upstream_tree":payload["upstream"]["tree"],
            **counts,
            "source_closure_ready":False,
            "reason":"Tracked source enumeration is established; dependency/LFS/semantic responsibility closure remains open."
          },sort_keys=True,indent=2)+"\n")
          PY

      - name: Scan LFS pointer candidates without claiming closure
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git '^version https://git-lfs.github.com/spec/v1$' upstream > ocrm-evidence/lfs-pointer-candidates.txt || true
          wc -l < ocrm-evidence/lfs-pointer-candidates.txt | tr -d ' ' > ocrm-evidence/lfs-pointer-candidates.count

      - name: Record dependency authority inputs
        shell: bash
        run: |
          set -euo pipefail
          {
            for f in package.json pnpm-lock.yaml pnpm-workspace.yaml package-lock.json yarn.lock bun.lock bun.lockb Cargo.toml Cargo.lock requirements.txt pyproject.toml go.mod go.sum Gemfile Gemfile.lock; do
              if [ -e "upstream/$f" ]; then
                printf '%s\t' "$f"
                git -C upstream hash-object "$f"
              fi
            done
          } > ocrm-evidence/dependency-root-inputs.tsv

      - name: Expand canonical source records and verify P0 G01/G02 structural
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
          python3 projects/openclaw-rust/scripts/test_inventory_materialization.py
          # Refuse malformed committed history before any generated write.
          python3 projects/openclaw-rust/scripts/verify_audit_integrity.py --before-expansion
          python3 projects/openclaw-rust/scripts/expand_inventory.py ocrm-evidence/upstream-recursive-inventory.json
          # Rebuild the source-derived shard manifest against this exact inventory
          # after canonical ledger reconciliation, then let validate_p0.py verify it.
          python3 projects/openclaw-rust/scripts/shard_inventory.py --write ocrm-evidence/upstream-recursive-inventory.json
          python3 projects/openclaw-rust/scripts/validate_p0.py ocrm-evidence --negative-probes
          python3 projects/openclaw-rust/scripts/verify_audit_integrity.py

      - name: Upload immutable authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-p0-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: ocrm-evidence/
          if-no-files-found: error
          retention-days: 30

  persist-verified-inventory:
    # P0 source-derived files only; never overwrite a moved PR head.
    needs: source-authority
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && !contains(github.event.head_commit.message, '[ocrm-recover-563-command-evidence]') && !contains(github.event.head_commit.message, '[ocrm-recover-812-command-evidence]') && !contains(github.event.head_commit.message, '[ocrm-recover-563-command-evidence-v2]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout guarded original subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Download this exact-subject verified canonical manifest
        uses: actions/download-artifact@v4
        with:
          name: ocrm-p0-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: ocrm-evidence

      - name: Materialize deterministic shards and dependency declarations in Actions
        shell: bash
        env:
          EXPECTED_SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("ocrm-evidence")
          summary=json.loads((root/"authority-summary.json").read_text())
          receipt=json.loads((root/"p0-structural-receipt.json").read_text())
          assert summary["subject_commit"] == receipt["subject_commit"] == os.environ["EXPECTED_SUBJECT"]
          assert receipt["gate_verdicts"]["OCRM-G01-tracked-tree"] == "success"
          assert receipt["gate_verdicts"]["OCRM-G02-structural"] == "success"
          raw=(root/"upstream-recursive-inventory.json").read_bytes()
          expected=(root/"upstream-recursive-inventory.sha256").read_text().strip()
          assert hashlib.sha256(raw).hexdigest() == expected == summary["canonical_inventory_sha256"]
          assert summary["canonical_file_records"] == summary["tracked_entries_total"]
          assert summary["canonical_file_records"] > 0
          PY
          python3 projects/openclaw-rust/scripts/shard_inventory.py --write ocrm-evidence/upstream-recursive-inventory.json

      - name: CAS commit derived source shards to the existing branch (non-force)
        id: persist
        shell: bash
        env:
          EXPECTED_SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD_REF"
          git check-ref-format "refs/heads/$EXPECTED_HEAD_REF"
          git add projects/openclaw-rust/inventory/index.json \
                  projects/openclaw-rust/inventory/shards \
                  projects/openclaw-rust/dependencies/source-manifest-inputs.json \
                  projects/openclaw-rust/parity-ledger.json \
                  projects/openclaw-rust/requirements-traceability-matrix.json
          if git diff --cached --quiet; then
            echo "No new source-derived shard content"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$EXPECTED_HEAD_REF"
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_SUBJECT" || { echo "PR lease moved: refusing derived snapshot write"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ocrm): persist locked canonical inventory shards and manifest inputs"
          git push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "materialized=true" >> "$GITHUB_OUTPUT"
          echo "Committed source-derived shard snapshot; new commit requires its own exact-head Actions receipt"

      - name: Dispatch scoped checks for the resulting exact branch head
        # The ordinary push already starts Rust checks for an unchanged H.
        # GITHUB_TOKEN-derived commits need their own explicit dispatch.
        if: ${{ steps.persist.outputs.materialized == 'true' && (github.event.pull_request.head.ref || github.ref_name) == 'codex/openclaw-rust-fusion-chat-20261101-writer' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RESULT_HEAD: ${{ steps.persist.outputs.head }}
          MATERIALIZED: ${{ steps.persist.outputs.materialized }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$EXPECTED_HEAD_REF" | cut -f1)" = "$RESULT_HEAD"
          python3 - <<'PY'
          import json, os, urllib.request
          repository=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ["EXPECTED_HEAD_REF"]
          workflows=[("rust-desktop-runtime.yml", {"validation_scope": "ocrm-config", "expected_subject": os.environ["RESULT_HEAD"]})]
          if os.environ["MATERIALIZED"] == "true":
              # A generated commit is a new subject, not evidence for its parent.
              workflows.insert(0, ("ocrm-p0-authority.yml", {"expected_subject": os.environ["RESULT_HEAD"]}))
          for workflow, inputs in workflows:
              request=urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/workflows/{workflow}/dispatches",
                  data=json.dumps({"ref": branch, "inputs": inputs}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"}, method="POST")
              with urllib.request.urlopen(request) as response:
                  assert response.status == 204
              print(f"Requested {workflow}; its first guard must match subject {os.environ['RESULT_HEAD']}")
          PY

  recover-original-host-log:
    # Read finalized original artifacts; never execute their archived commands.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && (contains(github.event.head_commit.message, '[ocrm-recover-563-command-evidence-v2]') || contains(github.event.head_commit.message, '[ocrm-recover-djc-e383-command-evidence]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      OCRM_EVIDENCE_PROFILE: ${{ contains(github.event.head_commit.message, '[ocrm-recover-djc-e383-command-evidence]') && 'djc-e383' || 'host-563' }}
    steps:
      - name: Recover identity-bound original Host commands and outcomes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, base64, hashlib, io, json, os, re, shlex, stat, sys, urllib.error, urllib.parse, urllib.request, warnings, zipfile
          from pathlib import Path, PurePosixPath
          
          repository = "bhrumom/fabushi-desktop"
          profile = os.environ["OCRM_EVIDENCE_PROFILE"]
          if profile not in ("host-563", "djc-e383"):
              raise RuntimeError("unrecognized_collection_profile")
          subject = "56386a66a1f2944545cee35b58d10cb085e3c292"
          subject_tree = "86f8fded50a54fc60b8f3a5d69af3af735e6c12a"
          source_run, source_attempt, source_job = 41498228438, 1, 125459002378
          if profile == "djc-e383":
              subject = "e3837eac2c6bd693f058ccc58268ed97df2c1f99"
              subject_tree = "4887f541b94d5adcbfddc2dff8a48d8d922a307d"
              source_run, source_attempt, source_job = 41642220354, 1, 125938337174
          upstream = {"repository": "openclaw/openclaw", "commit": "1440bb1771372334bea23d7642bb52deb7db1845",
                      "tree": "90c8aab39972da11cfad220361781d49e1bc6700"}
          base = f"https://api.github.com/repos/{repository}"
          evidence = Path(os.environ["RUNNER_TEMP"]) / "ocrm-original-host-log"
          evidence.mkdir(parents=True, exist_ok=False)
          stage = "instrument_controls"
          workflow_path = ".github/workflows/rust-desktop-runtime.yml"
          lock_path = "projects/openclaw-rust/upstream.lock.json"
          runtime_root = "source/mahayana/mahayana-rs"
          input_paths = {
              "recovery": {workflow_path, lock_path, "source/host/Cargo.toml", "source/host/Cargo.lock"},
              "native": {workflow_path, lock_path, f"{runtime_root}/Cargo.toml", f"{runtime_root}/Cargo.lock",
                         f"{runtime_root}/mahayana-runtime/Cargo.toml",
                         *[f"{runtime_root}/mahayana-runtime/src/{name}.rs" for name in
                           ("lib", "conversation_actor", "runtime_store", "dispatch_admission_tests", "acceptance_admission_tests")]},
          }
          artifacts = [
              {"label": "recovery", "id": 13167684148, "size": 877191,
               "sha256": "ee0c70b19203bd452d25510da83f4b7dd686968afd3b468cc13061e155d8c583",
               "name": f"ocrm-recovery-commands-{subject}-{source_run}-{source_attempt}",
               "kind": "ocrm-recovery-command-diagnostics",
               "upload_step": "Preserve exact-subject Recovery command diagnostics"},
              {"label": "native", "id": 13169190332, "size": 3605,
               "sha256": "6fe5f43e03285d5516089e214bbc76510c914f7cad9b84f570e1913db7ae19f9",
               "name": f"ocrm-native-runtime-{subject}-{source_run}-{source_attempt}",
               "kind": "ocrm-native-runtime-command-diagnostics",
               "upload_step": "Preserve exact-subject native Runtime diagnostics"},
          ]
          
          djc_input_paths = {
              workflow_path, "projects/openclaw-rust/docs/specs/device-pairing-join-admission.md",
              "source/host/Cargo.toml", "source/host/Cargo.lock",
              "source/host/src/device_pairing_owner.rs", "source/host/src/gateway_server.rs",
              "source/host/src/gateway_command_error.rs", "source/host/src/host_gateway_api.rs",
              "source/host/app/src/main.rs", "source/host/tests/device_pairing_join_admission_contract.rs",
          }
          djc_command = ["cargo", "test", "--locked", "--manifest-path", "source/host/Cargo.toml",
                         "--test", "device_pairing_join_admission_contract", "--", "--test-threads=1"]
          djc_required = [
              "join_storage_read_failure_is_distinct_and_recovers_without_consuming",
              "join_storage_write_failure_preserves_row_and_redacts_errors",
              "join_storage_commit_refusal_never_publishes_payload",
              "join_malformed_rows_are_consumed_durably_before_content_validation",
              "join_expiry_and_legacy_json_preserve_single_use_contract",
              "join_expiry_is_rechecked_after_a_delayed_successful_commit",
              "join_concurrent_file_owners_publish_one_payload",
              "join_gateway_reports_storage_failure_and_preserves_public_recovery",
              "join_deferred_commit_refusal_is_qualified_and_preserves_recovery",
          ]
          djc_members = {
              "subject.json", "device-pairing-join.command.txt", "device-pairing-join.log",
              "device-pairing-join.receipt.json", "command-exit-codes.tsv", "capture-exit-codes.tsv",
              "console-evidence.jsonl",
          }
          if profile == "djc-e383":
              artifacts = [{
                  "label": "djc", "id": 13233434578, "size": 1811356,
                  "sha256": "89d74935aca99b8b6003dac9edc4bac62535857abb6959e88f0b2251de5bf410",
                  "name": f"ocrm-recovery-commands-{subject}-{source_run}-{source_attempt}",
                  "kind": "ocrm-recovery-command-diagnostics",
                  "upload_step": "Preserve exact-subject Recovery command diagnostics",
              }]
          
          class CollectionRefusal(Exception):
              pass
          
          def require(condition, code):
              if not condition:
                  raise CollectionRefusal(code)
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate_json_member")
                  result[key] = value
              return result
          
          def decode_json(body):
              return json.loads(body, object_pairs_hook=unique_object)
          
          def save_json(name, value):
              (evidence / name).write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          redirects = {301, 302, 303, 307, 308}
          
          def read_response(url, authenticated=False, limit=100 * 1024 * 1024):
              parsed = urllib.parse.urlsplit(url)
              require(parsed.scheme == "https" and parsed.username is None and parsed.password is None
                      and parsed.port in (None, 443), "invalid_transport")
              require(not authenticated or parsed.hostname == "api.github.com", "invalid_credential_destination")
              headers = {"Accept-Encoding": "identity", "User-Agent": "ocrm-exact-job-log-recovery"}
              if authenticated:
                  headers.update({"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              request = urllib.request.Request(url, headers=headers)
              try:
                  response = opener.open(request, timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code not in redirects:
                      raise
                  location = error.headers.get("Location")
                  error.close()
                  return error.code, location, b""
              with response:
                  require(response.status == 200 and not response.headers.get("Content-Range"), "incomplete_response")
                  require(response.headers.get("Content-Encoding", "identity") == "identity", "unexpected_encoding")
                  declared = response.headers.get("Content-Length")
                  require(declared is None or 0 <= int(declared) <= limit, "body_size_limit")
                  body = response.read(limit + 1)
                  require(len(body) <= limit and (declared is None or len(body) == int(declared)), "body_size_mismatch")
                  return response.status, None, body
          
          def api_json(path):
              status, location, body = read_response(base + path, authenticated=True, limit=2 * 1024 * 1024)
              require(status == 200 and location is None, "metadata_redirect")
              return decode_json(body)
          
          def download(path, limit):
              url = base + path
              for hop in range(6):
                  # Only the fixed first API request has credentials; redirects never inherit them.
                  status, location, body = read_response(url, authenticated=(hop == 0), limit=limit)
                  if status == 200:
                      require(bool(body), "empty_download")
                      return body
                  require(bool(location) and hop < 5, "redirect_limit")
                  url = urllib.parse.urljoin(url, location)
                  host = urllib.parse.urlsplit(url).hostname or ""
                  require(host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com"),
                          "unapproved_download_host")
              raise CollectionRefusal("redirect_limit")
          
          def read_archive(raw):
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  entries = archive.infolist()
                  require(0 < len(entries) <= 512, "archive_member_count")
                  names, total = set(), 0
                  for entry in entries:
                      name = entry.filename
                      path = PurePosixPath(name)
                      require(bool(name) and "\\" not in name and ":" not in name and "\0" not in name and not path.is_absolute()
                              and all(part not in ("", ".", "..") for part in name.rstrip("/").split("/"))
                              and path.as_posix() == name.rstrip("/"), "archive_member_path")
                      require(path.as_posix() not in names, "duplicate_archive_member")
                      names.add(path.as_posix())
                      mode = entry.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR) and not stat.S_ISLNK(mode),
                              "archive_member_type")
                      require(not entry.flag_bits & 1 and entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                              "archive_member_encoding")
                      require(0 <= entry.file_size <= 16 * 1024 * 1024, "archive_member_size")
                      total += entry.file_size
                  require(total <= 64 * 1024 * 1024, "archive_expanded_size")
                  result = {}
                  for entry in entries:
                      if entry.is_dir():
                          continue
                      with archive.open(entry) as member:
                          body = member.read(16 * 1024 * 1024 + 1)
                      require(len(body) == entry.file_size and len(body) <= 16 * 1024 * 1024, "archive_actual_size")
                      result[entry.filename] = body
                  return result
          
          def validate_subject(receipt, kind, paths):
              require(receipt.get("kind") == kind and "verification_verdict" in receipt
                      and receipt["verification_verdict"] is None
                      and receipt.get("subject_commit") == subject and receipt.get("subject_tree") == subject_tree
                      and receipt.get("upstream") == upstream and receipt.get("run_id") == str(source_run)
                      and receipt.get("run_attempt") == str(source_attempt) and receipt.get("runner_os") == "macOS",
                      "subject_identity_mismatch")
              inputs = receipt.get("inputs_sha256")
              require(isinstance(inputs, dict) and set(inputs) == paths
                      and all(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) for value in inputs.values()),
                      "subject_inputs_mismatch")
          
          def member_text(members, name):
              require(name in members and bool(members[name]), "missing_requested_member")
              return members[name].decode("utf-8")
          
          def exit_value(text):
              require(re.fullmatch(r"(0|[1-9][0-9]{0,2})\n?", text) is not None, "invalid_exit_record")
              value = int(text)
              require(value <= 255, "invalid_exit_record")
              return value
          
          def upload_identity_present(lines, artifact):
              artifact_id = re.compile(r"\bArtifact ID(?::| is)?[ \t]+" + str(artifact["id"]) + r"\b")
              digest = re.compile(r"(?<![0-9a-fA-F])" + re.escape(artifact["sha256"]) + r"(?![0-9a-fA-F])")
              return (any(artifact_id.search(line) for line in lines)
                      and any(digest.search(line) for line in lines))

          def encode_record(record):
              # Actions also recognizes legacy commands inside a JSON string.
              # Unicode escapes preserve the value while denying command syntax.
              return json.dumps(record, ensure_ascii=True, sort_keys=True).replace(
                  "##[", r"\u0023\u0023[").replace("::", r"\u003a\u003a")

          def terminal_text(line):
              return re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line)

          def is_harness_line(line):
              return re.match(r"^\s*(?:Running |running \d+ tests?\b|test .+ \.\.\. |test result:)",
                              terminal_text(line)) is not None

          records, output_bytes = [], 0
          def emit(record):
              global output_bytes
              record = {"collection_state": "partial", "source_subject": subject,
                        "source_run": source_run, "source_attempt": source_attempt, "source_job": source_job,
                        "carrier_commit": os.environ["GITHUB_SHA"], "product_validation_executed_by_carrier": False,
                        **record}
              encoded = encode_record(record)
              output_bytes += len(("OCRM_EVIDENCE " + encoded + "\n").encode("utf-8"))
              require(len(records) < 12000 and output_bytes <= 2 * 1024 * 1024, "outcome_output_limit")
              records.append(encoded)
              # Keep validated partial evidence readable even if a later source refuses.
              with (evidence / "outcomes.jsonl").open("a", encoding="utf-8") as output:
                  output.write(encoded + "\n")
              print("OCRM_EVIDENCE " + encoded, flush=True)
          
          input_cache = {}
          def source_input(path):
              allowed = input_paths["recovery"] | input_paths["native"] | djc_input_paths
              require(path in allowed, "unapproved_source_input")
