              section = workflow.split(marker, 1)[1].split("      - name:", 1)[0]
              start, end = "source_paths = [", "source_paths = sorted(set(source_paths)"
              require(section.count(start) == 1 and section.count(end) == 1, "frozen_subject_producer")
              literal = "[" + section.split(start, 1)[1].split(end, 1)[0].strip()
