          def validate_carrier_push(event, commit, comparison, carrier_sha):
              before = event.get("before")
              require(isinstance(before, str) and re.fullmatch(r"[0-9a-f]{40}", before) is not None
                      and before != "0" * 40 and event.get("after") == carrier_sha
                      and event.get("ref") == "refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer"
                      and event.get("repository", {}).get("full_name") == repository
                      and event.get("repository", {}).get("id") == 1375312893
                      and event.get("head_commit", {}).get("id") == carrier_sha
                      and commit.get("sha") == carrier_sha
                      and isinstance(commit.get("message"), str)
                      and "[ocrm-recover-djc-e383-command-evidence]" in commit["message"]
                      and not any(marker in commit["message"].lower() for marker in legacy_persistence_markers)
                      and event["head_commit"].get("message") == commit["message"]
                      and [parent.get("sha") for parent in commit.get("parents", [])] == [before],
                      "unapproved_collector_carrier")
              require(comparison.get("status") == "ahead" and comparison.get("ahead_by") == 1
                      and comparison.get("behind_by") == 0 and comparison.get("total_commits") == 1
                      and comparison.get("base_commit", {}).get("sha") == before
                      and comparison.get("merge_base_commit", {}).get("sha") == before
                      and [item.get("sha") for item in comparison.get("commits", [])] == [carrier_sha],
                      "unapproved_collector_carrier")
              files = comparison.get("files")
              require(isinstance(files, list) and len(files) == 1
                      and files[0].get("filename") == ".github/workflows/ocrm-p0-authority.yml"
                      and files[0].get("status") == "modified" and "previous_filename" not in files[0]
                      and re.fullmatch(r"[0-9a-f]{40}", files[0].get("sha", "")) is not None,
                      "unapproved_collector_carrier")
              return before
          
          def require_djc_members(members):
