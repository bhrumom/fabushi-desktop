name: Global Dandelion real engine Host acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Global Dandelion source commit
        required: true
        default: 0fc0c7513ddac495a7149038583670c29cbe56fa
        type: string
  pull_request:
    paths:
      - 'source/electron-main/mcp/miniapp-cli-backend.ts'
      - 'source/electron-main/mcp/miniapp-tools.contract.test.ts'
      - 'source/electron-main/mcp/miniapp-tools.ts'
      - '.github/workflows/global-dandelion-real-engine.yml'
      - 'docs/specs/global-dandelion-miniapp-full-capabilities.md'
  push:
    branches: [main]
    paths:
      - 'source/electron-main/mcp/miniapp-cli-backend.ts'
      - 'source/electron-main/mcp/miniapp-tools.contract.test.ts'
      - 'source/electron-main/mcp/miniapp-tools.ts'
      - '.github/workflows/global-dandelion-real-engine.yml'

permissions:
  contents: read

jobs:
  linux-real-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha || '0fc0c7513ddac495a7149038583670c29cbe56fa' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install desktop test dependencies
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund

      - name: Resolve exact Global Dandelion source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/global-dandelion"
          git clone --filter=blob:none --no-checkout https://github.com/bhrumom/global-dandelion-rs.git "$source_dir"
          git -C "$source_dir" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$source_dir" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Build the exact source CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SOURCE_DIR/scripts/disk_guard.py" --path "$SOURCE_DIR" --planned-bytes 1073741824
          cargo build --locked --release --manifest-path "$SOURCE_DIR/Cargo.toml" -p dandelion-app
          test -x "$SOURCE_DIR/target/release/dandelion"

      - name: Prepare authorized disposable fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/global-dandelion-real-fixture"
          mkdir -m 700 -p "$fixture/root" "$fixture/state"
          printf 'Global Dandelion real Host fixture\n' > "$fixture/root/payload.txt"
          "$SOURCE_DIR/target/release/dandelion" config init > "$fixture/config.toml"
          chmod 600 "$fixture/config.toml"
          echo "FABUSHI_DANDELION_REAL_BIN=$SOURCE_DIR/target/release/dandelion" >> "$GITHUB_ENV"
          echo "FABUSHI_DANDELION_REAL_CONFIG=$fixture/config.toml" >> "$GITHUB_ENV"
          echo "FABUSHI_DANDELION_REAL_ROOT=$fixture/root" >> "$GITHUB_ENV"

      - name: Run Host contract and real-engine acceptance
        working-directory: desktop
        run: |
          set -o pipefail
          npx --yes tsx@4.21.0 --test ../source/electron-main/mcp/miniapp-tools.contract.test.ts 2>&1 | tee "$RUNNER_TEMP/global-dandelion-real-engine.log"

      - name: Write exact-head evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg desktop "$(git rev-parse HEAD)" \
            --arg source "$SOURCE_SHA" \
            --arg platform "github-actions/ubuntu-24.04" \
            --arg log_sha "$(sha256sum "$RUNNER_TEMP/global-dandelion-real-engine.log" | awk '{print $1}')" \
            '{schemaVersion:1,desktopSha:$desktop,sourceSha:$source,platform:$platform,realEngineHostAcceptance:"see log",logSha256:$log_sha}' \
            > "$RUNNER_TEMP/global-dandelion-real-engine-evidence.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-dandelion-real-engine-${{ github.sha }}
          path: |
            ${{ runner.temp }}/global-dandelion-real-engine.log
            ${{ runner.temp }}/global-dandelion-real-engine-evidence.json
