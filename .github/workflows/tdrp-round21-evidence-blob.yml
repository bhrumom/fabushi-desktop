name: Round21 reviewed evidence object transport

# Temporary EUS-06 / FMEP-001 transport of reviewed evidence, not product CI.
# Creates Git blobs only; final publication remains an expected_sha/force=false CAS.
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/workflows/tdrp-round21-evidence-blob.yml'
      - '.github/tdrp-round21-evidence-bundle.part-*'
permissions:
  contents: read
jobs:
  reviewed-objects:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create only the three reviewed Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, http.client, io, json, os, pathlib
          REPO = 'bhrumom/fabushi-desktop'
          REF = 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          EXPECTED_INPUTS = {'projects/telegram-desktop-rust/parity-ledger.json': {'sha': 'a95d76c46119474e36134456442aebe39f4e9760', 'sha256': '401f254113506ed2bcb1be21ed6a4ce4b74e71645e5c60801a1d110ddfa3a5f3', 'bytes': 3543593}, 'projects/telegram-desktop-rust/evidence/round21-update-source-authority.json': {'sha': '6904ca0029457eb6da4ebdeee66ad861337c40bc', 'sha256': '67a621137f31cd5fced7f5544dc78e57898f8e9461cadef103535d37e2c72454', 'bytes': 7467}, 'projects/fabushi-communication-platform/quality/requirements-traceability-matrix.md': {'sha': '60498664255292247d9d31d235e896448fac7137', 'sha256': '4f66c6b9725b06227a46db5b801ffad99f95d785761f5f216b27ea5a745ed73d', 'bytes': 44514}}
          EXPECTED_OUTPUTS = {'projects/telegram-desktop-rust/parity-ledger.json': {'sha': '026508e30187d3e6722beef3cc7241bbc5533df9', 'sha256': '4b4c55c09e9accbdbff1f450fa5920c40dbf911ccf2ed06a1f7f229c4caeb830', 'bytes': 3550353}, 'projects/telegram-desktop-rust/evidence/round21-update-source-authority.json': {'sha': 'bc533e3390b6cc51dcf1cd576f94489ed0fb899f', 'sha256': 'c981ab3e6513d9c2929d65350742caffc793d8b7bcd7250c349a1daa9efa8955', 'bytes': 171366}, 'projects/fabushi-communication-platform/quality/requirements-traceability-matrix.md': {'sha': '8e72f3047a869eaa4225d3e173dbebc27cf17644', 'sha256': 'fb13bfe7882044901676269d4211b034a6db1cf6a48c82f3b72467c728b4715c', 'bytes': 47616}}
          ALLOWED_FIELDS = set(['additional_source_identities', 'artifact_digest', 'artifact_id', 'behavior_contract', 'blockers', 'fabushi_target_paths', 'job', 'license_and_provenance', 'module_id', 'notes', 'run_attempt', 'source_analysis_path', 'source_blob_sha', 'source_kind', 'source_path', 'source_symbols', 'target_commit', 'test_execution_evidence', 'workflow_run'])
          PACKED_SHA256 = '1022f236e737937180c52c3d4be4f19524aaee064d579f4febe02cb65c1c3a2d'
          PART_COUNT = 2
          artifact = pathlib.Path('artifacts/round21-reviewed-objects')
          artifact.mkdir(parents=True, exist_ok=True)
          proof = {'repository': REPO, 'ref': REF, 'producer_head': os.environ.get('GITHUB_SHA'),
                   'run_id': os.environ.get('GITHUB_RUN_ID'), 'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                   'expected_inputs': EXPECTED_INPUTS, 'expected_outputs': EXPECTED_OUTPUTS,
                   'reviewed_bundle_sha256': PACKED_SHA256, 'created_blobs': [], 'state': 'starting',
                   'commit_or_ref_mutation': False, 'release_acceptance': False}
          def save_proof():
              (artifact/'objects.json').write_text(json.dumps(proof, indent=2)+'\n')
          def identity(data):
              return {'sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(),
                      'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          save_proof()
          try:
              if os.environ.get('GITHUB_REPOSITORY') != REPO or os.environ.get('GITHUB_REF') != REF:
                  raise RuntimeError('producer repository/ref mismatch')
              if os.environ.get('GITHUB_API_URL') != 'https://api.github.com':
                  raise RuntimeError('unexpected GitHub API authority')
              parts = [pathlib.Path(f'.github/tdrp-round21-evidence-bundle.part-{n:02d}') for n in range(PART_COUNT)]
              for part in parts:
                  if not part.is_file() or part.stat().st_size > 30000:
                      raise RuntimeError('missing or oversized reviewed bundle part')
              packed = b''.join(part.read_bytes() for part in parts)
              if hashlib.sha256(packed).hexdigest() != PACKED_SHA256:
                  raise RuntimeError('reviewed bundle identity mismatch')
              with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
                  raw = stream.read(524289)
                  if len(raw) > 524288 or stream.read(1):
                      raise RuntimeError('reviewed bundle expansion bound exceeded')
              bundle = json.loads(raw)
              if (bundle.get('format') != 'TDRP_REVIEWED_EVIDENCE_OBJECTS_V1'
                  or bundle.get('repository') != REPO
                  or bundle.get('branch') != REF.removeprefix('refs/heads/')
                  or bundle.get('fixed_U') != 'f985723b552b30fe1c17d377d57f44e61a15a8c4'):
                  raise RuntimeError('reviewed operation authority mismatch')
              if bundle.get('expected_inputs') != EXPECTED_INPUTS or bundle.get('expected_outputs') != EXPECTED_OUTPUTS:
                  raise RuntimeError('reviewed file identities changed')
              originals = {}
              for path, expected in EXPECTED_INPUTS.items():
                  data = pathlib.Path(path).read_bytes()
                  if identity(data) != expected:
                      raise RuntimeError('concurrent source change: ' + path)
                  originals[path] = data
              ledger_path = 'projects/telegram-desktop-rust/parity-ledger.json'
              receipt_path = 'projects/telegram-desktop-rust/evidence/round21-update-source-authority.json'
              rtm_path = 'projects/fabushi-communication-platform/quality/requirements-traceability-matrix.md'
              ledger = json.loads(originals[ledger_path])
              if ledger['upstream_commit'] != bundle['fixed_U'] or len(ledger['rows']) != 184:
                  raise RuntimeError('canonical ledger authority changed')
              updates = bundle.get('row_updates')
              if not isinstance(updates, list) or len(updates) != 1:
                  raise RuntimeError('reviewed row scope changed')
              update = updates[0]
              if (set(update) != {'responsibility_id','changes'}
                  or update['responsibility_id'] != 'TDRP-UPDATER-DISCOVERY-AUTHORITY-001'
                  or set(update['changes']) != ALLOWED_FIELDS):
                  raise RuntimeError('reviewed field scope changed')
              matches = [row for row in ledger['rows'] if row['responsibility_id'] == update['responsibility_id']]
              if len(matches) != 1:
                  raise RuntimeError('canonical row not unique')
              matches[0].update(update['changes'])
              if set(bundle['replacement_text']) != {receipt_path, rtm_path}:
                  raise RuntimeError('reviewed replacement scope changed')
              outputs = {ledger_path: (json.dumps(ledger, ensure_ascii=False, indent=2) + '\n').encode()}
              outputs.update({path: text.encode() for path, text in bundle['replacement_text'].items()})
              for path, data in outputs.items():
                  if identity(data) != EXPECTED_OUTPUTS[path]:
                      raise RuntimeError('reviewed output identity mismatch: ' + path)
              proof['state'] = 'verified-content-before-write'
              save_proof()
              for path, data in outputs.items():
                  payload = json.dumps({'content': data.decode(), 'encoding':'utf-8'}, ensure_ascii=False).encode()
                  # Fixed HTTPS authority, no automatic redirect following, no alternate credentials.
                  connection = http.client.HTTPSConnection('api.github.com', timeout=60)
                  try:
                      connection.request('POST', '/repos/bhrumom/fabushi-desktop/git/blobs', body=payload, headers={
                          'Accept':'application/vnd.github+json', 'Content-Type':'application/json',
                          'User-Agent':'Fabushi-Round21-Evidence-Transport',
                          'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version':'2022-11-28'})
                      response = connection.getresponse()
                      response_body = response.read(1048577)
                      proof['last_http_status'] = response.status
                      save_proof()
                      if response.status != 201 or len(response_body) > 1048576:
                          raise RuntimeError('Git blob response status/size rejected')
                      result = json.loads(response_body)
                  finally:
                      connection.close()
                  if result.get('sha') != EXPECTED_OUTPUTS[path]['sha']:
                      raise RuntimeError('GitHub returned a different reviewed blob')
                  item = {'path':path, **identity(data)}
                  proof['created_blobs'].append(item)
                  save_proof()
                  print('REVIEWED_OBJECT ' + json.dumps(item, sort_keys=True), flush=True)
              proof['state'] = 'complete'
              save_proof()
              print('REVIEWED_OBJECTS_COMPLETE ' + json.dumps(proof, sort_keys=True), flush=True)
          except BaseException as error:
              proof['state'] = 'failed'
              proof['error_type'] = type(error).__name__
              save_proof()
              # Only fixed diagnostics above reach RuntimeError; never print a request/token/body.
              if type(error) is RuntimeError:
                  print('REVIEWED_OBJECTS_FAILED ' + str(error), flush=True)
              else:
                  print('REVIEWED_OBJECTS_FAILED ' + type(error).__name__, flush=True)
              raise SystemExit(1)
          PY
      - name: Preserve object identities including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round21-reviewed-objects-${{ github.sha }}
          path: artifacts/round21-reviewed-objects/
          if-no-files-found: error
          retention-days: 90
