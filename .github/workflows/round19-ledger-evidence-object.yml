name: Round19 ledger evidence object transfer
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round19-ledger-evidence-object.yml
      - .github/checkpoint-ledger-ops-round19.json
permissions:
  contents: read
jobs:
  store-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Append reviewed evidence and create only an unattached Git blob
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          ops_path = pathlib.Path('.github/checkpoint-ledger-ops-round19.json')
          ops_bytes = ops_path.read_bytes()
          payload = json.loads(ops_bytes)
          repository = 'bhrumom/fabushi-desktop'
          ledger_path = 'projects/telegram-desktop-rust/parity-ledger.json'
          if payload['repository'] != repository or payload['path'] != ledger_path:
              raise SystemExit('Unexpected ledger transfer scope')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout identity mismatch')
          before = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + ledger_path], text=True).strip()
          if before != payload['expected_input_blob']:
              raise SystemExit('Ledger advanced; reconcile before another transfer')
          allowed_ids = {'FBCP-NMR-001', 'TDRP-R9-PROXY-SETTINGS-STATE-PERSISTENCE-001'}
          allowed_fields = {'test_evidence', 'test_execution_evidence', 'requirement_ids'}
          if len(payload['operations']) != 2 or {op['id'] for op in payload['operations']} != allowed_ids:
              raise SystemExit('Unexpected or duplicate responsibility')
          ledger = json.loads(pathlib.Path(ledger_path).read_text())
          prior = copy.deepcopy(ledger)
          for op in payload['operations']:
              if set(op) != {'id', 'append', 'note'} or set(op['append']) - allowed_fields:
                  raise SystemExit('Only reviewed evidence arrays and notes may be appended')
              matches = [row for row in ledger['rows'] if row.get('responsibility_id') == op['id']]
              if len(matches) != 1 or not isinstance(op['note'], str):
                  raise SystemExit('Responsibility must be unique with a literal note')
              row = matches[0]
              for key, values in op['append'].items():
                  if not isinstance(row[key], list) or not isinstance(values, list) or not all(isinstance(v, str) for v in values):
                      raise SystemExit('Evidence append must contain literal strings')
                  for value in values:
                      if value not in row[key]:
                          row[key].append(value)
              if op['note'] not in row['notes']:
                  row['notes'] += op['note']
          if {k:v for k,v in ledger.items() if k != 'rows'} != {k:v for k,v in prior.items() if k != 'rows'}:
              raise SystemExit('Source authority or top-level state changed')
          if len(ledger['rows']) != len(prior['rows']):
              raise SystemExit('Responsibility count changed')
          for old, new in zip(prior['rows'], ledger['rows']):
              if old['responsibility_id'] not in allowed_ids:
                  if old != new:
                      raise SystemExit('Unrelated responsibility changed')
              else:
                  changed = {k for k in set(old) | set(new) if old.get(k) != new.get(k)}
                  if changed - allowed_fields - {'notes'}:
                      raise SystemExit('Non-evidence responsibility field changed')
                  for key in changed - {'notes'}:
                      if new[key][:len(old[key])] != old[key]:
                          raise SystemExit('Existing evidence was not preserved')
                  if not new['notes'].startswith(old['notes']):
                      raise SystemExit('Existing notes were not preserved')
          content = json.dumps(ledger, ensure_ascii=False, indent=2) + '\n'
          encoded = content.encode('utf-8')
          blob = hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest()
          if blob != payload['expected_output_blob']:
              raise SystemExit('Output differs from the reviewed Git object')
          request = urllib.request.Request(
              'https://api.github.com/repos/' + repository + '/git/blobs',
              data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['TRANSFER_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                       'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          if result.get('sha') != blob:
              raise SystemExit('GitHub stored a different object')
          receipt = {'source_sha': head, 'input_blob': before, 'ledger_blob': blob,
                     'bytes': len(encoded), 'operations_sha256': hashlib.sha256(ops_bytes).hexdigest(),
                     'refs_updated': False, 'product_validation': False}
          pathlib.Path('round19-ledger-object-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('ROUND19_LEDGER_OBJECT ' + json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round19-ledger-object-${{ github.sha }}
          path: round19-ledger-object-receipt.json
          if-no-files-found: error
