name: Grok parity source check
on:
  push:
    branches: [refactor/grok-bot-018-parity-mac]
    paths:
      - "desktop/**"
      - ".github/workflows/grok-parity-source-check.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/grok-parity-source-check.yml"

concurrency:
  group: grok-parity-source-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build pinned reference Agent runner
        run: npm run build:reference-agent
      - name: Check Electron CommonJS syntax
        run: |
          for file in electron/*.cjs; do
            node --check "$file"
          done
      - name: Runtime contract tests
        run: node --test tests/*.test.cjs
      - name: Typecheck exact pinned reference source
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$PWD/node_modules" ../node_modules
          trap 'rm -f ../node_modules' EXIT
          npx tsc --project ../source/tsconfig.json
      - name: Typecheck and renderer build
        run: npm run build
