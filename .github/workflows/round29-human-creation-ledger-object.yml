name: Round29 Human creation ledger registration
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round29-human-creation-ledger-object.yml
      - .github/round29-human-creation-ledger-append.json
permissions:
  contents: read
jobs:
  store-reviewed-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Store only the reviewed append-only ledger object
        env:
          R29_OBJECT_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const manifestPath = '.github/round29-human-creation-ledger-append.json';
          const manifestBytes = readFileSync(manifestPath);
          const operation = JSON.parse(manifestBytes);
          const repository = 'bhrumom/fabushi-desktop';
          const path = 'projects/telegram-desktop-rust/parity-ledger.json';
          assert.equal(operation.repository, repository);
          assert.equal(operation.path, path);
          assert.equal(operation.taskId, '20bf9475-a885-4314-b509-bea53ef8849f');
          assert.equal(operation.round, 29);
          assert.equal(operation.row_id, 'FBCP-NMR-001');
          assert.equal(operation.authored_code_commit, '8b801ffdd0ca1b14fcd9f277de7b27d16b7456b1');
          assert.deepEqual(Object.keys(operation).sort(), [
            'append','expected_input_blob','expected_output_blob','note','path',
            'repository','round','row_id','authored_code_commit','taskId'
          ].sort());
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const head = git('rev-parse', 'HEAD');
          assert.equal(head, process.env.GITHUB_SHA);
          const input = git('rev-parse', 'HEAD:' + path);
          assert.equal(input, operation.expected_input_blob, 'canonical ledger advanced; reconcile before transfer');
          const ledger = JSON.parse(readFileSync(path, 'utf8'));
          const before = structuredClone(ledger);
          const matches = ledger.rows.map((row,index) => row.responsibility_id === operation.row_id ? index : -1).filter(index => index >= 0);
          assert.equal(matches.length, 1, 'one existing responsibility required');
          const index = matches[0];
          const row = ledger.rows[index];
          const allowed = new Set(['requirement_ids','fabushi_target_paths','fabushi_target_symbols','unit_case_ids','fault_recovery_case_ids','test_evidence','test_execution_evidence']);
          for (const [key, values] of Object.entries(operation.append)) {
            assert(allowed.has(key), 'no other field may be changed');
            assert(Array.isArray(values) && Array.isArray(row[key]));
            for (const value of values) {
              assert(typeof value === 'string' && value.trim().length > 0);
              if (!row[key].includes(value)) row[key].push(value);
            }
          }
          assert(typeof row.notes === 'string' && typeof operation.note === 'string');
          assert(operation.note.startsWith('\nRound29 Human creation integrity registration:'));
          if (!row.notes.includes(operation.note)) row.notes += operation.note;
          for (const [key,value] of Object.entries(row)) {
            if (!Object.hasOwn(operation.append,key) && key !== 'notes') assert.deepEqual(value,before.rows[index][key]);
          }
          const unchanged = structuredClone(ledger);
          unchanged.rows[index] = before.rows[index];
          assert.deepEqual(unchanged,before,'all other rows, source reviews and top-level acceptance must remain unchanged');
          const content = JSON.stringify(ledger,null,2) + '\n';
          const bytes = Buffer.from(content,'utf8');
          const blob = createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
          assert.equal(blob, operation.expected_output_blob, 'output must equal the reviewed exact object');
          const response = await fetch('https://api.github.com/repos/' + repository + '/git/blobs', {
            method:'POST', signal:AbortSignal.timeout(60000),
            headers:{Authorization:'Bearer ' + process.env.R29_OBJECT_TOKEN,
              Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({content,encoding:'utf-8'})
          });
          if (!response.ok) throw new Error('Git blob storage failed with status ' + response.status);
          const result = await response.json();
          assert.equal(result.sha,blob);
          const receipt = {source_sha:head,authored_code_commit:operation.authored_code_commit,input_blob:input,ledger_blob:blob,bytes:bytes.length,
            operations_blob:git('rev-parse','HEAD:' + manifestPath),
            operations_sha256:createHash('sha256').update(manifestBytes).digest('hex'),
            refs_updated:false,commits_created:false,product_validation:false,source_acceptance:false};
          writeFileSync('round29-human-ledger-object-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('ROUND29_HUMAN_LEDGER_OBJECT ' + JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: round29-human-ledger-object-${{ github.sha }}
          path: round29-human-ledger-object-receipt.json
          if-no-files-found: error
