name: NMR48 temporary ledger object delivery
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/workflows/nmr48-ledger-object.yml'
      - '.github/nmr48-ledger-ops.json'
permissions: {}
jobs:
  prepare-exact-ledger-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Create only the reviewed unattached ledger blob
        shell: bash
        env:
          GH_BLOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const repository = 'bhrumom/fabushi-desktop';
          const branch = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1';
          const path = 'projects/telegram-desktop-rust/parity-ledger.json';
          const baseBlob = '59d18f5de12fe6c4fe72bb110996c0cb0e07e9f4';
          const targetBlob = '1e0e3cb513109642b44ef9b430a5447ed0f47379';
          const fields = ['requirement_ids','fabushi_target_paths','fabushi_target_symbols',
            'unit_case_ids','contract_case_ids','integration_case_ids','fault_recovery_case_ids',
            'security_case_ids','production_evidence','test_evidence','test_execution_evidence','blockers'];
          const blobId = value => {
            const bytes = Buffer.from(value, 'utf8');
            return crypto.createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
          };
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/' + branch);
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/);
          const input = JSON.parse(fs.readFileSync('.github/nmr48-ledger-ops.json','utf8'));
          assert.equal(input.schema, 'fabushi-nmr48-ledger-append-v1');
          assert.equal(input.repository, repository);
          assert.equal(input.branch, branch);
          assert.equal(input.path, path);
          assert.equal(input.responsibility_id, 'FBCP-NMR-001');
          assert.equal(input.base_blob, baseBlob);
          assert.equal(input.target_blob, targetBlob);
          assert.deepEqual(Object.keys(input.append), fields);
          assert.equal(typeof input.append_note, 'string');
          const original = fs.readFileSync(path,'utf8');
          assert.equal(blobId(original), baseBlob, 'changed canonical ledger must be rebased');
          const before = JSON.parse(original);
          const matches = before.rows.map((row,index) => row.responsibility_id === input.responsibility_id ? index : -1).filter(index => index >= 0);
          assert.equal(matches.length,1);
          const index = matches[0];
          const afterRow = structuredClone(before.rows[index]);
          for (const field of fields) {
            assert.ok(Array.isArray(afterRow[field]));
            assert.ok(Array.isArray(input.append[field]));
            for (const value of input.append[field]) {
              assert.equal(typeof value,'string');
              if (!afterRow[field].includes(value)) afterRow[field].push(value);
            }
            assert.deepEqual(afterRow[field].slice(0,before.rows[index][field].length),before.rows[index][field]);
          }
          afterRow.notes += input.append_note;
          const identity = '      "responsibility_id": "FBCP-NMR-001"';
          const position = original.indexOf(identity);
          assert.ok(position >= 0);
          assert.equal(original.indexOf(identity,position+1),-1);
          const start = original.lastIndexOf('    {\n      "source_repository"',position);
          const end = original.indexOf('\n    },',position)+6;
          assert.ok(start >= 0 && end > position);
          assert.deepEqual(JSON.parse(original.slice(start,end)),before.rows[index]);
          const replacement = JSON.stringify(afterRow,null,2).split('\n').map(line=>'    '+line).join('\n');
          const updated = original.slice(0,start)+replacement+original.slice(end);
          assert.equal(blobId(updated),targetBlob,'reviewed output identity must match');
          const expected = structuredClone(before); expected.rows[index] = afterRow;
          assert.deepEqual(JSON.parse(updated),expected,'all other rows/source/acceptance fields remain unchanged');
          assert.ok(process.env.GH_BLOB_TOKEN);
          const response = await fetch('https://api.github.com/repos/bhrumom/fabushi-desktop/git/blobs',{
            method:'POST',redirect:'error',signal:AbortSignal.timeout(45000),
            headers:{Authorization:'Bearer '+process.env.GH_BLOB_TOKEN,Accept:'application/vnd.github+json',
              'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({content:updated,encoding:'utf-8'}),
          });
          assert.equal(response.status,201,'exact Git blob endpoint only');
          const created = await response.json();
          assert.equal(created.sha,targetBlob);
          fs.mkdirSync('artifacts/nmr48-ledger-object',{recursive:true});
          const receipt = {repository,checkout:process.env.GITHUB_SHA,path,base_blob:baseBlob,
            created_blob:created.sha,bytes:Buffer.byteLength(updated),source_review_count:before.source_reviews?.length ?? 0,
            sha256:crypto.createHash('sha256').update(updated).digest('hex'),
            row:input.responsibility_id,ref_updated:false,acceptance:false,
            scope:'Unattached Git object transport only; root must read back and perform force=false expected-head CAS.'};
          fs.writeFileSync('artifacts/nmr48-ledger-object/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE
      - name: Preserve object delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmr48-ledger-object-${{ github.sha }}
          path: artifacts/nmr48-ledger-object
          if-no-files-found: error
          retention-days: 30
