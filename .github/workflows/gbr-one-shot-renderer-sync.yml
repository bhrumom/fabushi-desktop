name: GBR one-shot renderer source sync
on:
  push:
    branches: [refactor/grok-bot-018-parity-mac]
    paths:
      - ".github/workflows/gbr-one-shot-renderer-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Grok Bot 0.18 reconstruction
        uses: actions/checkout@v4
        with:
          repository: bhrum/grok-bot-0.18-reconstructed
          ref: 107877b4e2134fd167d239411386f09e42eadd6d
          path: _grok
          persist-credentials: false

      - name: Verify pinned reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _grok rev-parse HEAD)" = "107877b4e2134fd167d239411386f09e42eadd6d"

      - name: Replace production renderer source with pinned reference source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete _grok/frontend/src/ desktop/src/
          cp _grok/frontend/tsconfig.json desktop/tsconfig.json

      - name: Align renderer dependencies with pinned reference
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const targetPath = 'desktop/package.json';
          const target = JSON.parse(fs.readFileSync(targetPath, 'utf8'));
          const ref = JSON.parse(fs.readFileSync('_grok/package.json', 'utf8'));
          target.dependencies = { ...(target.dependencies || {}), ...(ref.dependencies || {}) };
          target.devDependencies = { ...(target.devDependencies || {}), ...(ref.devDependencies || {}) };
          target.description = 'Fabushi desktop - Grok Bot 0.18 source-parity refactor with local Mac Computer';
          fs.writeFileSync(targetPath, JSON.stringify(target, null, 2) + '\n');
          NODE
          sed -i 's/node-version: "22"/node-version: "26"/g' .github/workflows/grok-parity-source-check.yml .github/workflows/macos-grok-parity.yml

      - name: Commit exact renderer-source sync
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No renderer-source changes"
            exit 0
          fi
          git config user.name "Fabushi Work"
          git config user.email "noreply@fabushi.local"
          git add desktop/src desktop/tsconfig.json desktop/package.json
          git commit -m "refactor(gbr): replace renderer with pinned Grok 0.18 source"
          git push origin HEAD:refactor/grok-bot-018-parity-mac
