name: TDRP live authority rebaseline

on:
  push:
    branches:
      - work/story-slider-view-coverage-20261008
    paths:
      - scripts/tdrp-live-rebaseline-feec5f9.mjs
      - .github/workflows/tdrp-live-rebaseline-feec5f9.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Assert exact staging HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "4bf023e32ec9399ae8ce5b53045197b86b8a222e"
      - name: Rebaseline live Revision 9 authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tdrp-live-rebaseline-feec5f9.mjs
      - name: Validate Revision 9 authority fail closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-tdrp-revision9-authority.mjs
      - name: Validate recursive inventory contract
        run: node --test scripts/tdrp-recursive-inventory-contract.test.mjs
      - name: Commit atomic authority reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/tdrp-live-rebaseline-feec5f9.mjs
          rm .github/workflows/tdrp-live-rebaseline-feec5f9.yml
          git diff --check
          git config user.name "fabushi-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(tdrp): rebaseline Revision 9 to feec5f9"
          git fetch origin work/story-slider-view-coverage-20261008
          test "$(git rev-parse origin/work/story-slider-view-coverage-20261008)" = "$GITHUB_SHA"
          git push origin HEAD:work/story-slider-view-coverage-20261008
