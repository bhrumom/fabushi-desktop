name: FDN G15 Host resource privacy

on:
  pull_request:
    paths:
      - "source/fabushi-network-worker/**"
      - "source/host/src/network_worker_process.rs"
      - "source/host/tests/network_worker_process_contract.rs"
      - ".github/scripts/fdn-g15-host-resource-privacy.sh"
      - ".github/workflows/fdn-g15-host-resource-privacy.yml"
      - "docs/specs/fdn-g15-host-resource-privacy.md"
  push:
    branches: [main]
    paths:
      - "source/fabushi-network-worker/**"
      - "source/host/src/network_worker_process.rs"
      - "source/host/tests/network_worker_process_contract.rs"
      - ".github/scripts/fdn-g15-host-resource-privacy.sh"
      - ".github/workflows/fdn-g15-host-resource-privacy.yml"
      - "docs/specs/fdn-g15-host-resource-privacy.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-resource-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git status --porcelain)" = ""

      - name: Setup exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/fabushi-network-worker/go.mod
          cache: false

      - name: Build shipping Host-owned worker
        working-directory: source/fabushi-network-worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.1"
          grep -Fx 'require tailscale.com v1.104.1' go.mod
          # Reproduce the exact dependency lock sealed by current-main run
          # 39061262418 artifact 12111532053
          # (artifact digest sha256:38f62fc58a1e711d64647d45c40d8a4389f9a4875e0990e8bb2a55875eb594f2).
          go mod tidy
          test "$(sha256sum go.mod | awk '{print $1}')" = "31a956329d877ddfc7261f19aeccfbf3e06c83e290b7472d1197e72139526c13"
          test "$(sha256sum go.sum | awk '{print $1}')" = "fff0813e7675eef0c378d524e9c3fa64b39226582b6d2b044cc188eae558fce3"
          go mod verify
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/fabushi-network-worker" .
          test -x "$RUNNER_TEMP/fabushi-network-worker"
          git restore go.mod
          rm -f go.sum
          test "$(git status --porcelain)" = ""

      - name: Focused Host supervisor contract
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component cargo
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
          test ! -e source/host/Cargo.lock
          test ! -e source/host/target
          export CARGO_TARGET_DIR="$RUNNER_TEMP/fdn-g15-host-cargo-target"
          set +e
          cargo_lookup="$(rustup which --toolchain 1.97.1 cargo 2>&1)"
          cargo_lookup_status=$?
          rustc_lookup="$(rustup which --toolchain 1.97.1 rustc 2>&1)"
          rustc_lookup_status=$?
          printf 'G15 cargo lookup status=%s value=%s\n' "$cargo_lookup_status" "$cargo_lookup"
          printf 'G15 rustc lookup status=%s value=%s\n' "$rustc_lookup_status" "$rustc_lookup"
          if [ "$cargo_lookup_status" -ne 0 ] || [ "$rustc_lookup_status" -ne 0 ]; then
            exit 1
          fi
          cargo_bin="$cargo_lookup"
          rustc_bin="$rustc_lookup"
          test -x "$cargo_bin" || exit 1
          test -x "$rustc_bin" || exit 1
          "$cargo_bin" --version
          "$rustc_bin" --version
          set -e
          "$cargo_bin" test --manifest-path source/host/Cargo.toml --test network_worker_process_contract
          rm -f source/host/Cargo.lock
          test ! -e source/host/target
          test "$(git status --porcelain)" = ""

      - name: Measure real Host-owned worker steady state and privacy
        shell: bash
        run: bash .github/scripts/fdn-g15-host-resource-privacy.sh evidence

      - name: Static secret and privacy artifact scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              re.compile(rb"(?i)authorization:\s*bearer\s+[A-Za-z0-9._~+/-]{12,}"),
              re.compile(rb"(?i)(?:access|refresh|device|mobile)[_-]?token\s*[:=]\s*[A-Za-z0-9._~+/-]{12,}"),
              re.compile(rb"(?:hskey|tskey)-auth-[A-Za-z0-9_-]{8,}"),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          for path in Path("evidence").rglob("*"):
              if not path.is_file():
                  continue
              data=path.read_bytes()
              for pattern in patterns:
                  if pattern.search(data):
                      raise SystemExit(f"secret-like material detected in {path}")
          print("FDN_G15_HOST secret_privacy_scan=pass")
          PY

      - name: Seal exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c evidence/SHA256SUMS
          git diff --exit-code

      - name: Upload exact-head Host G15 evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fdn-g15-host-resource-privacy-${{ env.EXPECTED_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Report evidence identity
        shell: bash
        run: |
          {
            echo "source_sha=$EXPECTED_SHA"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_digest=sha256:${{ steps.upload.outputs.artifact-digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
