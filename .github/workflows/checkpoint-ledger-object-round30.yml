name: Round30 exact forwarding feedback ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/checkpoint-ledger-ops-round30.json'
      - '.github/workflows/checkpoint-ledger-object-round30.yml'
permissions:
  contents: write
jobs:
  prepare-ledger-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Append only the reviewed NMR evidence at this exact checkout
        env:
          EXPECTED_CHECKOUT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
          mkdir -p artifacts/round30-ledger-object
          export ROUND30_INPUT_BLOB
          ROUND30_INPUT_BLOB=$(git rev-parse HEAD:projects/telegram-desktop-rust/parity-ledger.json)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const gitHash = bytes => crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
          const opsBytes = fs.readFileSync('.github/checkpoint-ledger-ops-round30.json');
          const ops = JSON.parse(opsBytes);
          assert.equal(process.env.GITHUB_REPOSITORY, 'bhrumom/fabushi-desktop');
          assert.equal(ops.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(ops.format_version, 2);
          assert.equal(ops.path, 'projects/telegram-desktop-rust/parity-ledger.json');
          assert.equal(ops.responsibility_id, 'TDRP-R9-SHARE-FORWARD-PRIVACY-001');
          const allowed = new Set(['fabushi_target_paths', 'fabushi_target_symbols', 'requirement_ids', 'ui_functional_case_ids', 'test_evidence', 'production_evidence', 'additional_source_identities']);
          const expectedIdentities = [{"repository":"telegramdesktop/tdesktop","commit":"f985723b552b30fe1c17d377d57f44e61a15a8c4","path":"Telegram/SourceFiles/chat_helpers/share_message_phrase_factory.h","object":"86865db47439dbce848fc812df2554335d3e004c"},{"repository":"telegramdesktop/tdesktop","commit":"f985723b552b30fe1c17d377d57f44e61a15a8c4","path":"Telegram/SourceFiles/chat_helpers/share_message_phrase_factory.cpp","object":"1437bbfbd86b9d6649faae0bed7eed755e06337e"}];
          assert.deepEqual(ops.additional_source_identities, expectedIdentities);
          assert.deepEqual(ops.source_review_updates.map(update => update.identity), expectedIdentities);
          for (const update of ops.source_review_updates) assert.deepEqual(update.responsibility_ids, [ops.responsibility_id]);
          const input = fs.readFileSync(ops.path);
          const inputBlob = gitHash(input);
          assert.equal(inputBlob, process.env.ROUND30_INPUT_BLOB);
          const original = JSON.parse(input), changed = structuredClone(original);
          const matches = changed.rows.filter(row => row.responsibility_id === ops.responsibility_id);
          assert.equal(matches.length, 1);
          const row = matches[0], before = original.rows.find(row => row.responsibility_id === ops.responsibility_id);
          for (const [key, value] of Object.entries(ops.source_identity)) assert.deepEqual(row[key], value, 'source identity drift: ' + key);
          for (const [key, values] of Object.entries(ops.append)) {
            assert.ok(allowed.has(key), 'undeclared field: ' + key);
            assert.ok(Array.isArray(row[key]) && Array.isArray(values));
            for (const value of values) {
              assert.equal(typeof value, 'string');
              if (!row[key].includes(value)) row[key].push(value);
            }
          }
          for (const identity of ops.additional_source_identities) {
            assert.deepEqual(Object.keys(identity).sort(), ['commit', 'object', 'path', 'repository']);
            assert.equal(identity.repository, ops.source_identity.source_repository);
            assert.equal(identity.commit, ops.source_identity.source_commit);
            const prior = row.additional_source_identities.filter(item => item.repository === identity.repository && item.commit === identity.commit && item.path === identity.path);
            assert.ok(prior.length <= 1);
            if (prior.length) assert.deepEqual(prior[0], identity);
            else row.additional_source_identities.push(identity);
          }
          assert.equal(ops.source_review_updates.length, 2);
          const changedReviewKeys = new Set();
          for (const update of ops.source_review_updates) {
            const key = JSON.stringify(update.identity);
            assert.ok(!changedReviewKeys.has(key));
            changedReviewKeys.add(key);
            const matches = changed.source_reviews.filter(review => Object.entries(update.identity).every(([key, value]) => review[key] === value));
            assert.equal(matches.length, 1);
            const review = matches[0];
            assert.equal(review.status, 'pending');
            assert.equal(review.review_depth, 'deep');
            for (const field of ['evidence', 'responsibility_ids']) {
              assert.ok(Array.isArray(review[field]) && Array.isArray(update[field]));
              for (const value of update[field]) {
                assert.equal(typeof value, 'string');
                if (!review[field].includes(value)) review[field].push(value);
              }
            }
          }
          assert.equal(changed.source_reviews.length, original.source_reviews.length);
          for (let index = 0; index < original.source_reviews.length; index += 1) {
            const oldReview = original.source_reviews[index], newReview = changed.source_reviews[index];
            const update = ops.source_review_updates.find(update => Object.entries(update.identity).every(([key, value]) => oldReview[key] === value));
            if (update == null) { assert.deepEqual(newReview, oldReview); continue; }
            assert.deepEqual(Object.keys(newReview), Object.keys(oldReview));
            for (const key of Object.keys(oldReview)) {
              if (key === 'evidence' || key === 'responsibility_ids') assert.deepEqual(newReview[key].slice(0, oldReview[key].length), oldReview[key]);
              else assert.deepEqual(newReview[key], oldReview[key], key);
            }
          }
          assert.equal(typeof row.notes, 'string');
          assert.equal(typeof ops.note, 'string');
          if (!row.notes.includes(ops.note)) row.notes += ops.note;
          for (const key of Object.keys(original)) if (key !== 'rows' && key !== 'source_reviews') assert.deepEqual(changed[key], original[key], key);
          assert.equal(changed.rows.length, original.rows.length);
          for (let index = 0; index < original.rows.length; index += 1) {
            const oldRow = original.rows[index], newRow = changed.rows[index];
            assert.equal(newRow.responsibility_id, oldRow.responsibility_id);
            if (oldRow.responsibility_id !== ops.responsibility_id) assert.deepEqual(newRow, oldRow);
          }
          for (const key of Object.keys(before)) {
            if (!allowed.has(key) && key !== 'notes') assert.deepEqual(row[key], before[key], key);
            if (allowed.has(key)) assert.deepEqual(row[key].slice(0, before[key].length), before[key], key);
          }
          assert.equal(Object.keys(row).length, Object.keys(before).length);
          assert.ok(row.notes.startsWith(before.notes));
          const text = JSON.stringify(changed, null, 2) + '\n', output = Buffer.from(text);
          const receipt = {harness_sha: process.env.GITHUB_SHA, input_blob: inputBlob, ops_blob: gitHash(opsBytes),
            output_blob: gitHash(output), output_sha256: crypto.createHash('sha256').update(output).digest('hex'),
            changed_rows: [ops.responsibility_id], changed_source_reviews: ops.source_review_updates.map(update => update.identity), product_validation: false, accepted: false,
            commit_created: false, ref_updated: false,
            integration_condition: 'Root reads complete input/output and current input identity, then force=false expected-head CAS.'};
          fs.writeFileSync('artifacts/round30-ledger-object/prepared-ledger.json', output);
          fs.writeFileSync('artifacts/round30-ledger-object/receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/round30-ledger-blob.json', JSON.stringify({content: text, encoding: 'utf-8'}));
          console.log(JSON.stringify(receipt));
          NODE
      - name: Create only the unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/round30-ledger-blob.json" > artifacts/round30-ledger-object/github-blob.json
          expected=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round30-ledger-object/receipt.json','utf8')).output_blob")
          actual=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round30-ledger-object/github-blob.json','utf8')).sha")
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
      - name: Preserve object identity for root readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round30-ledger-object-${{ github.sha }}
          path: artifacts/round30-ledger-object
          if-no-files-found: error
