name: Native call scope temporary ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths: ['.github/workflows/native-call-scope-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the existing ledger schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate and create only the exact scoped ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
