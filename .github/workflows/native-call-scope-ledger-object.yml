          import jsonschema
          path = 'projects/telegram-desktop-rust/parity-ledger.json'
          schema_path = 'projects/telegram-desktop-rust/contracts/parity-ledger.schema.json'
          expected = 'a73e18e1d1e44dfa28cb28755ce13812be9534cc'
          expected_schema = 'e52b2ba92c8cf966bb506cc8b9f81320462474ae'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'checkout must equal this run'
          for input_path, identity in [(path, expected), (schema_path, expected_schema)]:
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + input_path], text=True).strip()
              assert actual == identity, 'reread and reconcile concurrent input before preparing: ' + input_path
