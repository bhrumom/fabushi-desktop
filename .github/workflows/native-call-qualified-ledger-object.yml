name: Native call qualified ledger object
on:
  push:
    branches: [checkpoint/tdrp-native-call-scope-20bf9475-r1]
    paths: ['.github/workflows/native-call-qualified-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing ledger schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate existing-row execution patch and create only an unattached blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          import jsonschema
          path = 'projects/telegram-desktop-rust/parity-ledger.json'
          schema_path = 'projects/telegram-desktop-rust/contracts/parity-ledger.schema.json'
          expected = '5b69d6e9103396f8de7d157e38fe7c1607afbf72'
          expected_schema = 'e52b2ba92c8cf966bb506cc8b9f81320462474ae'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'exact preparation checkout required'
          for input_path, identity in [(path, expected), (schema_path, expected_schema)]:
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + input_path], text=True).strip()
              assert actual == identity, 'input changed; reread before retry: ' + input_path
          before = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          schema = json.loads(pathlib.Path(schema_path).read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(before)
          assert before['upstream_commit'] == 'f985723b552b30fe1c17d377d57f44e61a15a8c4'
          assert len(before['rows']) == before['coverage']['responsibilities_total'] == 185
          positions = [i for i, row in enumerate(before['rows']) if row['responsibility_id'] == 'FBCP-CALL-SCOPE-001']
          assert len(positions) == 1
          position = positions[0]
          assert before['rows'][position]['target_commit'] == '8bcfd464691534acaa04b13852cd523ab49a3dcc'
          patch = json.loads(r'''{"platform_delta":"Existing Rust Host/SQLite/Native HTTP owners. Exact523 credential/scope execution ran Ubuntu24.04.5; separate macOS shipping job125550827119 remains queued. No signed package/media acceptance.","blockers":["Bounded AC-CALL-CRED01–03 independently supported at exact523c8ca: credential6+scope5+shipping3+local1 passed. Full call/platform/service and release acceptance remain blocked.","macOS shipping compilation job125550827119 is queued at executionH523c8ca; deployed call authorization, media/device/renderer lifetime, complete platform and recovery gates remain open.","Snapshot comparison is not epoch/ABA revocation; historical inconsistent-row remediation remains open.","Full source identity dispositions, legal/generated/external closure and independent product ACCEPT remain false."],"test_evidence":["passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_scope_contract.rs#native_call_scope_rejects_wrong_peer_and_invalid_requests_without_effects","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_scope_contract.rs#native_call_scope_rejects_malformed_canonical_metadata_and_preserves_reopen_state","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_scope_contract.rs#native_call_scope_valid_creation_lifecycle_and_discovery_survive_reopen","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_scope_contract.rs#native_call_scope_backend_refusal_has_no_phantom_call_and_allows_retry","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_scope_contract.rs#native_call_scope_leaves_non_native_participant_and_lifecycle_contract_unchanged","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/session_gateway_contract.rs#shipping_call_session_uses_backend_ordering_then_materializes_canonical_owner","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/session_gateway_contract.rs#shipping_call_discovery_materializes_incoming_call_into_canonical_human_scope","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/session_gateway_contract.rs#call_session_owner_fences_lifecycle_signaling_reconnect_and_restart","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_credentials_bind_all_http_families_before_transport","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_signal_binds_sender_to_dispatch_credential","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_credentials_fence_every_held_get_field_before_lifecycle_post","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_credentials_reject_stale_ice_and_discovery_bodies","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_credentials_recover_admitted_create_after_rejected_response","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/native_call_credential_contract.rs#native_call_credentials_recover_admitted_event_after_rejected_response","passed-at-523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6:source/host/tests/session_gateway_contract.rs#shipping_call_ice_credentials_remain_host_owned_and_device_scoped"],"target_commit":"523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6","workflow_run":41525143801,"job":125550827148,"artifact_id":13179882022,"artifact_digest":"sha256:8defdbefda95277677c14067bc3c7f0e946439d07edb91634fbe02eb23b5d77d","test_environment_ids":["GitHub Actions native-service-contracts / native-message-reconciliation / Ubuntu24.04.5; exact523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6"],"test_execution_evidence":["H=523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6; run41525143801 attempt1 job125550827148; credential6+scope5+shipping3+local1 passed0failed0ignored; artifact13179882022 sha256:8defdbefda95277677c14067bc3c7f0e946439d07edb91634fbe02eb23b5d77d; independent bounded AC-CALL-CRED01/02/03 assessment by /root/call_credential_source_review; not full product ACCEPT.","H=8bcfd464691534acaa04b13852cd523ab49a3dcc; run41521134666 attempt1 job125537147556; CALL-SCOPE5 + shipping-call3 + local-lifecycle1 passed; artifact13177343396 sha256:3b65ad1fde0b105aee7120483dd5ea7fc7f252d31ae2df8c90bc40d5d34a9001; this is prior scope evidence only, not execution of CALL-CRED cases.","path:projects/telegram-desktop-rust/evidence/task20bf-round1-call-scope.json"],"reviewer":"Frozen source/code/test/merge and CRED-MERGE-01 FIX reviews are recorded in task20bf-round1-call-scope-review.md. /root/call_credential_source_review independently reread exact523 completed logs/artifacts/source and supports bounded AC-CALL-CRED01/02/03; no concrete defect. Full shipping/product ACCEPT remains open.","notes":"Actual code and15 bounded call contracts are qualified at target_commit523c8ca with independent loopback assessment; prior8bc scope evidence is retained as history. implementation remains implemented, coverage pending, release blocked and global acceptance false. Snapshot comparison is not epoch/ABA or atomic revocation; no deployed-service/media/platform qualification or whole-file source_reviews completion is inferred."}''')
          assert set(patch) == set(["platform_delta","blockers","test_evidence","target_commit","workflow_run","job","artifact_id","artifact_digest","test_environment_ids","test_execution_evidence","reviewer","notes"])
          after = copy.deepcopy(before)
          after['rows'][position].update(patch)
          assert after['rows'][position]['target_commit'] == '523c8ca4883e6eaa10d1d19a0e237f9d3964b3c6'
          for key in ['implementation_status', 'coverage_disposition', 'release_gate_status', 'acceptance_reviewer', 'coverage_matrix_status', 'flake_status']:
              assert after['rows'][position][key] == before['rows'][position][key], 'no acceptance promotion'
          restored = copy.deepcopy(after)
          restored['rows'][position] = before['rows'][position]
          assert restored == before, 'only the declared existing-row execution fields may change'
          jsonschema.Draft202012Validator(schema).validate(after)
          payload = (json.dumps(after, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          expected_new = hashlib.sha1(b'blob ' + str(len(payload)).encode() + b'\0' + payload).hexdigest()
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
              data=json.dumps({'content': payload.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected_new
          receipt = {'preparation_head': head, 'base_blob': expected, 'schema_blob': expected_schema,
                     'prepared_blob': result['sha'], 'bytes': len(payload), 'responsibilities': len(after['rows']),
                     'execution_head': after['rows'][position]['target_commit'], 'changed_fields': sorted(patch),
                     'other_rows_preserved': True, 'source_reviews_preserved': True, 'acceptance_changed': False, 'refs_written': False}
          pathlib.Path('call-qualified-ledger-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve exact preparation receipt
        uses: actions/upload-artifact@v4
        with:
          name: native-call-qualified-ledger-object-${{ github.sha }}
          path: call-qualified-ledger-receipt.json
          if-no-files-found: error
