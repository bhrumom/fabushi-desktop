name: Round8 entry refresh repair evidence
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/checkpoint-ledger-ops-round8-entry-refresh-repair.json'
      - '.github/workflows/checkpoint-entry-refresh-repair-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  prepare-ledger-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preserve exact concurrent source records and append reviewed owner anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export ROUND8_INPUT_BLOB
          ROUND8_INPUT_BLOB=$(git rev-parse HEAD:projects/telegram-desktop-rust/parity-ledger.json)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const hash = b => crypto.createHash('sha1').update(Buffer.from('blob ' + b.length + '\0')).update(b).digest('hex');
          const identity = x => JSON.stringify([x.repository, x.commit, x.path, x.object]);
          const primary = x => JSON.stringify([x.source_repository, x.source_commit, x.source_path, x.source_blob_sha]);
          const root = 'projects/telegram-desktop-rust/parity-ledger.json';
          const opsBytes = fs.readFileSync('.github/checkpoint-ledger-ops-round8-entry-refresh-repair.json');
          const ops = JSON.parse(opsBytes);
          assert.equal(process.env.GITHUB_REPOSITORY, 'bhrumom/fabushi-desktop');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1');
          assert.deepEqual(Object.keys(ops).sort(), ['format_version','repository','path','reviewed_base','input_blob','operations','remove_redundant_review_fields','nmr_append'].sort());
          assert.equal(ops.format_version, 1);
          assert.equal(ops.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(ops.path, root);
          assert.equal(ops.reviewed_base, '3a4af377451d915795466362b084247e05975101');
          assert.equal(ops.input_blob, '665f379284b8bda695b64c1f7364600384149a66');
          const input = fs.readFileSync(root);
          assert.equal(hash(input), process.env.ROUND8_INPUT_BLOB);
          assert.equal(hash(input), ops.input_blob, 'canonical input advanced; reconcile and regenerate without overwriting');
          const before = JSON.parse(input), after = structuredClone(before);
          const ids = ['FBCP-NMR-001','TDRP-R9-SHARE-SEND-OPTIONS-001','TDRP-R9-SHARE-THREAD-DESTINATION-001','TDRP-R9-SHARE-TOPIC-ELIGIBILITY-001','TDRP-R9-SHARE-FORWARD-PRIVACY-001'];
          assert.deepEqual(ops.operations.map(x => x.id).sort(), [...ids].sort());
          assert.equal(before.source_reviews.length, 16);
          assert.equal(before.source_reviews.filter(x => x.status === 'complete').length, 6);
          const allowedSources = new Map([
           ['Telegram/SourceFiles/history/view/controls/history_view_forward_panel.h','b5847bfe6e651f5e3bc52480192afd664a37c8b8'],
           ['Telegram/SourceFiles/history/view/controls/history_view_forward_panel.cpp','eaa0108dd32dbadc21727ed4583c329d3badc85e'],
           ['Telegram/SourceFiles/chat_helpers/share_message_phrase_factory.h','86865db47439dbce848fc812df2554335d3e004c'],
           ['Telegram/SourceFiles/chat_helpers/share_message_phrase_factory.cpp','1437bbfbd86b9d6649faae0bed7eed755e06337e']
          ]);
          const checkedSource = x => {
           assert.deepEqual(Object.keys(x).sort(), ['repository','commit','path','object'].sort());
           assert.equal(x.repository, 'telegramdesktop/tdesktop');
           assert.equal(x.commit, 'f985723b552b30fe1c17d377d57f44e61a15a8c4');
           assert.equal(x.object, allowedSources.get(x.path));
          };
          let relationCount = 0;
          for (const op of ops.operations) {
           assert.deepEqual(Object.keys(op).sort(), ['id','source_identity','append_source_identities'].sort());
           const indexes = after.rows.flatMap((r,i) => r.responsibility_id === op.id ? [i] : []);
           assert.equal(indexes.length, 1);
           const index = indexes[0], row = after.rows[index], original = before.rows[index];
           assert.deepEqual(Object.keys(op.source_identity).sort(), ['source_repository','source_commit','source_path','source_blob_sha'].sort());
           for (const [k,v] of Object.entries(op.source_identity)) assert.equal(row[k], v);
           const prior = original.additional_source_identities ?? [];
           row.additional_source_identities ??= [];
           const expectedCount = ['FBCP-NMR-001','TDRP-R9-SHARE-SEND-OPTIONS-001'].includes(op.id) ? 4 : 2;
           assert.equal(op.append_source_identities.length, expectedCount);
           for (const tuple of op.append_source_identities) {
            checkedSource(tuple);
            if (expectedCount === 2) assert.ok(tuple.path.includes('history_view_forward_panel.'));
            assert.notEqual(identity(tuple), primary(row));
            assert.ok(!row.additional_source_identities.some(x => identity(x) === identity(tuple)));
            row.additional_source_identities.push(tuple);
            relationCount++;
           }
           assert.deepEqual(row.additional_source_identities.slice(0,prior.length),prior);
          }
          assert.equal(relationCount, 14);
          assert.equal(ops.remove_redundant_review_fields.length, 0);
          for (const review of before.source_reviews) assert.ok(!Object.hasOwn(review, 'reviewed_source_blob'));
          const removed = new Set();
          for (const op of ops.remove_redundant_review_fields) {
           assert.deepEqual(Object.keys(op).sort(), ['identity','field','value'].sort());
           checkedSource(op.identity);
           assert.equal(op.field, 'reviewed_source_blob');
           assert.equal(op.value, op.identity.object);
           const indexes = after.source_reviews.flatMap((r,i) => identity(r) === identity(op.identity) ? [i] : []);
           assert.equal(indexes.length,1);
           const index=indexes[0], review=after.source_reviews[index];
           assert.ok(!removed.has(index));
           removed.add(index);
           assert.equal(review.reviewed_source_blob,review.object);
           assert.equal(review.reviewed_source_blob,op.value);
           assert.equal(review.status,'complete');
           delete review.reviewed_source_blob;
           const original = structuredClone(before.source_reviews[index]);
           delete original.reviewed_source_blob;
           assert.deepEqual(review,original,'all reviewed evidence and status must remain');
          }
          for (let i=0;i<before.source_reviews.length;i++) if(!removed.has(i)) assert.deepEqual(after.source_reviews[i],before.source_reviews[i]);
          assert.deepEqual(Object.keys(ops.nmr_append).sort(),['fabushi_target_paths','fabushi_target_symbols','production_evidence','test_execution_evidence'].sort());
          assert.deepEqual(ops.nmr_append.fabushi_target_paths,[
           'frontend/src/recovered/features/conversation/workspace/pdf-viewer.css',
           'frontend/src/recovered/features/conversation/workspace/view.css'
          ]);
          assert.deepEqual(ops.nmr_append.fabushi_target_symbols,[
           'open_human_forward_recovery_owner','deliver_forward_batch_while_locked','pending_human_forward_is_batch_owned'
          ]);
          const nmr=after.rows.find(x=>x.responsibility_id==='FBCP-NMR-001');
          const oldNmr=before.rows.find(x=>x.responsibility_id==='FBCP-NMR-001');
          for(const [key,values] of Object.entries(ops.nmr_append)){
           assert.ok(Array.isArray(nmr[key]) && Array.isArray(values));
           assert.ok(values.every(x=>typeof x==='string' && x.length));
           for(const value of values){assert.ok(!nmr[key].includes(value)); nmr[key].push(value);}
           assert.deepEqual(nmr[key].slice(0,oldNmr[key].length),oldNmr[key]);
          }
          assert.equal(nmr.fabushi_target_paths.length,70);
          assert.equal(nmr.fabushi_target_symbols.length,95);
          assert.equal(after.rows.length,before.rows.length);
          for(let i=0;i<before.rows.length;i++){
           const original=before.rows[i], row=after.rows[i];
           if(!ids.includes(row.responsibility_id)){assert.deepEqual(row,original);continue;}
           for(const key of Object.keys(original)){
            if(key==='additional_source_identities')continue;
            if(row.responsibility_id==='FBCP-NMR-001' && Object.hasOwn(ops.nmr_append,key))continue;
            assert.deepEqual(row[key],original[key],'unchanged row field '+row.responsibility_id+':'+key);
           }
           assert.deepEqual(Object.keys(row).filter(k=>k!=='additional_source_identities'),Object.keys(original).filter(k=>k!=='additional_source_identities'));
          }
          for(const key of Object.keys(before)) if(!['rows','source_reviews'].includes(key)) assert.deepEqual(after[key],before[key]);
          const output=Buffer.from(JSON.stringify(after,null,2)+'\n');
          const dir='artifacts/round8-entry-refresh-repair-ledger';
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/prepared-ledger.json',output);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/round8-entry-refresh-repair-blob.json',JSON.stringify({content:output.toString('utf8'),encoding:'utf-8'}));
          fs.writeFileSync(dir+'/receipt.json',JSON.stringify({
           harness_sha:process.env.GITHUB_SHA,input_blob:hash(input),ops_blob:hash(opsBytes),output_blob:hash(output),
           output_sha256:crypto.createHash('sha256').update(output).digest('hex'),
           source_relation_appends:relationCount,removed_redundant_fields:removed.size,changed_rows:ids,
           source_review_statuses_preserved:true,unrelated_rows_and_globals_preserved:true,
           product_validation:false,source_acceptance:false,commit_created:false,ref_updated:false
          },null,2)+'\n');
          NODE
      - name: Create only the unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/round8-entry-refresh-repair-blob.json" > artifacts/round8-entry-refresh-repair-ledger/github-blob.json
          expected=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round8-entry-refresh-repair-ledger/receipt.json','utf8')).output_blob")
          actual=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/round8-entry-refresh-repair-ledger/github-blob.json','utf8')).sha")
          test "$actual" = "$expected"
          cat artifacts/round8-entry-refresh-repair-ledger/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-entry-refresh-repair-ledger-${{ github.sha }}
          path: artifacts/round8-entry-refresh-repair-ledger
          if-no-files-found: error
  inspect-original-ui-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read original failed artifact without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bhrumom/fabushi-desktop"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13198736941" > "$RUNNER_TEMP/round8-original-ui-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13198736941/zip" > "$RUNNER_TEMP/round8-original-ui.zip"
          python3 <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((root / "round8-original-ui-artifact.json").read_text())
          assert meta["id"] == 13198736941
          assert meta["workflow_run"]["id"] == 41565477479
          assert meta["workflow_run"]["head_sha"] == "a0e6cd2ded523f59add3a7ade6bd43890b448300"
          assert not meta["expired"]
          expected = "081240c1b2edab848a5432e01cfdf66572f443c13b03f6cec0b5b067dce568dd"
          assert meta["digest"] == "sha256:" + expected
          archive = root / "round8-original-ui.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          names = [
           "human-entry-refresh-requeries-search-and-discards-older-results.browser.json",
           "human-entry-refresh-retires-removed-pdf-and-late-resource-reads.browser.json",
           "human-entry-refresh-retires-spreadsheet-mount-when-source-changes.browser.json",
          ]
          receipt = {"source_run": 41565477479, "source_head": meta["workflow_run"]["head_sha"],
                     "source_artifact": meta["id"], "archive_sha256": expected,
                     "inspection_only": True, "tests_executed": 0, "cases": []}
          with zipfile.ZipFile(archive) as z:
           for name in names:
            found = [n for n in z.namelist() if pathlib.PurePosixPath(n).name == name]
            assert len(found) == 1, (name, len(found))
            info = z.getinfo(found[0])
            assert info.file_size < 2000000
            data = json.loads(z.read(info))
            resources = data.get("resources", [])
            safe_resources = []
            for r in resources:
             args = r.get("args", {})
             source = args.get("source", "")
             account = r.get("account")
             assert account in ["fixture-a", "fixture-b", None]
             safe_resources.append({
              "id": r.get("id"), "method": r.get("method"), "account": account,
              "settled": r.get("settled"),
              "source_sha256": hashlib.sha256(source.encode()).hexdigest(),
              "maxBytes": args.get("maxBytes")
             })
            receipt["cases"].append({
             "name": name, "diagnostic_count": len(data.get("diagnostics", [])),
             "unexpected_count": len(data.get("unexpected", [])),
             "resource_count": len(resources), "resources": safe_resources,
             "coordinator_request_count": len(data.get("requests", [])),
             "visible_row_count": len(data.get("rows", [])),
            })
          out = pathlib.Path("artifacts/round8-entry-refresh-original-ui")
          out.mkdir(parents=True, exist_ok=True)
          (out / "inspection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-entry-refresh-original-ui-${{ github.sha }}
          path: artifacts/round8-entry-refresh-original-ui
          if-no-files-found: error
