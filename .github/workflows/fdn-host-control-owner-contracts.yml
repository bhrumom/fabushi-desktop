name: FDN Host control owner contracts

on:
  pull_request:
    paths:
      - "source/host/src/network_enrollment_owner.rs"
      - "source/host/src/network_worker_process.rs"
      - "source/host/src/remote_computer_target.rs"
      - "source/host/app/src/main.rs"
      - "source/host/tests/network_enrollment_owner_contract.rs"
      - "source/host/tests/network_worker_process_contract.rs"
      - "source/host/tests/remote_computer_target_contract.rs"
      - "source/host/tests/remote_computer_target_native_wiring_contract.rs"
      - ".github/workflows/fdn-host-control-owner-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdn-host-control-owner-contracts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-owner-contracts:
    name: Host owner contracts / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: fdn-host-control-owner-contracts-ubuntu-1.97.1
      - name: Install Linux native desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Format focused owner and contract sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check             source/host/src/network_enrollment_owner.rs             source/host/src/network_worker_process.rs             source/host/src/remote_computer_target.rs             source/host/tests/network_enrollment_owner_contract.rs             source/host/tests/network_worker_process_contract.rs             source/host/tests/remote_computer_target_contract.rs             source/host/tests/remote_computer_target_native_wiring_contract.rs
      - name: Test enrollment owner lifecycle and uncertainty fences
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml --test network_enrollment_owner_contract -- --nocapture
      - name: Test supervised worker IPC and secret boundary
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml --test network_worker_process_contract -- --nocapture
      - name: Test target authorization, operation journal and network fences
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml --test remote_computer_target_contract -- --nocapture
      - name: Test shipping native target wiring and sensitive result boundary
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml --test remote_computer_target_native_wiring_contract -- --nocapture
      - name: Record bounded evidence scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence
          cat > .evidence/fdn-host-control-owner-contracts.json <<EOF
          {
            "source_sha": "$(git rev-parse HEAD)",
            "environment": "github-actions/ubuntu-24.04",
            "scope": "bounded-host-owner-contracts-only",
            "covers_contract_slices": ["G01","G02","G04","G07","G08","G09","G13","G15"],
            "does_not_claim_complete_gates": ["G01","G02","G03","G04","G05","G06","G07","G08","G09","G10","G11","G12","G13","G14","G15","G16"],
            "production_enrollment_secret_required": false,
            "android_signing_or_protected_account_secret_required": false,
            "desktop_release_version_required": false
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: fdn-host-control-owner-contracts-${{ github.event.pull_request.head.sha || github.sha }}
          path: .evidence/fdn-host-control-owner-contracts.json
          if-no-files-found: error
          retention-days: 90
