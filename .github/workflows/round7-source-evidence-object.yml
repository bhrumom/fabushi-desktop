name: Round7 source evidence object transfer
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round7-source-evidence-object.yml
      - .github/round7-source-evidence-ops.json
permissions:
  contents: read
jobs:
  store-reviewed-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Store only the append-only evidence object
        env:
          R7_OBJECT_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const repository = 'bhrumom/fabushi-desktop';
          const path = 'projects/telegram-desktop-rust/parity-ledger.json';
          const manifestPath = '.github/round7-source-evidence-ops.json';
          const bytes = readFileSync(manifestPath);
          const operation = JSON.parse(bytes);
          assert.equal(operation.repository, repository);
          assert.equal(operation.path, path);
          assert.equal(operation.taskId, '20bf9475-a885-4314-b509-bea53ef8849f');
          assert.equal(operation.round, 7);
          assert.equal(operation.row_id, 'FBCP-NMR-001');
          assert.deepEqual(Object.keys(operation).sort(), ['repository','path','taskId','round','row_id','source_reviews','append','note'].sort());
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const head = git('rev-parse', 'HEAD');
          assert.equal(head, process.env.GITHUB_SHA);
          const inputBlob = git('rev-parse', 'HEAD:' + path);
          const ledger = JSON.parse(readFileSync(path, 'utf8'));
          const before = structuredClone(ledger);
          assert(Array.isArray(ledger.source_reviews));
          assert.equal(operation.source_reviews.length, 8);
          const key = value => [value.repository,value.commit,value.path,value.object].join('\0');
          const additions = [];
          const existing = [];
          const identities = new Set();
          for (const review of operation.source_reviews) {
            assert.equal(review.repository, 'telegramdesktop/tdesktop');
            assert.equal(review.commit, 'f985723b552b30fe1c17d377d57f44e61a15a8c4');
            assert.equal(review.status, 'pending');
            assert.equal(review.category, 'product');
            assert.equal(review.risk, 'high');
            assert.equal(review.review_depth, 'deep');
            assert.deepEqual(review.responsibility_ids, []);
            assert.deepEqual(review.evidence, ['projects/telegram-desktop-rust/research/native-message-known-overlap-fixed-u.md#round-7-sparse-history-and-parser-review']);
            assert(!identities.has(key(review)), 'duplicate requested source');
            identities.add(key(review));
            const matches = ledger.source_reviews.filter(value => value.repository === review.repository && value.commit === review.commit && value.path === review.path);
            assert(matches.length <= 1);
            if (matches.length) {
              assert.equal(matches[0].object, review.object, 'source identity changed');
              existing.push(key(review));
            } else {
              ledger.source_reviews.push(review);
              additions.push(key(review));
            }
          }
          const indices = ledger.rows.map((row,index) => row.responsibility_id === operation.row_id ? index : -1).filter(index => index >= 0);
          assert.equal(indices.length, 1);
          const index = indices[0], row = ledger.rows[index];
          const allowed = new Set(['test_evidence','test_execution_evidence']);
          for (const [field,values] of Object.entries(operation.append)) {
            assert(allowed.has(field));
            assert(Array.isArray(row[field]) && Array.isArray(values));
            for (const value of values) {
              assert(typeof value === 'string' && value.trim().length > 0);
              if (!row[field].includes(value)) row[field].push(value);
            }
          }
          assert(typeof row.notes === 'string' && operation.note.startsWith('\nRound7 settled-canonical reaction and source review:'));
          if (!row.notes.includes(operation.note)) row.notes += operation.note;
          for (const [field,value] of Object.entries(row)) {
            if (!Object.hasOwn(operation.append,field) && field !== 'notes') assert.deepEqual(value,before.rows[index][field]);
          }
          assert.deepEqual(ledger.source_reviews.slice(0,before.source_reviews.length),before.source_reviews);
          const unchanged = structuredClone(ledger);
          unchanged.rows[index] = before.rows[index];
          unchanged.source_reviews = before.source_reviews;
          assert.deepEqual(unchanged,before,'all other rows, counters, locks and acceptance states must be unchanged');
          const content = JSON.stringify(ledger,null,2) + '\n';
          const output = Buffer.from(content,'utf8');
          const blob = createHash('sha1').update(Buffer.from('blob ' + output.length + '\0')).update(output).digest('hex');
          const response = await fetch('https://api.github.com/repos/' + repository + '/git/blobs', {
            method:'POST', signal:AbortSignal.timeout(60000),
            headers:{Authorization:'Bearer ' + process.env.R7_OBJECT_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({content,encoding:'utf-8'})
          });
          if (!response.ok) throw new Error('Git blob storage failed with status ' + response.status);
          const result = await response.json();
          assert.equal(result.sha,blob);
          const receipt = {source_sha:head,input_blob:inputBlob,ledger_blob:blob,bytes:output.length,
            operations_blob:git('rev-parse','HEAD:' + manifestPath),operations_sha256:createHash('sha256').update(bytes).digest('hex'),
            added_reviews:additions,existing_reviews_preserved:existing,
            refs_updated:false,commits_created:false,product_validation:false,source_acceptance:false};
          writeFileSync('round7-source-evidence-object-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('ROUND7_SOURCE_EVIDENCE_OBJECT ' + JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: round7-source-evidence-object-${{ github.sha }}
          path: round7-source-evidence-object-receipt.json
          if-no-files-found: error
