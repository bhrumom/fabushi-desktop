name: Round17 reviewed object transfer
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round17-reviewed-objects.yml
      - .github/round17-reviewed-objects.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-reviewed-objects:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Store reviewed blobs and complete byte manifests without moving refs
        env:
          TRANSFER_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/round17-reviewed-objects-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import base64, copy, gzip, hashlib, io, json, os, pathlib, re, subprocess
          import urllib.error, urllib.request

          REPOSITORY = 'bhrumom/fabushi-desktop'
          BRANCH = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          TEST = 'source/mahayana/mahayana-rs/mahayana-app-host/tests/native_desktop_account_handoff.rs'
          WORKFLOW = '.github/workflows/native-service-contracts.yml'
          SPEC = 'docs/specs/fbcp-native-message-reconciliation.md'
          LEDGER = 'projects/telegram-desktop-rust/parity-ledger.json'
          RTM = 'projects/fabushi-communication-platform/quality/requirements-traceability-matrix.md'
          PROOF = 'projects/telegram-desktop-rust/evidence/round17-resumed-account-matrix.json'
          CONTROL = '.github/workflows/round17-reviewed-objects.yml'
          PAYLOAD = '.github/round17-reviewed-objects.json'
          OLD_TEST = 'cf689cbd8b62b8b3f538de64b8bb948b669a62f8'
          NEW_TEST = '44b162170ad991af97fee935b71843ab803644cb'
          REVIEW_BASE = '59f5fa24827812f78336c464995d161f403dedfb'
          REVIEW_PATCH = '139f004cc3b02c389158452c3891f0b97e9d80a97c16c3b766e93c5707631db8'
          WORKFLOW_ADDITION_SHA256 = '0077c558d8a12e6d640e6048a4a6ae84c24086aedd394a2b2d982191050312b9'
          SPEC_ADDITION_SHA256 = 'bd8538eef2390d4ab4234154aa39c645b4fb6abbf858b6d9aae0d6f08f89afc8'
          RTM_OLD_LINE_SHA256 = '298502f3b2a0d27c14a3d5a25462e0cc6f05c35a9ef78d2754452923174f59fb'
          RTM_NEW_LINE_SHA256 = '970ca4b6d09dfd8943bf4a521fc490d27f5d932a20f0e322d8f904a1aca2c926'
          RTM_PREFIX = b'| NMR-38 / NMR-AC-28 | `assert_settings_restart_matrix`:'
          ROW_IDS = {'FBCP-NMR-001', 'TDRP-R9-PROXY-SETTINGS-STATE-PERSISTENCE-001'}
          APPEND_FIELDS = {'test_evidence', 'integration_case_ids', 'fault_recovery_case_ids',
                           'temporal_case_ids', 'security_case_ids'}
          NOTE_TAG = '\n\nRound17 resumed account-matrix authored supplement:'
          NATIVE_ANCHOR = "          grep -Eq 'test result: ok\\. 7 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/native-startup-retention.log\n"
          SPEC_ANCHOR = '### Round 17 account matrix and actual AppHost resource-copy evidence\n\n'
          SPEC_TAG = 'Current-head supplement after resuming at\n'
          PATHS = [TEST, WORKFLOW, SPEC, LEDGER, RTM, PROOF]
          MAX_CONTENT = 8_000_000
          destination = pathlib.Path(os.environ['ARTIFACT_DIR'])
          destination.mkdir(parents=True, exist_ok=False)
          manifest = {'format_version': 1, 'repository': REPOSITORY, 'branch': BRANCH,
                      'event_sha': os.environ['GITHUB_SHA'], 'source_checkout_H': None,
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'review_base': REVIEW_BASE, 'review_patch_sha256': REVIEW_PATCH,
                      'status': 'preparing', 'control_inputs': [], 'objects': [], 'contents': [],
                      'refs_updated': False, 'commits_created': False,
                      'product_validation': False, 'acceptance': False}

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def blob_id(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          def git(*args, input=None):
              return subprocess.check_output(['git', *args], input=input, timeout=30)

          def unique_pairs(pairs):
              value = {}
              for key, item in pairs:
                  require(key not in value, 'Duplicate JSON key: ' + key)
                  value[key] = item
              return value

          def parse_json(data):
              def reject_constant(value):
                  raise RuntimeError('Non-finite JSON value: ' + value)
              return json.loads(data.decode('utf-8'), object_pairs_hook=unique_pairs,
                                parse_constant=reject_constant)

          def encode_json(value):
              return (json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + '\n').encode('utf-8')

          def persist_manifest():
              data = encode_json(manifest)
              (destination / 'manifest.json').write_bytes(data)
              (destination / 'manifest.sha256').write_text(sha256(data) + '  manifest.json\n', encoding='ascii')

          def save_content(name, data):
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              item = {'artifact_path': name, 'bytes': len(data), 'sha256': sha256(data)}
              manifest['contents'].append(item)
              return item

          def read_head(path, required=True, limit=MAX_CONTENT):
              entry = git('ls-tree', '-z', 'HEAD', '--', path)
              if not entry:
                  require(not required, 'Required input absent: ' + path)
                  return None, None
              require(entry.count(b'\0') == 1, 'Ambiguous tree entry: ' + path)
              metadata, actual_path = entry[:-1].split(b'\t', 1)
              mode, kind, oid = metadata.decode('ascii').split(' ')
              require(mode == '100644' and kind == 'blob' and actual_path.decode('utf-8') == path,
                      'Input must be the exact regular file: ' + path)
              size = int(git('cat-file', '-s', oid).strip())
              require(0 < size <= limit, 'Input outside byte budget: ' + path)
              data = git('cat-file', 'blob', oid)
              require(len(data) == size and blob_id(data) == oid, 'Input identity mismatch: ' + path)
              return data, oid

          def check_digest(data, expected, label):
              require(isinstance(expected, str) and re.fullmatch('[0-9a-f]{64}', expected)
                      and sha256(data) == expected, label + ' SHA256 differs')

          def append_block(data, anchor, addition, tag, label, within_step=False):
              text = data.decode('utf-8')
              require(isinstance(addition, str) and addition and text.count(anchor) == 1,
                      label + ' requires one exact anchor')
              location = text.index(anchor) + len(anchor)
              if addition in text:
                  end = text.find('\n      - ', location) if within_step else text.find('\n### ', location)
                  end = len(text) if end < 0 else end
                  require(text.count(addition) == 1 and addition in text[location:end],
                          label + ' existing block is ambiguous or outside its owner')
                  return data
              require(tag not in text, label + ' has a partial or conflicting authored block')
              return (text[:location] + addition + text[location:]).encode('utf-8')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Blob endpoint redirected; no redirected request is allowed')

          persist_manifest()
          try:
              require(os.environ['GITHUB_REPOSITORY'] == REPOSITORY
                      and os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH,
                      'Unexpected repository or branch')
              require(os.environ['GITHUB_EVENT_NAME'] in {'push', 'workflow_dispatch'}, 'Unexpected event')
              head = git('rev-parse', 'HEAD').decode('ascii').strip()
              manifest['source_checkout_H'] = head
              require(head == os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}', head),
                      'Checkout differs from the exact workflow event')
              require(not git('diff', '--cached', '--name-only', '-z'), 'Fresh checkout index is not clean')
              for path in [CONTROL, PAYLOAD]:
                  data, oid = read_head(path, limit=29_999)
                  saved = save_content('controls/' + path, data)
                  manifest['control_inputs'].append({'path': path, 'blob': oid, **saved})
                  if path == PAYLOAD:
                      payload = parse_json(data)
              require(set(payload) == {'format_version', 'repository', 'branch', 'review_base',
                                      'review_patch_sha256', 'test_patch', 'workflow_append',
                                      'spec_append', 'ledger', 'rtm', 'evidence'}, 'Unexpected payload fields')
              require(payload['format_version'] == 1 and payload['repository'] == REPOSITORY
                      and payload['branch'] == BRANCH and payload['review_base'] == REVIEW_BASE
                      and payload['review_patch_sha256'] == REVIEW_PATCH, 'Unexpected reviewed source authority')
              original, originals = {}, {}
              for path in PATHS:
                  data, oid = read_head(path, required=path != PROOF)
                  original[path] = data
                  originals[path] = oid
                  if data is not None:
                      save_content('inputs/' + path, data)

              test_op = payload['test_patch']
              require(set(test_op) == {'path', 'old_blob', 'new_blob', 'old_content_sha256',
                                      'new_content_sha256', 'patch_bytes', 'patch_sha256',
                                      'gzip_bytes', 'gzip_sha256', 'gzip_base64'}, 'Unexpected test patch fields')
              require(test_op['path'] == TEST and test_op['old_blob'] == OLD_TEST
                      and test_op['new_blob'] == NEW_TEST and originals[TEST] == OLD_TEST,
                      'Reviewed test input changed; reconcile before another transfer')
              check_digest(original[TEST], test_op['old_content_sha256'], 'Test input')
              compressed = base64.b64decode(test_op['gzip_base64'], validate=True)
              require(len(compressed) == test_op['gzip_bytes'] and 0 < len(compressed) <= 20_000,
                      'Compressed test patch outside byte budget')
              check_digest(compressed, test_op['gzip_sha256'], 'Compressed test patch')
              with gzip.GzipFile(fileobj=io.BytesIO(compressed), mode='rb') as stream:
                  patch = stream.read(100_001)
              require(len(patch) == test_op['patch_bytes'] and 0 < len(patch) <= 100_000,
                      'Test patch outside byte budget')
              check_digest(patch, test_op['patch_sha256'], 'Test patch')
              expected_header = ('diff --git a/' + TEST + ' b/' + TEST).encode('utf-8')
              require(re.findall(rb'^diff --git [^\n]+$', patch, re.M) == [expected_header],
                      'Test patch exceeded the single reviewed path')
              require(patch.startswith(expected_header + b'\nindex ' + OLD_TEST.encode('ascii') + b'..'
                                      + NEW_TEST.encode('ascii') + b' 100644\n--- a/' + TEST.encode('utf-8')
                                      + b'\n+++ b/' + TEST.encode('utf-8') + b'\n'),
                      'Test patch has unexpected full identities or mode')
              save_content('controls/reviewed-test.patch', patch)
              git('apply', '--cached', '--whitespace=nowarn', '-', input=patch)
              require(git('diff', '--cached', '--name-only', '-z') == TEST.encode('utf-8') + b'\0',
                      'Staged object scope differs from the reviewed test')
              test_data = git('show', ':' + TEST)
              require(blob_id(test_data) == NEW_TEST, 'Applied test object differs from the reviewed output')
              check_digest(test_data, test_op['new_content_sha256'], 'Test output')
              output = {TEST: test_data}

              workflow_op = payload['workflow_append']
              require(set(workflow_op) == {'path', 'anchor', 'lines'} and workflow_op['path'] == WORKFLOW
                      and workflow_op['anchor'] == NATIVE_ANCHOR, 'Unexpected Native7 append scope')
              lines = workflow_op['lines']
              require(isinstance(lines, list) and len(lines) == 3 and len(set(lines)) == 3
                      and all(isinstance(line, str) and line.startswith('          ') and line.endswith('\n')
                              and line.count('\n') == 1 for line in lines), 'Expected the three reviewed marker lines')
              check_digest(''.join(lines).encode('utf-8'), WORKFLOW_ADDITION_SHA256, 'Reviewed workflow addition')
              for line in lines:
                  require(original[WORKFLOW].decode('utf-8').count(line) <= 1, 'Duplicate workflow marker')
              existing_lines = [line in original[WORKFLOW].decode('utf-8') for line in lines]
              require(all(existing_lines) or not any(existing_lines), 'Partial Native7 marker append')
              output[WORKFLOW] = append_block(original[WORKFLOW], NATIVE_ANCHOR, ''.join(lines),
                                              'NMR-AC-28 legacy auth matrix: 12 routes,', 'Native7', True)

              spec_op = payload['spec_append']
              require(set(spec_op) == {'path', 'anchor', 'addition'} and spec_op['path'] == SPEC
                      and spec_op['anchor'] == SPEC_ANCHOR and isinstance(spec_op['addition'], str)
                      and spec_op['addition'].startswith(SPEC_TAG) and len(spec_op['addition'].splitlines()) == 14,
                      'Unexpected fourteen-line spec supplement')
              check_digest(spec_op['addition'].encode('utf-8'), SPEC_ADDITION_SHA256, 'Reviewed spec supplement')
              output[SPEC] = append_block(original[SPEC], SPEC_ANCHOR, spec_op['addition'], SPEC_TAG, 'Spec')

              ledger_op = payload['ledger']
              require(set(ledger_op) == {'path', 'operations'} and ledger_op['path'] == LEDGER,
                      'Unexpected ledger scope')
              operations = ledger_op['operations']
              require(isinstance(operations, list) and len(operations) == 2
                      and {op['id'] for op in operations} == ROW_IDS, 'Unexpected ledger responsibilities')
              before = parse_json(original[LEDGER])
              after = copy.deepcopy(before)
              require(isinstance(before.get('rows'), list), 'Canonical ledger rows absent')
              changed_indexes = []
              for op in operations:
                  require(set(op) == {'id', 'append', 'note'} and isinstance(op['append'], dict)
                          and op['append'] and not set(op['append']) - APPEND_FIELDS,
                          'Ledger operation exceeded authored evidence/case scope')
                  indexes = [i for i, row in enumerate(before['rows']) if row.get('responsibility_id') == op['id']]
                  require(len(indexes) == 1, 'Canonical ledger responsibility must be unique')
                  index = indexes[0]
                  changed_indexes.append(index)
                  expected = copy.deepcopy(before['rows'][index])
                  for key, values in op['append'].items():
                      require(isinstance(expected.get(key), list) and all(isinstance(v, str) for v in expected[key])
                              and isinstance(values, list) and 0 < len(values) <= 8
                              and all(isinstance(v, str) and 0 < len(v) <= 1800 for v in values),
                              'Authored evidence requires existing string-array fields')
                      for value in values:
                          if value not in expected[key]:
                              expected[key].append(value)
                  note = op['note']
                  prior_note = expected.get('notes')
                  require(isinstance(prior_note, str) and isinstance(note, str) and note.startswith(NOTE_TAG)
                          and len(note) <= 1800 and PROOF in note, 'Unexpected authored ledger note')
                  if NOTE_TAG in prior_note:
                      require(prior_note.count(NOTE_TAG) == 1 and prior_note.count(note) == 1,
                              'Conflicting or duplicated authored ledger note')
                  else:
                      expected['notes'] = prior_note + note
                  after['rows'][index] = expected
                  actual = after['rows'][index]
                  require(set(actual) == set(before['rows'][index]), 'Ledger row fields changed')
                  for key, value in before['rows'][index].items():
                      if key in op['append']:
                          require(actual[key][:len(value)] == value, 'Prior ledger evidence changed')
                      elif key == 'notes':
                          require(actual[key] in (value, value + note), 'Prior ledger notes changed')
                      else:
                          require(actual[key] == value, 'Unreviewed ledger field changed: ' + key)
              restored = copy.deepcopy(after)
              for index in changed_indexes:
                  restored['rows'][index] = before['rows'][index]
              require(restored == before, 'Header, source reviews, coverage, acceptance or other rows changed')
              output[LEDGER] = original[LEDGER] if after == before else encode_json(after)
              require(parse_json(output[LEDGER]) == after, 'Serialized ledger differs from preserved semantics')

              rtm_op = payload['rtm']
              require(set(rtm_op) == {'path', 'old_line', 'new_line'} and rtm_op['path'] == RTM
                      and isinstance(rtm_op['old_line'], str) and isinstance(rtm_op['new_line'], str),
                      'Unexpected RTM single-line replacement scope')
              old_line = rtm_op['old_line'].encode('utf-8')
              new_line = rtm_op['new_line'].encode('utf-8')
              require(all(line.startswith(RTM_PREFIX) and line.endswith(b'\n') and line.count(b'\n') == 1
                          for line in (old_line, new_line)), 'RTM replacement must contain exactly one complete row')
              check_digest(old_line, RTM_OLD_LINE_SHA256, 'Reviewed original RTM row')
              check_digest(new_line, RTM_NEW_LINE_SHA256, 'Reviewed updated RTM row')
              rtm_lines = original[RTM].splitlines(keepends=True)
              rtm_matches = [i for i, line in enumerate(rtm_lines) if line.startswith(RTM_PREFIX)]
              require(len(rtm_matches) == 1 and rtm_lines[rtm_matches[0]] == old_line,
                      'RTM target row changed or is not unique; preserve concurrent authorship')
              rtm_index = rtm_matches[0]
              rtm_after = list(rtm_lines)
              rtm_after[rtm_index] = new_line
              output[RTM] = b''.join(rtm_after)
              encoded_lines = output[RTM].splitlines(keepends=True)
              require(len(encoded_lines) == len(rtm_lines) and encoded_lines[rtm_index] == new_line
                      and sum(line.startswith(RTM_PREFIX) for line in encoded_lines) == 1,
                      'RTM output row differs from the exact reviewed row')
              encoded_lines[rtm_index] = old_line
              require(b''.join(encoded_lines) == original[RTM], 'RTM bytes outside the target row changed')

              proof_op = payload['evidence']
              require(set(proof_op) == {'path', 'content_utf8', 'content_sha256', 'blob'} and proof_op['path'] == PROOF
                      and isinstance(proof_op['content_utf8'], str), 'Evidence content slot has not been finalized')
              proof_data = proof_op['content_utf8'].encode('utf-8')
              require(0 < len(proof_data) <= 20_000 and isinstance(parse_json(proof_data), dict),
                      'Evidence must be a bounded complete JSON object')
              check_digest(proof_data, proof_op['content_sha256'], 'Evidence')
              require(blob_id(proof_data) == proof_op['blob'], 'Evidence Git object differs')
              require(original[PROOF] is None or original[PROOF] == proof_data,
                      'Evidence path already has different bytes; preserve concurrent authorship')
              output[PROOF] = proof_data
              require(set(output) == set(PATHS), 'Unexpected output path scope')
              for path in PATHS:
                  data = output[path]
                  require(0 < len(data) <= MAX_CONTENT, 'Output outside byte budget: ' + path)
                  saved = save_content('outputs/' + path, data)
                  prior = original[path]
                  manifest['objects'].append({'path': path, 'mode': '100644',
                      'original_blob': originals[path], 'original_bytes': len(prior) if prior is not None else None,
                      'original_content_sha256': sha256(prior) if prior is not None else None,
                      'new_blob': blob_id(data), 'new_bytes': len(data), 'new_content_sha256': sha256(data),
                      'input_artifact': 'inputs/' + path if prior is not None else None,
                      'output_artifact': saved['artifact_path'], 'stored': False})
              manifest['status'] = 'prepared'
              persist_manifest()

              # The only API operation is this fixed POST /git/blobs. There is
              # no commit/tree/ref/push operation, retry, redirect or product execution.
              endpoint = 'https://api.github.com/repos/bhrumom/fabushi-desktop/git/blobs'
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              for index, item in enumerate(manifest['objects']):
                  request_data = encode_json({'content': base64.b64encode(output[item['path']]).decode('ascii'),
                                              'encoding': 'base64'})
                  request_digest = save_content('requests/' + str(index) + '.json', request_data)
                  item['request_sha256'] = request_digest['sha256']
                  item['store_attempted'] = True
                  persist_manifest()
                  request = urllib.request.Request(endpoint, data=request_data,
                      headers={'Authorization': 'Bearer ' + os.environ['TRANSFER_TOKEN'],
                               'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                               'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
                  with opener.open(request, timeout=45) as response:
                      require(response.status == 201, 'Unexpected blob response status')
                      response_data = response.read(65_537)
                  require(len(response_data) <= 65_536, 'Blob response outside byte budget')
                  response_digest = save_content('responses/' + str(index) + '.json', response_data)
                  result = parse_json(response_data)
                  require(result.get('sha') == item['new_blob'], 'Stored Git object differs: ' + item['path'])
                  item['stored'] = True
                  item['returned_blob'] = result['sha']
                  item['response_sha256'] = response_digest['sha256']
                  persist_manifest()
              manifest['status'] = 'complete'
              persist_manifest()
              print('ROUND17_REVIEWED_OBJECTS ' + json.dumps({'source_checkout_H': head,
                    'manifest_sha256': sha256((destination / 'manifest.json').read_bytes()),
                    'objects': [{'path': item['path'], 'original_blob': item['original_blob'],
                                 'new_blob': item['new_blob'], 'new_content_sha256': item['new_content_sha256']}
                                for item in manifest['objects']], 'refs_updated': False,
                    'product_validation': False, 'acceptance': False}))
          except BaseException as error:
              manifest['status'] = 'failed'
              manifest['error'] = {'type': type(error).__name__, 'message': str(error)[:1000]}
              persist_manifest()
              raise
          PY
      - name: Preserve all inputs, outputs, content digests and partial transfer receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round17-reviewed-objects-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/round17-reviewed-objects-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

# Refresh exact source objects after concurrent specification changes; product checks are unchanged.
