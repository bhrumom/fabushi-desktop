name: Task20bf Human retry current ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths: ['.github/workflows/task20bf-human-retry-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare-current-reviewed-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare only the reviewed append against the current exact ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_OPS_BASE64: ''
          REVIEWED_OPS_SHA256: '45055278f54d2644f312d16e7617dca3911fda1518e746fffe542f9e2960a8c7'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/task20bf-human-retry-ledger-object
          python - <<'PY'
          import base64, copy, hashlib, json, os, pathlib, re, urllib.request, zlib
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'bhrumom/fabushi-desktop':
              raise SystemExit('unexpected repository')
          branch = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          ledger_path = 'projects/telegram-desktop-rust/parity-ledger.json'
          fixed_u = 'f985723b552b30fe1c17d377d57f44e61a15a8c4'
          packed = base64.b64decode(os.environ['REVIEWED_OPS_BASE64'], validate=True)
          if hashlib.sha256(packed).hexdigest() != os.environ['REVIEWED_OPS_SHA256']:
              raise SystemExit('reviewed operations digest mismatch')
          decoder = zlib.decompressobj()
          raw_ops = decoder.decompress(packed, 100_001)
          if len(raw_ops) > 100_000 or decoder.unconsumed_tail or not decoder.eof:
              raise SystemExit('operations exceed reviewed bounds')
          operations = json.loads(raw_ops)
          allowed = {'fabushi_target_paths', 'fabushi_target_symbols', 'command_event_contracts',
              'production_entrypoints', 'production_evidence', 'test_evidence', 'requirement_ids',
              'contract_case_ids', 'integration_case_ids', 'temporal_case_ids', 'fault_recovery_case_ids',
              'ui_functional_case_ids', 'security_case_ids', 'notes'}
          if not isinstance(operations, list) or len({op['key'] for op in operations}) != len(operations):
              raise SystemExit('duplicate or invalid operation list')
          for op in operations:
              if op['key'] not in allowed:
                  raise SystemExit('unreviewed ledger field')
              if op['key'] == 'notes':
                  if set(op) != {'key', 'append_text'} or not isinstance(op['append_text'], str) or not op['append_text']:
                      raise SystemExit('invalid notes append')
              elif set(op) != {'key', 'append'} or not isinstance(op['append'], list) or not all(isinstance(v, str) and v for v in op['append']):
                  raise SystemExit('invalid array append')
          def api(method, suffix, body=None):
              permitted = method == 'GET' and (suffix == '/git/ref/heads/' + branch or suffix.startswith('/git/trees/') or suffix.startswith('/git/blobs/'))
              if not permitted and not (method == 'POST' and suffix == '/git/blobs'):
                  raise SystemExit('unpermitted transport operation')
              request = urllib.request.Request('https://api.github.com/repos/' + repository + suffix,
                  data=None if body is None else json.dumps(body).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          # Read the live migration head once, then pin every input read to it.
          # This is accounting object preparation, never late-bound product testing.
          head = api('GET', '/git/ref/heads/' + branch)['object']['sha']
          tree = api('GET', '/git/trees/' + head + '?recursive=1')
          if tree.get('truncated') is not False:
              raise SystemExit('incomplete current tree')
          matches = [item for item in tree['tree'] if item['path'] == ledger_path and item['type'] == 'blob']
          if len(matches) != 1:
              raise SystemExit('current ledger is not unique')
          input_blob = matches[0]['sha']
          if not re.fullmatch('[0-9a-f]{40}', input_blob):
              raise SystemExit('invalid input identity')
          old_bytes = base64.b64decode(api('GET', '/git/blobs/' + input_blob)['content'])
          if git_blob(old_bytes) != input_blob:
              raise SystemExit('current input bytes differ from Git identity')
          raw = old_bytes.decode('utf-8')
          original = json.loads(raw)
          if original['project_id'] != 'TDRP-001' or original['upstream_commit'] != fixed_u:
              raise SystemExit('source authority changed')
          expected = copy.deepcopy(original)
          targets = [row for row in expected['rows'] if row['responsibility_id'] == 'FBCP-NMR-001']
          if len(targets) != 1:
              raise SystemExit('target responsibility is not unique')
          target = targets[0]
          needle = '\n      "responsibility_id": "FBCP-NMR-001"'
          if raw.count(needle) != 1:
              raise SystemExit('unexpected target row layout')
          marker = raw.index(needle)
          start = raw.rfind('\n    {', 0, marker) + 5
          parsed_row, size = json.JSONDecoder().raw_decode(raw[start:])
          if parsed_row != target:
              raise SystemExit('target row byte boundary mismatch')
          row_text = raw[start:start + size]
          inserts = []
          for op in operations:
              key = op['key']
              prefix = '\n      ' + json.dumps(key) + ': '
              if row_text.count(prefix) != 1:
                  raise SystemExit('unexpected field layout: ' + key)
              value_start = row_text.index(prefix) + len(prefix)
              value, consumed = json.JSONDecoder().raw_decode(row_text[value_start:])
              if value != parsed_row[key]:
                  raise SystemExit('field byte boundary mismatch: ' + key)
              if key == 'notes':
                  if not isinstance(value, str):
                      raise SystemExit('notes type changed')
                  addition = op['append_text']
                  if addition in value:
                      continue
                  inserts.append((start + value_start + consumed - 1,
                      json.dumps(addition, ensure_ascii=False)[1:-1]))
                  target[key] += addition
              else:
                  if not isinstance(value, list) or not value or not all(isinstance(v, str) for v in value):
                      raise SystemExit('array type/layout changed: ' + key)
                  additions = [v for v in op['append'] if v not in value]
                  if not additions:
                      continue
                  close = row_text.rfind('\n      ]', value_start, value_start + consumed)
                  if close < value_start:
                      raise SystemExit('array closing layout changed: ' + key)
                  inserts.append((start + close, ',\n        ' + ',\n        '.join(json.dumps(v, ensure_ascii=False) for v in additions)))
                  target[key].extend(additions)
          updated = raw
          for offset, inserted in sorted(inserts, reverse=True):
              updated = updated[:offset] + inserted + updated[offset:]
          if json.loads(updated) != expected:
              raise SystemExit('scoped append changed unreviewed data')
          data = updated.encode('utf-8')
          output_blob = git_blob(data)
          created = api('POST', '/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
          if created['sha'] != output_blob:
              raise SystemExit('GitHub output identity mismatch')
          receipt = {'task_id': '20bf9475-a885-4314-b509-bea53ef8849f', 'round': 1,
              'carrier_sha': os.environ['GITHUB_SHA'], 'input_head': head,
              'input_blob': input_blob, 'output_blob': output_blob, 'path': ledger_path,
              'operations_sha256': os.environ['REVIEWED_OPS_SHA256'], 'insertions': len(inserts),
              'rows_retained': len(original['rows']), 'source_reviews_retained': len(original.get('source_reviews', [])),
              'scope': 'Unattached ledger blob only. Root must read back, compare current input and perform non-forced CAS. No commit/ref writes, product tests or acceptance.'}
          pathlib.Path('artifacts/task20bf-human-retry-ledger-object/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('REVIEWED_LEDGER_RECEIPT ' + json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task20bf-human-retry-ledger-object-${{ github.sha }}
          path: artifacts/task20bf-human-retry-ledger-object
          if-no-files-found: error
