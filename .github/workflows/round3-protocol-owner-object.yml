name: Round3 exact protocol owner ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round3-protocol-owner-object.yml
      - .github/round3-protocol-owner-object.json
permissions:
  contents: read
jobs:
  store-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare only two reviewed owner corrections without updating refs
        env:
          OBJECT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, pathlib, re, subprocess, urllib.request
          scope = {'TDRP-R9-MTPROTO-BAD-MESSAGE-RECOVERY-001', 'TDRP-R9-MTPROTO-SINGLE-RPC-MESSAGE-CONTAINER-001'}
          allowed = {'existing_owner', 'implementation_status', 'coverage_disposition', 'production_entrypoints', 'production_evidence', 'blockers', 'release_gate_status', 'notes', 'lifecycle_owner', 'composition_root', 'service_owner', 'capability_surface', 'ui_disposition'}
          manifest = pathlib.Path('.github/round3-protocol-owner-object.json').read_bytes()
          payload = json.loads(manifest)
          repository = 'bhrumom/fabushi-desktop'
          ledger_path = 'projects/telegram-desktop-rust/parity-ledger.json'
          if payload['repository'] != repository or payload['path'] != ledger_path:
              raise SystemExit('Unexpected ledger-object scope')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Exact checkout required')
          # The checkout pins the reviewed transformation. Capture one current
          # input commit separately, then read its immutable ledger blob only.
          # This is object transport, not execution/acceptance of that input.
          branch = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          def read_json(endpoint):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + endpoint,
                  headers={'Authorization': 'Bearer ' + os.environ['OBJECT_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, method='GET')
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          ref = read_json('/git/ref/heads/' + branch)
          if ref['ref'] != 'refs/heads/' + branch or ref['object']['type'] != 'commit':
              raise SystemExit('Unexpected input ref identity')
          input_head = ref['object']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', input_head):
              raise SystemExit('An immutable input commit is required')
          entry = read_json('/contents/' + ledger_path + '?ref=' + input_head)
          if entry['path'] != ledger_path or entry['type'] != 'file' or not re.fullmatch(r'[0-9a-f]{40}', entry['sha']):
              raise SystemExit('Unexpected canonical input object')
          if not isinstance(entry['size'], int) or not 0 < entry['size'] <= 10 * 1024 * 1024:
              raise SystemExit('Unexpected ledger size')
          source_blob = read_json('/git/blobs/' + entry['sha'])
          if source_blob['sha'] != entry['sha'] or source_blob['encoding'] != 'base64':
              raise SystemExit('Unexpected canonical blob encoding or identity')
          source_bytes = base64.b64decode(''.join(source_blob['content'].split()), validate=True)
          if len(source_bytes) != entry['size'] or len(source_bytes) != source_blob['size']:
              raise SystemExit('Incomplete canonical input bytes')
          input_blob = hashlib.sha1(b'blob ' + str(len(source_bytes)).encode() + b'\0' + source_bytes).hexdigest()
          if input_blob != entry['sha']:
              raise SystemExit('Canonical input Git identity mismatch')
          original = json.loads(source_bytes)
          ledger = copy.deepcopy(original)
          if ledger['upstream_commit'] != payload['upstream']:
              raise SystemExit('Frozen source changed; independent review required')
          ops = payload['operations']
          if len(ops) != 2 or {op['id'] for op in ops} != scope:
              raise SystemExit('Only the two reviewed protocol responsibilities may change')
          for op in ops:
              matches = [row for row in ledger['rows'] if row['responsibility_id'] == op['id']]
              if len(matches) != 1 or set(op['set']) != allowed:
                  raise SystemExit('Unexpected responsibility or mutation fields')
              row = matches[0]
              row_hash = hashlib.sha256(json.dumps(row, sort_keys=True, ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
              if row_hash != op['expected_row_sha256']:
                  raise SystemExit('Reviewed responsibility changed; reconcile without replacing it')
              changes = op['set']
              if changes['implementation_status'] != 'understood' or changes['coverage_disposition'] != 'pending' or changes['release_gate_status'] != 'blocked' or changes['production_entrypoints']:
                  raise SystemExit('Correction must reopen current wiring, never grant acceptance')
              row.update(changes)
          coverage = payload['coverage_change']
          if original['coverage']['unmapped_responsibilities'] != coverage['expected_unmapped_responsibilities'] or coverage['unmapped_responsibilities'] != 2:
              raise SystemExit('Reconcile the independently changed mapping count')
          ledger['coverage']['unmapped_responsibilities'] = 2
          # Prove unrelated rows and all source/review/legal/acceptance fields survive.
          residual = copy.deepcopy(ledger)
          original_rows = {row['responsibility_id']: row for row in original['rows']}
          for row in residual['rows']:
              if row['responsibility_id'] in scope:
                  for field in allowed:
                      row[field] = original_rows[row['responsibility_id']][field]
          residual['coverage']['unmapped_responsibilities'] = original['coverage']['unmapped_responsibilities']
          if residual != original:
              raise SystemExit('An unrelated canonical field changed')
          content = json.dumps(ledger, ensure_ascii=False, indent=2) + '\n'
          encoded = content.encode()
          blob = hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest()
          request = urllib.request.Request('https://api.github.com/repos/' + repository + '/git/blobs',
              data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['OBJECT_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.urlopen(request, timeout=45) as response:
              result = json.load(response)
          if result.get('sha') != blob:
              raise SystemExit('GitHub object identity differs from prepared content')
          receipt = {'preparation_sha': head, 'source_sha': input_head, 'input_blob': input_blob, 'ledger_blob': blob, 'bytes': len(encoded), 'operations_sha256': hashlib.sha256(manifest).hexdigest(), 'changed_responsibilities': sorted(scope), 'refs_updated': False, 'product_validation': False, 'accepted': False}
          pathlib.Path('round3-protocol-owner-object-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('ROUND3_PROTOCOL_OWNER_OBJECT ' + json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round3-protocol-owner-object-${{ github.sha }}-${{ github.run_attempt }}
          path: round3-protocol-owner-object-receipt.json
          if-no-files-found: error
