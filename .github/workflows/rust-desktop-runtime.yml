              "scope": "Actual native HTTP authentication/permissions and AttachmentsService fresh-cache success/refusal; shipping Coordinator binary carrier/forwarding against a controlled peer; actual Linux app helper with closed Host lane and preserved ordinary lane replies, plus source-only shared-Arc/API anchors. Not macOS, cold internet fetch/pinning, concurrency soak, desktop UI/timing, remote-host path portability, full media/platform or OCRM acceptance.",
          }
          for label, command, required in cases:
              receipt["active_case"] = label
              (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
              log_path = root / (label + ".log")
              cargo_exit, capture_exit, execution_error, raw = None, 0, None, b""
              try:
                  with log_path.open("wb") as output:
                      completed = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, check=False)
                  cargo_exit = completed.returncode
                  raw = log_path.read_bytes()
              except OSError as error:
                  capture_exit, execution_error = 1, str(error)
              text = raw.decode("utf-8", errors="replace")
              print(text, flush=True)
              passed = re.findall(r"^test (\S+) \.\.\. ok$", text, re.MULTILINE)
              missing = [name for name in required if passed.count(name) != 1]
              accepted = cargo_exit == 0 and capture_exit == 0 and not missing
              receipt["executions"].append({"case": label, "command": command,
                  "cargo_exit": cargo_exit, "capture_exit": capture_exit, "execution_error": execution_error,
                  "required_positive_names": required, "observed_passed_test_names": passed,
                  "missing_or_nonunique_positive_results": missing, "oracle_accepted": accepted,
                  "log": log_path.name, "log_sha256": hashlib.sha256(raw).hexdigest()})
              (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          receipt.pop("active_case", None)
          # The incoming Automation command already runs the composition
          # target. Reuse its same-H evidence instead of executing it twice.
          shared_root = pathlib.Path(".evidence/sqlite-native-path/automation-admission")
          shared_log = shared_root / "tests.log"
          shared_receipt_path = shared_root / "receipt.json"
          shared_raw = shared_log.read_bytes() if shared_log.is_file() else b""
          shared_required = [
              "shipping_gateway_dispatches_desktop_mcp_to_the_existing_service_before_fallback",
              "desktop_mcp_dispatch_oracle_rejects_wrong_owner_ignored_result_and_dead_delegation",
          ]
          shared_passed = re.findall(r"^test (\S+) \.\.\. ok$", shared_raw.decode("utf-8", errors="replace"), re.MULTILINE)
          shared_missing = [name for name in shared_required if shared_passed.count(name) != 1]
          shared_error = None
          try:
              shared = json.loads(shared_receipt_path.read_text())
          except (OSError, ValueError) as error:
              shared, shared_error = {}, str(error)
          shared_digest = hashlib.sha256(shared_raw).hexdigest()
          shared_accepted = (not shared_missing and shared.get("subject_commit") == head
              and shared.get("subject_tree") == receipt["subject_tree"] and shared.get("upstream") == receipt["upstream"]
              and shared.get("cargo_exit") == 0 and shared.get("capture_exit") == 0
              and shared.get("log_sha256") == shared_digest and shared.get("result") == "passed")
          receipt["executions"].append({"case": "reused-mcp-composition", "command": shared.get("command"),
              "cargo_exit": shared.get("cargo_exit"), "capture_exit": shared.get("capture_exit"),
              "execution_error": shared_error, "reused_receipt": str(shared_receipt_path),
              "required_positive_names": shared_required, "observed_passed_test_names": shared_passed,
              "missing_or_nonunique_positive_results": shared_missing, "oracle_accepted": shared_accepted,
              "log": str(shared_log), "log_sha256": shared_digest})
          receipt["inputs_after_sha256"] = digest_inputs()
          unchanged = receipt["inputs_before_sha256"] == receipt["inputs_after_sha256"]
          accepted = unchanged and len(receipt["executions"]) == len(cases) + 1 and all(case["oracle_accepted"] for case in receipt["executions"])
          receipt["result"] = "passed" if accepted else "failed-or-incomplete"
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2), flush=True)
          raise SystemExit(0 if accepted else 1)
          PY
      - name: Preserve failed owned native-path and Automation fixtures
        if: ${{ failure() && (steps.native_paths.outcome == 'failure' || steps.channel_pending_recovery.outcome == 'failure' || steps.automation_admission.outcome == 'failure' || steps.automation_app.outcome == 'failure' || steps.link_preview_gateway.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$NATIVE_PATH_FIXTURES" ]; then
            tar -C "$NATIVE_PATH_FIXTURES" -cf .evidence/sqlite-native-path/owned-fixtures.tar .
          fi
      - name: Upload native SQLite path evidence
        if: ${{ always() && steps.native_paths.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-sqlite-native-path-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/sqlite-native-path/
          if-no-files-found: error
          retention-days: 90

  pressure-profiler-platform:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
    name: Pressure profiler / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: pressure-profiler-${{ matrix.os }}-1.97.1
      - name: Enable Linux perf sampling and native desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
          if ! command -v perf >/dev/null 2>&1; then
            sudo apt-get install -y linux-tools-common linux-tools-generic
          fi
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          perf --version
      - name: Capture a real production pressure CPU profile
        run: >-
          cargo test --manifest-path source/host/Cargo.toml
          --test pressure_cpu_profiler_contract
          production_backend_emits_native_consumable_cpu_profile_artifact
          -- --exact --nocapture

