          receipt["inputs_sha256_after"] = after
          receipt["fixture_sha256_after"] = after_fixture
          accepted = before == after and fixture_hash == after_fixture and len(receipt["executions"]) == len(commands) and all(
              case["oracle_accepted"] for case in receipt["executions"])
