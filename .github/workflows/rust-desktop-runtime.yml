          shared_passed = re.findall(r"^test (\S+) \.\.\. ok$", shared_raw.decode("utf-8", errors="replace"), re.MULTILINE)
          shared_missing = [name for name in shared_required if shared_passed.count(name) != 1]
          shared_error = None
          try:
              shared = json.loads(shared_receipt_path.read_text())
