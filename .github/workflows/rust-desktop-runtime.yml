          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Record Linux build profile and available storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/sqlite-native-path
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(".evidence/sqlite-native-path")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["FABUSHI_TARGET_SHA"]
          profile = {key: os.environ[key] for key in (
              "CARGO_PROFILE_DEV_DEBUG", "CARGO_PROFILE_TEST_DEBUG", "CARGO_INCREMENTAL")}
          assert all(value == "0" for value in profile.values())
          lock = json.loads(pathlib.Path("projects/openclaw-rust/upstream.lock.json").read_text())
          (root / "build-storage-subject.json").write_text(json.dumps({
              "contract": "CI-LINUX-STORAGE-01", "subject_commit": head,
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: lock["upstream"][key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "profile_environment": profile, "result": "environment recorded; execution not yet assessed",
          }, indent=2) + "\n")
          PY
          df -Pk . "$RUNNER_TEMP" > .evidence/sqlite-native-path/storage-before.txt
          if [ -d source/host/target ]; then
            du -sk source/host/target >> .evidence/sqlite-native-path/storage-before.txt
          fi
      - name: Test native SQLite paths and affected recovery owners
        id: native_paths
        env:
          TMPDIR: ${{ env.NATIVE_PATH_FIXTURES }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/sqlite-native-path
          command=(cargo test --locked --no-fail-fast --manifest-path source/host/Cargo.toml --test host_storage_contract --test agent_db_recovery_contract --test conversation_blob_db_recovery_contract --test automation_store_contract -- --test-threads=1)
          set +e
          "${command[@]}" 2>&1 | tee .evidence/sqlite-native-path/tests.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          python3 - "${pipeline_status[0]}" "${pipeline_status[1]}" "${command[@]}" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          root = pathlib.Path(".evidence/sqlite-native-path")
          log = (root / "tests.log").read_bytes()
          cargo_exit, capture_exit = map(int, sys.argv[1:3])
          required = [
              "sqlite_raw_path_contract::explicit_quarantine_preserves_native_source_and_destination_bytes",
