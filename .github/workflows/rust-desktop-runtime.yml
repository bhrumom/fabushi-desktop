            printf '%q ' "$@" > "$OCRM_RECOVERY_EVIDENCE_DIR/$check_name.command.txt" || return $?
            printf '\n' >> "$OCRM_RECOVERY_EVIDENCE_DIR/$check_name.command.txt" || return $?
            "$@" > "$OCRM_RECOVERY_EVIDENCE_DIR/$check_name.log" 2>&1 || check_status=$?
            local exit_record_status=0
            printf '%s\t%s\n' "$check_name" "$check_status" >> "$OCRM_RECOVERY_EVIDENCE_DIR/command-exit-codes.tsv" || exit_record_status=$?
            local capture_status=0
            python3 "$OCRM_RECOVERY_EVIDENCE_DIR/project-log.py" "$check_name" "$check_status" || capture_status=$?
            if [ "$exit_record_status" -ne 0 ]; then capture_status=86; fi
            printf '%s\t%s\n' "$check_name" "$capture_status" >> "$OCRM_RECOVERY_EVIDENCE_DIR/capture-exit-codes.tsv" || capture_status=86
            if [ "$check_status" -ne 0 ]; then return "$check_status"; fi
            return "$capture_status"
          }
