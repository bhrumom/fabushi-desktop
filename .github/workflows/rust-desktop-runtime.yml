name: Rust desktop runtime

on:
  workflow_dispatch:
    inputs:
      expected_subject:
        description: 'Optional frozen full SHA; reject a moved dispatch ref'
        type: string
        required: false
      validation_scope:
        description: 'Validation scope on the exact dispatched commit'
        type: choice
        required: true
        default: full
        options:
          - full
          - ocrm-config
          - ocrm-mcp-native
          - ocrm-custody-recovery
          - ocrm-background-custody
          - ocrm-background-custody-recovery
          - ocrm-memory-checked-list
          - ocrm-memory-native-binding
          - ocrm-memory-fixture-lifecycle
          - ocrm-djc-reader-observation
          - ocrm-local-exec-runtime
          - ocrm-local-exec-capture
  push:
    branches:
      - main
      - restore/rust-desktop-runtime
      - refactor/grok-018-architecture-rebuild
      - 'ocrm/**'
      - 'codex/openclaw-rust-fusion-chat-20261101-writer'
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'
  pull_request:
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'

permissions:
  contents: read

env:
  FABUSHI_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_DISPATCH_SHA: ${{ inputs.expected_subject || '' }}

concurrency:
  group: rust-desktop-runtime-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && format('{0}-{1}', github.ref, github.sha)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-host:
    if: ${{ ((!((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-mcp-native') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-mcp-native):')))) && !(((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-custody-recovery') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-custody-recovery):'))) || ((((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-background-custody') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-background-custody):'))) || (((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-memory-checked-list') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-memory-checked-list):'))) || (((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-memory-native-binding') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-memory-native-binding):'))) || (((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-memory-fixture-lifecycle') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-memory-fixture-lifecycle):'))) || ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-djc-reader-observation') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-djc-reader-observation):'))))))) || ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-background-custody-recovery') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-background-custody-recovery):')))))) && !(((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-local-exec-runtime') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-local-exec-runtime):'))) || ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-local-exec-capture') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-local-exec-capture):')))) }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/mahayana/mahayana-rs -> target
            source/host -> target
            source/host/app -> target
            source/node-agent-coordinator -> target
            source/box-exec-daemon -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Validate local Cargo dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -f source/mahayana/mahayana-rs/Cargo.toml
          test -f source/mahayana/codex-rs/Cargo.toml
          test -f native/mahayana-messaging/Cargo.toml
          cargo metadata --no-deps --format-version 1 --manifest-path source/mahayana/mahayana-rs/Cargo.toml >/dev/null
      - name: Test canonical Fabushi messaging responsibilities
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/mahayana-messaging/Cargo.toml
          mkdir -p .evidence
          cat > .evidence/messaging-responsibilities.json <<EOF
          {
            "head_sha": "${{ env.FABUSHI_TARGET_SHA }}",
            "manifest": "native/mahayana-messaging/Cargo.toml",
            "responsibilities": [
              "scheduled-and-silent-forward-preservation",
              "forward-destination-authorization",
              "formatted-text-utf16-entity-offset",
              "typed-forward-thread-destination",
              "missing-closed-hidden-topic-rejection"
            ],
            "result": "passed"
          }
          EOF
      - name: Upload canonical Fabushi messaging evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-messaging-responsibilities-${{ env.FABUSHI_TARGET_SHA }}
          path: .evidence/messaging-responsibilities.json
          if-no-files-found: error
          retention-days: 90
      - name: Check Grok-aligned shipping Mahayana Host
        shell: bash
        run: cargo check --locked --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml
      - name: Execute media cleanup owner and real service contracts
        id: media_store_cleanup
        env:
          CARGO_TERM_COLOR: never
          PYTHONUTF8: '1'
        shell: bash
        run: python3 projects/openclaw-rust/scripts/capture_media_cleanup.py
      - name: Upload exact-subject media cleanup evidence
        if: ${{ always() && steps.media_store_cleanup.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-media-cleanup-${{ runner.os }}-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/media-store-cleanup/
          if-no-files-found: error
          retention-days: 90
      - name: Test independent Mahayana Coordinator contract
        id: coordinator_full
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          coordinator_command=(cargo test --locked --manifest-path source/node-agent-coordinator/Cargo.toml)
          mkdir -p .evidence
          coordinator_status=0
          "${coordinator_command[@]}" > .evidence/coordinator-command.log 2>&1 || coordinator_status=$?
          printf 'command=%s\nexit_code=%s\n' "${coordinator_command[*]}" "$coordinator_status" >> "$GITHUB_OUTPUT"
          cat .evidence/coordinator-command.log
          exit "$coordinator_status"
      - name: Test independent Grok box exec daemon contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/box-exec-daemon/Cargo.toml
      - name: Test shipping Host box exec daemon supervisor
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path source/box-exec-daemon/Cargo.toml --bin box-exec-daemon
          FABUSHI_BOX_EXEC_DAEMON_TEST_BIN="$GITHUB_WORKSPACE/source/box-exec-daemon/target/debug/box-exec-daemon" \
            cargo test --manifest-path source/host/Cargo.toml --test box_exec_daemon_process_contract
      - name: Bind the actual shipping App test executable for original-turn restart
        id: original_turn_app_compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/ocrm-original-turn
          compile_status=0
          cargo test --locked --manifest-path source/host/app/Cargo.toml --bin mahayana-app-host \
            --no-run --message-format=json > .evidence/ocrm-original-turn/compiler-artifacts.jsonl || compile_status=$?
          python3 - <<'PY_MESSAGES'
          import json
          from pathlib import Path
          for line in Path(".evidence/ocrm-original-turn/compiler-artifacts.jsonl").read_text().splitlines():
              if line.startswith("{"):
                  item=json.loads(line)
                  rendered=item.get("message", {}).get("rendered")
                  if rendered:
                      print(rendered, end="")
          PY_MESSAGES
          if [ "$compile_status" -ne 0 ]; then exit "$compile_status"; fi
          python3 - <<'PY_BIND'
          import hashlib, json, os
          from pathlib import Path
          evidence=Path(".evidence/ocrm-original-turn")
          candidates=set()
          for line in (evidence/"compiler-artifacts.jsonl").read_text().splitlines():
              if not line.startswith("{"):
                  continue
              item=json.loads(line)
              if (item.get("reason") == "compiler-artifact"
                      and item.get("target", {}).get("name") == "mahayana-app-host"
                      and item.get("target", {}).get("kind") == ["bin"]
                      and item.get("profile", {}).get("test") is True
                      and item.get("executable")):
                  candidates.add(item["executable"])
          assert len(candidates) == 1, "Expected one actual shipping App test executable"
          binary=Path(candidates.pop()).resolve(strict=True)
          assert binary.is_file() and binary.is_relative_to(Path.cwd().resolve()), "Unexpected App compiler artifact boundary"
          sha256=lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          binding={
              "head_sha": os.environ["FABUSHI_TARGET_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "command": ["cargo", "test", "--locked", "--manifest-path", "source/host/app/Cargo.toml", "--bin", "mahayana-app-host", "--no-run", "--message-format=json"],
              "exit_code": 0,
              "executable": str(binary),
              "executable_sha256": sha256(binary),
              "manifest_sha256": sha256("source/host/app/Cargo.toml"),
              "lock_sha256": sha256("source/host/app/Cargo.lock"),
              "main_sha256": sha256("source/host/app/src/main.rs"),
              "child_source_sha256": sha256("source/host/app/src/tests/original_turn_recovery_tests.rs"),
              "compiler_artifacts_sha256": sha256(evidence/"compiler-artifacts.jsonl"),
              "child_filter": "tests::original_turn_recovery_tests::original_turn_shipping_ack_process_child",
              "result": "compiled; restart parent must still execute and validate owned child receipts",
          }
          (evidence/"app-test-binding.json").write_text(json.dumps(binding, indent=2)+"\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for key,value in [("FABUSHI_ORIGINAL_TURN_APP_TEST_EXECUTABLE", str(binary)), ("FABUSHI_ORIGINAL_TURN_APP_TEST_SHA256", binding["executable_sha256"])]:
                  assert "\n" not in value and "\r" not in value
                  env.write(f"{key}={value}\n")
          PY_BIND
      - name: Upload actual original-turn App executable binding
        if: ${{ always() && steps.original_turn_app_compile.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-original-turn-app-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/ocrm-original-turn
          if-no-files-found: error
          retention-days: 90
      - name: Test independent Mahayana Host Runner contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml
      - name: Check affected Native workspace dependency integration
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib
          git diff --exit-code -- source/mahayana/mahayana-rs/Cargo.lock
      - name: Initialize scoped command diagnostics
        id: ocrm_diagnostics
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        env:
          OCRM_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/ocrm-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$OCRM_RECOVERY_EVIDENCE_DIR"
          printf 'OCRM_RECOVERY_EVIDENCE_DIR=%s\n' "$OCRM_RECOVERY_EVIDENCE_DIR" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["FABUSHI_TARGET_SHA"]
          source_paths = [
              ".github/workflows/rust-desktop-runtime.yml",
              "projects/openclaw-rust/scripts/capture_portable_contracts.py",
              "source/host/Cargo.toml", "source/host/Cargo.lock",
              "projects/openclaw-rust/upstream.lock.json",
              "source/host/build.rs",
              "source/packages/proto/generated/agent/v1/mcp_exec_pb.ts",
              "source/host/src/runner/generated_agent_turn_stream.rs",
              "source/host/src/runner/production_agent_checkpoint.rs",
              "source/host/src/runner/inactive_turn_agent_stream.rs",
              "source/host/src/runner/stream_attempt.rs",
              "source/host/src/transcript_mirror/generated_occurrence_codec.rs",
              "source/host/tests/generated_occurrence_codec_contract.rs",
              "source/host/tests/production_checkpoint_restart_contract.rs",
              "source/host/tests/routed_send_acceptance_contract.rs",
              "projects/openclaw-rust/docs/specs/plugin-skills-snapshot-admission.md",
              "source/host/src/extensions/mcp/mcp_service.rs",
              "source/host/src/extensions/mcp/coordinator_relay.rs",
              "source/host/src/extensions/mcp/plugin_skills.rs",
              "source/host/src/extensions/mcp/plugin_skills_cache.rs",
              "source/host/src/extensions/mcp/plugin_skills_uninstall_state.rs",
              "source/host/src/extensions/mcp/plugin_skills_sync_tests.rs",
              "source/host/src/extensions/mcp/plugin_skills_auth_recovery_tests.rs",
              "source/host/src/extensions/mcp/production.rs",
              "source/host/src/host_production_extensions.rs",
              "source/host/src/gateway_server.rs",
              "source/host/src/host_gateway_api.rs",
              "source/host/app/src/main.rs",
              "source/host/tests/mcp_service_contract.rs",
              "source/host/tests/mcp_coordinator_relay_contract.rs",
              "source/host/tests/gateway_server_contract.rs",
              "source/host/tests/host_runner_composition_production_wiring_contract.rs",
              "projects/openclaw-rust/docs/specs/cron-session-reaper.md",
              "source/host/src/automations/automation_store.rs",
              "source/host/src/extensions/automations/fire_delivery.rs",
              "source/host/src/extensions/transcript/automation_runtime.rs",
              "source/host/src/extensions/transcript/automation_run_path.rs",
              "source/host/src/extensions/session/agent_session.rs",
              "source/host/src/extensions/session/production.rs",
              "source/host/app/src/tests/automation_terminal_custody_tests.rs",
              "source/host/tests/automation_store_contract.rs",
              "source/host/tests/automations_fire_delivery_contract.rs",
              "source/host/tests/automation_run_production_wiring_contract.rs",
              "source/host/tests/automations_backend_contract.rs",
              "source/host/tests/automation_runtime_contract.rs",
              "source/host/tests/automation_run_path_contract.rs",
              "source/host/tests/automation_spend_guard_runtime_contract.rs",
              "source/host/tests/agent_session_contract.rs",
              "projects/openclaw-rust/docs/specs/memory-gateway-selector-boundary.md",
              "projects/openclaw-rust/docs/specs/memory-append-read-integrity.md",
              "source/host/src/extensions/transcript/transcript_manager.rs",
