              "checkpoint_root_recovery_contract": "SWA-ROOT-RECOVERY-v1",
              "canonical_checkpoint_contract": "CKR-v1",
              "checkpoint_root_recovery_result": "passed",
              "host_takeover_refusal_contract": "OCRM-HOST-TAKEOVER-REFUSAL-v1",
              "host_takeover_refusal_result": "passed",
              "checkpoint_process_reopen_scope": "Storage and Host readiness only; provider replay and unknown-effect settlement remain pending",
              "mcp_lifecycle_waiter_contract": "MCP-LIFE-004",
              "mcp_lifecycle_waiter_result": "passed",
              "automation_history_contract": "OCRM-AUTOMATION-HISTORY-ACK-v1",
              "automation_history_result": "passed",
              "plugin_snapshot_contract": "OCRM-PLUGIN-SNAPSHOT-ADMISSION-v1",
              "plugin_snapshot_rust_result": "passed",
              "committed_source_integrity": "passed",
              "scope": "Shared Settings CAS/snapshot; provider-bound Fabushi turn identity, accepted-checkpoint retry, shipping lease refusal, and truthful Automation history settlement through existing owners. Checkpoint recovery checks durable metadata/root/blob state before owner recovery or publication, preserves legacy fixed IDs and refusal custody, and validates bounded direct-reference availability. App compaction tests bind typed/shared cancellation to the real Runner/Session producer and the post-lock and pre-COMMIT token reads, with raw rollback/no-publication and ordinary-fallback controls. Callback timing is injected; cancellation after the DB final read does not undo the committed result. Normalized root continuation and separate-process storage reopening retain valid fixed-root checkpoints; original-turn provider load/claim/settle remains open. Host takeover coverage refuses a still-live known Host or exhausted exclusive acquisition without claiming atomic PID fencing or tool termination. MCP lifecycle coverage binds close to waiter registration and exercises real Skills polling shutdown without claiming remote operation retraction or full permission lifecycle acceptance. Automation coverage includes bounded background/spend-guard execution and guarded cron SQL lifecycle. Cancellation request acknowledgment no longer publishes a task terminal; frozen finalization inputs bind structured, trace and terminal event outcomes. Automation deadline and unknown-outcome custody remain open. Channel coverage binds atomic idle release to the actual shipping drain control in one live manager lifetime; append ambiguity, deferred rearm and restart remain open. History refusal suppresses run observations but does not undo terminal cron rows or imply no backend ACK. Loopback protocol evidence is not real provider compatibility or process-restart execution. Plugin Skills coverage is committed cache eligibility and dispose/publication ordering; live revocation after failed persistence and real marketplace/MCP permission lifecycle remain open. Platform packaging and final acceptance remain pending.",
