              git -C "$work" grep -n -F "$symbol" -- Telegram/SourceFiles || true
            done
          } > artifacts/tdrp-authority/source-consumer-trace-801-900.txt
          {
            printf '%s\n' "accepted_upstream=$upstream_sha"
            for symbol in input_liked input_record input_record_filled input_video; do
              printf 'symbol=%s\n' "$symbol"
              git -C "$work" grep -n -F "$symbol" -- Telegram/SourceFiles Telegram/Resources ':!Telegram/Resources/icons/chat/' || true
            done
          } > artifacts/tdrp-authority/source-consumer-reachability-501-600.txt
      - name: Resolve GitHub Action provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tdrp-build-provenance.mjs
      - name: Attest declared source ranges
        run: node scripts/tdrp-source-attest.mjs
      - name: Resolve explicit GitHub clone refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tdrp-build-git-ref-provenance.mjs
      - name: Validate Revision 9 authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-tdrp-revision9-authority.mjs
      - name: Require accepted mode to fail closed only on incomplete acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/validate-tdrp-revision9-authority.mjs --require-accepted > /tmp/accepted.log 2>&1
          status=$?
          set -e
          cat /tmp/accepted.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -Eq 'accepted mode requires acceptance.accepted=true|accepted mode requires baseline_ready=true|G-INVENTORY unknown must be 0|G-INVENTORY unread must be 0' /tmp/accepted.log
          ! grep -Eqi 'baseline drift|traceability.*missing|validator.*error|source commit differs|blob mismatch' /tmp/accepted.log
      - name: Upload current-head source-authority evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tdrp-revision9-authority-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/tdrp-authority
          if-no-files-found: error
