  config-restore-linux:
    name: OCRM installation key restore boundary / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/host/target
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact restore test subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FABUSHI_TARGET_SHA"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          export RESTORE_EVIDENCE_DIR="$RUNNER_TEMP/ocrm-config-restore-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'RESTORE_EVIDENCE_DIR=%s\n' "$RESTORE_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RESTORE_EVIDENCE_DIR"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          upstream=json.loads(Path("projects/openclaw-rust/upstream.lock.json").read_text())["upstream"]
          binding={
              "contract": "OCRM-CONFIG-PUBLIC-SECRET-v1:CS06-ROOT/DELETE",
              "subject_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: upstream[key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "independent_acceptance": "pending",
          }
          assert binding["subject_commit"] == os.environ["FABUSHI_TARGET_SHA"]
          Path(os.environ["RESTORE_EVIDENCE_DIR"], "subject.json").write_text(json.dumps(binding, indent=2)+"\n")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Install canonical Linux native Computer build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Compile locked restore contracts as the ordinary runner user
        id: config_restore_compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cargo test --locked --manifest-path source/host/Cargo.toml \
            --test box_store_download_frozen_parity_contract --no-run --message-format=json \
            > "$RESTORE_EVIDENCE_DIR/compiler-artifacts.jsonl"
          git diff --exit-code -- source/host/Cargo.lock
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ["RESTORE_EVIDENCE_DIR"])
          candidates=set()
          for line in (root/"compiler-artifacts.jsonl").read_text().splitlines():
              if not line.startswith("{"):
                  continue
              item=json.loads(line)
              if (item.get("reason") == "compiler-artifact"
                      and item.get("target", {}).get("name") == "box_store_download_frozen_parity_contract"
                      and item.get("target", {}).get("kind") == ["test"]
                      and item.get("profile", {}).get("test") is True
                      and item.get("executable")):
                  candidates.add(item["executable"])
          assert len(candidates) == 1, "Expected exactly one actual restore contract executable"
          binary=Path(candidates.pop()).resolve(strict=True)
          target=Path(os.environ["CARGO_TARGET_DIR"]).resolve(strict=True)
          assert binary.is_file() and binary.is_relative_to(target), "Unexpected compiler executable boundary"
          sha256=lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          compiled={
              "command": ["cargo", "test", "--locked", "--manifest-path", "source/host/Cargo.toml", "--test", "box_store_download_frozen_parity_contract", "--no-run", "--message-format=json"],
              "exit_code": 0,
              "executable": str(binary),
              "executable_sha256": sha256(binary),
              "manifest_sha256": sha256("source/host/Cargo.toml"),
              "lock_sha256": sha256("source/host/Cargo.lock"),
              "compiler_artifacts_sha256": sha256(root/"compiler-artifacts.jsonl"),
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True),
              "cargo": subprocess.check_output(["cargo", "-V"], text=True).strip(),
              "compiler_uid": os.geteuid(),
          }
          (root/"compiled.json").write_text(json.dumps(compiled, indent=2)+"\n")
          PY
      - name: Exercise ordinary restore and real mounted descendants
        id: config_restore_execution
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root=Path(os.environ["RESTORE_EVIDENCE_DIR"])
          compiled=json.loads((root/"compiled.json").read_text())
          binary=Path(compiled["executable"])
          assert os.geteuid() != 0, "Ordinary permission oracles must not run as root"
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == compiled["executable_sha256"]
          cases=[("ordinary", [str(binary), "--nocapture"], None)]
          for name in (
              "linux_bind_mounted_descendant_file_restore_boundary",
              "linux_bind_mounted_descendant_symlink_restore_boundary",
          ):
              cases.append((name, ["sudo", "-n", "unshare", "--mount", "--propagation", "private", "--",
                  str(binary), "--exact", name, "--ignored", "--nocapture"], name))
          results=[]
          for label, command, exact in cases:
              log=root/(label+".log")
              print("Executing "+json.dumps(command), flush=True)
              with log.open("wb") as output:
                  completed=subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, check=False)
              raw=log.read_bytes()
              text=raw.decode("utf-8", errors="replace")
              print(text, flush=True)
              summaries=re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", text)
              counts=tuple(map(int, summaries[-1])) if summaries else None
              accepted=completed.returncode == 0 and counts is not None and counts[0] > 0 and counts[1] == 0
              if exact is not None:
                  accepted=accepted and counts == (1, 0, 0) and f"test {exact} ... ok" in text
              results.append({
                  "case": label, "command": command, "exit_code": completed.returncode,
                  "passed": counts[0] if counts else None,
                  "failed": counts[1] if counts else None,
                  "ignored": counts[2] if counts else None,
                  "oracle_accepted": accepted,
                  "log": log.name, "log_sha256": hashlib.sha256(raw).hexdigest(),
              })
              receipt={
                  **json.loads((root/"subject.json").read_text()),
                  "compiled": compiled, "executions": results,
                  "result": "passed" if len(results) == len(cases) and all(item["oracle_accepted"] for item in results) else "failed-or-incomplete",
                  "scope": "Ordinary restore contracts plus real private-namespace bind-mounted descendant file/symlink replacements, using synthetic installation keys and owned fixtures. Missing privileges fail execution. This is not exclusion of concurrent external namespace mutation or full backup/client compatibility acceptance.",
              }
              (root/"execution.json").write_text(json.dumps(receipt, indent=2)+"\n")
          raise SystemExit(0 if all(item["oracle_accepted"] for item in results) else 1)
          PY
      - name: Upload exact-subject Linux restore evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-config-restore-linux-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocrm-config-restore-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

  sqlite-native-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      # CI-LINUX-STORAGE-01: retain test assertions without full debug artifacts.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FABUSHI_TARGET_SHA"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA"
          fi
          native_path_fixtures="$RUNNER_TEMP/ocrm-sqlite-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$native_path_fixtures"
          printf 'NATIVE_PATH_FIXTURES=%s\n' "$native_path_fixtures" >> "$GITHUB_ENV"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
