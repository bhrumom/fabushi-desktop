name: Rust desktop runtime

on:
  workflow_dispatch:
    inputs:
      expected_subject:
        description: 'Optional frozen full SHA; reject a moved dispatch ref'
        type: string
        required: false
      validation_scope:
        description: 'Validation scope on the exact dispatched commit'
        type: choice
        required: true
        default: full
        options:
          - full
          - ocrm-config
  push:
    branches:
      - main
      - restore/rust-desktop-runtime
      - refactor/grok-018-architecture-rebuild
      - 'ocrm/**'
      - 'codex/openclaw-rust-fusion-chat-20261101-writer'
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'
  pull_request:
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'

permissions:
  contents: read

env:
  FABUSHI_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_DISPATCH_SHA: ${{ inputs.expected_subject || '' }}

concurrency:
  group: rust-desktop-runtime-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-host:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/mahayana/mahayana-rs -> target
            source/host -> target
            source/host/app -> target
            source/node-agent-coordinator -> target
            source/box-exec-daemon -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Validate local Cargo dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -f source/mahayana/mahayana-rs/Cargo.toml
          test -f source/mahayana/codex-rs/Cargo.toml
          test -f native/mahayana-messaging/Cargo.toml
          cargo metadata --no-deps --format-version 1 --manifest-path source/mahayana/mahayana-rs/Cargo.toml >/dev/null
      - name: Test canonical Fabushi messaging responsibilities
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/mahayana-messaging/Cargo.toml
          mkdir -p .evidence
          cat > .evidence/messaging-responsibilities.json <<EOF
          {
            "head_sha": "${{ env.FABUSHI_TARGET_SHA }}",
            "manifest": "native/mahayana-messaging/Cargo.toml",
            "responsibilities": [
              "scheduled-and-silent-forward-preservation",
              "forward-destination-authorization",
              "formatted-text-utf16-entity-offset",
              "typed-forward-thread-destination",
              "missing-closed-hidden-topic-rejection"
            ],
            "result": "passed"
          }
          EOF
      - name: Upload canonical Fabushi messaging evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-messaging-responsibilities-${{ env.FABUSHI_TARGET_SHA }}
          path: .evidence/messaging-responsibilities.json
          if-no-files-found: error
          retention-days: 90
      - name: Check Grok-aligned shipping Mahayana Host
        shell: bash
        run: cargo check --locked --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml
      - name: Test independent Mahayana Coordinator contract
        id: coordinator_full
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          coordinator_command=(cargo test --manifest-path source/node-agent-coordinator/Cargo.toml)
          coordinator_status=0
          "${coordinator_command[@]}" || coordinator_status=$?
          printf 'command=%s\nexit_code=%s\n' "${coordinator_command[*]}" "$coordinator_status" >> "$GITHUB_OUTPUT"
          exit "$coordinator_status"
      - name: Test independent Grok box exec daemon contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/box-exec-daemon/Cargo.toml
      - name: Test shipping Host box exec daemon supervisor
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path source/box-exec-daemon/Cargo.toml --bin box-exec-daemon
          FABUSHI_BOX_EXEC_DAEMON_TEST_BIN="$GITHUB_WORKSPACE/source/box-exec-daemon/target/debug/box-exec-daemon" \
            cargo test --manifest-path source/host/Cargo.toml --test box_exec_daemon_process_contract
      - name: Test independent Mahayana Host Runner contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml
      - name: Check affected Native workspace dependency integration
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib
          git diff --exit-code -- source/mahayana/mahayana-rs/Cargo.lock
      - name: Test OCRM Settings transaction and inference consumers
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast --manifest-path source/host/Cargo.toml \
            --test host_secret_store_contract \
            --test host_foundation_contract \
            --test box_store_download_frozen_parity_contract \
            --test box_store_transfer_frozen_parity_contract \
            --test box_copy_in_production_wiring_contract \
            --test box_store_sync_production_wiring_contract \
            --test settings_service_contract \
            --test openclaw_sessions_and_config_contract \
            --test inference_extension_composition_contract \
            --test settings_extension_contract \
            --test production_settings_single_owner_contract \
            --test gateway_command_error_contract \
            --test openclaw_agent_roster_contract \
            --test extensions_auth_service_contract \
            --test inference_codex_direct_contract \
            --test inference_provider_session_contract \
            --test runner_production_bridge_contract \
            --test fabushi_model_identity_production_contract \
            --test fabushi_responses_credential_context_contract
      - name: Test shipping model, channel, compaction cancellation and Runner terminal contracts
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          admission_status=0
          if cargo test --locked --manifest-path source/host/app/Cargo.toml --bin mahayana-app-host --no-run; then
            for admission_test in \
              tests::config_secret_boundary_tests::all_public_settings_routes_mask_values_and_internal_digests \
              tests::config_secret_boundary_tests::masked_skill_round_trips_preserve_stored_bytes_and_explicit_updates_keep_normalization \
              tests::config_secret_boundary_tests::public_settings_conflicts_and_invalid_requests_do_not_expose_values_or_call_consumers \
              tests::config_secret_boundary_tests::public_settings_response_and_trusted_callback_keep_their_commit_after_reentry \
              tests::config_secret_boundary_tests::legacy_public_masked_write_restores_the_current_committed_secret \
              tests::config_secret_boundary_tests::public_key_refusal_precedes_all_four_routes_and_read_normalization \
              tests::model_admission_refusals_release_the_accepted_lease_before_permission_effects \
              tests::listener_connect_resume_is_hidden_handoff_with_stable_nonce \
              tests::upgrade_marker_handoff_preserves_kickstart_intent_on_failure \
              tests::upgrade_marker_startup_checks_all_rows_before_any_dispatch \
              tests::channel_inbound_drain_idle_predecessor_preserves_successor_ownership \
              tests::channel_inbound_drain_nonempty_pause_keeps_existing_cleanup_and_queue_order \
              tests::channel_inbound_commit_preserves_all_messages_before_continuation \
              tests::channel_inbound_commit_failure_never_enters_continuation \
              tests::channel_inbound_append_commits_once_before_runner_and_displayed_redrive \
              tests::channel_inbound_append_lost_ack_holds_real_commit_without_runner_or_replay \
              tests::channel_inbound_append_rollback_retries_same_preparation_before_later_input \
              tests::channel_inbound_checked_history_failure_keeps_binding_and_never_dispatches \
              tests::channel_inbound_runner_admission_refuses_changed_binding_and_releases_work \
              tests::channel_inbound_reply_nudge_keeps_generation_after_real_session_settlement \
              tests::channel_inbound_displayed_redrive_refuses_archive_restore_without_rebinding \
              tests::channel_inbound_readiness_tests::settings_commit_rearms_retained_input_without_new_ingress \
              tests::channel_inbound_readiness_tests::rejected_settings_cas_and_unrelated_fields_do_not_rearm \
              tests::channel_inbound_readiness_tests::failed_settings_persistence_does_not_publish_readiness \
              tests::channel_inbound_readiness_tests::committed_settings_signal_during_gate_check_survives_pause_once \
              tests::channel_inbound_readiness_tests::notification_is_only_a_hint_and_does_not_invent_provider_configuration \
              tests::channel_inbound_readiness_tests::active_hint_does_not_spin_while_upgrade_gate_remains_closed \
              tests::channel_inbound_readiness_tests::rollback_signal_retries_latest_real_preparation_before_tail \
              tests::channel_inbound_readiness_tests::unknown_commit_rejects_settings_resume_and_later_ingress \
              tests::channel_inbound_readiness_tests::resume_rearms_before_later_pending_wake_restoration_failure \
              tests::channel_inbound_readiness_tests::failed_launch_keeps_exact_head_and_stale_error_cannot_release_successor \
              tests::channel_inbound_readiness_tests::dispose_refuses_snapshotted_settings_callback_and_reserved_ticket \
              tests::channel_inbound_readiness_tests::disposal_after_real_append_prevents_late_handoff_without_replaying_rows \
              tests::channel_host_lane_tests::channel_send_host_lane_reaches_existing_delivery_owner_once \
              tests::channel_host_lane_tests::channel_send_host_lane_failure_reaches_tray_and_pending_wake \
              tests::channel_host_lane_tests::channel_send_host_lane_unregistered_provider_uses_existing_failure_owner \
              tests::channel_host_lane_tests::channel_send_host_lane_returns_before_transport_and_preserves_fallback \
              tests::channel_host_lane_tests::channel_send_host_lane_preserves_projection_noop_and_no_retry \
              tests::post_turn_compaction_cancelled_summaries_preserve_session \
              tests::post_turn_compaction_cancellation_between_phases_and_before_commit_preserves_session \
              tests::post_turn_compaction_provider_failures_commit_fitted_degraded_fallback \
              tests::post_turn_compaction_success_commits_once_and_replays_after_reopen \
              tests::compaction_prefix_cancellation_refuses_fitting_fallback_at_shipping_boundary \
              tests::compaction_prefix_failure_without_cancel_commits_through_session_owner \
              tests::routed_provider_cancel_request_waits_for_worker_terminal \
              tests::routed_provider_cancellation_only_marks_superseded_connectors \
              tests::routed_provider_terminal_snapshot_resists_late_success_and_failure_cancellation \
              tests::routed_provider_terminal_preserves_waiting_review_and_delivery_facts \
              tests::routed_provider_terminal_keeps_real_guard_custody_after_local_retirement \
              tests::routed_provider_terminal_custody_refuses_missing_and_foreign_reports \
              tests::routed_provider_terminal_shipping_wiring_preserves_finalization_boundary \
              tests::automation_deadline_retains_real_run_ownership_until_worker_terminal \
              tests::automation_deadline_preserves_queued_runner_success \
              tests::automation_terminal_custody_tests::automation_terminal_custody_requires_bound_complete_evidence \
              tests::automation_terminal_custody_tests::automation_terminal_custody_preserves_safe_outcomes_and_upgrade_annotation \
              tests::automation_terminal_custody_tests::automation_unknown_tool_terminal_retains_durable_run_and_backend_delivery \
              tests::background_deadline_retains_session_custody_until_worker_terminal \
              tests::background_deadline_refused_cancellation_keeps_supervising \
              tests::background_deadline_preserves_queued_success_receipt \
              tests::background_deadline_preserves_frozen_success_and_failure \
              tests::background_terminal_preserves_failure_waiting_and_stale_generation \
              tests::background_terminal_disconnect_preserves_existing_error_and_release \
              tests::coordinator_tool_bridge_preserves_downstream_unknown_and_review_gate \
              tests::automation_terminal_event_maps_runner_settlement_without_guessing; do
              cargo test --locked --manifest-path source/host/app/Cargo.toml --bin mahayana-app-host \
                "$admission_test" -- --exact || admission_status=1
            done
          else
            admission_status=1
          fi
          cargo test --locked --manifest-path source/host/app/Cargo.toml --test startup_admission_contract || admission_status=1
          exit "$admission_status"
      - name: Test affected Session Transcript and Runner integration recovery
        id: ocrm_recovery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        env:
          FABUSHI_AUTOMATION_CONTRACT_ARTIFACT_ROOT: ${{ runner.temp }}/ocrm-automation-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$FABUSHI_AUTOMATION_CONTRACT_ARTIFACT_ROOT"
          # SESSION-JSON-ROUNDTRIP-v1: retain the effective locked dependency
          # feature graph with each baseline/fixed subject; do not infer it from Cargo.lock.
          cargo tree --locked --manifest-path source/host/Cargo.toml --edges features --invert serde_json
          recovery_status=0
          cargo test --locked --no-fail-fast --manifest-path source/host/Cargo.toml \
            --test production_turn_input_projection_contract \
            --test production_turn_agent_owner_contract \
            --test production_agent_store_contract \
            --test production_agent_store_recovery_contract \
            --test canonical_checkpoint_recovery_contract \
            --test session_conversation_state_contract \
            --test transcript_mirror_production_provider_contract \
            --test checkpoint_root_identity_contract \
            --test production_checkpoint_restart_contract \
            --test production_agent_checkpoint_contract \
            --test session_production_contract \
            --test runner_routed_provider_contract \
            --test turn_runtime_recovery_contract \
            --test transcript_dispatch_source_contract \
            --test routed_send_acceptance_contract \
            --test transcript_extension_contract \
            --test turn_telemetry_production_wiring_contract \
            --test production_turn_run_shell_adapter_contract \
            --test runner_effect_custody_contract \
            --test mcp_meta_tools_contract \
            --test cursor_inference_transport_contract \
            --test stream_attempt_outer_lifecycle_contract \
            --test host_runner_composition_production_wiring_contract \
            --test pending_wake_rearm_contract \
            --test cloud_agent_pending_wake_rearm_production_contract \
            --test background_work_contract \
            --test background_wakes_production_contract \
            --test durable_recovery_stores_contract \
            --test transcript_manager_contract \
            --test transcript_production_composition_contract \
            --test host_upgrade_service_contract \
            --test agent_lifecycle_kickstart_production_contract \
            --test completion_revivals_contract \
            --test automation_runtime_contract \
            --test automation_run_path_contract \
            --test automation_run_production_wiring_contract \
            --test automation_event_fires_contract \
            --test automation_store_contract \
            --test automation_spend_guard_runtime_contract \
            --test automation_lifecycle_production_wiring_contract \
            --test automations_fire_delivery_contract \
            --test automations_backend_contract \
            --test plugin_skills_contract \
            --test host_bundle_and_plugin_cache_contract \
            --test workflow_store_contract \
            --test workflow_commands_contract \
            --test agent_state_contract \
            --test host_production_extensions_contract \
            --test system_prompt_dynamic_sections_production_contract \
            --test skill_publish_contract \
            --test legacy_live_references_contract \
            --test mcp_service_contract \
            --test mcp_coordinator_relay_contract \
            --test runner_coordinator_tool_relay_contract \
            --test mcp_extension_contract \
            --test mcp_production_contract \
            --test host_upgrade_production_contract \
            --test bootstrap_contract \
            --test sand_host_production_wiring_contract \
            --test cloud_workers_extension_contract \
            --test shared_rooms_production_contract \
            --test agent_session_contract \
            --test agent_db_owner_contract \
            --test agent_db_serde_contract \
            --test agent_db_transcript_pages_contract \
            --test agent_db_recovery_contract \
            --test session_maintenance_contract \
            --test agent_to_agent_messaging_contract \
            --test session_gateway_contract || recovery_status=1
          if cargo test --locked --manifest-path source/host/Cargo.toml --lib --no-run; then
            for recovery_filter in \
              host_lock::physical_guard_tests \
              extensions::settings::public_projection::tests \
              host_secret_store::config_revision_key_publication_tests \
              extensions::box_store_sync::production::tests::production_snapshot_categories_exclude_actual_workspace_installation_key \
              extensions::box_store_sync::production::tests::pack_source_selection_excludes_installation_key_material \
              extensions::session::typed_replay::tests \
              extensions::session::production_agent_store::checked_state_tests \
              extensions::session::agent_db::fresh_append_tests \
              extensions::session::production::fresh_append_tests \
              extensions::session::gateway::fresh_append_tests \
              extensions::session::agent_db::channel_inbound_append_tests \
              extensions::session::production::plugin_skills_admission_tests \
              host_production_extensions::plugin_skills_binding_tests \
              extensions::transcript::sand_upgrade_resume_store::checked_marker_tests \
              extensions::transcript::production_runtime::checked_upgrade_handoff_tests \
              extensions::mcp::coordinator_relay::lifecycle_tests \
              runner::coordinator_tool_relay::lifecycle_tests \
              extensions::transcript::completion_revivals::idle_handoff_tests \
              extensions::inference::typed_replay_serialization::tests \
              runner::compaction_planning::tests \
              runner::production_turn_run_shell_adapter::tests \
              runner::tools::mcp_meta_tools::tests \
              runner::turn_shape::tests \
              extensions::inference::production::tests \
              extensions::inference::provider_session::tests \
              extensions::inference::provider_session::fabushi_credential_context_tests \
              extensions::inference::codex_direct_responses::tests::provider_refusal_parser \
              extensions::mcp::plugin_skills::sync_tests \
              extensions::mcp::plugin_skills_cache::tests; do
              cargo test --locked --manifest-path source/host/Cargo.toml --lib "$recovery_filter" || recovery_status=1
            done
          else
            recovery_status=1
          fi
          exit "$recovery_status"
      - name: Preserve failed owned Automation fixtures
        if: ${{ failure() && steps.ocrm_recovery.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-automation-fixtures-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocrm-automation-fixtures-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Test scoped Coordinator control retirement and relay correlation
        id: coordinator_scoped
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          coordinator_command=(cargo test --manifest-path source/node-agent-coordinator/Cargo.toml --test coordinator_contract --test mcp_lifecycle_relay_contract --test runner_tool_relay_contract)
          coordinator_status=0
          "${coordinator_command[@]}" || coordinator_status=$?
          printf 'command=%s\nexit_code=%s\n' "${coordinator_command[*]}" "$coordinator_status" >> "$GITHUB_OUTPUT"
          exit "$coordinator_status"
      - name: Capture exact Coordinator dependency inputs
        id: coordinator_inputs
        if: ${{ always() && (steps.coordinator_full.outcome == 'success' || steps.coordinator_full.outcome == 'failure' || steps.coordinator_scoped.outcome == 'success' || steps.coordinator_scoped.outcome == 'failure') }}
        shell: bash
        env:
          COORDINATOR_FULL_OUTCOME: ${{ steps.coordinator_full.outcome }}
          COORDINATOR_FULL_COMMAND: ${{ steps.coordinator_full.outputs.command }}
          COORDINATOR_FULL_EXIT_CODE: ${{ steps.coordinator_full.outputs.exit_code }}
          COORDINATOR_SCOPED_OUTCOME: ${{ steps.coordinator_scoped.outcome }}
          COORDINATOR_SCOPED_COMMAND: ${{ steps.coordinator_scoped.outputs.command }}
          COORDINATOR_SCOPED_EXIT_CODE: ${{ steps.coordinator_scoped.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def require(condition, detail):
              if not condition:
                  raise SystemExit(detail)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          selected = [mode for mode in ("FULL", "SCOPED")
                      if os.environ[f"COORDINATOR_{mode}_OUTCOME"] in ("success", "failure")]
          require(len(selected) == 1, "Exactly one Coordinator command must have executed")
          mode = selected[0]
          outcome = os.environ[f"COORDINATOR_{mode}_OUTCOME"]
          exit_text = os.environ[f"COORDINATOR_{mode}_EXIT_CODE"]
          require(re.fullmatch(r"[0-9]{1,3}", exit_text) is not None,
                  "Coordinator command exit status is missing or invalid")
          exit_code = int(exit_text)
          require(exit_code <= 255 and (exit_code == 0) == (outcome == "success"),
                  "Coordinator command exit status and outcome disagree")
          command = os.environ[f"COORDINATOR_{mode}_COMMAND"]
          require(command.startswith("cargo test ") and "--manifest-path source/node-agent-coordinator/Cargo.toml" in command
                  and "\n" not in command, "Coordinator command identity is missing or invalid")
          head = git("rev-parse", "HEAD")
          require(re.fullmatch(r"[0-9a-f]{40}", head) is not None and head == os.environ["FABUSHI_TARGET_SHA"],
                  "Coordinator input capture subject mismatch")
          manifest = Path("source/node-agent-coordinator/Cargo.toml")
          require(manifest.is_file() and not manifest.is_symlink(), "Coordinator manifest is not a regular file")
          manifest_blob = git("rev-parse", f"HEAD:{manifest.as_posix()}")
          require(git("hash-object", str(manifest)) == manifest_blob,
                  "Coordinator manifest changed during the command")
          lock = Path("source/node-agent-coordinator/Cargo.lock")
          require(lock.is_file() and not lock.is_symlink(), "Coordinator command produced no regular lock file")
          lock_bytes = lock.read_bytes()
          require(bool(lock_bytes), "Coordinator command produced an empty lock file")
          lock_blob = hashlib.sha1(b"blob " + str(len(lock_bytes)).encode("ascii") + b"\0" + lock_bytes).hexdigest()
          tracked_lock = git("ls-tree", "HEAD", "--", lock.as_posix())
          committed_lock_blob = None
          if tracked_lock:
              fields = tracked_lock.split(None, 3)
              require(len(fields) == 4 and fields[1] == "blob" and fields[3] == lock.as_posix(),
                      "Committed Coordinator lock identity is invalid")
              committed_lock_blob = fields[2]
              require(lock_blob == committed_lock_blob, "Coordinator command changed its committed lock input")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              require(re.fullmatch(r"[1-9][0-9]*", os.environ[name]) is not None,
                      "Coordinator capture run identity is missing or invalid")
          for name in ("GITHUB_JOB", "RUNNER_OS", "RUNNER_ARCH"):
              require(bool(os.environ[name]), "Coordinator capture execution identity is missing")
          receipt = {
              "contract": "COORDINATOR-LOCK-01",
              "capture_result": "captured",
              "acceptance": "Capture alone does not approve tests, a committed dependency graph, or full OCRM acceptance.",
              "subject_commit": head,
              "subject_tree": git("rev-parse", "HEAD^{tree}"),
              "manifest": {"path": manifest.as_posix(), "git_blob": manifest_blob},
              "lock": {"path": lock.as_posix(), "artifact_file": "coordinator-Cargo.lock",
                       "git_blob": lock_blob, "sha256": hashlib.sha256(lock_bytes).hexdigest(),
                       "byte_length": len(lock_bytes), "committed_git_blob": committed_lock_blob,
                       "provenance": "committed-input" if committed_lock_blob else "newly-observed-resolution"},
              "command": {"step": f"coordinator_{mode.lower()}", "argv": command.split(),
                          "exit_code": exit_code, "outcome": outcome},
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "rustc": subprocess.check_output(["rustc", "--version", "--verbose"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
          }
          evidence = Path(".evidence")
          evidence.mkdir(exist_ok=True)
          with (evidence / "coordinator-Cargo.lock").open("xb") as target:
              target.write(lock_bytes)
          with (evidence / "coordinator-inputs.json").open("x", encoding="utf-8") as target:
              target.write(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
