          COORDINATOR_FULL_COMMAND: ${{ steps.coordinator_full.outputs.command }}
          COORDINATOR_FULL_EXIT_CODE: ${{ steps.coordinator_full.outputs.exit_code }}
          COORDINATOR_SCOPED_OUTCOME: ${{ steps.coordinator_scoped.outcome }}
          COORDINATOR_SCOPED_COMMAND: ${{ steps.coordinator_scoped.outputs.command }}
          COORDINATOR_SCOPED_EXIT_CODE: ${{ steps.coordinator_scoped.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def require(condition, detail):
              if not condition:
                  raise SystemExit(detail)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          selected = [mode for mode in ("FULL", "SCOPED")
                      if os.environ[f"COORDINATOR_{mode}_OUTCOME"] in ("success", "failure")]
          require(len(selected) == 1, "Exactly one Coordinator command must have executed")
          mode = selected[0]
          outcome = os.environ[f"COORDINATOR_{mode}_OUTCOME"]
          exit_text = os.environ[f"COORDINATOR_{mode}_EXIT_CODE"]
          require(re.fullmatch(r"[0-9]{1,3}", exit_text) is not None,
                  "Coordinator command exit status is missing or invalid")
          exit_code = int(exit_text)
          require(exit_code <= 255 and (exit_code == 0) == (outcome == "success"),
                  "Coordinator command exit status and outcome disagree")
          command = os.environ[f"COORDINATOR_{mode}_COMMAND"]
          require(command.startswith("cargo test ") and "--manifest-path source/node-agent-coordinator/Cargo.toml" in command
                  and "\n" not in command, "Coordinator command identity is missing or invalid")
          command_log = Path(".evidence/coordinator-command.log")
          require(command_log.is_file() and not command_log.is_symlink(),
                  "Coordinator command log is not a regular file")
          command_log_bytes = command_log.read_bytes()
          require(bool(command_log_bytes), "Coordinator command log is empty")
          head = git("rev-parse", "HEAD")
          require(re.fullmatch(r"[0-9a-f]{40}", head) is not None and head == os.environ["FABUSHI_TARGET_SHA"],
                  "Coordinator input capture subject mismatch")
          manifest = Path("source/node-agent-coordinator/Cargo.toml")
          require(manifest.is_file() and not manifest.is_symlink(), "Coordinator manifest is not a regular file")
          manifest_blob = git("rev-parse", f"HEAD:{manifest.as_posix()}")
          require(git("hash-object", str(manifest)) == manifest_blob,
                  "Coordinator manifest changed during the command")
          lock = Path("source/node-agent-coordinator/Cargo.lock")
          require(lock.is_file() and not lock.is_symlink(), "Coordinator command produced no regular lock file")
          lock_bytes = lock.read_bytes()
          require(bool(lock_bytes), "Coordinator command produced an empty lock file")
          lock_blob = hashlib.sha1(b"blob " + str(len(lock_bytes)).encode("ascii") + b"\0" + lock_bytes).hexdigest()
          tracked_lock = git("ls-tree", "HEAD", "--", lock.as_posix())
          committed_lock_blob = None
          if tracked_lock:
              fields = tracked_lock.split(None, 3)
              require(len(fields) == 4 and fields[1] == "blob" and fields[3] == lock.as_posix(),
                      "Committed Coordinator lock identity is invalid")
              committed_lock_blob = fields[2]
              require(lock_blob == committed_lock_blob, "Coordinator command changed its committed lock input")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              require(re.fullmatch(r"[1-9][0-9]*", os.environ[name]) is not None,
                      "Coordinator capture run identity is missing or invalid")
          for name in ("GITHUB_JOB", "RUNNER_OS", "RUNNER_ARCH"):
              require(bool(os.environ[name]), "Coordinator capture execution identity is missing")
          receipt = {
              "contract": "COORDINATOR-LOCK-01",
              "capture_result": "captured",
              "acceptance": "Capture alone does not approve tests, a committed dependency graph, or full OCRM acceptance.",
              "subject_commit": head,
              "subject_tree": git("rev-parse", "HEAD^{tree}"),
              "manifest": {"path": manifest.as_posix(), "git_blob": manifest_blob},
              "source_inputs_sha256": {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in (
                      ".github/workflows/rust-desktop-runtime.yml",
                      "source/node-agent-coordinator/src/main.rs",
                      "source/node-agent-coordinator/src/carrier.rs",
                      "source/node-agent-coordinator/tests/coordinator_contract.rs",
                      "projects/openclaw-rust/docs/specs/link-preview-native-gateway.md",
                      "source/node-agent-coordinator/src/mcp_lifecycle_relay.rs",
                      "source/node-agent-coordinator/tests/mcp_lifecycle_relay_contract.rs",
                      "source/node-agent-coordinator/tests/production_protocol.rs",
                      "source/shared/rpc/coordinator-main.ts",
                  )
              },
              "lock": {"path": lock.as_posix(), "artifact_file": "coordinator-Cargo.lock",
                       "git_blob": lock_blob, "sha256": hashlib.sha256(lock_bytes).hexdigest(),
                       "byte_length": len(lock_bytes), "committed_git_blob": committed_lock_blob,
                       "provenance": "committed-input" if committed_lock_blob else "newly-observed-resolution"},
              "command": {"step": f"coordinator_{mode.lower()}", "argv": command.split(),
                          "exit_code": exit_code, "outcome": outcome},
              "command_log": {"artifact_file": command_log.name,
                              "sha256": hashlib.sha256(command_log_bytes).hexdigest(),
                              "byte_length": len(command_log_bytes)},
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "rustc": subprocess.check_output(["rustc", "--version", "--verbose"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
          }
          evidence = Path(".evidence")
          evidence.mkdir(exist_ok=True)
          with (evidence / "coordinator-Cargo.lock").open("xb") as target:
              target.write(lock_bytes)
          with (evidence / "coordinator-inputs.json").open("x", encoding="utf-8") as target:
              target.write(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY
