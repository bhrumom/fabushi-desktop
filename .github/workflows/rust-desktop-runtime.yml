name: Rust desktop runtime

on:
  push:
    branches: [main, restore/rust-desktop-runtime]
    paths:
      - 'desktop/**'
      - 'third_party/mahayana/mahayana-rs/**'
      - 'third_party/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'third_party/mahayana/mahayana-rs/**'
      - 'third_party/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'

permissions:
  contents: read

jobs:
  rust-host:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Validate local Cargo dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/mahayana/mahayana-rs/Cargo.toml
          test -f third_party/mahayana/codex-rs/Cargo.toml
          test -f native/mahayana-messaging/Cargo.toml
          cargo metadata --no-deps --format-version 1 --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml >/dev/null
      - name: Check desktop Mahayana host
        shell: bash
        run: cargo check --profile ci -p mahayana-app-host-desktop --bin mahayana-app-host --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
      - name: Test ConversationActor and CapabilityBroker ownership
        shell: bash
        run: cargo test -p mahayana-runtime --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml

  platform-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-platform-worker-wasm-1.97.1
      - name: Check Mahayana platform Worker
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mahayana-platform-worker --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml

  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund
      - name: Check Electron Host boundary
        run: node --test desktop/electron/host-process.test.cjs
      - name: Check Agent workspace architecture boundary
        run: node desktop/scripts/check-agent-workspace-boundary.mjs
      - name: Typecheck and build renderer
        run: npm --prefix desktop run build:renderer
      - name: Enforce built desktop bundle boundary
        run: node desktop/scripts/check-desktop-bundle.mjs
