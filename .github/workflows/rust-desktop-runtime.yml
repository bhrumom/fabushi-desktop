name: Rust desktop runtime

on:
  push:
    branches: [main, restore/rust-desktop-runtime, refactor/grok-018-architecture-rebuild]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'

permissions:
  contents: read

concurrency:
  group: rust-desktop-runtime-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-host:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FABUSHI_TESTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/mahayana/mahayana-rs -> target
            source/host -> target
            source/host/app -> target
            source/node-agent-coordinator -> target
            source/box-exec-daemon -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Validate local Cargo dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -f source/mahayana/mahayana-rs/Cargo.toml
          test -f source/mahayana/codex-rs/Cargo.toml
          test -f native/mahayana-messaging/Cargo.toml
          cargo metadata --no-deps --format-version 1 --manifest-path source/mahayana/mahayana-rs/Cargo.toml >/dev/null
      - name: Test canonical Fabushi messaging responsibilities
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/mahayana-messaging/Cargo.toml
          mkdir -p .evidence
          cat > .evidence/messaging-responsibilities.json <<EOF
          {
            "head_sha": "$FABUSHI_TESTED_HEAD_SHA",
            "manifest": "native/mahayana-messaging/Cargo.toml",
            "responsibilities": [
              "scheduled-and-silent-forward-preservation",
              "forward-destination-authorization",
              "formatted-text-utf16-entity-offset",
              "typed-forward-thread-destination",
              "missing-closed-hidden-topic-rejection"
            ],
            "result": "passed"
          }
          EOF
      - name: Upload canonical Fabushi messaging evidence
        uses: actions/upload-artifact@v4
        with:
          name: rust-messaging-responsibilities-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .evidence/messaging-responsibilities.json
          if-no-files-found: error
          retention-days: 90
      - name: Check Grok-aligned shipping Mahayana Host
        shell: bash
        run: cargo check --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml
      - name: Test independent Mahayana Coordinator contract
        shell: bash
        run: cargo test --manifest-path source/node-agent-coordinator/Cargo.toml
      - name: Test independent Grok box exec daemon contract
        shell: bash
        run: cargo test --manifest-path source/box-exec-daemon/Cargo.toml
      - name: Test shipping Host box exec daemon supervisor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path source/box-exec-daemon/Cargo.toml --bin box-exec-daemon
          FABUSHI_BOX_EXEC_DAEMON_TEST_BIN="$GITHUB_WORKSPACE/source/box-exec-daemon/target/debug/box-exec-daemon" \
            cargo test --manifest-path source/host/Cargo.toml --test box_exec_daemon_process_contract
      - name: Test independent Mahayana Host Runner contract
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml
      - name: Test Grok prompt attachment projection contract
        shell: bash
        run: cargo test -p mahayana-feature-host grok_send_prompt_projects_attachment_context_into_user_transcript_event --manifest-path source/mahayana/mahayana-rs/Cargo.toml
      - name: Test human Computer takeover lifecycle
        shell: bash
        run: cargo test -p mahayana-feature-host computer_takeover_acquires_and_releases_a_human_control_lease --manifest-path source/mahayana/mahayana-rs/Cargo.toml
      - name: Test ConversationActor and CapabilityBroker ownership
        shell: bash
        run: cargo test -p mahayana-runtime --manifest-path source/mahayana/mahayana-rs/Cargo.toml

  pressure-profiler-platform:
    name: Pressure profiler / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: pressure-profiler-${{ matrix.os }}-1.97.1
      - name: Enable Linux perf sampling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v perf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y linux-tools-common linux-tools-generic
          fi
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          perf --version
      - name: Capture a real production pressure CPU profile
        run: >-
          cargo test --manifest-path source/host/Cargo.toml
          --test pressure_cpu_profiler_contract
          production_backend_emits_native_consumable_cpu_profile_artifact
          -- --exact --nocapture


  updater-platform-contract:
    name: Updater contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund
      - name: Build Electron updater contract
        run: npm --prefix desktop run build:electron
      - name: Compile Electron updater contract
        run: ./desktop/node_modules/.bin/tsc -p desktop/tsconfig.grok-electron.json
      - name: Test updater parent-handoff and platform gates
        run: >-
          node --test
          --test-name-pattern="Windows updater handoff|update gates"
          desktop/.tmp-grok-electron/source/electron-main/foundations.test.js

  platform-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/mahayana/mahayana-rs -> target
          shared-key: mahayana-platform-worker-wasm-1.97.1
      - name: Check Mahayana platform Worker
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mahayana-platform-worker --manifest-path source/mahayana/mahayana-rs/Cargo.toml

  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund
      - name: Build Grok-shaped Electron runtime
        run: npm --prefix desktop run build:electron
      - name: Check production architecture boundary
        run: node desktop/scripts/check-agent-workspace-boundary.mjs
      - name: Compile Grok Electron boundary contracts
        run: ./desktop/node_modules/.bin/tsc -p desktop/tsconfig.grok-electron.json
      - name: Compile Fabushi product policy contract
        run: ./desktop/node_modules/.bin/tsc -p desktop/tsconfig.fabushi-product.json
      - name: Test Grok Electron boundary contracts
        run: >-
          node --test
          desktop/.tmp-grok-electron/source/electron-preload/coordinator-port-bridge.test.js
          desktop/.tmp-grok-electron/source/electron-preload/preload-boundaries.test.js
          desktop/.tmp-grok-electron/source/shared/foundations.test.js
          desktop/.tmp-grok-electron/source/shared/node/mcp/mcp-discovery-settlement.contract.test.js
          desktop/.tmp-grok-electron/source/electron-main/foundations.test.js
          desktop/.tmp-grok-electron/source/electron-main/analytics/xlsx-export.test.js
          desktop/.tmp-grok-electron/source/electron-main/mcp/mcp-runtime.contract.test.js
          desktop/.tmp-grok-electron/source/electron-main/coordinator/coordinator-launcher.test.js
          desktop/.tmp-grok-electron/source/electron-main/coordinator/coordinator-executors.test.js
          desktop/.tmp-grok-electron/source/electron-main/local-exec/local-exec-daemon-protocol.test.js
      - name: Test Fabushi product policy contract
        run: node --test desktop/.tmp-fabushi-product/source/product/fabushi/fabushi-account-service.contract.test.js
      - name: Test recovered window chrome contracts
        run: >-
          node --experimental-strip-types --test
          frontend/src/recovered/features/window-chrome/app-alert/controller.contract.test.ts
          frontend/src/recovered/features/window-chrome/model.contract.test.ts
          frontend/src/recovered/ui/overlay-dismissal.contract.test.ts
          frontend/src/recovered/ui/button-state.contract.test.ts
          frontend/src/recovered/ui/in-flight-command.contract.test.ts
          frontend/src/recovered/ui/sand-tabs-state.contract.test.ts
          frontend/src/recovered/ui/sand-tooltip.contract.test.ts
          frontend/src/production/human-call-controls.contract.test.ts
          frontend/src/recovered/features/recovered-foundations.contract.test.ts
          frontend/src/recovered/features/recovered-runtime-models.contract.test.ts
          frontend/src/recovered/features/access-cover.contract.test.ts
          frontend/src/recovered/features/recovered-configuration-models.contract.test.ts
          frontend/src/recovered/features/recovered-navigation.contract.test.ts
          frontend/src/recovered/features/reaction-system.contract.test.ts
          frontend/src/recovered/features/agent-info-members.contract.test.ts
          frontend/src/recovered/features/shared-room.contract.test.ts
          frontend/src/recovered/features/recovered-owner-utilities.contract.test.ts
          frontend/src/recovered/features/recovered-conversation-infra.contract.test.ts
          frontend/src/recovered/features/access-roster-state.contract.test.ts
          frontend/src/recovered/features/recovered-state-models.contract.test.ts
          frontend/src/recovered/features/recovered-shell-models.contract.test.ts
          frontend/src/production/story-capability-surface.contract.test.ts
          frontend/src/recovered/contracts/desktop-bridge.contract.test.ts
          frontend/src/recovered/runtime/runtime-foundations.contract.test.ts
      - name: Check Agent workspace architecture boundary
        run: node desktop/scripts/check-agent-workspace-boundary.mjs
      - name: Check Grok architecture inventory
        run: node scripts/check-grok-architecture.mjs
      - name: Typecheck and build renderer
        run: npm --prefix desktop run build:renderer
      - name: Verify co-staged desktop runtime
        run: npm --prefix desktop run check:desktop-runtime
      - name: Enforce built desktop bundle boundary
        run: node desktop/scripts/check-desktop-bundle.mjs
      - name: Check Grok final architecture gate
        run: node scripts/check-grok-architecture.mjs --strict


  source-authority:
    name: Source authority / recursive inventory
    runs-on: ubuntu-24.04
    env:
      TDRP_TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        run: |
          test "$TDRP_TARGET_SHA" = "$(git rev-parse HEAD)"
          echo "Exact tested HEAD: $TDRP_TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve accepted upstream tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('projects/telegram-desktop-rust/upstream.lock.json','utf8'));
          const r=await fetch('https://api.github.com/repos/'+lock.upstream.repository+'/git/commits/'+lock.upstream.commit,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'fabushi-tdrp-r9'}});
          if(!r.ok) throw new Error('commit lookup failed '+r.status);
          const commit=await r.json();
          console.log('UPSTREAM_COMMIT='+commit.sha);
          console.log('UPSTREAM_TREE='+commit.tree.sha);
          console.log('LOCK_TREE='+lock.upstream.tree);
          const branchResponse=await fetch('https://api.github.com/repos/'+lock.upstream.repository+'/branches/dev',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'fabushi-tdrp-r9'}});
          if(!branchResponse.ok) throw new Error('dev branch lookup failed '+branchResponse.status);
          const liveBranch=await branchResponse.json();
          const liveCommitResponse=await fetch('https://api.github.com/repos/'+lock.upstream.repository+'/git/commits/'+liveBranch.commit.sha,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'fabushi-tdrp-r9'}});
          if(!liveCommitResponse.ok) throw new Error('live dev commit lookup failed '+liveCommitResponse.status);
          const liveCommit=await liveCommitResponse.json();
          console.log('LIVE_DEV_COMMIT='+liveBranch.commit.sha);
          console.log('LIVE_DEV_TREE='+liveCommit.tree.sha);
          async function printGitlinks(repo, sha, label) {
            const cr=await fetch('https://api.github.com/repos/'+repo+'/git/commits/'+sha,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'fabushi-tdrp-r9'}});
            if(!cr.ok) throw new Error(label+' commit lookup failed '+cr.status);
            const co=await cr.json();
            const tr=await fetch('https://api.github.com/repos/'+repo+'/git/trees/'+co.tree.sha+'?recursive=1',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'fabushi-tdrp-r9'}});
            if(!tr.ok) throw new Error(label+' tree lookup failed '+tr.status);
            const tree=await tr.json();
            for (const entry of tree.tree ?? []) if (entry.mode === '160000') console.log(label+'_GITLINK '+entry.path+'='+entry.sha);
          }
          await printGitlinks('openssl/openssl','45e844fa2a14ec92d146bd8f5778ac130b6625fb','OPENSSL');
          await printGitlinks('desktop-app/tg_owt','d1cf250ea73de26c4c1f0a3c8173eb2648efbb04','TGOWT');
          NODE
      - name: Regression test recursive inventory fail-closed contract
        run: node --test scripts/tdrp-recursive-inventory-contract.test.mjs
      - name: Scan build-time acquisition candidates for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tdrp-authority
          : > artifacts/tdrp-authority/build-time-acquisition-candidates.txt
          upstream_sha="$(node -p "require('./projects/telegram-desktop-rust/upstream.lock.json').upstream.commit")"
          work="$RUNNER_TEMP/tdesktop-acquisition-scan"
          git clone --filter=blob:none --no-checkout https://github.com/telegramdesktop/tdesktop.git "$work"
          git -C "$work" checkout --detach "$upstream_sha"
          test "$(git -C "$work" rev-parse HEAD)" = "$upstream_sha"
          (
            cd "$work"
            grep -RInE --exclude-dir=.git --exclude='*.patch' --exclude='*.diff' \
              '(git[[:space:]]+(clone|fetch|submodule)|curl[[:space:]]|wget[[:space:]]|(^|[;&|[:space:]])(iwr|Invoke-WebRequest)[[:space:]]|git\+https?://|^[[:space:]]*source[[:space:]]*:|source-(url|commit|tag|branch):|GIT_REPOSITORY|GIT_TAG|URL[[:space:]]+https?://|python(3(\.[0-9]+)*)?[[:space:]]+-m[[:space:]]+pip[[:space:]]+install|pip(3)?[[:space:]]+install|pacman[[:space:]]+-S|apt(-get)?[[:space:]]+(install|update)|dnf[[:space:]][^#]*install|brew[[:space:]]+install|cargo[[:space:]]+install|uses:[[:space:]]|^[[:space:]]*FROM[[:space:]]|https://github\.com/.+\.git|https://gitlab\.com/.+\.git)' \
              Telegram/build Telegram/cmake cmake snap tools .github 2>/dev/null || true
          ) | LC_ALL=C sort -u > "$GITHUB_WORKSPACE/artifacts/tdrp-authority/build-time-acquisition-candidates.txt"
          actual_count="$(wc -l < artifacts/tdrp-authority/build-time-acquisition-candidates.txt | tr -d '[:space:]')"
          expected_count="$(node -p "require('./projects/telegram-desktop-rust/inventory/build-time-acquisitions.json').discovery.candidate_lines_total")"
          printf '%s\n' "upstream=$upstream_sha" "actual_count=$actual_count" "expected_count=$expected_count" > artifacts/tdrp-authority/build-time-acquisition-summary.txt
          if [ "$actual_count" != "$expected_count" ]; then
            echo "::error::build-time acquisition candidate drift: discovered $actual_count, inventory expects $expected_count"
            exit 1
          fi
          printf '%s\n' "accepted_upstream=$upstream_sha" > artifacts/tdrp-authority/source-binary-evidence-245-335.txt
          while IFS='|' read -r order path expected_blob; do
            actual_blob="$(git -C "$work" hash-object "$path")"
            test "$actual_blob" = "$expected_blob"
            size="$(wc -c < "$work/$path" | tr -d '[:space:]')"
            kind="$(file -b "$work/$path")"
            printf '%s|%s|%s|%s|%s\n' "$order" "$path" "$actual_blob" "$size" "$kind" >> artifacts/tdrp-authority/source-binary-evidence-245-335.txt
          done <<'EOF'
          245|Telegram/Resources/art/mac_setup.tiff|71d8354694ced401b149d375e5e912065cb60b49
          246|Telegram/Resources/art/premium/coin_border.png|03a5254f5689472e31b89db6058830eeb1afc581
          254|Telegram/Resources/art/premium/flecks.png|b6695a1690d98bdf18f75b9f991b37a0d1660597
          260|Telegram/Resources/art/round_placeholder.jpg|cbdc9aee39c6eceacebf68a0459a84a54118502e
          261|Telegram/Resources/art/themeimage.jpg|d0ffd90d52ec600913864904217004cee1ea6ce9
          271|Telegram/Resources/art/verified_bg.webp|f08059f45501358a219e991bb3b733eb70cca537
          272|Telegram/Resources/art/verified_fg.webp|3535123495877e3de02cff29ca7e3d2ef3a70921
          276|Telegram/Resources/day-blue.tdesktop-theme|ccc3dbdf9dc6d1aed5ae02df7d9430334839900f
          277|Telegram/Resources/day-custom-base.tdesktop-theme|162d90457d8254d3eefcf772c3ca62545a97508a
