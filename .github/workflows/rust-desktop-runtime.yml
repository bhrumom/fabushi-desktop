        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host -> target
            source/host/app -> target
            source/box-exec-daemon -> target
          shared-key: ${{ runner.os == 'Windows' && 'pressure-profiler-windows-2025-1.97.1' || 'desktop-restored-rust-1.97.1' }}
      - name: Install existing Linux Host native dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Compile the exact shipping Host for the selected recovery
        if: ${{ runner.os != 'Windows' && env.OCRM_PORTABLE_SCOPE != 'memory-fixture-lifecycle' && env.OCRM_PORTABLE_SCOPE != 'djc-reader-observation' }}
        id: shipping_host
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check --locked --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml > ".evidence/$OCRM_PORTABLE_SCOPE/shipping-host.log" 2>&1
          command_status=$?
          set -e
          export CRF_HOST_COMPILE_EXIT="$command_status"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          scope = os.environ["OCRM_PORTABLE_SCOPE"]
          assert scope in ("custody-recovery", "background-custody", "background-custody-recovery", "memory-checked-list")
          root = pathlib.Path(".evidence") / scope
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["FABUSHI_TARGET_SHA"]
          lock = json.loads(pathlib.Path("projects/openclaw-rust/upstream.lock.json").read_text())
          raw = (root / "shipping-host.log").read_bytes()
          status = int(os.environ["CRF_HOST_COMPILE_EXIT"])
          receipt = {
              "contract": ("MGL-v1-shipping-compile" if scope == "memory-checked-list"
                  else "BGC-v1-recovery-shipping-compile" if scope == "background-custody-recovery"
                  else "BGC-v1-shipping-compile" if scope == "background-custody" else "CRF-v1-shipping-compile"),
              "validation_scope": scope,
              "subject_commit": head,
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: lock["upstream"][key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"], "runner_os": os.environ["RUNNER_OS"],
              "command": ["cargo", "check", "--locked", "--profile", "ci", "--bin", "mahayana-app-host",
                  "--manifest-path", "source/host/app/Cargo.toml"],
              "command_exit": status, "capture_exit": 0,
              "log": "shipping-host.log", "log_sha256": hashlib.sha256(raw).hexdigest(),
              "result": "compiled" if status == 0 else "failed-or-incomplete",
              "scope": "Compilation only, not runtime, full-contract or package acceptance.",
          }
          (root / "shipping-host.receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
          cat ".evidence/$OCRM_PORTABLE_SCOPE/shipping-host.log"
          exit "$command_status"
      - name: Execute selected real native contracts
        id: custody_contracts
        shell: bash
        run: |
          set -euo pipefail
          evidence_root=".evidence/$OCRM_PORTABLE_SCOPE"
          mkdir -p "$evidence_root"
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} projects/openclaw-rust/scripts/capture_portable_contracts.py 2>&1 | tee "$evidence_root/capture.log"
      - name: Upload exact-subject focused evidence including owned failures
        if: ${{ always() && steps.bind.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ocrm-${{ env.OCRM_PORTABLE_SCOPE }}-${{ runner.os }}-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/${{ env.OCRM_PORTABLE_SCOPE }}/
          if-no-files-found: error
          retention-days: 90


  local-exec-runtime:
    if: ${{ (((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-local-exec-runtime') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-local-exec-runtime):'))) || ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-local-exec-capture') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-local-exec-capture):')))) }}
    name: OCRM selected LocalExec runtime / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      OCRM_LOCAL_EXEC_SCOPE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-local-exec-capture') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer' && startsWith(github.event.head_commit.message, 'fix(ocrm-local-exec-capture):'))) && 'ocrm-local-exec-capture' || 'ocrm-local-exec-runtime' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact LocalExec subject and owned fixture root
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FABUSHI_TARGET_SHA"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA"
          fi
          local_exec_fixtures="$RUNNER_TEMP/ocrm-local-exec-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$local_exec_fixtures"
          printf 'NATIVE_PATH_FIXTURES=%s\n' "$local_exec_fixtures" >> "$GITHUB_ENV"
          mkdir -p .evidence/sqlite-native-path
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(".evidence/sqlite-native-path")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["FABUSHI_TARGET_SHA"]
          lock = json.loads(pathlib.Path("projects/openclaw-rust/upstream.lock.json").read_text())
          assert lock["upstream"]["commit"] == "1440bb1771372334bea23d7642bb52deb7db1845"
          paths = [".github/workflows/rust-desktop-runtime.yml",
              "projects/openclaw-rust/scripts/capture_local_exec_identity.py",
              "desktop/package.json", "desktop/package-lock.json", "projects/openclaw-rust/upstream.lock.json"]
          inputs = {}
          for path in paths:
              raw = pathlib.Path(path).read_bytes()
              assert raw == subprocess.check_output(["git", "show", f"{head}:{path}"]), path
              inputs[path] = {"git_blob": subprocess.check_output(["git", "rev-parse", f"{head}:{path}"], text=True).strip(),
                  "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          selected_scope = os.environ["OCRM_LOCAL_EXEC_SCOPE"]
          assert selected_scope in ("ocrm-local-exec-runtime", "ocrm-local-exec-capture")
          (root / "local-exec-selection.json").write_text(json.dumps({
              "contract": "LDB-v1-selection", "validation_scope": selected_scope,
              "subject_commit": head,
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: lock["upstream"][key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"], "source_inputs": inputs,
              "result": "selection and inputs bound; installation/build/behavior not yet assessed",
          }, indent=2) + "\n")
          PY
          echo "Selected LocalExec subject: $actual; unrelated failed instruments remain unaccepted" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host -> target
            source/box-exec-daemon -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Install existing Linux Host native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frozen desktop dependencies
        timeout-minutes: 10
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund
      - name: Execute actual Coordinator identity and selected LocalExec daemon
        id: local_exec_identity
        timeout-minutes: 45
        env:
          TMPDIR: ${{ env.NATIVE_PATH_FIXTURES }}
          CARGO_BUILD_JOBS: '1'
        shell: bash
        run: python3 projects/openclaw-rust/scripts/capture_local_exec_identity.py
      - name: Preserve exact owned LocalExec fixtures on failure
        if: ${{ always() && steps.local_exec_identity.outcome != 'skipped' && steps.local_exec_identity.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$NATIVE_PATH_FIXTURES"
          test ! -L "$NATIVE_PATH_FIXTURES"
          tar -C "$NATIVE_PATH_FIXTURES" -cf .evidence/sqlite-native-path/local-exec-owned-fixtures.tar .
      - name: Upload exact-subject LocalExec evidence
        if: ${{ always() && steps.bind.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OCRM_LOCAL_EXEC_SCOPE }}-${{ env.FABUSHI_TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/sqlite-native-path/
          if-no-files-found: error
          retention-days: 90
