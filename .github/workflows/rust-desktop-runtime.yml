              startup_output = run(startup_command, "startup-admission")
              startup_passed = re.findall(r"^test (\S+) \.\.\. ok$", startup_output, re.MULTILINE)
              startup_summaries = re.findall(r"^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;", startup_output, re.MULTILINE)
              startup_missing = [name for name in startup_required if startup_passed.count(name) != 1]
              startup_accepted = (not startup_missing and len(startup_summaries) == 1
                  and startup_summaries[0][0] == "ok" and int(startup_summaries[0][1]) >= len(startup_required)
                  and startup_summaries[0][2:] == ("0", "0"))
              receipt["startup_admission"] = {"contract": "HSA-v1/DPS-v1", "command": startup_command,
                  "required_tests": startup_required, "observed_passed_test_names": startup_passed,
                  "missing_or_nonunique_positive_results": startup_missing, "summaries": startup_summaries,
                  "result": "passed" if startup_accepted else "failed"}
