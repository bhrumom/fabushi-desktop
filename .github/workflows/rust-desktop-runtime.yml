      - name: Validate Revision 9 authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-tdrp-revision9-authority.mjs
      - name: Require accepted mode to fail closed only on incomplete acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/validate-tdrp-revision9-authority.mjs --require-accepted > /tmp/accepted.log 2>&1
          status=$?
          set -e
          cat /tmp/accepted.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -Eq 'accepted mode requires acceptance.accepted=true|accepted mode requires baseline_ready=true|G-INVENTORY unknown must be 0|G-INVENTORY unread must be 0' /tmp/accepted.log
          ! grep -Eqi 'baseline drift|traceability.*missing|validator.*error|source commit differs|blob mismatch' /tmp/accepted.log
      - name: Upload current-head source-authority evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
