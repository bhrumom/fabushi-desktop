        run: |
          mkdir -p .evidence
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["PLUGIN_EXPECTED_SHA"]
          lock=json.loads(Path("projects/openclaw-rust/upstream.lock.json").read_text())
          evidence={
              "contract": "OCRM-PLUGIN-SNAPSHOT-ADMISSION-v1",
              "subject_commit": head,
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: lock["upstream"][key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "shipping_electron_bundle": "passed",
              "node_contract_targets": ["host-plugin-skills-loader.contract.test", "loader.contract.test"],
