              and shared.get("log_sha256") == shared_digest and shared.get("result") == "passed")
          receipt["executions"].append({"case": "reused-mcp-composition", "command": shared.get("command"),
              "cargo_exit": shared.get("cargo_exit"), "capture_exit": shared.get("capture_exit"),
              "execution_error": shared_error, "reused_receipt": str(shared_receipt_path),
              "required_positive_names": shared_required, "observed_passed_test_names": shared_passed,
              "missing_or_nonunique_positive_results": shared_missing, "oracle_accepted": shared_accepted,
              "log": str(shared_log), "log_sha256": shared_digest})
          receipt["inputs_after_sha256"] = digest_inputs()
          unchanged = receipt["inputs_before_sha256"] == receipt["inputs_after_sha256"]
          accepted = unchanged and len(receipt["executions"]) == len(cases) + 1 and all(case["oracle_accepted"] for case in receipt["executions"])
          receipt["result"] = "passed" if accepted else "failed-or-incomplete"
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2), flush=True)
          raise SystemExit(0 if accepted else 1)
