name: Rust desktop runtime

on:
  workflow_dispatch:
    inputs:
      expected_subject:
        description: 'Optional frozen full SHA; reject a moved dispatch ref'
        type: string
        required: false
      validation_scope:
        description: 'Validation scope on the exact dispatched commit'
        type: choice
        required: true
        default: full
        options:
          - full
          - ocrm-config
  push:
    branches:
      - main
      - restore/rust-desktop-runtime
      - refactor/grok-018-architecture-rebuild
      - 'ocrm/**'
      - 'codex/openclaw-rust-fusion-chat-20261101-writer'
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'
  pull_request:
    paths:
      - '.github/workflows/release-macos-main.yml'
      - 'desktop/**'
      - 'source/**'
      - 'projects/grok-fabu-parity/architecture-manifest.json'
      - 'projects/grok-fabu-parity/architecture-semantic-adaptations.json'
      - 'scripts/check-grok-architecture.mjs'
      - 'source/mahayana/mahayana-rs/**'
      - 'source/mahayana/codex-rs/**'
      - 'native/mahayana-messaging/**'
      - 'projects/telegram-desktop-rust/**'
      - '.github/workflows/rust-desktop-runtime.yml'
      - 'RUST_RUNTIME_SOURCE.md'
      - 'DESKTOP_SOURCE_CLOSURE.md'
      - 'frontend/**'
      - 'chatgpt-vps-control/**'
      - 'contracts/**'
      - 'projects/openclaw-rust/**'

permissions:
  contents: read

env:
  FABUSHI_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_DISPATCH_SHA: ${{ inputs.expected_subject || '' }}

concurrency:
  group: rust-desktop-runtime-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-host:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
          if [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$EXPECTED_DISPATCH_SHA" || { echo "Dispatch ref moved away from frozen subject"; exit 1; }
          fi
          echo "Exact tested HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/mahayana/mahayana-rs -> target
            source/host -> target
            source/host/app -> target
            source/node-agent-coordinator -> target
            source/box-exec-daemon -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Validate local Cargo dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test -f source/mahayana/mahayana-rs/Cargo.toml
          test -f source/mahayana/codex-rs/Cargo.toml
          test -f native/mahayana-messaging/Cargo.toml
          cargo metadata --no-deps --format-version 1 --manifest-path source/mahayana/mahayana-rs/Cargo.toml >/dev/null
      - name: Test canonical Fabushi messaging responsibilities
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path native/mahayana-messaging/Cargo.toml
          mkdir -p .evidence
          cat > .evidence/messaging-responsibilities.json <<EOF
          {
            "head_sha": "${{ env.FABUSHI_TARGET_SHA }}",
            "manifest": "native/mahayana-messaging/Cargo.toml",
            "responsibilities": [
              "scheduled-and-silent-forward-preservation",
              "forward-destination-authorization",
              "formatted-text-utf16-entity-offset",
              "typed-forward-thread-destination",
              "missing-closed-hidden-topic-rejection"
            ],
            "result": "passed"
          }
          EOF
      - name: Upload canonical Fabushi messaging evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-messaging-responsibilities-${{ env.FABUSHI_TARGET_SHA }}
          path: .evidence/messaging-responsibilities.json
          if-no-files-found: error
          retention-days: 90
      - name: Check Grok-aligned shipping Mahayana Host
        shell: bash
        run: cargo check --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml
      - name: Test independent Mahayana Coordinator contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/node-agent-coordinator/Cargo.toml
      - name: Test independent Grok box exec daemon contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/box-exec-daemon/Cargo.toml
      - name: Test shipping Host box exec daemon supervisor
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path source/box-exec-daemon/Cargo.toml --bin box-exec-daemon
          FABUSHI_BOX_EXEC_DAEMON_TEST_BIN="$GITHUB_WORKSPACE/source/box-exec-daemon/target/debug/box-exec-daemon" \
            cargo test --manifest-path source/host/Cargo.toml --test box_exec_daemon_process_contract
      - name: Test independent Mahayana Host Runner contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test --manifest-path source/host/Cargo.toml
      - name: Test OCRM Settings transaction and inference consumers
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-fail-fast --manifest-path source/host/Cargo.toml \
            --test settings_service_contract \
            --test openclaw_sessions_and_config_contract \
            --test inference_extension_composition_contract \
            --test settings_extension_contract \
            --test production_settings_single_owner_contract \
            --test gateway_command_error_contract \
            --test openclaw_agent_roster_contract \
            --test inference_codex_direct_contract \
            --test inference_provider_session_contract \
            --test runner_production_bridge_contract \
            --test fabushi_model_identity_production_contract
      - name: Test shipping model, channel, compaction cancellation and Runner terminal contracts
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          admission_status=0
          if cargo test --manifest-path source/host/app/Cargo.toml --bin mahayana-app-host --no-run; then
            for admission_test in \
              tests::model_admission_refusals_release_the_accepted_lease_before_permission_effects \
              tests::listener_connect_resume_is_hidden_handoff_with_stable_nonce \
              tests::channel_inbound_drain_idle_predecessor_preserves_successor_ownership \
              tests::channel_inbound_drain_nonempty_pause_keeps_existing_cleanup_and_queue_order \
              tests::post_turn_compaction_cancelled_summaries_preserve_session \
              tests::post_turn_compaction_cancellation_between_phases_and_before_commit_preserves_session \
              tests::post_turn_compaction_provider_failures_commit_fitted_degraded_fallback \
              tests::post_turn_compaction_success_commits_once_and_replays_after_reopen \
              tests::compaction_prefix_cancellation_refuses_fitting_fallback_at_shipping_boundary \
              tests::compaction_prefix_failure_without_cancel_commits_through_session_owner \
              tests::routed_provider_cancel_request_waits_for_worker_terminal \
              tests::routed_provider_terminal_snapshot_resists_late_success_and_failure_cancellation \
              tests::routed_provider_terminal_preserves_waiting_review_and_delivery_facts \
              tests::routed_provider_terminal_shipping_wiring_preserves_finalization_boundary \
              tests::automation_terminal_event_maps_runner_settlement_without_guessing; do
              cargo test --manifest-path source/host/app/Cargo.toml --bin mahayana-app-host \
                "$admission_test" -- --exact || admission_status=1
            done
          else
            admission_status=1
          fi
          exit "$admission_status"
      - name: Test affected Session Transcript and Runner integration recovery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_status=0
          cargo test --no-fail-fast --manifest-path source/host/Cargo.toml \
            --test production_turn_input_projection_contract \
            --test production_turn_agent_owner_contract \
            --test production_agent_store_contract \
            --test production_agent_store_recovery_contract \
            --test canonical_checkpoint_recovery_contract \
            --test session_conversation_state_contract \
            --test transcript_mirror_production_provider_contract \
            --test checkpoint_root_identity_contract \
            --test production_checkpoint_restart_contract \
            --test production_agent_checkpoint_contract \
            --test session_production_contract \
            --test runner_routed_provider_contract \
            --test turn_runtime_recovery_contract \
            --test transcript_extension_contract \
            --test turn_telemetry_production_wiring_contract \
            --test production_turn_run_shell_adapter_contract \
            --test host_runner_composition_production_wiring_contract \
            --test pending_wake_rearm_contract \
            --test cloud_agent_pending_wake_rearm_production_contract \
            --test background_work_contract \
            --test background_wakes_production_contract \
            --test durable_recovery_stores_contract \
            --test transcript_manager_contract \
            --test completion_revivals_contract \
            --test automation_runtime_contract \
            --test automation_run_path_contract \
            --test automation_run_production_wiring_contract \
            --test automation_store_contract \
            --test automation_spend_guard_runtime_contract \
            --test automation_lifecycle_production_wiring_contract \
            --test automations_fire_delivery_contract \
            --test plugin_skills_contract \
            --test host_bundle_and_plugin_cache_contract \
            --test workflow_store_contract \
            --test workflow_commands_contract \
            --test skill_publish_contract \
            --test legacy_live_references_contract \
            --test mcp_service_contract \
            --test mcp_coordinator_relay_contract \
            --test mcp_extension_contract \
            --test mcp_production_contract \
            --test host_upgrade_production_contract \
            --test bootstrap_contract \
            --test sand_host_production_wiring_contract \
            --test cloud_workers_extension_contract \
            --test shared_rooms_production_contract \
            --test agent_session_contract \
            --test agent_db_owner_contract \
            --test agent_db_serde_contract \
            --test agent_db_transcript_pages_contract \
            --test agent_db_recovery_contract \
            --test session_maintenance_contract \
            --test session_gateway_contract || recovery_status=1
          if cargo test --manifest-path source/host/Cargo.toml --lib --no-run; then
            for recovery_filter in \
              extensions::session::typed_replay::tests \
              extensions::session::production_agent_store::checked_state_tests \
              extensions::mcp::coordinator_relay::lifecycle_tests \
              extensions::inference::typed_replay_serialization::tests \
              runner::compaction_planning::tests \
              runner::production_turn_run_shell_adapter::tests \
              runner::turn_shape::tests \
              extensions::inference::production::tests \
              extensions::inference::provider_session::tests \
              extensions::mcp::plugin_skills::sync_tests \
              extensions::mcp::plugin_skills_cache::tests; do
              cargo test --manifest-path source/host/Cargo.toml --lib "$recovery_filter" || recovery_status=1
            done
          else
            recovery_status=1
          fi
          exit "$recovery_status"
      - name: Verify OpenClaw migration audit integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-audit
          .venv-audit/bin/pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
          .venv-audit/bin/python3 projects/openclaw-rust/scripts/verify_audit_integrity.py
      - name: Test Grok prompt attachment projection contract
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test -p mahayana-feature-host grok_send_prompt_projects_attachment_context_into_user_transcript_event --manifest-path source/mahayana/mahayana-rs/Cargo.toml
      - name: Test human Computer takeover lifecycle
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test -p mahayana-feature-host computer_takeover_acquires_and_releases_a_human_control_lease --manifest-path source/mahayana/mahayana-rs/Cargo.toml
      - name: Test ConversationActor and CapabilityBroker ownership
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: cargo test -p mahayana-runtime --manifest-path source/mahayana/mahayana-rs/Cargo.toml
      - name: Test Native-only Desktop credential hand-off on macOS
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'ocrm-config') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib
          cargo test --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-app-host --test native_desktop_account_handoff

      - name: Record exact-subject OCRM configuration evidence
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'ocrm-config') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/openclaw-rust-fusion-chat-20261101-writer') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["FABUSHI_TARGET_SHA"]
          lock=json.loads(Path("projects/openclaw-rust/upstream.lock.json").read_text())
          evidence={
              "contract": "OCRM-CONFIG-CAS-v1",
              "subject_commit": head,
              "subject_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "upstream": {key: lock["upstream"][key] for key in ("repository", "commit", "tree")},
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "shipping_host_check": "passed",
              "owner_contract_targets": ["settings_service_contract", "openclaw_sessions_and_config_contract", "inference_extension_composition_contract", "settings_extension_contract", "production_settings_single_owner_contract", "gateway_command_error_contract", "openclaw_agent_roster_contract", "inference_codex_direct_contract", "inference_provider_session_contract", "runner_production_bridge_contract", "fabushi_model_identity_production_contract"],
              "owner_contract_result": "passed",
              "model_identity_contract": "OCRM-MODEL-IDENTITY-v1",
              "shipping_model_admission_test": "tests::model_admission_refusals_release_the_accepted_lease_before_permission_effects",
              "shipping_model_admission_result": "passed",
              "shipping_listener_resume_test": "tests::listener_connect_resume_is_hidden_handoff_with_stable_nonce",
              "shipping_listener_resume_result": "passed",
              "channel_idle_handoff_contract": "OCRM-CHANNEL-IDLE-HANDOFF-v1",
              "shipping_channel_handoff_tests": ["tests::channel_inbound_drain_idle_predecessor_preserves_successor_ownership", "tests::channel_inbound_drain_nonempty_pause_keeps_existing_cleanup_and_queue_order"],
              "channel_idle_handoff_result": "passed",
              "compaction_cancellation_contract": "OCRM-COMPACTION-CANCEL-v1",
              "compaction_summary_cancellation_contract": "CC-SUMMARY-CANCEL-01..05",
              "shipping_compaction_cancellation_tests": ["tests::compaction_prefix_cancellation_refuses_fitting_fallback_at_shipping_boundary", "tests::compaction_prefix_failure_without_cancel_commits_through_session_owner", "tests::post_turn_compaction_cancelled_summaries_preserve_session", "tests::post_turn_compaction_cancellation_between_phases_and_before_commit_preserves_session", "tests::post_turn_compaction_provider_failures_commit_fitted_degraded_fallback", "tests::post_turn_compaction_success_commits_once_and_replays_after_reopen"],
              "compaction_cancellation_result": "passed",
              "runner_cancel_terminal_contract": "OCRM-RUNNER-CANCEL-TERMINAL-v1",
              "shipping_runner_terminal_tests": ["tests::routed_provider_cancel_request_waits_for_worker_terminal", "tests::routed_provider_terminal_snapshot_resists_late_success_and_failure_cancellation", "tests::routed_provider_terminal_preserves_waiting_review_and_delivery_facts", "tests::routed_provider_terminal_shipping_wiring_preserves_finalization_boundary", "tests::automation_terminal_event_maps_runner_settlement_without_guessing"],
              "runner_cancel_terminal_result": "passed",
              "integration_recovery_contract": "OCRM-CONFIG-INTEGRATION-RECOVERY-v1",
              "integration_recovery_contract_targets": ["production_turn_input_projection_contract", "production_turn_agent_owner_contract", "production_agent_store_contract", "production_agent_store_recovery_contract", "checkpoint_root_identity_contract", "production_checkpoint_restart_contract", "canonical_checkpoint_recovery_contract", "session_conversation_state_contract", "transcript_mirror_production_provider_contract", "production_agent_checkpoint_contract", "session_production_contract", "runner_routed_provider_contract", "turn_runtime_recovery_contract", "transcript_extension_contract", "turn_telemetry_production_wiring_contract", "production_turn_run_shell_adapter_contract", "host_runner_composition_production_wiring_contract", "pending_wake_rearm_contract", "cloud_agent_pending_wake_rearm_production_contract", "background_work_contract", "background_wakes_production_contract", "durable_recovery_stores_contract", "transcript_manager_contract", "completion_revivals_contract", "automation_runtime_contract", "automation_run_path_contract", "automation_run_production_wiring_contract", "automation_store_contract", "automation_spend_guard_runtime_contract", "automation_lifecycle_production_wiring_contract", "automations_fire_delivery_contract", "host_upgrade_production_contract", "bootstrap_contract", "sand_host_production_wiring_contract", "cloud_workers_extension_contract", "shared_rooms_production_contract", "agent_session_contract", "agent_db_owner_contract", "agent_db_serde_contract", "agent_db_transcript_pages_contract", "agent_db_recovery_contract", "session_maintenance_contract", "session_gateway_contract", "plugin_skills_contract", "host_bundle_and_plugin_cache_contract", "workflow_store_contract", "workflow_commands_contract", "skill_publish_contract", "legacy_live_references_contract", "mcp_service_contract", "mcp_coordinator_relay_contract", "mcp_extension_contract", "mcp_production_contract"],
              "integration_recovery_lib_filters": ["extensions::session::typed_replay::tests", "extensions::session::production_agent_store::checked_state_tests", "extensions::mcp::coordinator_relay::lifecycle_tests", "extensions::inference::typed_replay_serialization::tests", "runner::compaction_planning::tests", "runner::production_turn_run_shell_adapter::tests", "runner::turn_shape::tests", "extensions::inference::production::tests", "extensions::inference::provider_session::tests", "extensions::mcp::plugin_skills::sync_tests", "extensions::mcp::plugin_skills_cache::tests"],
