          import hashlib, json, os, re, sys
          from pathlib import Path

          PREFIX = "OCRM_COMMAND "
          MAX_RECORDS, MAX_BYTES, RESERVE = 12000, 2 * 1024 * 1024, 4096
          root = Path(os.environ["OCRM_RECOVERY_EVIDENCE_DIR"])
          subject = {}
          check_name = sys.argv[1]
          ledger_ready = False
          refusal_path = root / "projection-refused.json"

          def encoded(record):
              return json.dumps(record, ensure_ascii=True, sort_keys=True).replace(
                  "##[", r"\u0023\u0023[").replace("::", r"\u003a\u003a")

          def terminal_text(line):
              return re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line)

          def harness(line):
              return re.match(r"^\s*(?:Running |running \d+ tests?\b|test .+ \.\.\. |test result:)",
                              terminal_text(line)) is not None

          def requires_test_summary(command):
              return command.startswith("cargo test ") and "--no-run" not in command

          def positive_summary(lines):
              return any((match := re.search(r"test result: ok\. (\d+) passed;", terminal_text(line)))
                         and int(match.group(1)) > 0 for line in lines)

          def fits(count, size, extra, terminal=False):
              return (count < MAX_RECORDS - (0 if terminal else 1)
                      and size + extra <= MAX_BYTES - (0 if terminal else RESERVE))

          try:
              # A previous terminal refusal is sticky for this owned evidence root.
              # Command loops still execute/capture raw results, but do not replay
              # more projection output after its bounded terminal record.
              if refusal_path.exists():
                  sys.exit(86)
              subject = json.loads((root / "subject.json").read_text(encoding="utf-8"))
              evidence = root / "console-evidence.jsonl"
              previous = evidence.read_bytes().splitlines(keepends=True) if evidence.exists() else []
              count = len(previous)
              size = sum(len(row) + len(PREFIX) for row in previous)
              ledger_ready = True

              def emit(record, terminal=False):
                  global count, size
                  record = {
                      "subject_commit": subject["subject_commit"],
                      "subject_tree": subject["subject_tree"],
                      "run_id": subject["run_id"], "run_attempt": subject["run_attempt"],
                      "check_name": check_name, "projection_state": "partial",
                      "instrument_control": check_name.startswith("control-")
                          or check_name in {"--controls", "--wrapper-controls"},
                      **record,
                  }
                  text = encoded(record)
                  data = (text + "\n").encode("ascii")
                  extra = len(PREFIX) + len(data)
                  if not fits(count, size, extra, terminal):
                      raise RuntimeError("projection_budget_exceeded")
                  with evidence.open("ab") as stream:
                      stream.write(data)
                  # Reserve the emission before stdout/flush can fail.
                  count += 1
                  size += extra
                  print(PREFIX + text, flush=True)

              if check_name == "--controls":
                  canary = {"legacy": "##[error]fixture", "modern": "::error::fixture"}
                  assert json.loads(encoded(canary)) == canary
                  assert "##[" not in encoded(canary) and "::" not in encoded(canary)
                  colored = "\x1b[1m\x1b[32m     Running\x1b[0m tests/example.rs (target/debug/example)"
                  assert harness(colored)
                  assert not harness("   Compiling mahayana_host_runtime v0.1.0")
                  assert positive_summary(["test result: ok. 1 passed; 0 failed;"])
                  assert not positive_summary(["test result: ok. 0 passed; 0 failed;"])
                  assert not positive_summary(["test result: FAILED. 1 passed; 1 failed;"])
                  assert requires_test_summary("cargo test --locked --test example ")
                  assert not requires_test_summary("cargo test --locked --lib --no-run ")
                  assert not requires_test_summary("cargo tree --locked --invert serde_json ")
                  assert not fits(MAX_RECORDS - 1, 0, 1)
                  assert not fits(0, MAX_BYTES - RESERVE, 1)
                  assert fits(0, 0, 1)
                  emit({"kind": "instrument-controls", "product_tests": False,
                        "controls": ["marker-round-trip", "colored-target", "compiler-noise",
                                     "positive-summary", "zero-test-refusal", "failed-summary-refusal",
                                     "test-command", "no-run-exemption", "feature-graph-exemption",
                                     "record-budget-refusal", "byte-budget-refusal", "budget-positive"],
                        "canary": canary, "colored_target": colored})
              elif check_name == "--wrapper-controls":
                  controls = json.loads((root / "wrapper-controls.json").read_text(encoding="utf-8"))
                  emit({"kind": "instrument-controls", "product_tests": False, **controls})
              else:
                  if not re.fullmatch(r"[A-Za-z0-9_-]+", check_name):
                      raise RuntimeError("invalid_check_name")
                  status = int(sys.argv[2])
                  command_file = check_name + ".command.txt"
                  log_file = check_name + ".log"
                  command = (root / command_file).read_text(encoding="utf-8").strip()
                  raw = (root / log_file).read_bytes()
                  lines = raw.decode("utf-8").splitlines()
                  exits = (root / "command-exit-codes.tsv").read_text(encoding="utf-8").splitlines()
                  if not exits or exits[-1].split("\t") != [check_name, str(status)]:
                      raise RuntimeError("command_exit_binding_mismatch")
                  emit({"kind": "command", "command": command, "command_file": command_file,
                        "exit_file": "command-exit-codes.tsv", "exit_line": len(exits),
                        "command_exit": status, "raw_file": log_file, "raw_bytes": len(raw),
                        "raw_lines": len(lines), "raw_sha256": hashlib.sha256(raw).hexdigest()})
                  selected = {index: "harness" for index, line in enumerate(lines) if harness(line)}
                  context = set()
                  if status != 0:
                      for index, line in enumerate(lines):
                          if re.search(r"(?:error(?:\[|:)|panicked at|assertion .*failed|fatal runtime error|has overflowed its stack)",
                                       terminal_text(line)):
                              context.update(range(max(0, index - 2), min(len(lines), index + 9)))
                      if not context:
                          context.update(range(max(0, len(lines) - 40), len(lines)))
                  optional = sorted(context.difference(selected))
                  context_omitted = max(0, len(optional) - 240)
                  for index in optional[:240]:
                      selected[index] = "failure-context"
                  if check_name == "feature-graph":
                      selected.update({index: "feature-graph" for index in range(len(lines))})
                  for index in sorted(selected):
                      emit({"kind": selected[index], "file": log_file, "line": index + 1,
                            "text": lines[index]})
                  if status == 0 and requires_test_summary(command) and not positive_summary(lines):
                      raise RuntimeError("missing_positive_test_summary")
                  emit({"kind": "projection-receipt", "command_projection_complete": True,
                        "product_verdict": None, "command_exit": status,
                        "context_omitted": context_omitted, "cumulative_records": count + 1,
                        "cumulative_bytes_before_receipt": size}, terminal=True)
          except Exception as error:
              identity = subject if isinstance(subject, dict) else {}
              failure = {"kind": "projection-failure", "check_name": check_name,
                         "subject_commit": identity.get("subject_commit"),
                         "run_id": os.environ.get("GITHUB_RUN_ID"),
                         "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                         "projection_state": "refused", "command_projection_complete": False,
                         "product_verdict": None, "error_type": type(error).__name__}
              if isinstance(error, RuntimeError):
                  failure["reason"] = str(error)
              try:
                  # Establish the terminal latch before any final console record.
                  # An unavailable latch/accounting path fails without unbounded output.
                  with refusal_path.open("x", encoding="utf-8") as stream:
                      stream.write(encoded(failure) + "\n")
                  if ledger_ready:
                      emit(failure, terminal=True)
              except Exception:
                  pass
              sys.exit(86)
          PY
