          import hashlib, json, os
          from pathlib import Path

          def command_evidence(label, command_rows, capture_rows):
              commands = [row for row in command_rows if row and row[0] == label]
              captures = [row for row in capture_rows if row and row[0] == label]
              return {"command_exit_records": commands, "capture_exit_records": captures,
                  "accepted": commands == [[label, "0"]] and captures == [[label, "0"]]}

          def read_command_evidence(root, label):
              def rows(name):
                  path = root / name
                  return [line.split("\t") for line in path.read_text().splitlines()] if path.is_file() else []
              return command_evidence(label, rows("command-exit-codes.tsv"), rows("capture-exit-codes.tsv"))

          if __name__ == "__main__":
              root = Path(os.environ["OCRM_RECOVERY_EVIDENCE_DIR"])
              subject = json.loads((root / "subject.json").read_text())
              label, other = "integration-contracts", "unrelated-command"
              zero = [[label, "0"]]
              cases = [
                  ("both-zero", zero, zero, True),
                  ("unrelated-failures-retain-scoped-zero", zero + [[other, "17"]], zero + [[other, "86"]], True),
                  ("command-missing", [], zero, False),
                  ("command-duplicate", zero + zero, zero, False),
                  ("command-nonzero", [[label, "101"]], zero, False),
                  ("command-malformed", [[label, "0", "extra"]], zero, False),
                  ("capture-missing", zero, [], False),
                  ("capture-duplicate", zero, zero + zero, False),
                  ("capture-nonzero", zero, [[label, "86"]], False),
                  ("capture-malformed", zero, [[label, "0", "extra"]], False),
                  ("capture-without-status", zero, [[label]], False),
                  ("wrong-command-label", [[other, "0"]], zero, False),
                  ("wrong-capture-label", zero, [[other, "0"]], False),
              ]
              controls = []
              for name, command_rows, capture_rows, expected in cases:
                  observed = command_evidence(label, command_rows, capture_rows)
                  controls.append({"case": name, "expected_acceptance": expected,
                      **observed, "control_passed": observed["accepted"] == expected})
              accepted = all(control["control_passed"] for control in controls)
              receipt = {key: subject[key] for key in (
                  "subject_commit", "subject_tree", "upstream", "run_id", "run_attempt", "runner_os", "inputs_sha256")}
              receipt.update({"contract": "OCRM-SCOPED-COMMAND-CAPTURE-v1", "controls": controls,
                  "helper_sha256": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
                  "result": "passed" if accepted else "failed", "product_verdict": None})
              (root / "command-capture-controls.json").write_text(json.dumps(receipt, indent=2) + "\n")
              print(json.dumps({"contract": receipt["contract"], "subject_commit": subject["subject_commit"],
                  "control_count": len(controls), "result": receipt["result"], "product_verdict": None}))
              raise SystemExit(0 if accepted else 1)
