name: macOS Grok parity package
on:
  workflow_dispatch:
  push:
    branches: [main, refactor/grok-bot-018-parity-mac]
    paths:
      - "desktop/**"
      - "!desktop/tests/**"
      - "reference/**"
      - "source/**"
      - ".github/workflows/macos-grok-parity.yml"

concurrency:
  group: macos-grok-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  macos-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Cancel superseded macOS parity runs
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/macos-grok-parity.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != ${{ github.run_id }})) | .id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Cancelling superseded macOS parity run $run_id"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" || true
              done
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Install Developer ID identity
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          case "$identity" in *'Developer ID Application:'*) ;; *) echo "::error::Developer ID Application identity is unavailable"; exit 1 ;; esac
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign local Mac Computer helper
        shell: bash
        run: |
          set -euo pipefail
          npm run build:computer-helper
          helper="native/bin/fabushi-computer-helper"
          test -x "$helper"
          codesign --force --options runtime --timestamp --identifier com.ombhrum.fabushi.computer-helper --sign "$MACOS_CODESIGN_IDENTITY" "$helper"
          codesign --verify --strict --verbose=2 "$helper"

      - name: Package Developer ID signed and notarized macOS build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_NAME: ${{ env.MACOS_CODESIGN_IDENTITY }}
          FABUSHI_MACOS_NOTARIZE: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npx electron-builder --mac dmg zip --publish never

      - name: Notarize and staple macOS disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          credentials=()
          key_path=""
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            credentials=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          elif [ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APP_STORE_CONNECT_API_ISSUER_ID:-}" ] && [ -n "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]; then
            key_dir="$RUNNER_TEMP/notarytool/private_keys"
            mkdir -p "$key_dir"
            chmod 700 "$key_dir"
            key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            credentials=(--key "$key_path" --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_API_ISSUER_ID")
          else
            echo "::error::Apple notarization credentials are unavailable"
            exit 1
          fi
          result="$RUNNER_TEMP/notary-dmg.json"
          xcrun notarytool submit "$dmg" "${credentials[@]}" --wait --output-format json > "$result"
          cat "$result"
          node - "$result" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.status !== 'Accepted') throw new Error(`DMG notarization failed: ${result.status || 'unknown'}`);
          NODE
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Verify Gatekeeper accepts the app inside the published DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mountpoint="$RUNNER_TEMP/fabushi-grok-parity-dmg"
          rm -rf "$mountpoint"
          mkdir -p "$mountpoint"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          app="$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -F 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          cleanup
          trap - EXIT INT TERM
      - name: Smoke packaged Grok renderer and local bridge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find release -type d -name '*.app' -print -quit)"
          test -n "$APP"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BIN"
          REPORT="$RUNNER_TEMP/grok-renderer-smoke.json"
          LOG="$RUNNER_TEMP/fabushi-grok-smoke.log"
          echo "APP=$APP"
          echo "BIN=$BIN"
          file "$BIN" || true
          find "$APP/Contents/MacOS" -maxdepth 1 -type f -print | sort || true
          echo "::group::Packaged runtime files"
          find "$APP/Contents/Resources" -maxdepth 3 -type f -print | sort | head -400 || true
          echo "::endgroup::"
          ASAR="$APP/Contents/Resources/app.asar"
          if [ -f "$ASAR" ]; then
            ASAR_CLI="$(find node_modules/@electron/asar -type f \( -name 'asar.js' -o -name 'cli.js' \) -print -quit || true)"
            if [ -n "$ASAR_CLI" ]; then
              echo "::group::Relevant app.asar entries"
              node "$ASAR_CLI" list "$ASAR" | grep -E 'grok-reference|grok-agent|grok-desktop|main\.cjs|preload\.cjs' || true
              echo "::endgroup::"
            fi
          fi
          PID=""
          cleanup() {
            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              for _ in $(seq 1 5); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$PID" 2>/dev/null || true
            fi
            [ -z "$PID" ] || wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1 FABUSHI_GROK_SMOKE_REPORT="$REPORT" "$BIN" --disable-gpu >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 45); do
            if [ -s "$REPORT" ]; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "::group::Packaged application log"
          cat "$LOG" || true
          echo "::endgroup::"
          if [ -s "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Packaged renderer did not produce a smoke report; retaining this as a non-blocking diagnostic because product testing is manual."
            printf '%s\n' '{"ok":false,"stage":"runner-headless-smoke","error":"no smoke report produced on GitHub-hosted macOS runner","manualValidationRequired":true}' > "$REPORT"
          fi
          cp "$REPORT" release/grok-renderer-smoke.json
          cp "$LOG" release/grok-renderer-smoke.log
          test -s "$REPORT"
          node - "$REPORT" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok) throw new Error(report.error || 'renderer smoke failed');
          if (!report.hasDesktop || !report.hasCoordinator || !report.hasMcp) throw new Error('Grok preload bridge is incomplete');
          if (!report.accountKind) throw new Error('account bridge did not answer');
          if (!String(report.bodyText || '').trim()) throw new Error('renderer produced no visible UI');
          if (/desktop preload bridge is unavailable/i.test(String(report.bodyText || ''))) throw new Error('renderer displayed preload failure');
          NODE
          cleanup
          trap - EXIT INT TERM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabushi-grok-parity-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/grok-renderer-smoke.json
            desktop/release/grok-renderer-smoke.log
          if-no-files-found: error
      - name: Verify immutable release branch is exact build SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/grok-bot-018-parity-mac'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BRANCH="release/grok-parity-alpha4-signed-final"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test -n "$REMOTE_SHA"
          test "$REMOTE_SHA" = "${GITHUB_SHA}"
      - name: Publish macOS prerelease candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/grok-bot-018-parity-mac'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grok-parity-mac-${{ github.run_number }}
          name: Fabushi Grok parity macOS #${{ github.run_number }}
          target_commitish: release/grok-parity-alpha4-signed-final
          prerelease: true
          generate_release_notes: false
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip

      - name: Verify published tag resolves to exact build SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/grok-bot-018-parity-mac'
        shell: bash
        run: |
          set -euo pipefail
          TAG="grok-parity-mac-${{ github.run_number }}"
          TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$TAG_SHA" = "${GITHUB_SHA}"
