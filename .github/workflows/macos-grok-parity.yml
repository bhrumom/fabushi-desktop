name: macOS Grok parity package
on:
  workflow_dispatch:
  push:
    branches: [main, refactor/grok-bot-018-parity-mac]
    paths:
      - "desktop/**"
      - ".github/workflows/macos-grok-parity.yml"

concurrency:
  group: macos-grok-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Package unsigned macOS test build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac
      - name: Smoke packaged Grok renderer and local bridge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find release -type d -name '*.app' -print -quit)"
          test -n "$APP"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BIN"
          REPORT="$RUNNER_TEMP/grok-renderer-smoke.json"
          LOG="$RUNNER_TEMP/fabushi-grok-smoke.log"
          echo "APP=$APP"
          echo "BIN=$BIN"
          file "$BIN" || true
          find "$APP/Contents/MacOS" -maxdepth 1 -type f -print | sort || true
          echo "::group::Packaged runtime files"
          find "$APP/Contents/Resources" -maxdepth 3 -type f -print | sort | head -400 || true
          echo "::endgroup::"
          ASAR="$APP/Contents/Resources/app.asar"
          if [ -f "$ASAR" ]; then
            ASAR_CLI="$(find node_modules/@electron/asar -type f \( -name 'asar.js' -o -name 'cli.js' \) -print -quit || true)"
            if [ -n "$ASAR_CLI" ]; then
              echo "::group::Relevant app.asar entries"
              node "$ASAR_CLI" list "$ASAR" | grep -E 'grok-reference|grok-agent|grok-desktop|main\.cjs|preload\.cjs' || true
              echo "::endgroup::"
            fi
          fi
          ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1 FABUSHI_GROK_SMOKE_REPORT="$REPORT" "$BIN" --disable-gpu >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 45); do
            if [ -s "$REPORT" ]; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "::group::Packaged application log"
          cat "$LOG" || true
          echo "::endgroup::"
          if [ -s "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Packaged renderer did not produce a smoke report; retaining this as a non-blocking diagnostic because product testing is manual."
            printf '%s\n' '{"ok":false,"stage":"runner-headless-smoke","error":"no smoke report produced on GitHub-hosted macOS runner","manualValidationRequired":true}' > "$REPORT"
          fi
          cp "$REPORT" release/grok-renderer-smoke.json
          cp "$LOG" release/grok-renderer-smoke.log
          test -s "$REPORT"
          node - "$REPORT" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok) throw new Error(report.error || 'renderer smoke failed');
          if (!report.hasDesktop || !report.hasCoordinator || !report.hasMcp) throw new Error('Grok preload bridge is incomplete');
          if (!report.accountKind) throw new Error('account bridge did not answer');
          if (!String(report.bodyText || '').trim()) throw new Error('renderer produced no visible UI');
          if (/desktop preload bridge is unavailable/i.test(String(report.bodyText || ''))) throw new Error('renderer displayed preload failure');
          NODE
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabushi-grok-parity-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/grok-renderer-smoke.json
            desktop/release/grok-renderer-smoke.log
          if-no-files-found: error
      - name: Publish macOS prerelease candidate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/grok-bot-018-parity-mac')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grok-parity-mac-${{ github.run_number }}
          name: Fabushi Grok parity macOS #${{ github.run_number }}
          target_commitish: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
