name: macOS Grok parity package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/macos-grok-parity.yml"

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Package unsigned macOS test build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: fabushi-grok-parity-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
      - name: Publish prerelease from canonical main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grok-parity-mac-${{ github.run_number }}
          name: Fabushi Grok parity macOS #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
