name: Round22 exact updater ledger and commit object preparation
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round22-ledger-object.yml
      - .github/round22-ledger-operations.json
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare reviewed append on exact live parent without changing any ref
        env:
          ROUND22_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, pathlib, re, subprocess, urllib.parse, urllib.request
          repository = 'bhrumom/fabushi-desktop'
          branch = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          ledger_path = 'projects/telegram-desktop-rust/parity-ledger.json'
          evidence_path = 'projects/telegram-desktop-rust/evidence/round22-windows-publisher-authority.json'
          workflow_path = '.github/workflows/round22-ledger-object.yml'
          operations_path = '.github/round22-ledger-operations.json'
          identity = 'TDRP-UPDATER-DISCOVERY-AUTHORITY-001'
          upstream = 'f985723b552b30fe1c17d377d57f44e61a15a8c4'
          source_objects = {'Telegram/SourceFiles/core/update_verify.cpp': '5d970cf882ec3870fa36d079ff94bd50eb703a37', 'Telegram/SourceFiles/_other/updater_win.cpp': 'bf935373b2577570c0268de1c151ba479206569d'}
          allowed_fields = {'additional_source_identities', 'test_execution_evidence', 'test_evidence'}
          raw_plan = pathlib.Path(operations_path).read_bytes()
          plan = json.loads(raw_plan)
          if plan['schema'] != 2 or plan['repository'] != repository or plan['path'] != ledger_path or plan['responsibility_id'] != identity or set(plan['append']) != allowed_fields:
              raise SystemExit('Unexpected immutable operation scope')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout differs from workflow source')
          def github(method, suffix, payload=None):
              if method != 'GET' and not (method == 'POST' and suffix in ('/git/blobs', '/git/trees', '/git/commits')):
                  raise SystemExit('Only reads and unpublished object creation are permitted')
              request = urllib.request.Request('https://api.github.com/repos/' + repository + suffix,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['ROUND22_OBJECT_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method=method)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          def blob_bytes(sha):
              if not re.fullmatch('[0-9a-f]{40}', sha):
                  raise SystemExit('Invalid Git blob identity')
              obj = github('GET', '/git/blobs/' + sha)
              if obj['sha'] != sha or obj['encoding'] != 'base64':
                  raise SystemExit('Unexpected immutable blob encoding')
              raw = base64.b64decode(obj['content'])
              if hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() != sha:
                  raise SystemExit('Blob bytes do not bind their Git identity')
              return raw
          def write_json(value):
              raw = (json.dumps(value, ensure_ascii=False, indent=2) + '\n').encode()
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              result = github('POST', '/git/blobs', {'content': raw.decode(), 'encoding': 'utf-8'})
              if result['sha'] != sha:
                  raise SystemExit('Created blob identity mismatch')
              return sha, raw
          evidence = json.loads(blob_bytes(plan['evidence_template_blob']))
          base = github('GET', '/git/ref/heads/' + branch)['object']['sha']
          base_commit = github('GET', '/git/commits/' + base)
          protected = {
              evidence_path: plan['expected_evidence_before_blob'],
              workflow_path: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + workflow_path], text=True).strip(),
              operations_path: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + operations_path], text=True).strip(),
          }
          for path, expected in protected.items():
              observed = github('GET', '/contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + base)
              if observed['sha'] != expected:
                  raise SystemExit('Concurrent protected file changed: ' + path)
          before_blob = github('GET', '/contents/' + ledger_path + '?ref=' + base)['sha']
          before = json.loads(blob_bytes(before_blob))
          if before['upstream_commit'] != upstream:
              raise SystemExit('Frozen upstream identity changed')
          if before['coverage'] != {'source_entries_total': 16381, 'unknown': None, 'unread': None, 'omitted': 0, 'responsibilities_total': 184, 'unmapped_responsibilities': 2} or len(before['rows']) != 184 or before['rebaseline_candidate']['status'] != 'unaccepted-inventory-open' or before['rebaseline_candidate']['upstream_commit'] != upstream:
              raise SystemExit('Canonical accounting or acceptance changed; manual review required')
          after = copy.deepcopy(before)
          rows = [r for r in after['rows'] if r.get('responsibility_id') == identity]
          if len(rows) != 1 or rows[0]['target_commit'] != plan['required_updater_target']:
              raise SystemExit('Concurrent updater authority changed; manual reconciliation required')
          row = rows[0]
          for field, additions in plan['append'].items():
              if not isinstance(row[field], list):
                  raise SystemExit('Expected append-only row array')
              for value in additions:
                  if value not in row[field]:
                      row[field].append(value)
          if plan['note'] not in row['notes']:
              row['notes'] += '\n' + plan['note']
          reviews = plan['source_reviews']
          if len(reviews) != 2 or {r['path']: r['object'] for r in reviews} != source_objects:
              raise SystemExit('Only two reviewed updater source identities are allowed')
          existing = after['source_reviews']
          for review in reviews:
              if review['repository'] != 'telegramdesktop/tdesktop' or review['commit'] != upstream or review['category'] != 'product' or review['risk'] != 'high' or review['review_depth'] != 'deep' or review['status'] != 'pending' or review['responsibility_ids'] != [identity]:
                  raise SystemExit('Source record exceeds pending review scope')
              key = tuple(review[k] for k in ('repository', 'commit', 'path', 'object'))
              prior = [r for r in existing if tuple(r[k] for k in ('repository', 'commit', 'path', 'object')) == key]
              if prior and (len(prior) != 1 or prior[0] != review):
                  raise SystemExit('Concurrent source review conflict')
              if not prior:
                  existing.append(review)
          if len(existing) != len(before['source_reviews']) + 2:
              raise SystemExit('Both pending updater reviews must be new; reconcile already-applied work manually')
          before_counts = {s: sum(r['status'] == s for r in before['source_reviews']) for s in ('complete', 'pending')}
          after_counts = {s: sum(r['status'] == s for r in existing) for s in ('complete', 'pending')}
          if sum(before_counts.values()) != len(before['source_reviews']) or sum(after_counts.values()) != len(existing):
              raise SystemExit('Unexpected source review state requires manual reconciliation')
          after['rebaseline_candidate']['source_responsibility_rows'] = str(len(after['rows'])) + ' current canonical responsibility rows; exact source tuples are checked against the fixed-U ' + format(after['coverage']['source_entries_total'], ',') + '-identity Git inventory. Source review records: ' + str(len(existing)) + ' total, ' + str(after_counts['complete']) + ' complete and ' + str(after_counts['pending']) + ' pending. This batch adds two pending updater selected-section reviews while preserving all prior records; global review counts remain undetermined and acceptance is false.'
          restored = copy.deepcopy(after)
          restored['rebaseline_candidate']['source_responsibility_rows'] = before['rebaseline_candidate']['source_responsibility_rows']
          original = next(r for r in before['rows'] if r.get('responsibility_id') == identity)
          restored_row = next(r for r in restored['rows'] if r.get('responsibility_id') == identity)
          for field in allowed_fields | {'notes'}:
              restored_row[field] = copy.deepcopy(original[field])
          restored['source_reviews'] = copy.deepcopy(before['source_reviews'])
          if restored != before:
              raise SystemExit('Undeclared row, contract, coverage or acceptance change')
          ledger_blob, ledger_bytes = write_json(after)
          evidence['source_review']['canonical_ledger_blob'] = ledger_blob
          sr = evidence['interruption_recovery']['source_reviews']
          sr['canonical_ledger_blob'] = ledger_blob
          sr['canonical_counts'] = {'records_before': len(before['source_reviews']), 'records_after': len(existing), 'complete_before': before_counts['complete'], 'complete_after': after_counts['complete'], 'pending_before': before_counts['pending'], 'pending_after': after_counts['pending'], 'global_review_counts_unknown': True}
          integration = evidence['resumption_ledger_integration']
          integration['reviewed_input'] = {'head_sha': base, 'git_blob': before_blob}
          integration['reviewed_output'] = {'git_blob': ledger_blob, 'bytes': len(ledger_bytes), 'sha256': hashlib.sha256(ledger_bytes).hexdigest()}
          integration['scope']['unchanged_other_responsibilities'] = len(before['rows']) - 1
          integration['scope']['preserved_prior_review_count'] = len(before['source_reviews'])
          integration['scope']['source_review_count_after'] = len(existing)
          integration['scope']['preserved_unmapped_responsibilities'] = before['coverage']['unmapped_responsibilities']
          evidence['canonical_accounting']['unmapped_responsibilities'] = before['coverage']['unmapped_responsibilities']
          evidence_blob, evidence_bytes = write_json(evidence)
          entries = [
              {'path': ledger_path, 'mode': '100644', 'type': 'blob', 'sha': ledger_blob},
              {'path': evidence_path, 'mode': '100644', 'type': 'blob', 'sha': evidence_blob},
              {'path': workflow_path, 'mode': '100644', 'type': 'blob', 'sha': None},
              {'path': operations_path, 'mode': '100644', 'type': 'blob', 'sha': None},
          ]
          tree = github('POST', '/git/trees', {'base_tree': base_commit['tree']['sha'], 'tree': entries})
          commit = github('POST', '/git/commits', {'message': 'docs(tdrp): preserve exact round22 updater execution and pending source evidence', 'tree': tree['sha'], 'parents': [base]})
          if commit['tree']['sha'] != tree['sha'] or [p['sha'] for p in commit['parents']] != [base]:
              raise SystemExit('Prepared commit parent/tree mismatch')
          receipt = {'workflow_source_sha': source, 'expected_parent': base, 'tree': tree['sha'], 'commit': commit['sha'], 'ledger_input_blob': before_blob, 'ledger_output_blob': ledger_blob, 'evidence_blob': evidence_blob, 'evidence_template_blob': plan['evidence_template_blob'], 'operations_sha256': hashlib.sha256(raw_plan).hexdigest(), 'source_reviews_before': len(before['source_reviews']), 'source_reviews_after': len(existing), 'changed_paths': [e['path'] for e in entries], 'refs_written': False, 'commit_objects_created': True, 'product_validation': False, 'acceptance_changed': False}
          pathlib.Path('round22-prepared-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('ROUND22_PREPARED_COMMIT ' + json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round22-ledger-object-${{ github.sha }}-${{ github.run_attempt }}
          path: round22-prepared-receipt.json
          if-no-files-found: error
