name: TDRP Revision 9 source authority

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-authority:
    name: Source authority / recursive inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Validate Revision 9 source authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-tdrp-revision9-authority.mjs
      - name: Assert source closure remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./projects/telegram-desktop-rust/upstream.lock.json');
          if (lock.upstream.accepted === true) {
            const evidence = lock.baseline_identity_evidence;
            if (evidence == null || !Number.isInteger(evidence.run_id) || typeof evidence.validation_head_sha !== 'string' || typeof evidence.artifact_digest !== 'string') {
              throw new Error('accepted baseline identity requires explicit GitHub Actions provenance');
            }
          }
          if (lock.acceptance.accepted !== false || lock.acceptance.baseline_ready !== false) throw new Error('source closure must remain false until zero-counter closure');
          if (!(lock.coverage.unknown_minimum > 0 && lock.coverage.unread_minimum > 0)) throw new Error('source closure must not fabricate semantic coverage');
          NODE
      - name: Discover build-time acquisition candidates at exact upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(node -p "require('./projects/telegram-desktop-rust/upstream.lock.json').upstream.commit")"
          work="$RUNNER_TEMP/tdesktop-acquisition-scan"
          git clone --filter=blob:none --no-checkout https://github.com/telegramdesktop/tdesktop.git "$work"
          git -C "$work" checkout --detach "$upstream_sha"
          test "$(git -C "$work" rev-parse HEAD)" = "$upstream_sha"
          mkdir -p artifacts/tdrp-authority
          (
            cd "$work"
            grep -RInE --exclude-dir=.git --exclude='*.patch' --exclude='*.diff' \
              '(git[[:space:]]+(clone|fetch|submodule)|curl[[:space:]]|wget[[:space:]]|(^|[;&|[:space:]])(iwr|Invoke-WebRequest)[[:space:]]|git\+https?://|^[[:space:]]*source[[:space:]]*:|source-(url|commit|tag|branch):|GIT_REPOSITORY|GIT_TAG|URL[[:space:]]+https?://|python(3(\.[0-9]+)*)?[[:space:]]+-m[[:space:]]+pip[[:space:]]+install|pip(3)?[[:space:]]+install|pacman[[:space:]]+-S|apt(-get)?[[:space:]]+(install|update)|dnf[[:space:]][^#]*install|brew[[:space:]]+install|cargo[[:space:]]+install|uses:[[:space:]]|^[[:space:]]*FROM[[:space:]]|https://github\.com/.+\.git|https://gitlab\.com/.+\.git)' \
              Telegram/build Telegram/cmake cmake snap tools .github 2>/dev/null || true
          ) | LC_ALL=C sort -u > "$GITHUB_WORKSPACE/artifacts/tdrp-authority/build-time-acquisition-candidates.txt"
          test -s artifacts/tdrp-authority/build-time-acquisition-candidates.txt
          actual_count="$(wc -l < artifacts/tdrp-authority/build-time-acquisition-candidates.txt | tr -d '[:space:]')"
          expected_count="$(node -p "require('./projects/telegram-desktop-rust/inventory/build-time-acquisitions.json').discovery.candidate_lines_total")"
          if [ "$actual_count" != "$expected_count" ]; then
            echo "::error::build-time acquisition candidate drift: discovered $actual_count, inventory expects $expected_count"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const inventory = require('./projects/telegram-desktop-rust/inventory/build-time-acquisitions.json');
          const discovered = fs.readFileSync('artifacts/tdrp-authority/build-time-acquisition-candidates.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          const liveKeys = new Set(discovered.map(line => {
            const match = line.match(/^(.*):(\d+):/);
            if (!match) throw new Error('unparseable acquisition discovery line: ' + line);
            return match[1] + ':' + match[2];
          }));
          const hasLiveKey = (key) => liveKeys.has(key);
          const classified = new Set();
          for (const item of inventory.immutable_commit_pin_occurrences || []) {
            const key = item.source_path + ':' + item.source_line;
            if (!hasLiveKey(key)) throw new Error('immutable acquisition missing from live discovery: ' + key);
            if (classified.has(key)) throw new Error('duplicate classified acquisition: ' + key);
            classified.add(key);
          }
          for (const group of inventory.candidate_disposition_groups || []) {
            for (const line of group.source_lines || []) {
              const key = group.source_path + ':' + line;
              if (!hasLiveKey(key)) throw new Error('dispositioned acquisition missing from live discovery: ' + key);
              if (classified.has(key)) throw new Error('duplicate classified acquisition: ' + key);
              classified.add(key);
            }
          }
          if (classified.size !== inventory.discovery.candidate_lines_classified) throw new Error('classified acquisition count disagrees with explicit live keys');
          if (discovered.length - classified.size !== inventory.discovery.candidate_lines_pending_classification) throw new Error('pending acquisition count disagrees with live discovery');
          NODE

      - name: Discover external recursive child authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/discover-tdrp-external-child-authority.mjs

      - name: Upload source-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: tdrp-revision9-authority-${{ github.sha }}
          path: artifacts/tdrp-authority
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  accepted-gate-contract:
    name: Accepted gate is executable and fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify full source-closure mode rejects current open baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if node scripts/validate-tdrp-revision9-authority.mjs --require-accepted > accepted.log 2>&1; then
            cat accepted.log
            echo "full source-closure gate unexpectedly passed before P0 closure" >&2
            exit 1
          fi
          grep -E 'accepted mode requires|G-INVENTORY' accepted.log
          echo "Fail-closed source-closure gate correctly rejected the unclosed baseline."
