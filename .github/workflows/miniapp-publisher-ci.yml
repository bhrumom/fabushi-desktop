name: First-party Mini App publisher
on:
  pull_request:
    paths:
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - 'source/electron-main/mcp/miniapp-publisher*'
      - 'source/electron-main/adapters/mcp-oauth.ts'
      - 'frontend/src/recovered/features/plugins/overlay/miniapp-publisher.tsx'
      - '.github/workflows/miniapp-publisher-ci.yml'
  push:
    branches: [main]
    paths:
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - 'source/electron-main/mcp/miniapp-publisher*'
      - 'source/electron-main/adapters/mcp-oauth.ts'
permissions:
  contents: read
  actions: read
jobs:
  publisher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exact signed fixture, not catalog approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir signed-fixture
          gh release download v0.2.1 -R bhrumom/global-dandelion-rs \
            --pattern global-dandelion-0.2.1.fabapp --dir signed-fixture
          echo 'afc45ad273e4965fc272a89e775291444c683513ecbc3fa31769858431e8a6b6  signed-fixture/global-dandelion-0.2.1.fabapp' | sha256sum -c -
      - name: Native trusted publisher boundaries
        env:
          FABUSHI_SIGNED_DANDELION_FIXTURE: ${{ github.workspace }}/signed-fixture/global-dandelion-0.2.1.fabapp
        run: npx --yes tsx@4.21.0 --test source/electron-main/mcp/miniapp-publisher.contract.test.ts
