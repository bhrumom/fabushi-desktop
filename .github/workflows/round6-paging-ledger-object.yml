name: Round6 temporary Human pagination ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths: ['.github/workflows/round6-paging-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Append only the reviewed existing Human owner fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          path = "projects/telegram-desktop-rust/parity-ledger.json"
          expected = "59d18f5de12fe6c4fe72bb110996c0cb0e07e9f4"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
          assert actual == expected, "reread concurrent ledger; never replace it with a stale object"
          before = json.loads(pathlib.Path(path).read_text())
          assert before["upstream_commit"] == "f985723b552b30fe1c17d377d57f44e61a15a8c4"
          changes = json.loads(r'''{"requirement_ids":["NMR-PAGING-01","NMR-PAGING-01a","NMR-PAGING-01b","NMR-PAGING-01c","NMR-ACTIVITY-01","NMR-AC-PAGING-01"],"release_gate_ids":["NMR-AC-PAGING-01"],"fabushi_target_paths":["source/host/src/extensions/session/agent_db_transcript_pages.rs","frontend/src/recovered/features/conversation/workspace/pagination.ts","frontend/src/production/transcript-projection.ts","source/shared/rpc/coordinator.ts"],"production_evidence":["authored-not-run: resumed-round6 NMR-PAGING-01 extends existing SandAgentDb Human-only reads with deterministic canonical ordering and bounded persistent physical-row traversal indices; no new message store; Gateway/Coordinator/Renderer/cache propagate the opaque continuation. Exact containing-H Actions required.","authored-not-run: resumed-round6 NMR-ACTIVITY-01 reconciles finite lastActivityAt by max after durable rows and replay, and joins Agent handoff to the existing per-conversation lane. Preserve later full credential fencing, concurrent send settlement, forwarding journal CAS and read-receipt instant semantics."],"test_evidence":["authored-not-run: source/host/tests/session_gateway_contract.rs; stable same-time/backfill/restart/corrupt-index/eviction traversal, real Native settlement moving the page anchor, and blocked history plus Agent handoff/activity recovery. All existing Human/forwarding/Agent/credential gates retained; exact containing-H run/log counts remain required.","authored-not-run: source/shared/rpc/coordinator.contract.test.ts and frontend/src/recovered/features/recovered-conversation-infra.contract.test.ts; opaque Human request/reply/cache/retry scope and existing Agent compatibility; existing renderer/projection/Chromium/Electron/shipping suites retained."],"notes":"Resumed task20bf9475 round6: interruption left the older21-file candidate unpublished. Remote had advanced through1b0116fe; preserve every later message, credential, forwarding, source-review and shipping change rather than replacing current owners. Only the remaining persistent Human traversal and monotonic activity/recovery changes are integrated. Physical-row snapshots live in existing conversation KV, bound to participant identity, limited to16 and reject corrupt/missing/reused anchors; current Human production has no transcript delete/clear entry, which must invalidate walks before any future exposure. Existing metadata, credentials, forward journals, schema, six source reviews, historical exact execution fields and acceptance states stay intact. This append records authored implementation intent, not new-H execution or source/product acceptance. Actual containing-H results must be read from GitHub Actions and the task receipt. Real Worker provenance/authenticated afterId=0, old-message changefeed, complete source/legal/recursive acquisition, signed platforms, complete Bot/UI/a11y/temporal/performance/soak and independent ACCEPT remain open."}''')
          after = copy.deepcopy(before)
          original = next(row for row in before["rows"] if row["responsibility_id"] == "FBCP-NMR-001")
          row = next(row for row in after["rows"] if row["responsibility_id"] == "FBCP-NMR-001")
          for key, additions in changes.items():
              if key == "notes":
                  assert additions not in row[key]
                  row[key] += "\n" + additions
              else:
                  assert key in {"requirement_ids", "release_gate_ids", "fabushi_target_paths", "production_evidence", "test_evidence"}
                  assert isinstance(row[key], list)
                  for value in additions:
                      if value not in row[key]:
                          row[key].append(value)
          restored = copy.deepcopy(after)
          restored_row = next(row for row in restored["rows"] if row["responsibility_id"] == "FBCP-NMR-001")
          for key in changes:
              restored_row[key] = copy.deepcopy(original[key])
          assert restored == before
          assert after.get("source_reviews") == before.get("source_reviews")
          assert after["coverage"] == before["coverage"]
          payload = (json.dumps(after, ensure_ascii=False, indent=2) + "\n").encode()
          expected_new = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs",
              data=json.dumps({"content": payload.decode(), "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["sha"] == expected_new
          print(json.dumps({"preparation_head": head, "base_blob": expected,
                            "prepared_blob": result["sha"], "bytes": len(payload),
                            "changed_existing_rows": ["FBCP-NMR-001"],
                            "source_reviews_preserved": True, "acceptance_changed": False,
                            "refs_written": False}, sort_keys=True))
          PY
