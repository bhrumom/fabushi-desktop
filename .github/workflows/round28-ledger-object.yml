name: Round28 scoped ledger object
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round28-ledger-object.yml
      - .github/round28-ledger-ops.json
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare one append-only ledger blob without commits or ref writes
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, urllib.request
          repository = "bhrumom/fabushi-desktop"
          path = "projects/telegram-desktop-rust/parity-ledger.json"
          ops_bytes = pathlib.Path(".github/round28-ledger-ops.json").read_bytes()
          ops = json.loads(ops_bytes)
          assert ops["repository"] == repository and ops["path"] == path
          assert ops["responsibility_id"] == "FBCP-NMR-001"
          allowed = {"requirement_ids", "integration_case_ids", "fault_recovery_case_ids",
                     "unit_case_ids", "test_evidence", "test_execution_evidence", "production_evidence"}
          assert set(ops["append"]) <= allowed
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          raw = pathlib.Path(path).read_bytes()
          identity = lambda value: hashlib.sha1(b"blob " + str(len(value)).encode() + b"\0" + value).hexdigest()
          before_blob = identity(raw)
          assert before_blob == subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
          before = json.loads(raw)
          assert before["upstream_commit"] == "f985723b552b30fe1c17d377d57f44e61a15a8c4"
          after = copy.deepcopy(before)
          matches = [row for row in after["rows"] if row["responsibility_id"] == ops["responsibility_id"]]
          assert len(matches) == 1
          row = matches[0]
          for key, values in ops["append"].items():
              assert isinstance(row[key], list) and isinstance(values, list)
              assert all(isinstance(value, str) for value in values)
              for value in values:
                  if value not in row[key]:
                      row[key].append(value)
          assert isinstance(row["notes"], str) and isinstance(ops["note"], str)
          if ops["note"] not in row["notes"]:
              row["notes"] += "\n" + ops["note"]
          restored = copy.deepcopy(after)
          old_row = next(row for row in before["rows"] if row["responsibility_id"] == ops["responsibility_id"])
          restored_row = next(row for row in restored["rows"] if row["responsibility_id"] == ops["responsibility_id"])
          for key in list(ops["append"]) + ["notes"]:
              restored_row[key] = copy.deepcopy(old_row[key])
          assert restored == before, "Only declared existing-row appends may differ"
          assert after.get("source_reviews") == before.get("source_reviews")
          assert after["coverage"] == before["coverage"]
          output = (json.dumps(after, ensure_ascii=False, indent=2) + "\n").encode()
          output_blob = identity(output)
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repository + "/git/blobs",
              data=json.dumps({"content": output.decode(), "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["TRANSFER_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"}, method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result["sha"] == output_blob
          receipt = {"head": head, "input_blob": before_blob, "output_blob": output_blob,
                     "bytes": len(output), "operations_sha256": hashlib.sha256(ops_bytes).hexdigest(),
                     "changed_existing_rows": [ops["responsibility_id"]],
                     "source_reviews_preserved": True, "acceptance_changed": False,
                     "refs_written": False, "product_validation": False}
          pathlib.Path("round28-ledger-object-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("ROUND28_LEDGER_OBJECT " + json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round28-ledger-object-${{ github.sha }}
          path: round28-ledger-object-receipt.json
          if-no-files-found: error
