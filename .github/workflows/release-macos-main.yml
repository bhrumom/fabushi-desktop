name: Package macOS installer from exact source

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to package. Empty means main.
        required: false
        type: string
      publish_release:
        description: Publish the signed artifact as a GitHub prerelease only after packaged acceptance passes.
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'native/**'
      - 'source/mahayana/**'
      - '.github/workflows/release-macos-main.yml'

permissions:
  contents: write

concurrency:
  group: package-macos-${{ github.event_name == 'push' && github.sha || inputs.source_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, notarize, and publish macOS arm64
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SUPPORT_REPO: bhrumom/fabushi
      SUPPORT_SHA: 5d75920308fa17f5000308df1a0153309eb8e9ab
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          requested="${{ inputs.source_sha }}"
          if [ -n "$requested" ]; then
            test "$sha" = "$requested"
          elif [ "${{ github.event_name }}" = "push" ]; then
            test "$sha" = "${{ github.sha }}"
            test "${{ github.ref }}" = "refs/heads/main"
          else
            test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          fi
          version="$(node -p "require('./desktop/package.json').version")"
          short="${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=macos-main-v${version}-${short}" >> "$GITHUB_OUTPUT"
          {
            echo "## macOS exact-source package"
            echo "- Source: \`$sha\`"
            echo "- Publish release: \`${{ inputs.publish_release }}\`"
            echo "- Version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require Apple signing secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          if { [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; } &&              { [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; }; then
            echo "::error::Apple notarization credentials are not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require complete Grok architecture cutover
        shell: bash
        run: node scripts/check-grok-architecture.mjs --strict

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Install desktop dependencies
        shell: bash
        run: npm --prefix desktop ci --prefer-offline --no-audit --no-fund

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/mahayana/mahayana-rs -> target
          shared-key: fabushi-desktop-macos-release-rust-1.97.1

      - name: Install Developer ID identity
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          case "$identity" in *'Developer ID Application:'*) ;; *) echo "::error::Developer ID Application identity was not found."; exit 1 ;; esac
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          probe="$RUNNER_TEMP/fabushi-team-probe"
          cp /usr/bin/true "$probe"
          codesign --force --options runtime --timestamp --sign "$identity" "$probe"
          team_id="$(codesign -dv --verbose=4 "$probe" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test -n "$team_id"
          echo "APPLE_TEAM_ID_RESOLVED=$team_id" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Build and stage Mahayana desktop host
        working-directory: desktop
        shell: bash
        run: npm run build:host

      - name: Build pinned offline ASR engine
        shell: bash
        run: |
          set -euo pipefail
          manifest="desktop/electron/offline-asr-engine.json"
          repo="$(node -p "require('./' + process.argv[1]).whisperCpp.repository" "$manifest")"
          commit="$(node -p "require('./' + process.argv[1]).whisperCpp.commit" "$manifest")"
          src="$RUNNER_TEMP/whisper-cpp"
          build="$RUNNER_TEMP/whisper-build"
          rm -rf "$src" "$build"
          git clone --filter=blob:none --no-checkout "$repo" "$src"
          git -C "$src" checkout --detach "$commit"
          cmake -S "$src" -B "$build"             -DWHISPER_BUILD_TESTS=OFF             -DWHISPER_BUILD_EXAMPLES=ON             -DWHISPER_BUILD_SERVER=OFF             -DBUILD_SHARED_LIBS=OFF             -DGGML_NATIVE=OFF
          cmake --build "$build" --config Release --parallel 2
          binary="$(find "$build" -type f -name whisper-cli -perm -111 -print -quit)"
          test -n "$binary"
          out="desktop/resources/asr/darwin-arm64"
          rm -rf "$out"
          mkdir -p "$out"
          cp "$binary" "$out/whisper-cli"
          chmod 755 "$out/whisper-cli"
          cp "$src/LICENSE" "$out/LICENSE.whisper.cpp"
          printf '{"repository":"%s","commit":"%s","platform":"darwin","arch":"arm64"}\n' "$repo" "$commit" > "$out/build.json"

      - name: Stage bundled Computer Use runtime
        shell: bash
        env:
          CHATGPT_COMPUTER_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
          CHATGPT_COMPUTER_TEAM_ID: ${{ env.APPLE_TEAM_ID_RESOLVED }}
        run: |
          set -euo pipefail
          support="$RUNNER_TEMP/fabushi-support"
          git clone --filter=blob:none --no-checkout "https://github.com/$SUPPORT_REPO.git" "$support"
          git -C "$support" sparse-checkout init --cone
          git -C "$support" sparse-checkout set chatgpt-vps-control
          git -C "$support" checkout "$SUPPORT_SHA"
          npm --prefix "$support/chatgpt-vps-control" ci --ignore-scripts --prefer-offline --no-audit --no-fund
          mkdir -p "$support/desktop/resources"
          export CHATGPT_COMPUTER_HOME="$support/desktop/resources/computer-control"
          node "$support/chatgpt-vps-control/bin/prepare-fabushi-bundle.js"
          rm -rf desktop/resources/computer-control
          mkdir -p desktop/resources/computer-control
          rsync -a "$support/desktop/resources/computer-control/" desktop/resources/computer-control/
          test -f desktop/resources/computer-control/active-runtime.json

      - name: Build Electron renderer
        working-directory: desktop
        shell: bash
        run: npm run build:renderer

      - name: Enforce built desktop bundle boundary
        working-directory: desktop
        shell: bash
        run: node scripts/check-desktop-bundle.mjs

      - name: Package signed and notarized macOS installer
        working-directory: desktop
        shell: bash
        env:
          FABUSHI_MACOS_SIGNED: '1'
          FABUSHI_MACOS_NOTARIZE: '1'
          MACOS_CODESIGN_IDENTITY: ${{ env.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID_RESOLVED }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npx electron-builder --mac --arm64 --publish never

      - name: Notarize and staple DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID_RESOLVED }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          app="$(find desktop/release -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$dmg"
          test -n "$app"
          args=()
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            args=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          else
            key_dir="$RUNNER_TEMP/private_keys"
            mkdir -p "$key_dir"
            key="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key"
            chmod 600 "$key"
            args=(--key "$key" --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_API_ISSUER_ID")
          fi
          xcrun notarytool submit "$dmg" "${args[@]}" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='Accepted') { console.error(r); process.exit(1) }" "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify desktop updater metadata
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          metadata="desktop/release/latest-mac.yml"
          test -s "$metadata"
          grep -F "fabushi-${VERSION}-macos-arm64.zip" "$metadata"
          find desktop/release -maxdepth 1 -type f -name '*.blockmap' -size +0c -print -quit | grep -q .

      - name: Bind packaged candidate executable
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/release -maxdepth 4 -type d -name '*.app' -print -quit)"
          test -n "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          echo "Candidate executable: $executable" >> "$GITHUB_STEP_SUMMARY"

      - name: Provision bounded production CI account session
        shell: bash
        env:
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
          FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
          DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-macos-app
        run: |
          set -euo pipefail
          test -n "$FABUSHI_CI_TEST_USERNAME"
          test -n "$FABUSHI_CI_TEST_PASSWORD"
          support="$RUNNER_TEMP/fabushi-support"
          test -f "$support/chatgpt-vps-control/scripts/login-ci-test-account.mjs"
          test -f "$support/chatgpt-vps-control/scripts/export-ci-app-account-session.mjs"
          account_dir="$RUNNER_TEMP/fabushi-candidate-account"
          app_session_dir="$RUNNER_TEMP/fabushi-candidate-app-session"
          mkdir -p "$account_dir" "$app_session_dir"
          chmod 700 "$account_dir" "$app_session_dir"
          export FABUSHI_ACCOUNT_SESSION_FILE="$account_dir/session.json"
          export FABUSHI_CI_ACCOUNT_SESSION_FILE="$app_session_dir/session.json"
          node "$support/chatgpt-vps-control/scripts/login-ci-test-account.mjs"
          node "$support/chatgpt-vps-control/scripts/export-ci-app-account-session.mjs"
          chmod 600 "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          jq -e '.provider == "github-actions" and .ciRunner == true and (.refreshToken | not)' "$FABUSHI_CI_ACCOUNT_SESSION_FILE" >/dev/null
          rm -f "$FABUSHI_ACCOUNT_SESSION_FILE"
          {
            echo "DEVICE_ID=$DEVICE_ID"
            echo "FABUSHI_CI_ACCOUNT_SESSION_FILE=$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          } >> "$GITHUB_ENV"
          echo "Bounded refresh-token-free production account session prepared for signed candidate acceptance." >> "$GITHUB_STEP_SUMMARY"

      - name: Run real signed packaged acceptance
        working-directory: desktop
        shell: bash
        timeout-minutes: 15
        env:
          OBF_REAL_ACCEPTANCE: '1'
          OBF_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OBF_EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OBF_EVIDENCE_DIR: ${{ runner.temp }}/fabushi-candidate-acceptance
          FABUSHI_ELECTRON_EXECUTABLE: ${{ github.workspace }}/${{ steps.candidate.outputs.executable }}
          FABUSHI_FEATURE_HOST_MODE: production
          FABUSHI_E2E: '0'
        run: |
          set -euo pipefail
          rm -rf "$OBF_EVIDENCE_DIR"
          mkdir -p "$OBF_EVIDENCE_DIR"
          recorder="$GITHUB_WORKSPACE/desktop/scripts/macos-session-recorder.sh"
          test -f "$recorder"
          test -s "$GITHUB_WORKSPACE/desktop/scripts/macos-session-video.swift"
          bash "$recorder" start "$OBF_EVIDENCE_DIR"
          bash "$recorder" assert-live "$OBF_EVIDENCE_DIR"
          test_status=0
          npx playwright test e2e/openbot-packaged-acceptance.spec.ts --workers=1 || test_status=$?
          stop_status=0
          bash "$recorder" stop "$OBF_EVIDENCE_DIR" || stop_status=$?
          verify_status=0
          bash "$recorder" verify "$OBF_EVIDENCE_DIR" || verify_status=$?
          test "$test_status" -eq 0
          test "$stop_status" -eq 0
          test "$verify_status" -eq 0
          test -s "$OBF_EVIDENCE_DIR/trace.zip"
          test -s "$OBF_EVIDENCE_DIR/runtime.log"
          test -s "$OBF_EVIDENCE_DIR/lifecycle.json"
          test -s "$OBF_EVIDENCE_DIR/candidate.json"
          find "$OBF_EVIDENCE_DIR/screenshots" -type f -name '*.png' -size +0c -print -quit | grep -q .
          find "$OBF_EVIDENCE_DIR" -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.webm' \) -size +0c -print -quit | grep -q .

      - name: Upload packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-candidate-acceptance-${{ steps.source.outputs.short }}
          path: |
            ${{ runner.temp }}/fabushi-candidate-acceptance
            desktop/playwright-report
            desktop/test-results
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/release
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-macos-${{ steps.source.outputs.short }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish GitHub prerelease
        if: ${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/package-macos-') || startsWith(github.event.head_commit.message, 'release:'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG"             desktop/release/*.dmg             desktop/release/*.zip             desktop/release/*.blockmap             desktop/release/latest-mac.yml             desktop/release/SHA256SUMS.txt             --target "$SOURCE_SHA"             --title "Fabushi macOS $VERSION — ${SOURCE_SHA:0:12}"             --notes "Signed and Apple-notarized macOS arm64 installer built from exact fabushi-desktop commit \`$SOURCE_SHA\`."             --prerelease
          url="$(gh release view "$TAG" --json url -q .url)"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $url" >> "$GITHUB_STEP_SUMMARY"
