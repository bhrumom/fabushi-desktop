name: Round8 read-only Electron artifact inspection
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/checkpoint-round8-electron-artifact-inspection.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect-owned-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact owned artifact without executing its contents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: bhrumom/fabushi-desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/round8-electron-inspection
          gh api repos/bhrumom/fabushi-desktop/actions/artifacts/13192011555 > "$RUNNER_TEMP/round8-artifact-meta.json"
          gh api repos/bhrumom/fabushi-desktop/actions/artifacts/13192011555/zip > "$RUNNER_TEMP/round8-artifact.zip"
          python3 - <<'PY'
          import base64, hashlib, io, json, os, posixpath, re, zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit

          expected_sha = "b6eaa5020c0d886e40e8477673d30673bd732be8"
          expected_digest = "078e876c152384a3ce7cfae64f516b589a3cd4da59384878cd383be0cc59f4fb"
          temporary = Path(os.environ["RUNNER_TEMP"])
          meta = json.loads((temporary / "round8-artifact-meta.json").read_text())
          assert meta["id"] == 13192011555 and meta["expired"] is False
          assert meta["name"] == "plugins-close-pointer-" + expected_sha
          assert meta["workflow_run"]["id"] == 41548150741
          assert meta["workflow_run"]["head_sha"] == expected_sha
          assert meta["digest"] == "sha256:" + expected_digest
          archive = (temporary / "round8-artifact.zip").read_bytes()
          assert hashlib.sha256(archive).hexdigest() == expected_digest
          result = {
              "schema": "round8-scoped-electron-artifact-inspection-v1",
              "source_head": expected_sha, "run_id": 41548150741,
              "artifact_id": meta["id"], "sha256": expected_digest,
              "archive_bytes": len(archive), "archive_digest_verified": True,
              "inspection_head": os.environ["GITHUB_SHA"],
              "scope": "Read existing artifact only; no product execution, images not visually reviewed, raw logs/headers/environment/source storage excluded.",
              "reports": [], "contexts": [], "traces": []
          }

          def safe(value, limit=700):
              text = re.sub(r"\x1b\[[0-9;]*m", "", str(value))
              if re.search(r"(?i)authorization|bearer|password|secret|api.?key|access.?token|refresh.?token", text):
                  return "<sensitive field omitted>"
              text = re.sub(r"https?://[^\s)\"<>]+", "<url>", text)
              text = re.sub(r"(?:/Users/|/home/|/private/var/|/var/folders/)[^\s)\"<>]+", "<path>", text)
              text = re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}", "<email>", text)
              text = re.sub(r"\b[0-9a-fA-F]{32,}\b", "<opaque-id>", text)
              return text[:limit]

          def selected(value, keys):
              return {key: value[key] for key in keys if key in value and isinstance(value[key], (str, int, float, bool, type(None)))}

          def process(value):
              output = selected(value, ["pid", "parentPid"])
              output["executable_basename"] = PurePosixPath(str(value.get("executable") or value.get("command") or "")).name
              return output

          def attachment_summary(name, data):
              if name == "human-http-request-response-release-order" and isinstance(data, dict):
                  requests = []
                  for row in data.get("requests", []):
                      item = selected(row, ["sequence", "phase", "method", "authorizationMatches", "deviceMatches"])
                      item["path"] = urlsplit(str(row.get("path", ""))).path
                      requests.append(item)
                  events = [selected(row, ["at", "kind", "request", "phase", "status", "method"]) for row in data.get("events", [])]
                  unexpected = []
                  for row in data.get("unexpected", []):
                      item = selected(row, ["request", "method", "phase", "status"])
                      if "path" in row: item["path"] = urlsplit(str(row["path"])).path
                      if "detail" in row: item["detail"] = safe(row["detail"], 250)
                      unexpected.append(item)
                  return {"requests": requests, "events": events, "unexpected": unexpected,
                          "held": [selected(row, ["request", "closed", "released", "destroyed"]) for row in data.get("held", [])],
                          "canonical_service_row_count": len(data.get("canonicalServiceRows", []))}
              if name == "human-process-ipc-and-sqlite-evidence" and isinstance(data, list):
                  output = []
                  for row in data:
                      item = selected(row, ["kind", "lifetime", "at", "durationMs", "method", "requestedMode", "actualMode", "exitCode", "signal"])
                      if isinstance(row.get("processes"), list): item["processes"] = [process(p) for p in row["processes"]]
                      if isinstance(row.get("currentTree"), list): item["current_tree"] = [process(p) for p in row["currentTree"]]
                      if isinstance(row.get("remainingObservedProcesses"), list): item["remaining_count"] = len(row["remainingObservedProcesses"])
                      if row.get("method") == "cursorAccount.getStatus":
                          status = row.get("status") or {}
                          item["account_kind"] = status.get("kind")
                          item["fixture_account_matches"] = status.get("authId") == "fabushi-e2e-account"
                      if "error" in row: item["error_summary"] = safe(str(row["error"]).splitlines()[0], 350)
                      output.append(item)
                  return output
              if name == "human-page-console-and-errors" and isinstance(data, list):
                  markers = ["Can't reach your computer", "listAgents", "listHumanConversations", "syncHumanConversations",
                             "Human roster unavailable", "Human sync unavailable", "coordinator", "disconnected", "1337"]
                  return [{**selected(row, ["kind", "level", "lifetime", "at"]),
                           "diagnostic_markers": {marker: marker in str(row.get("text") or row.get("message") or row.get("error") or "") for marker in markers}}
                          for row in data]
              if name.endswith("-dom") and isinstance(data, dict):
                  rows = data.get("rows") or []
                  return {"scheme": urlsplit(str(data.get("url", ""))).scheme, "row_count": len(rows),
                          "rows": [{"text_length": len(str(row.get("text") or "")), **selected(row, ["role", "pending", "failed"])} for row in rows],
                          "composer_length": len(str(data.get("composer") or "")),
                          "notice": safe(data.get("notice") or "")}
              return None

          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              names = bundle.namelist()
              result["archive_entry_count"] = len(names)
              targets = [name for name in names if name.endswith("target-sha.txt")]
              assert targets
              for name in targets: assert bundle.read(name).decode().strip() == expected_sha
              result["bound_target_files"] = targets

              allowed_roots = ("artifacts/plugins-close/", "artifacts/native-human-electron/", "desktop/test-results/", "desktop/human-electron-results/")
              assert all(not name.startswith("/") and ".." not in PurePosixPath(name).parts for name in names)

              def read_attachment(value, report_entry):
                  body = value.get("body")
                  if isinstance(body, str):
                      raw = body.encode() if body.lstrip().startswith(("{", "[")) else base64.b64decode(body, validate=True)
                  elif isinstance(body, dict) and body.get("type") == "Buffer":
                      raw = bytes(body["data"])
                  elif isinstance(body, list):
                      raw = bytes(body)
                  else:
                      source = str(value.get("path", "")).replace("\\", "/")
                      candidates = set()
                      for marker, prefix in [("/desktop/", "desktop/"), ("/artifacts/", "artifacts/")]:
                          if marker in source: candidates.add(posixpath.normpath(prefix + source.split(marker, 1)[1]))
                      if source and not source.startswith("/"):
                          candidates.add(posixpath.normpath(posixpath.join(posixpath.dirname(report_entry), source)))
                          candidates.add(posixpath.normpath(source))
                      matches = sorted(candidate for candidate in candidates
                                       if candidate.startswith(allowed_roots) and candidate in names)
                      if len(matches) != 1: return None
                      raw = bundle.read(matches[0])
                  return json.loads(raw)

              for name in names:
                  if not name.endswith("playwright.json"): continue
                  report = json.loads(bundle.read(name))
                  output = {"artifact_entry": name, "stats": report.get("stats"), "cases": []}
                  def walk(suite):
                      for spec in suite.get("specs", []):
                          for test in spec.get("tests", []):
                              item = {"title": safe(spec.get("title"), 250), "expected_status": test.get("expectedStatus"), "results": []}
                              for executed in test.get("results", []):
                                  one = selected(executed, ["status", "retry", "duration", "startTime"])
                                  one["errors"] = [{"name": error.get("name"), "summary": safe(str(error.get("message", "")).splitlines()[0] if error.get("message") else "", 250),
                                                    "peer_locator": "Human restart peer" in str(error.get("message", "")),
                                                    "element_not_found": "element(s) not found" in str(error.get("message", ""))}
                                                   for error in executed.get("errors", [])]
                                  one["attachments"] = {}
                                  for attached in executed.get("attachments", []):
                                      label = str(attached.get("name", ""))
                                      if label not in ["human-http-request-response-release-order", "human-process-ipc-and-sqlite-evidence", "human-page-console-and-errors"] and not label.endswith("-dom"): continue
                                      data = read_attachment(attached, name)
                                      if "native-human-electron/" in name:
                                          assert data is not None, "Required scoped Human attachment could not be uniquely resolved: " + label
                                      one["attachments"][label] = attachment_summary(label, data) if data is not None else {"readable": False}
                                  if "native-human-electron/" in name:
                                      for required in ["human-http-request-response-release-order", "human-process-ipc-and-sqlite-evidence", "human-page-console-and-errors"]:
                                          assert required in one["attachments"], "Missing required scoped Human attachment: " + required
                                  item["results"].append(one)
                              output["cases"].append(item)
                      for child in suite.get("suites", []): walk(child)
                  for suite in report.get("suites", []): walk(suite)
                  result["reports"].append(output)

              for name in names:
                  if not name.endswith("error-context.md"): continue
                  raw = bundle.read(name)
                  assert len(raw) <= 2 * 1024 * 1024
                  context = raw.decode("utf-8", "replace")
                  labels = ["Human restart peer", "Can't reach your computer", "Sign in", "Sign In", "Retry", "Reconnect", "Connecting", "Loading", "No conversations", "Agents", "Conversation transcript"]
                  lines = [safe(line, 400) for line in context.splitlines()
                           if re.search(r"(?i)^\s*-\s*(?:button|heading|alert|status|dialog|navigation)|can't reach|roster|unavailable|failed|connecting", line)]
                  result["contexts"].append({"artifact_entry": name, "sha256": hashlib.sha256(raw).hexdigest(),
                                             "label_counts": {label: context.count(label) for label in labels}, "selected_ui_lines": lines[:90]})

              for name in names:
                  if not name.endswith("-trace.zip"): continue
                  raw = bundle.read(name)
                  with zipfile.ZipFile(io.BytesIO(raw)) as trace:
                      methods, failures = [], []
                      for entry in trace.namelist():
                          if not entry.endswith(".trace"): continue
                          for line in trace.read(entry).decode("utf-8", "replace").splitlines():
                              if not line.strip(): continue
                              event = json.loads(line)
                              if event.get("type") == "before":
                                  methods.append(selected(event, ["callId", "apiName", "class", "method", "startTime"]))
                              if event.get("type") == "after" and event.get("error"):
                                  error = event["error"]
                                  failures.append({"call_id": event.get("callId"), "name": error.get("name"), "summary": safe(error.get("message", ""), 350)})
                      result["traces"].append({"artifact_entry": name, "method_count": len(methods), "last_methods": methods[-25:], "failures": failures})
          assert result["reports"]
          encoded = json.dumps(result, ensure_ascii=False, indent=2)
          assert len(encoded) < 500000
          Path("artifacts/round8-electron-inspection/evidence.json").write_text(encoded + "\n")
          print("ROUND8_ELECTRON_EVIDENCE_BEGIN")
          print(encoded)
          print("ROUND8_ELECTRON_EVIDENCE_END")
          PY
      - name: Preserve scoped read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: round8-electron-inspection-${{ github.sha }}
          path: artifacts/round8-electron-inspection/evidence.json
          if-no-files-found: error
