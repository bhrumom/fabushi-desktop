name: Round14 scoped ledger object preparation
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - .github/workflows/round14-c15-ledger-object.yml
      - .github/round14-c15-ledger-ops.json
permissions:
  contents: read
jobs:
  prepare-object:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply only reviewed existing-row additions to one exact current input
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, pathlib, re, subprocess, urllib.request
          repository = 'bhrumom/fabushi-desktop'
          branch = 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
          path = 'projects/telegram-desktop-rust/parity-ledger.json'
          payload_bytes = pathlib.Path('.github/round14-c15-ledger-ops.json').read_bytes()
          payload = json.loads(payload_bytes)
          preparation_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if preparation_head != os.environ['GITHUB_SHA']:
              raise SystemExit('Preparation checkout differs from its event')
          if (payload['repository'], payload['path'], payload['responsibility_id'], payload['fixed_upstream']) != (
              repository, path, 'FBCP-NMR-001', 'f985723b552b30fe1c17d377d57f44e61a15a8c4'):
              raise SystemExit('Unexpected object preparation scope')
          def api(method, suffix, body=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + suffix,
                  data=None if body is None else json.dumps(body, allow_nan=False).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['TRANSFER_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'}, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          # This is data-object preparation, not product validation. Resolve
          # the input once and retain its immutable identity separately from
          # the reviewed operation's workflow revision. Never write a ref.
          current = api('GET', '/git/ref/heads/' + branch)
          input_commit = current['object']['sha']
          if current['object']['type'] != 'commit' or not re.fullmatch('[0-9a-f]{40}', input_commit):
              raise SystemExit('Invalid canonical input commit')
          if input_commit != preparation_head:
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', input_commit], check=True)
          input_blob = subprocess.check_output(['git', 'rev-parse', input_commit + ':' + path], text=True).strip()
          input_bytes = subprocess.check_output(['git', 'show', input_commit + ':' + path])
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob_sha(input_bytes) != input_blob:
              raise SystemExit('Canonical input bytes differ from their Git identity')
          before = json.loads(input_bytes)
          if before['upstream_commit'] != payload['fixed_upstream']:
              raise SystemExit('Frozen upstream changed')
          allowed = {'fabushi_target_paths', 'fabushi_target_symbols',
                     'production_entrypoints', 'production_evidence', 'test_evidence',
                     'integration_case_ids', 'fault_recovery_case_ids',
                     'security_case_ids', 'test_execution_evidence'}
          if not payload['append'] or not set(payload['append']).issubset(allowed):
              raise SystemExit('Unexpected responsibility fields')
          original = [r for r in before['rows'] if r.get('responsibility_id') == payload['responsibility_id']]
          if len(original) != 1:
              raise SystemExit('Responsibility identity must be unique')
          after = copy.deepcopy(before)
          row = next(r for r in after['rows'] if r.get('responsibility_id') == payload['responsibility_id'])
          for key, additions in payload['append'].items():
              if not isinstance(row[key], list) or not isinstance(additions, list):
                  raise SystemExit('Append fields must be arrays')
              for value in additions:
                  if not isinstance(value, str) or not value.strip():
                      raise SystemExit('Only explicit nonempty evidence strings may be appended')
                  if value not in row[key]:
                      row[key].append(value)
          note = payload['note']
          if not isinstance(note, str) or not note.strip() or not isinstance(row['notes'], str):
              raise SystemExit('Notes must remain explicit text')
          if note not in row['notes']:
              row['notes'] += '\n' + note
          restored = copy.deepcopy(after)
          restored_row = next(r for r in restored['rows'] if r.get('responsibility_id') == payload['responsibility_id'])
          for key in [*payload['append'], 'notes']:
              restored_row[key] = copy.deepcopy(original[0][key])
          if restored != before:
              raise SystemExit('Undeclared state changed')
          if after.get('source_reviews') != before.get('source_reviews') or after['coverage'] != before['coverage']:
              raise SystemExit('Source review or accounting changed')
          # Preserve all unrelated file bytes as well as JSON meaning.
          def row_block(value):
              return '\n'.join('    ' + line for line in json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False).splitlines())
          old_block, new_block = row_block(original[0]), row_block(row)
          text = input_bytes.decode('utf-8')
          if text.count(old_block) != 1:
              raise SystemExit('Canonical row serialization changed; review before preparation')
          output_bytes = text.replace(old_block, new_block, 1).encode('utf-8')
          prepared_blob = blob_sha(output_bytes)
          if prepared_blob != input_blob:
              result = api('POST', '/git/blobs', {'content': output_bytes.decode('utf-8'), 'encoding': 'utf-8'})
              if result.get('sha') != prepared_blob:
                  raise SystemExit('GitHub object differs from the prepared exact bytes')
          receipt = {
              'preparation_head': preparation_head, 'input_commit': input_commit,
              'input_blob': input_blob, 'prepared_blob': prepared_blob,
              'operations_sha256': hashlib.sha256(payload_bytes).hexdigest(),
              'bytes': len(output_bytes), 'changed_existing_rows': ['FBCP-NMR-001'],
              'source_reviews_preserved': True, 'source_accounting_preserved': True,
              'acceptance_changed': False, 'refs_written': False,
              'product_validation': False
          }
          pathlib.Path('round14-ledger-object-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('ROUND14_LEDGER_OBJECT ' + json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round14-ledger-object-${{ github.sha }}
          path: round14-ledger-object-receipt.json
          if-no-files-found: error
