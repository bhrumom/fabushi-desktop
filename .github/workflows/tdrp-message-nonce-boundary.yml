name: TDRP message nonce boundary
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - 'source/host/src/extensions/transcript/send_pipeline.rs'
      - 'source/host/tests/send_pipeline_nonce_boundary_contract.rs'
      - '.github/workflows/tdrp-message-nonce-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-message-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Bind exact source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: tdrp-message-nonce-rust-1.97.1
      - name: Install native Host library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Test production Host nonce identity boundary
        run: cargo test --locked --manifest-path source/host/Cargo.toml --test send_pipeline_nonce_boundary_contract
      - name: Check shipping Host composition
        run: cargo check --locked --manifest-path source/host/app/Cargo.toml
