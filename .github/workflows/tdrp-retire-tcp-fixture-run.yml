name: TDRP retire diagnosed TCP fixture run
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths: [.github/workflows/tdrp-retire-tcp-fixture-run.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retire-exact-obsolete-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Identify the exact prior run before requesting cancellation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bhrumom/fabushi-desktop
          mkdir -p artifacts/retired-tcp-fixture
          gh api --method GET repos/bhrumom/fabushi-desktop/actions/runs/41395923359 > artifacts/retired-tcp-fixture/before.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/retired-tcp-fixture')
          prior = json.loads((root / 'before.json').read_text())
          expected = ('d00fdb48200b105b7aea9f2cb865cf4e7b482b2d', 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1')
          if prior.get('id') != 41395923359 or (prior.get('head_sha'), prior.get('head_branch')) != expected:
              raise SystemExit('Prior run identity changed; cancellation refused')
          if prior.get('path') != '.github/workflows/native-service-contracts.yml' or prior.get('run_attempt') != 1:
              raise SystemExit('Unexpected prior workflow or attempt; cancellation refused')
          decision = {'prior_run': 41395923359, 'head_sha': expected[0], 'management_head': os.environ['GITHUB_SHA'],
                      'status_before': prior['status'], 'cancel_requested': prior['status'] == 'in_progress',
                      'reason': 'The selected TCP suite contains a deterministic fake-peer wait cycle: server awaits a mode marker while the client only receives. Two fixture repairs are committed for a new exact-H run; retain prior logs as non-passing evidence.',
                      'tests_rerun': False, 'acceptance': False}
          (root / 'decision.json').write_text(json.dumps(decision, indent=2) + '\n')
          print(json.dumps(decision))
          PY
          cancel_exit=0
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('artifacts/retired-tcp-fixture/decision.json'))['cancel_requested'] else 1)"; then
            gh api --include --method POST repos/bhrumom/fabushi-desktop/actions/runs/41395923359/cancel > artifacts/retired-tcp-fixture/cancel-response.txt 2> artifacts/retired-tcp-fixture/cancel-stderr.txt || cancel_exit=$?
          fi
          printf '%s\n' "$cancel_exit" > artifacts/retired-tcp-fixture/cancel-exit.txt
          after_exit=0
          gh api --method GET repos/bhrumom/fabushi-desktop/actions/runs/41395923359 > artifacts/retired-tcp-fixture/after.json 2> artifacts/retired-tcp-fixture/after-stderr.txt || after_exit=$?
          printf '%s\n' "$after_exit" > artifacts/retired-tcp-fixture/after-exit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/retired-tcp-fixture')
          decision = json.loads((root / 'decision.json').read_text())
          cancel_exit = int((root / 'cancel-exit.txt').read_text())
          after_exit = int((root / 'after-exit.txt').read_text())
          result = {'cancel_exit': cancel_exit, 'after_exit': after_exit, 'acceptance': False,
                    'atomic_attempt_cas': False, 'tests_rerun': False}
          if after_exit == 0:
              after = json.loads((root / 'after.json').read_text())
              identity_matches = (after.get('id') == 41395923359
                  and after.get('head_sha') == 'd00fdb48200b105b7aea9f2cb865cf4e7b482b2d'
                  and after.get('head_branch') == 'checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
                  and after.get('path') == '.github/workflows/native-service-contracts.yml'
                  and after.get('run_attempt') == 1)
              result.update(identity_matches=identity_matches, status_after=after.get('status'),
                            conclusion_after=after.get('conclusion'),
                            cancellation_request_accepted=decision['cancel_requested'] and cancel_exit == 0)
          (root / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          if after_exit != 0 or not result.get('identity_matches'):
              raise SystemExit('Could not confirm the same prior run after the request; inspect saved evidence')
          if decision['cancel_requested'] and cancel_exit != 0 and result['status_after'] != 'completed':
              raise SystemExit('Cancellation request failed and prior run is not terminal; inspect saved evidence')
          PY
      - name: Preserve the cancellation identity and reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdrp-retired-tcp-fixture-41395923359-${{ github.sha }}
          path: artifacts/retired-tcp-fixture
          if-no-files-found: error
