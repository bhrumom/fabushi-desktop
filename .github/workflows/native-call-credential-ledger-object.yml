name: Native call credential temporary ledger object
on:
  push:
    branches: [checkpoint/tdrp-native-call-scope-20bf9475-r1]
    paths: ['.github/workflows/native-call-credential-ledger-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 00036927d789913f08062cd303475fc5c55d57f2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the existing ledger schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate and create only the exact scoped ledger blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
