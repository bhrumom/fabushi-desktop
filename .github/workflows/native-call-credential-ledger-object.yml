mote invitation or durable call insertion. This is a bounded target admission repair, not full Telegram call/media equivalence. The same selected-peer/authenticated-account responsibility also binds each shipping call HTTP request to the fixed Session Human and rejects a response consumed across a change in the existing six private credential fields; signal sender device must match the exact dispatch credential.","state_machine":"Selected canonical Human conversation -> current stored pair admission -> existing credential check -> native create POST -> validate remote call identity/state -> persist the same CallSession scope. Admission rejection performs no remote request or call insertion; backend refusal after an admitted POST produces no local call insertion. Valid calls retain existing lifecycle and reopen/discovery behavior. Fixed Session Human -> fresh private credential/expected-user admission -> same-snapshot signal sender admission where applicable -> HTTP -> complete body consumption -> six-field stability fence -> existing parse/settlement. A changed GET cannot authorize a later mutation; an already-dispatched mutation may require existing discovery/replay recovery.","side_effects":["Only admitted Native creation reaches /api/social/calls.","Valid service response is persisted by the existing CallSessionStore; malformed scope/request or backend refusal creates no local phantom call.","Wrong fixed user or signal sender produces no call HTTP. Credential changes detected after body consumption reject local settlement; they do not undo a previously dispatched remote mutation."],"failure_cases":["A readable A/B conversation is combined with requested A/C participants.","Stored pair is missing, malformed, ambiguous, self-only or lacks the local identity.","An alternate readable scope is paired with a different peer.","Backend refuses a valid admitted create; local durable calls remain unchanged.","Valid call GET completes after user/device/token/session/expiry/