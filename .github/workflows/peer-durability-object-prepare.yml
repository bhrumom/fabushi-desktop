name: Peer durability scoped object preparation
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - '.github/workflows/peer-durability-object-prepare.yml'
      - '.github/scripts/prepare-peer-durability-objects.py'
      - '.github/peer-durability-object-ops.json'
      - 'projects/telegram-desktop-rust/parity-ledger.json'
      - 'source/mahayana/mahayana-rs/Cargo.lock'
permissions:
  contents: read
jobs:
  prepare-objects:
    if: github.repository == 'bhrumom/fabushi-desktop' && github.ref == 'refs/heads/checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare and read back only the scoped unattached objects
        env:
          PEER_OBJECT_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare-peer-durability-objects.py
      - name: Preserve complete object bytes and identities for root CAS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-durability-objects-${{ github.sha }}
          path: artifacts/peer-durability-objects
          if-no-files-found: error
          retention-days: 90
