          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile
          evidence = pathlib.Path("artifacts/native-message-shipping").resolve()
          binaries = pathlib.Path("source/mahayana/mahayana-rs/target/ci").resolve()
          cases = []
          identities = []
          for name in ("mahayana", "mahayana-gateway"):
              binary = binaries / name
              raw = binary.read_bytes()
              identities.append({"name": name, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
              for native_https in (True, False):
                  label = name + ("-native-https" if native_https else "-native-http-refusal")
                  with tempfile.TemporaryDirectory(prefix="fabushi-cli-production-") as scratch:
                      owned = pathlib.Path(scratch)
                      workspace = owned / "workspace"
                      workspace.mkdir()
                      env = os.environ.copy()
                      env.update({
                          "MAHAYANA_HOME": str(owned / "mahayana"),
                          "MAHAYANA_GATEWAY_STATE": str(owned / "gateway-state.json"),
                          "MAHAYANA_USE_CODEX_ACCOUNT": "0",
                          "MAHAYANA_RESPONSES_BASE_URL": ("https" if native_https else "http") + "://127.0.0.1:1/v1",
                      })
                      command = [str(binary)] + (["status"] if name == "mahayana" else [])
                      frames = (
                          '{"jsonrpc":"2.0","id":1,"method":"session.list","params":{}}\n'
                          '{"jsonrpc":"2.0","id":2,"method":"gateway.shutdown","params":{}}\n'
                      ) if name == "mahayana-gateway" else ""
                      try:
                          result = subprocess.run(command, input=frames, text=True, capture_output=True,
                                                  cwd=workspace, env=env, timeout=30)
                      except subprocess.TimeoutExpired as error:
                          for stream, value in (("stdout", error.stdout), ("stderr", error.stderr)):
                              if isinstance(value, bytes):
                                  value = value.decode("utf-8", errors="replace")
                              (evidence / (label + "." + stream + ".log")).write_text(value or "")
                          raise
                      (evidence / (label + ".stdout.log")).write_text(result.stdout)
                      (evidence / (label + ".stderr.log")).write_text(result.stderr)
                      if native_https:
                          assert result.returncode == 0, (label, result.returncode, result.stderr)
                          if name == "mahayana":
                              status = json.loads(result.stdout)
                              assert status["@type"] == "mahayana.runtime.status", status
                              assert "mahayana-ai" in status["providers"] and "miniapp" in status["providers"], status
                          else:
                              observed = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
                              replies = {frame["id"]: frame for frame in observed if "id" in frame}
                              assert "result" in replies[1] and "error" not in replies[1], replies
                              assert replies[2]["result"]["shuttingDown"] is True, replies
                      else:
                          assert result.returncode != 0, (label, "unavailable fallback unexpectedly succeeded")
                          assert "remote model endpoints must use HTTPS" in result.stderr, (label, result.stderr)
                      cases.append({"case": label, "exit_code": result.returncode, "passed": True})
          assert len(cases) == 4
          receipt = {"source_sha": os.environ["GITHUB_SHA"], "build_profile": "ci",
                     "build_root": "mahayana-cli only; normal/build features",
                     "binaries": identities, "cases": cases,
                     "limits": "Production process construction only; no remote inference, full Bot, signed installer or external FFI acceptance"}
          (evidence / "cli-production-processes.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("NMR-CLI-HOST-01 actual production process controls: 4 passed")
          PY
      - name: Native CLI/gateway direct Host and approval boundary
        shell: bash
        run: |
