          path: artifacts/native-message-electron
          if-no-files-found: error
  windows-update-publisher:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact Windows publisher source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/windows-update-publisher
          git rev-parse HEAD > artifacts/windows-update-publisher/target-sha.txt
          printf '%s\n' 'EUS-WIN-02/04/06; actual Windows Authenticode with an ephemeral CI-only certificate and inert signed fixture; no installer execution, formal publisher authorization, or package acceptance' > artifacts/windows-update-publisher/scope.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Actual Windows signature and Unicode publisher contracts
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          node --test --test-reporter=tap ../source/electron-main/update/windows-publisher.native.test.mjs 2>&1 | tee ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# tests 11' ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# pass 11' ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# fail 0' ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# cancelled 0' ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# skipped 0' ../artifacts/windows-update-publisher/native-publisher.log
          grep -Fx '# todo 0' ../artifacts/windows-update-publisher/native-publisher.log
          grep -F 'FABUSHI_WINDOWS_NATIVE_FIXTURE ' ../artifacts/windows-update-publisher/native-publisher.log
          grep -F 'FABUSHI_WINDOWS_NATIVE_UNICODE ' ../artifacts/windows-update-publisher/native-publisher.log
          grep -F 'FABUSHI_WINDOWS_NATIVE_CLEANUP ' ../artifacts/windows-update-publisher/native-publisher.log
      - name: Preserve native API evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-publisher-${{ github.sha }}
          path: artifacts/windows-update-publisher
          if-no-files-found: error
