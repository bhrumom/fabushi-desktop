name: Native service contracts
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - 'source/host/src/extensions/session/**'
      - 'source/host/tests/session_gateway_contract.rs'
      - 'source/host/Cargo.lock'
      - 'source/host/app/Cargo.lock'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-protocol/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-network/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-runtime/**'
      - 'source/mahayana/mahayana-rs/Cargo.lock'
      - '.github/workflows/native-service-contracts.yml'
  pull_request:
    paths:
      - 'source/host/src/extensions/auth/**'
      - 'source/host/src/extensions/automations/**'
      - 'source/host/src/extensions/cross_user_sharing/xuser_sharing_environment.rs'
      - 'source/host/tests/xuser_sharing_environment_contract.rs'
      - 'source/host/tests/xuser_service_contract.rs'
      - 'source/host/src/extensions/box_store_sync/native_account_store.rs'
      - 'source/host/src/extensions/box_store_sync/native_object_transfer.rs'
      - 'source/host/src/extensions/box_store_sync/native_box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/production.rs'
      - 'source/host/src/extensions/box_store_sync/extension.rs'
      - 'source/host/src/extensions/box_store_sync/box_copy_in.rs'
      - 'source/host/src/box/box_store_backend_policy.rs'
      - 'source/host/src/host_production_extensions.rs'
      - 'source/host/src/extensions/box_store_sync/mod.rs'
      - 'source/host/tests/extensions_auth_service_contract.rs'
      - 'source/host/tests/extensions_auth_credential_renewer_contract.rs'
      - 'source/host/tests/automations_backend_contract.rs'
      - 'source/host/tests/native_automation_transport_contract.rs'
      - 'source/host/tests/native_cloud_sync_contract.rs'
      - 'source/host/tests/native_account_store_contract.rs'
      - 'source/host/tests/native_object_transfer_contract.rs'
      - '.github/workflows/native-service-contracts.yml'
  workflow_dispatch:
    inputs:
      message_batch:
        description: Run the focused FBCP native message reconciliation batch
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-auth-and-journal:
    if: github.event_name != 'push' && !inputs.message_batch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: fdn-host-control-owner-contracts-ubuntu-1.97.1
      - name: Install existing Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Native credentials, issuer and HTTP journal contracts
        run: >-
          cargo test --manifest-path source/host/Cargo.toml
          --test extensions_auth_service_contract
          --test extensions_auth_credential_renewer_contract
          --test automations_backend_contract
          --test native_automation_transport_contract
          --test native_cloud_sync_contract
          --test automations_cloud_sync_contract
          --test native_account_store_contract
          --test native_object_transfer_contract
          --test box_store_sync_extension_contract
          --test box_foundation_contract
          --test box_store_sync_production_wiring_contract
          --test xuser_sharing_environment_contract
          --test xuser_service_contract
      - name: Record evidence scope
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Native credential and loopback HTTP transport evidence only; no deployed-cloud, full lifecycle or packaged-platform acceptance.' >> "$GITHUB_STEP_SUMMARY"
  native-message-reconciliation:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact source and batch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/native-message
          git rev-parse HEAD > artifacts/native-message/target-sha.txt
          printf '%s\n' 'FBCP-NMR-001; source-informed U=f985723b552b30fe1c17d377d57f44e61a15a8c4; loopback integration only' > artifacts/native-message/scope.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Human ingress, settlement and restart contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test session_gateway_contract shipping_human_ -- --nocapture 2>&1 | tee artifacts/native-message/session-gateway.log
          grep -Eq 'test result: ok\. 10 passed; 0 failed; 0 ignored;' artifacts/native-message/session-gateway.log
      - name: Preserve Agent send nonce boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test send_pipeline_nonce_boundary_contract -- --nocapture 2>&1 | tee artifacts/native-message/agent-send-nonce.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' artifacts/native-message/agent-send-nonce.log
      - name: Diagnose locked Session dependency drift (no acceptance)
        if: failure()
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path source/host/Cargo.toml || true
          git diff -- source/host/Cargo.lock | head -n 260
      - name: Preserve exact batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-message-reconciliation-${{ github.sha }}
          path: artifacts/native-message
          if-no-files-found: error
  native-message-shipping-compile:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact shipping source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/native-message-shipping
          git rev-parse HEAD > artifacts/native-message-shipping/target-sha.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host/app -> target
            source/mahayana/mahayana-rs -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Compile actual desktop AppHost entry
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml 2>&1 | tee artifacts/native-message-shipping/app-host-check.log
      - name: Verify DNS and special-config response normalization
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-protocol --lib response_normalization:: 2>&1 | tee artifacts/native-message-shipping/telegram-response-normalization.log
          grep -Eq 'test result: ok\. 6 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-response-normalization.log
      - name: Verify protocol and TCP compatibility behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-protocol --test protocol_contract 2>&1 | tee artifacts/native-message-shipping/telegram-protocol-contract.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-protocol-contract.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-network --test tcp_transport -- --include-ignored 2>&1 | tee artifacts/native-message-shipping/telegram-tcp-transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-tcp-transport.log
      - name: Verify proxy rejection and Native credential boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-runtime --lib network_proxy_contracts -- --nocapture 2>&1 | tee artifacts/native-message-shipping/telegram-proxy-boundary.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-proxy-boundary.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib native_schema_is_not_ci_export_and_has_no_ci_ttl_cap -- --nocapture 2>&1 | tee artifacts/native-message-shipping/native-credential-schema.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/native-credential-schema.log
      - name: Diagnose locked AppHost dependency drift (no acceptance)
        if: failure()
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path source/host/app/Cargo.toml || true
          git diff -- source/host/app/Cargo.lock | head -n 260
      - name: Preserve shipping compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-message-shipping-compile-${{ github.sha }}
          path: artifacts/native-message-shipping
          if-no-files-found: error

