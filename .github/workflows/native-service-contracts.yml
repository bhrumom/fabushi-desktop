          cargo test --locked --manifest-path "$manifest" -p mahayana-cli --bin mahayana-gateway -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/gateway-native-owner.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/gateway-native-owner.log
          cargo test --locked --manifest-path "$manifest" -p mahayana-gateway --lib -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/gateway-contracts.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/gateway-contracts.log
