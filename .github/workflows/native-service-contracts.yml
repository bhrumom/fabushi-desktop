      - name: Reconcile immutable historical installer metadata without changing package bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_PACKAGE_SOURCE: 9d16483f70df9af06db97b17bb02a24dc507e459
          HISTORICAL_ARTIFACT_DIGEST: f17fc29681164e69507d24201c57a58c84651d66a65cc3d0ebf1faeeee0be225
        run: |
          set -euo pipefail
          export MACOS_METADATA_CANDIDATE
          MACOS_METADATA_CANDIDATE="$(mktemp -d "$RUNNER_TEMP/fabushi-historical-metadata.XXXXXX")"
          export MACOS_METADATA_ARCHIVE="$RUNNER_TEMP/fabushi-historical-package.zip"
          gh api repos/bhrumom/fabushi-desktop/actions/artifacts/13093546572 > artifacts/native-message-electron/historical-artifact.json
          gh api repos/bhrumom/fabushi-desktop/actions/artifacts/13093546572/zip > "$MACOS_METADATA_ARCHIVE"
          python3 - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          evidence = Path('artifacts/native-message-electron')
          archive = Path(os.environ['MACOS_METADATA_ARCHIVE'])
          metadata = json.loads((evidence / 'historical-artifact.json').read_text())
          expected = os.environ['HISTORICAL_ARTIFACT_DIGEST']
          assert metadata['id'] == 13093546572 and not metadata['expired']
          assert metadata['workflow_run']['id'] == 41327420143
          assert metadata['workflow_run']['head_sha'] == '9993ca8e107f7e019a8201e5ab74fa54e82159f2'
          assert metadata['digest'] == 'sha256:' + expected
          with archive.open('rb') as handle:
              assert hashlib.file_digest(handle, 'sha256').hexdigest() == expected
          names = ['fabushi-1.2.78-macos-arm64.zip', 'fabushi-1.2.78-macos-arm64.dmg']
          permitted = set(names + [name + '.blockmap' for name in names] + ['latest-mac.yml'])
          destination = Path(os.environ['MACOS_METADATA_CANDIDATE'])
          with zipfile.ZipFile(archive) as source:
              assert len(source.infolist()) == len(permitted) and set(source.namelist()) == permitted
              for item in source.infolist():
                  assert not item.is_dir() and item.file_size > 0
                  with source.open(item) as src, (destination / item.filename).open('xb') as dst:
                      shutil.copyfileobj(src, dst)
          assets = []
          for name in names:
              asset = destination / name
              with asset.open('rb') as handle:
                  digest = hashlib.file_digest(handle, 'sha256').hexdigest()
              assets.append({'name': name, 'size': asset.stat().st_size, 'sha256': digest})
          assert assets[0]['size'] == 174991227 and assets[1]['size'] == 174156394
          shutil.copyfile(destination / 'latest-mac.yml', evidence / 'historical-latest-mac.before.yml')
          receipt = {'harness_sha': os.environ['GITHUB_SHA'], 'artifact_id': metadata['id'],
              'archive_sha256': expected, 'package_source_observed_in_job_log': os.environ['HISTORICAL_PACKAGE_SOURCE'],
              'source_job': 124910185631, 'assets': assets, 'installed_or_released': False}
          (evidence / 'historical-input.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
          if node desktop/scripts/reconcile-macos-update-metadata.mjs \
            --directory "$MACOS_METADATA_CANDIDATE" --version 1.2.78 \
            --target-sha "$HISTORICAL_PACKAGE_SOURCE" --verify \
            > artifacts/native-message-electron/historical-rejection.log 2>&1; then
            echo 'Stale historical package metadata unexpectedly passed' >&2
            exit 1
          fi
          grep -Fx 'MACOS_METADATA_ASSET_MISMATCH' artifacts/native-message-electron/historical-rejection.log
          node desktop/scripts/reconcile-macos-update-metadata.mjs \
            --directory "$MACOS_METADATA_CANDIDATE" --version 1.2.78 \
            --target-sha "$HISTORICAL_PACKAGE_SOURCE" \
            --receipt "$GITHUB_WORKSPACE/artifacts/native-message-electron/historical-reconciled.json" \
            > artifacts/native-message-electron/historical-reconcile.log 2>&1
          node desktop/scripts/reconcile-macos-update-metadata.mjs \
            --directory "$MACOS_METADATA_CANDIDATE" --version 1.2.78 \
            --target-sha "$HISTORICAL_PACKAGE_SOURCE" --verify \
            > artifacts/native-message-electron/historical-verify.log 2>&1
          cp "$MACOS_METADATA_CANDIDATE/latest-mac.yml" artifacts/native-message-electron/historical-latest-mac.after.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/native-message-electron')
          before = json.loads((root / 'historical-input.json').read_text())
          after = json.loads((root / 'historical-reconciled.json').read_text())
          verified = json.loads((root / 'historical-verify.log').read_text())
          assert after == verified and after['sourceSha'] == before['package_source_observed_in_job_log']
          for original in before['assets']:
              actual = next(item for item in after['assets'] if item['name'] == original['name'])
              assert actual['size'] == original['size'] and actual['sha256'] == original['sha256']
          print('NMR-43 historical installer: stale metadata rejected, final maps/hashes verified, ZIP/DMG bytes unchanged; no install or release')
          PY
      - name: Compile actual Electron main, preload and carrier
        shell: bash
