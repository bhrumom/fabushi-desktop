name: Native service contracts
on:
  push:
    branches: [checkpoint/tdrp-stage-a-msg-mutations-7457eb1c-r1]
    paths:
      - 'source/host/src/extensions/session/**'
      - 'source/host/tests/session_gateway_contract.rs'
      - 'source/host/Cargo.lock'
      - 'source/host/app/Cargo.lock'
      - 'frontend/src/production/ProductionRenderer.tsx'
      - 'desktop/forward-dialog-test.html'
      - 'desktop/forward-dialog-test.ts'
      - 'frontend/src/production/ForwardMessageDialog*'
      - 'frontend/src/production/forward-settlement*'
      - 'frontend/src/production/forward-account-scope.ts'
      - 'frontend/src/production/forward-recipient-navigation.ts'
      - 'frontend/src/recovered/runtime/coordinator-source.ts'
      - 'source/shared/rpc/coordinator.ts'
      - 'frontend/src/production/coordinator-client.ts'
      - 'frontend/src/production/transcript-projection*'
      - 'frontend/src/recovered/features/conversation/workspace/pagination*'
      - 'source/electron-main/coordinator/rust-coordinator-carrier*'
      - 'source/product/fabushi/fabushi-account-service*'
      - 'source/electron-main/update/**'
      - 'source/electron-main/production-binding-providers.ts'
      - 'source/shared/node/fabushi-service-origin.ts'
      - 'frontend/src/recovered/contracts/desktop-bridge.ts'
      - 'frontend/src/recovered/features/settings/overlay/updates.ts'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/scripts/build-electron-runtime.mjs'
      - 'desktop/scripts/native-package-resources.contract.test.mjs'
      - 'desktop/scripts/reconcile-macos-update-metadata*.mjs'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-cli/**'
      - 'source/mahayana/mahayana-rs/mahayana-gateway/**'
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-protocol/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-network/**'
      - 'source/mahayana/mahayana-rs/providers/telegram-runtime/**'
      - 'source/mahayana/mahayana-rs/Cargo.lock'
      - 'projects/telegram-desktop-rust/upstream.lock.json'
      - '.github/workflows/native-service-contracts.yml'
  pull_request:
    paths:
      - 'source/host/src/extensions/auth/**'
      - 'source/host/src/extensions/automations/**'
      - 'source/host/src/extensions/cross_user_sharing/xuser_sharing_environment.rs'
      - 'source/host/tests/xuser_sharing_environment_contract.rs'
      - 'source/host/tests/xuser_service_contract.rs'
      - 'source/host/src/extensions/box_store_sync/native_account_store.rs'
      - 'source/host/src/extensions/box_store_sync/native_object_transfer.rs'
      - 'source/host/src/extensions/box_store_sync/native_box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/production.rs'
      - 'source/host/src/extensions/box_store_sync/extension.rs'
      - 'source/host/src/extensions/box_store_sync/box_copy_in.rs'
      - 'source/host/src/box/box_store_backend_policy.rs'
      - 'source/host/src/host_production_extensions.rs'
      - 'source/host/src/extensions/box_store_sync/mod.rs'
      - 'source/host/tests/extensions_auth_service_contract.rs'
      - 'source/host/tests/extensions_auth_credential_renewer_contract.rs'
      - 'source/host/tests/automations_backend_contract.rs'
      - 'source/host/tests/native_automation_transport_contract.rs'
      - 'source/host/tests/native_cloud_sync_contract.rs'
      - 'source/host/tests/native_account_store_contract.rs'
      - 'source/host/tests/native_object_transfer_contract.rs'
      - '.github/workflows/native-service-contracts.yml'
  workflow_dispatch:
    inputs:
      message_batch:
        description: Run the focused FBCP native message reconciliation batch
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-auth-and-journal:
    if: github.event_name != 'push' && !inputs.message_batch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: fdn-host-control-owner-contracts-ubuntu-1.97.1
      - name: Install existing Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Native credentials, issuer and HTTP journal contracts
        run: >-
          cargo test --manifest-path source/host/Cargo.toml
          --test extensions_auth_service_contract
          --test extensions_auth_credential_renewer_contract
          --test automations_backend_contract
          --test native_automation_transport_contract
          --test native_cloud_sync_contract
          --test automations_cloud_sync_contract
          --test native_account_store_contract
          --test native_object_transfer_contract
          --test box_store_sync_extension_contract
          --test box_foundation_contract
          --test box_store_sync_production_wiring_contract
          --test xuser_sharing_environment_contract
          --test xuser_service_contract
      - name: Record evidence scope
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Native credential and loopback HTTP transport evidence only; no deployed-cloud, full lifecycle or packaged-platform acceptance.' >> "$GITHUB_STEP_SUMMARY"
  native-message-reconciliation:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact source and batch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/native-message
          git rev-parse HEAD > artifacts/native-message/target-sha.txt
          printf '%s\n' 'FBCP-NMR-001; source-informed U=f985723b552b30fe1c17d377d57f44e61a15a8c4; loopback integration only' > artifacts/native-message/scope.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Human ingress, settlement and restart contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test session_gateway_contract shipping_human_ -- --nocapture 2>&1 | tee artifacts/native-message/session-gateway.log
          grep -Eq 'test result: ok\. 44 passed; 0 failed; 0 ignored;' artifacts/native-message/session-gateway.log
          grep -F 'shipping_human_forward_restart_corruption_fails_closed_and_recovers_exact_journal ... ok' artifacts/native-message/session-gateway.log
      - name: Durable forwarding sharebox owner contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib sharebox_shipping_tests -- --nocapture 2>&1 | tee artifacts/native-message/forward-sharebox.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' artifacts/native-message/forward-sharebox.log
      - name: Durable forwarding journal and stale-write CAS contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib forward_batch_journal::tests -- --nocapture 2>&1 | tee artifacts/native-message/forward-batches.log
          grep -Eq 'test result: ok\. 12 passed; 0 failed; 0 ignored;' artifacts/native-message/forward-batches.log
          grep -F 'stale_same_batch_snapshot_cannot_regress_completed_destination ... ok' artifacts/native-message/forward-batches.log
          grep -F 'concurrent_forward_metadata_writers_have_one_durable_winner_and_recover ... ok' artifacts/native-message/forward-batches.log
      - name: Preserve Agent send nonce boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test send_pipeline_nonce_boundary_contract -- --nocapture 2>&1 | tee artifacts/native-message/agent-send-nonce.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' artifacts/native-message/agent-send-nonce.log
      - name: Prove completed HTTP credential fencing at settlement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib shipping_human_settlement_credential_ -- --nocapture 2>&1 | tee artifacts/native-message/settlement-credential.log
          grep -Eq 'test result: ok\. 3 passed; 0 failed; 0 ignored;' artifacts/native-message/settlement-credential.log
      - name: Authenticated forward recipient gateway HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test gateway_server_contract gateway_forward_recipient_methods_are_authenticated_and_unknown_methods_stay_closed -- --nocapture 2>&1 | tee artifacts/native-message/forward-http.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' artifacts/native-message/forward-http.log
      - name: Diagnose locked Session dependency drift (no acceptance)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'cannot update the lock file|lock file.*needs to be updated' artifacts/native-message/*.log 2>/dev/null; then
            cargo metadata --format-version 1 --manifest-path source/host/Cargo.toml > /dev/null 2> artifacts/native-message/dependency-resolution.log || true
            git diff -- source/host/Cargo.lock > artifacts/native-message/dependency-drift.patch
            sed -n '1,260p' artifacts/native-message/dependency-drift.patch
          fi
      - name: Preserve exact batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-message-reconciliation-${{ github.sha }}
          path: artifacts/native-message
          if-no-files-found: error
  native-message-shipping-compile:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact shipping source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/native-message-shipping
          git rev-parse HEAD > artifacts/native-message-shipping/target-sha.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/host/app -> target
            source/mahayana/mahayana-rs -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Build actual desktop AppHost entry and inspect its legacy boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path source/host/app/Cargo.toml --edges normal,build 2>&1 | tee artifacts/native-message-shipping/app-host-production-dependencies.log
          if grep -Eq '(mahayana-telegram|fabushi-telegram-(core|network|protocol|runtime|storage)) v' artifacts/native-message-shipping/app-host-production-dependencies.log; then
            echo 'desktop AppHost still has a production dependency on a legacy Telegram owner' >&2
            exit 1
          fi
          cargo build --locked --profile ci --bin mahayana-app-host --manifest-path source/host/app/Cargo.toml 2>&1 | tee artifacts/native-message-shipping/app-host-build.log
          binary=source/host/app/target/ci/mahayana-app-host
          test -x "$binary"
          shasum -a 256 "$binary" > artifacts/native-message-shipping/app-host-sha256.txt
          file "$binary" > artifacts/native-message-shipping/app-host-file.txt
          nm -gUj "$binary" > artifacts/native-message-shipping/app-host-defined-symbols.txt
          otool -L "$binary" > artifacts/native-message-shipping/app-host-linked-libraries.txt
          if grep -Eq '^_?fabushi_telegram_(create_client|create_persistent_client|execute|close_client|free_string|force_link)$' artifacts/native-message-shipping/app-host-defined-symbols.txt; then
            echo 'desktop AppHost exports a legacy direct Telegram C entry' >&2
            exit 1
          fi
          if grep -Eqi '(mahayana_runtime|fabushi[_-]telegram)' artifacts/native-message-shipping/app-host-linked-libraries.txt; then
            echo 'desktop AppHost loads a legacy runtime shared library' >&2
            exit 1
          fi
          cp "$binary" artifacts/native-message-shipping/mahayana-app-host
      - name: Native startup, desktop messaging boundary and account restart
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-app-host --lib telegram_composition_contract_tests -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/native-composition.log
          grep -Eq 'test result: ok\. 12 passed; 0 failed; 0 ignored; 0 measured;' artifacts/native-message-shipping/native-composition.log
          grep -Fx 'NMR-41 proxy preference matrix passed: orders=16 removals=48 repeated_no_ops=48 complete_permutations=6 complete_permutation_removals=18' artifacts/native-message-shipping/native-composition.log
          test "$(grep -c 'NMR-41 proxy removal passed:' artifacts/native-message-shipping/native-composition.log)" -eq 48
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-app-host --test native_desktop_account_handoff -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/native-startup-retention.log
          grep -Eq 'test result: ok\. 7 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/native-startup-retention.log
      - name: Retained messaging stores and Agent automation boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-feature-host --lib desktop_messaging_boundary_tests -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/featurehost-messaging-boundary.log
          grep -Eq 'test result: ok\. 7 passed; 0 failed; 0 ignored; 0 measured;' artifacts/native-message-shipping/featurehost-messaging-boundary.log
      - name: Retained Social recovery and desktop HTTP ownership
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-runtime --lib retained_social_recovery_tests -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/social-recovery.log
          grep -Eq 'test result: ok\. 9 passed; 0 failed;' artifacts/native-message-shipping/social-recovery.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib session_owned_platform_ -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/social-http-owner.log
          grep -Eq 'test result: ok\. 6 passed; 0 failed;' artifacts/native-message-shipping/social-http-owner.log
      - name: Direct Host and C ABI reject legacy handoff before storage
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-host --features test-support --lib legacy_handoff_tests -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/host-legacy-handoff.log
          grep -Eq 'test result: ok\. 6 passed; 0 failed; 0 ignored; 0 measured;' artifacts/native-message-shipping/host-legacy-handoff.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-ffi --lib -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/ffi-legacy-handoff.log
          grep -Eq 'test result: ok\. 7 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/ffi-legacy-handoff.log
      - name: Native CLI/gateway direct Host and approval boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest=source/mahayana/mahayana-rs/Cargo.toml
          cargo tree --locked --manifest-path "$manifest" -p mahayana-cli --edges normal,build 2>&1 | tee artifacts/native-message-shipping/cli-production-dependencies.log
          if grep -Eq '(mahayana-ffi|fabushi-telegram-runtime) v' artifacts/native-message-shipping/cli-production-dependencies.log; then
            echo 'production CLI or stdio gateway retains the legacy FFI/Telegram runtime dependency' >&2
            exit 1
          fi
          cargo test --locked --manifest-path "$manifest" -p mahayana-cli --bin mahayana direct_cli_host_contract_tests -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/cli-native-owner.log
          grep -Eq 'test result: ok\. 3 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/cli-native-owner.log
          cargo test --locked --manifest-path "$manifest" -p mahayana-cli --bin mahayana-gateway -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/gateway-native-owner.log
          grep -Eq 'test result: ok\. 5 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/gateway-native-owner.log
          cargo test --locked --manifest-path "$manifest" -p mahayana-gateway --lib -- --nocapture --test-threads=1 2>&1 | tee artifacts/native-message-shipping/gateway-contracts.log
          grep -Eq 'test result: ok\. 11 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/gateway-contracts.log
      - name: Verify generic Host has no direct Telegram adapter dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-host --edges normal --depth 1 2>&1 | tee artifacts/native-message-shipping/host-direct-dependencies.log
          if grep -q 'mahayana-telegram v' artifacts/native-message-shipping/host-direct-dependencies.log; then
            echo 'generic Host still depends directly on legacy Telegram adapter' >&2
            exit 1
          fi
      - name: Verify DNS and special-config response normalization
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-protocol --lib response_normalization:: 2>&1 | tee artifacts/native-message-shipping/telegram-response-normalization.log
          grep -Eq 'test result: ok\. 6 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-response-normalization.log
      - name: Verify bare future-salts parser against fixed-U wire
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-protocol --lib mtproto_service_builder_contract_tests::future_salts_ 2>&1 | tee artifacts/native-message-shipping/telegram-future-salts.log
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-future-salts.log
      - name: Verify protocol and TCP compatibility behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-protocol --test protocol_contract 2>&1 | tee artifacts/native-message-shipping/telegram-protocol-contract.log
          grep -Eq 'test result: ok\. 122 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/telegram-protocol-contract.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-network --test tcp_transport -- --include-ignored 2>&1 | tee artifacts/native-message-shipping/telegram-tcp-transport.log
          grep -Eq 'test result: ok\. 9 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/native-message-shipping/telegram-tcp-transport.log
      - name: Verify proxy rejection and Native credential boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p fabushi-telegram-runtime --lib network_proxy_contracts -- --nocapture 2>&1 | tee artifacts/native-message-shipping/telegram-proxy-boundary.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/telegram-proxy-boundary.log
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib native_schema_is_not_ci_export_and_has_no_ci_ttl_cap -- --nocapture 2>&1 | tee artifacts/native-message-shipping/native-credential-schema.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' artifacts/native-message-shipping/native-credential-schema.log
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked resource-copy implementation
        working-directory: desktop
        run: npm ci
      - name: Copy the actual AppHost into its package resource slot
        shell: bash
        env:
          FABUSHI_PACKAGE_REAL_APP_HOST: '1'
          FABUSHI_PACKAGE_APP_HOST_BINARY: ${{ github.workspace }}/source/host/app/target/ci/mahayana-app-host
          FABUSHI_PACKAGE_TARGET_SHA: ${{ github.sha }}
          FABUSHI_PACKAGE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/native-message-shipping/actual-package-resource
        run: |
          set -euo pipefail
          export FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256="$(awk 'NR == 1 { print $1 }' artifacts/native-message-shipping/app-host-sha256.txt)"
          if env -u FABUSHI_PACKAGE_APP_HOST_BINARY node --test --test-reporter=tap --test-name-pattern='NMR-40 actual' desktop/scripts/native-package-resources.contract.test.mjs > artifacts/native-message-shipping/package-missing-input-negative.log 2>&1; then
            echo 'actual package-copy invocation accepted a missing binary input' >&2
            exit 1
          fi
          grep -F 'FABUSHI_PACKAGE_APP_HOST_BINARY is required' artifacts/native-message-shipping/package-missing-input-negative.log
          if env FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256=invalid node --test --test-reporter=tap --test-name-pattern='NMR-40 actual' desktop/scripts/native-package-resources.contract.test.mjs > artifacts/native-message-shipping/package-invalid-hash-negative.log 2>&1; then
            echo 'actual package-copy invocation accepted an invalid build hash' >&2
            exit 1
          fi
          grep -F 'bind the hash recorded by the actual AppHost build step' artifacts/native-message-shipping/package-invalid-hash-negative.log
          mismatched_hash="0${FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256:1}"
          if [ "$mismatched_hash" = "$FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256" ]; then
            mismatched_hash="1${FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256:1}"
          fi
          if env FABUSHI_PACKAGE_APP_HOST_BUILD_SHA256="$mismatched_hash" node --test --test-reporter=tap --test-name-pattern='NMR-40 actual' desktop/scripts/native-package-resources.contract.test.mjs > artifacts/native-message-shipping/package-mismatched-hash-negative.log 2>&1; then
            echo 'actual package-copy invocation accepted a mismatched build hash' >&2
            exit 1
          fi
          grep -F 'copy only the same binary whose hash was captured after build' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          grep -Fx '# tests 1' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          grep -Fx '# pass 0' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          grep -Fx '# fail 1' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          grep -Fx '# cancelled 0' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          grep -Fx '# skipped 0' artifacts/native-message-shipping/package-mismatched-hash-negative.log
          test ! -e "$FABUSHI_PACKAGE_EVIDENCE_DIR"
          node --test --test-reporter=tap desktop/scripts/native-package-resources.contract.test.mjs 2>&1 | tee artifacts/native-message-shipping/actual-package-resource.log
          grep -Fx '# tests 4' artifacts/native-message-shipping/actual-package-resource.log
          grep -Fx '# pass 4' artifacts/native-message-shipping/actual-package-resource.log
          grep -Fx '# fail 0' artifacts/native-message-shipping/actual-package-resource.log
          grep -Fx '# cancelled 0' artifacts/native-message-shipping/actual-package-resource.log
          grep -Fx '# skipped 0' artifacts/native-message-shipping/actual-package-resource.log
          copied="$FABUSHI_PACKAGE_EVIDENCE_DIR/resources/bin/mahayana-app-host"
          cmp "$FABUSHI_PACKAGE_APP_HOST_BINARY" "$copied"
          file "$copied" > artifacts/native-message-shipping/copied-app-host-file.txt
          shasum -a 256 "$copied" > artifacts/native-message-shipping/copied-app-host-sha256.txt
          nm -gUj "$copied" > artifacts/native-message-shipping/copied-app-host-defined-symbols.txt
          otool -L "$copied" > artifacts/native-message-shipping/copied-app-host-linked-libraries.txt
          if grep -Eq '^_?fabushi_telegram_(create_client|create_persistent_client|execute|close_client|free_string|force_link)$' artifacts/native-message-shipping/copied-app-host-defined-symbols.txt; then
            echo 'copied AppHost exports a legacy direct Telegram C entry' >&2
            exit 1
          fi
          if grep -Eqi '(mahayana_runtime|fabushi[_-]telegram)' artifacts/native-message-shipping/copied-app-host-linked-libraries.txt; then
            echo 'copied AppHost loads a legacy runtime shared library' >&2
            exit 1
          fi
          printf '%s\n' 'Actual AppHost resource-copy evidence only; complete signed application/package acceptance remains open.' > "$FABUSHI_PACKAGE_EVIDENCE_DIR/scope.txt"
      - name: Diagnose locked shipping dependency drift (no acceptance)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for cargo_root in source/host/app source/mahayana/mahayana-rs; do
            if grep -Eq "cannot update the lock file .*$cargo_root/Cargo[.]lock|lock file .*$cargo_root/Cargo[.]lock.*needs to be updated" artifacts/native-message-shipping/*.log 2>/dev/null; then
              diagnostic_name=${cargo_root//\//-}
              cargo metadata --format-version 1 --manifest-path "$cargo_root/Cargo.toml" > /dev/null 2> "artifacts/native-message-shipping/$diagnostic_name-dependency-resolution.log" || true
            fi
          done
          git diff -- source/host/app/Cargo.lock source/mahayana/mahayana-rs/Cargo.lock > artifacts/native-message-shipping/dependency-drift.patch
          sed -n '1,260p' artifacts/native-message-shipping/dependency-drift.patch
      - name: Preserve shipping compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-message-shipping-compile-${{ github.sha }}
          path: artifacts/native-message-shipping
          if-no-files-found: error
