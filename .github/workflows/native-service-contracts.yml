      - 'frontend/src/recovered/features/recovered-conversation-infra.contract.test.ts'
      - 'frontend/src/production/coordinator-client.ts'
      - 'frontend/src/recovered/features/root-resilience/connection-state.ts'
      - 'frontend/src/production/transcript-projection*'
      - 'frontend/src/recovered/features/conversation/workspace/draft-state.ts'
      - 'frontend/src/recovered/features/conversation/workspace/draft-recovery.contract.test.ts'
      - 'source/shared/client-persistence-store*'
      - 'frontend/src/recovered/features/conversation/workspace/reply-thread-controller*'
      - 'desktop/e2e/native-message-author-recovery.spec.ts'
      - 'desktop/e2e/fixtures/native-message-author-recovery.tsx'
      - 'frontend/src/recovered/features/conversation/workspace/pagination*'
      - 'frontend/src/recovered/features/conversation/workspace/submission.ts'
      - 'source/electron-main/coordinator/rust-coordinator-carrier*'
      - 'source/product/fabushi/fabushi-account-service*'
      - 'source/electron-main/update/**'
      - 'source/electron-main/production-binding-providers.ts'
      - 'source/shared/node/fabushi-service-origin.ts'
      - 'frontend/src/recovered/contracts/desktop-bridge.ts'
      - 'frontend/src/recovered/features/settings/overlay/updates.ts'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/scripts/build-electron-runtime.mjs'
      - 'desktop/scripts/native-package-resources.contract.test.mjs'
      - 'desktop/scripts/reconcile-macos-update-metadata*.mjs'
      - 'source/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'source/mahayana/mahayana-rs/mahayana-host/**'
      - 'source/mahayana/mahayana-rs/mahayana-cli/**'
      - 'source/mahayana/mahayana-rs/mahayana-gateway/**'
      - 'source/mahayana/mahayana-rs/mahayana-gateway-peer/**'
      - 'source/mahayana/mahayana-rs/mahayana-product/**'
      - 'source/mahayana/mahayana-rs/mahayana-runtime/**'
      - 'source/mahayana/mahayana-rs/Cargo.lock'
      - 'source/mahayana/mahayana-rs/Cargo.toml'
      - 'projects/telegram-desktop-rust/upstream.lock.json'
      - '.github/workflows/native-service-contracts.yml'
      - '.github/workflows/release-macos-main.yml'
      - '.github/scripts/promote-miniapp-candidate*.mjs'
      - '.github/scripts/resolve-package-acceptance-scope*.mjs'
  pull_request:
    paths:
      - 'source/host/src/extensions/auth/**'
      - 'source/host/src/extensions/automations/**'
      - 'source/host/src/extensions/cross_user_sharing/xuser_sharing_environment.rs'
      - 'source/host/tests/xuser_sharing_environment_contract.rs'
      - 'source/host/tests/xuser_service_contract.rs'
      - 'source/host/src/extensions/box_store_sync/native_account_store.rs'
      - 'source/host/src/extensions/box_store_sync/native_object_transfer.rs'
      - 'source/host/src/extensions/box_store_sync/native_box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/box_object_store.rs'
      - 'source/host/src/extensions/box_store_sync/production.rs'
      - 'source/host/src/extensions/box_store_sync/extension.rs'
      - 'source/host/src/extensions/box_store_sync/box_copy_in.rs'
      - 'source/host/src/box/box_store_backend_policy.rs'
      - 'source/host/src/host_production_extensions.rs'
      - 'source/host/src/extensions/box_store_sync/mod.rs'
      - 'source/host/tests/extensions_auth_service_contract.rs'
      - 'source/host/tests/extensions_auth_credential_renewer_contract.rs'
      - 'source/host/tests/automations_backend_contract.rs'
      - 'source/host/tests/native_automation_transport_contract.rs'
      - 'source/host/tests/native_cloud_sync_contract.rs'
      - 'source/host/tests/native_account_store_contract.rs'
      - 'source/host/tests/native_object_transfer_contract.rs'
      - '.github/workflows/native-service-contracts.yml'
  workflow_dispatch:
    inputs:
      message_batch:
        description: Run the focused FBCP native message reconciliation batch
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-auth-and-journal:
    if: github.event_name != 'push' && !inputs.message_batch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: fdn-host-control-owner-contracts-ubuntu-1.97.1
      - name: Install existing Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Native credentials, issuer and HTTP journal contracts
        run: >-
          cargo test --manifest-path source/host/Cargo.toml
          --test extensions_auth_service_contract
          --test extensions_auth_credential_renewer_contract
          --test automations_backend_contract
          --test native_automation_transport_contract
          --test native_cloud_sync_contract
          --test automations_cloud_sync_contract
          --test native_account_store_contract
          --test native_object_transfer_contract
          --test box_store_sync_extension_contract
          --test box_foundation_contract
          --test box_store_sync_production_wiring_contract
          --test xuser_sharing_environment_contract
          --test xuser_service_contract
      - name: Record evidence scope
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Native credential and loopback HTTP transport evidence only; no deployed-cloud, full lifecycle or packaged-platform acceptance.' >> "$GITHUB_STEP_SUMMARY"
  gateway-peer-durability:
    if: github.event_name == 'push' || inputs.message_batch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact peer source and platform scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/gateway-peer-durability
          git rev-parse HEAD > artifacts/gateway-peer-durability/target-sha.txt
          printf '%s\n' 'FBCP-NMR-001/NMR-PEER-DURABILITY-01; actual file transactions and OS locks; Host handoff, replay reconciliation, power-loss and mixed-version acceptance remain open' > artifacts/gateway-peer-durability/scope.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/mahayana/mahayana-rs -> target
          shared-key: gateway-peer-durability-${{ matrix.os }}-1.97.1
      - name: Complete peer state and actual filesystem contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/mahayana/mahayana-rs/Cargo.toml -p mahayana-gateway-peer --lib -- --nocapture --test-threads=1 2>&1 | tee artifacts/gateway-peer-durability/peer-contracts.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' artifacts/gateway-peer-durability/peer-contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-peer-durability-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/gateway-peer-durability
          if-no-files-found: error
  native-message-reconciliation:
    if: github.event_name == 'push' || inputs.message_batch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind exact source and batch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p artifacts/native-message
          git rev-parse HEAD > artifacts/native-message/target-sha.txt
          printf '%s\n' 'FBCP-NMR-001; source-informed U=f985723b552b30fe1c17d377d57f44e61a15a8c4; loopback integration only' > artifacts/native-message/scope.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: desktop-restored-rust-1.97.1
      - name: Install existing Linux Host native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Transcript compaction and recovery registration contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib conversation_state_binary::tests -- --nocapture 2>&1 | tee artifacts/native-message/transcript-recovery.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/transcript-recovery.log
          grep -Fx 'test transcript_mirror::conversation_state_binary::tests::recovery_fields_decode_token_details_and_turn_timing ... ok' artifacts/native-message/transcript-recovery.log
          grep -Fx 'test transcript_mirror::conversation_state_binary::tests::stale_token_details_can_be_removed_without_reencoding_other_fields ... ok' artifacts/native-message/transcript-recovery.log
      - name: Human ingress, settlement and restart contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test session_gateway_contract shipping_human_ -- --nocapture 2>&1 | tee artifacts/native-message/session-gateway.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/session-gateway.log
          grep -F 'test shipping_human_forward_active_batch_does_not_block_destination_or_unrelated_history ... ok' artifacts/native-message/session-gateway.log
          grep -F 'test shipping_human_roster_recovery_attempts_failed_forward_once_per_invocation_and_reopens ... ok' artifacts/native-message/session-gateway.log
          grep -F 'test shipping_human_roster_binds_active_user_before_http_and_preserves_compatible_api ... ok' artifacts/native-message/session-gateway.log
          grep -F 'test shipping_human_roster_rejects_six_streaming_credential_rotations_before_effects_and_recovers ... ok' artifacts/native-message/session-gateway.log
          grep -Fq 'shipping_human_forward_recovery_reports_storage_failures_and_preserves_account_policy ... ok' artifacts/native-message/session-gateway.log
          for case_name in \
            shipping_human_retry_reopens_attachment_reply_and_coalesces_same_nonce_without_reupload \
            shipping_human_retry_rejects_invalid_identity_and_payload_without_http_or_mutation \
            shipping_human_retry_preserves_forward_source_policy_and_refuses_generic_ownership_bypass \
            shipping_human_retry_fences_account_and_issuer_changes_and_restores_durable_failure \
            shipping_human_committed_refresh_reaches_production_transcript_bus \
            shipping_human_transcript_feed_reads_current_owner_and_deduplicates_ids \
            shipping_human_transcript_feed_rejects_foreign_roots_agents_and_unauthorized_origins \
            shipping_human_transcript_feed_disposes_copied_callbacks_before_replacement \
            shipping_human_offline_origin_is_explicit_and_survives_settlement_and_restart \
            shipping_human_reaction_rejection_preserves_intent_while_history_progresses_after_restart \
            shipping_human_roster_reaction_rejection_does_not_starve_other_conversations_or_calls \
            shipping_human_reaction_rejection_continuation_refuses_changed_credentials_before_downstream_work \
            shipping_human_reaction_rejection_keeps_admission_and_protocol_failures_fail_closed \
            shipping_human_history_coverage_incomplete_signal_is_exposed_until_sync_reaches_end; do
            grep -Fx "test $case_name ... ok" artifacts/native-message/session-gateway.log
          done
      - name: Human resource upload size and bounded-read contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib native_message_resource_upload_tests -- --nocapture 2>&1 | tee artifacts/native-message/resource-upload-bounds.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/resource-upload-bounds.log
          grep -F 'shipping_human_forward_restart_corruption_fails_closed_and_recovers_exact_journal ... ok' artifacts/native-message/session-gateway.log
          grep -F 'shipping_human_pending_reply_chain_recovers_after_restart_in_canonical_order ... ok' artifacts/native-message/session-gateway.log
          grep -F 'shipping_human_historical_reply_aliases_require_unique_local_canonical_parent ... ok' artifacts/native-message/session-gateway.log
          grep -F 'shipping_human_reply_identity_transaction_rolls_back_children_and_recovers_after_reopen ... ok' artifacts/native-message/session-gateway.log
      - name: Concurrent Human creation and non-destructive initialization recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib human_creation_tests -- --nocapture 2>&1 | tee artifacts/native-message/human-creation.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured;' artifacts/native-message/human-creation.log
          grep -Fq 'retained_wal_creation_keeps_committed_identity_and_transcript_after_reopen ... ok' artifacts/native-message/human-creation.log
          grep -Fq 'human_format_probe_preserves_posix_locks_against_an_external_writer ... ok' artifacts/native-message/human-creation.log
          cargo test --locked --manifest-path source/host/Cargo.toml --lib human_creation_storage_tests -- --nocapture 2>&1 | tee artifacts/native-message/human-creation-storage.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured;' artifacts/native-message/human-creation-storage.log
      - name: Durable forwarding sharebox owner contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib sharebox_shipping_tests -- --nocapture 2>&1 | tee artifacts/native-message/forward-sharebox.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/forward-sharebox.log
      - name: Durable forwarding journal and stale-write CAS contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib forward_batch_journal::tests -- --nocapture 2>&1 | tee artifacts/native-message/forward-batches.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/forward-batches.log
          grep -F 'stale_same_batch_snapshot_cannot_regress_completed_destination ... ok' artifacts/native-message/forward-batches.log
          grep -F 'concurrent_forward_metadata_writers_have_one_durable_winner_and_recover ... ok' artifacts/native-message/forward-batches.log
      - name: Preserve Agent send nonce boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test send_pipeline_nonce_boundary_contract -- --nocapture 2>&1 | tee artifacts/native-message/agent-send-nonce.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/agent-send-nonce.log
      - name: Prove completed HTTP credential fencing at settlement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --lib shipping_human_settlement_credential_ -- --nocapture 2>&1 | tee artifacts/native-message/settlement-credential.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/settlement-credential.log
      - name: Authenticated forward and identity-only retry gateway HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml --test gateway_server_contract gateway_forward_recipient_methods_are_authenticated_and_unknown_methods_stay_closed -- --nocapture 2>&1 | tee artifacts/native-message/forward-http.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/forward-http.log
      - name: Canonical Search merges authenticated Human and Agent conversations
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --lib recipient_policy_tests -- --nocapture 2>&1 | tee artifacts/native-message/messaging-core-search.log
          grep -Fx 'test search::recipient_policy_tests::forward_origin_visibility_and_multi_term_field_matching_enforce_domain_policy ... ok' artifacts/native-message/messaging-core-search.log
          grep -Fx 'test search::recipient_policy_tests::search_index_supports_scoped_media_files_links_collections_and_filename_matching ... ok' artifacts/native-message/messaging-core-search.log
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --lib child_destination_tests -- --nocapture 2>&1 | tee artifacts/native-message/child-destination-tests.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/child-destination-tests.log
          grep -Fx 'test conversation::child_destination_tests::child_runtime_removes_deleted_messages_and_clears_matching_draft_reply_without_losing_text ... ok' artifacts/native-message/child-destination-tests.log
          grep -Fx 'test conversation::child_destination_tests::child_runtime_rekeys_local_to_server_message_id_and_invalidates_bottom_window ... ok' artifacts/native-message/child-destination-tests.log
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --test m5_contacts_groups_contract -- --nocapture 2>&1 | tee artifacts/native-message/m5-contacts-groups.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/m5-contacts-groups.log
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --test messaging_contract -- --nocapture 2>&1 | tee artifacts/native-message/messaging-contract.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/messaging-contract.log
          grep -Fx 'test story_sibling_resolution_fences_stale_suggestions_contacts_visibility_and_media_fallback ... ok' artifacts/native-message/messaging-contract.log
          grep -Fx 'test send_menu_mode_and_applicability_enforces_paid_silent_only_reminder_and_scheduled_to_user ... ok' artifacts/native-message/messaging-contract.log
          grep -Fx 'test paid_send_plan_approval_consumption_and_story_share_at_time_revalidation ... ok' artifacts/native-message/messaging-contract.log
          grep -Fx 'test forward_panel_option_cycle_draft_lifecycle_forced_info_and_custom_emoji_stripping ... ok' artifacts/native-message/messaging-contract.log
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --test service_contract -- --nocapture 2>&1 | tee artifacts/native-message/service-contract.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/service-contract.log
          grep -Fx 'test presence_triggered_send_enforces_last_seen_privacy_cancellation_reschedule_and_terminal_policy_failure ... ok' artifacts/native-message/service-contract.log
          cargo test --locked --manifest-path source/host/Cargo.toml -p fabushi-messaging-core --test m6_channels_topics_contract -- --nocapture 2>&1 | tee artifacts/native-message/m6-channels-topics.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/m6-channels-topics.log
          grep -Fx 'test deleting_messages_clears_reply_drafts_without_losing_text_and_reconciles_child_windows ... ok' artifacts/native-message/m6-channels-topics.log
          grep -Fx 'test share_recipient_search_uses_canonical_typed_permission_axes_before_exposure ... ok' artifacts/native-message/m5-contacts-groups.log
          grep -Fx 'test typed_share_permission_fields_keep_legacy_persistence_fail_closed ... ok' artifacts/native-message/m5-contacts-groups.log
          cargo test --locked --manifest-path source/host/Cargo.toml --test roster_search_contract -- --nocapture 2>&1 | tee artifacts/native-message/roster-search.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' artifacts/native-message/roster-search.log
          grep -Fx 'test canonical_search_merges_authenticated_human_and_agent_conversations_and_enforces_account_isolation ... ok' artifacts/native-message/roster-search.log
      - name: Diagnose locked Session dependency drift (no acceptance)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'cannot update the lock file|lock file.*needs to be updated' artifacts/native-message/*.log 2>/dev/null; then
