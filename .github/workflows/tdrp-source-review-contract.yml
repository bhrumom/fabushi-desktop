name: TDRP source review contract
on:
  push:
    branches: [codex/tdrp-risk-based-source-review-20261102]
    paths:
      - scripts/tdrp-source-review*.mjs
      - scripts/validate-tdrp-revision9-authority.mjs
      - .github/workflows/tdrp-source-review-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tdrp-source-review.test.mjs
      - run: node --check scripts/validate-tdrp-revision9-authority.mjs
