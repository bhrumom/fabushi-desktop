name: Bot Mini App authoring and GitHub delivery
on:
  pull_request:
    paths:
      - 'source/host/src/runner/tools/miniapp*'
      - 'source/host/src/runner/tools/mod.rs'
      - 'source/host/src/runner/tools/turn_toolset.rs'
      - 'source/host/src/runner/system_prompt_assembly.rs'
      - 'source/host/tests/miniapp*'
      - 'scripts/miniapp-github-roundtrip.py'
      - '.github/workflows/bot-miniapp-authoring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Reserve bounded SDK fixture storage
        run: python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+16777216"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: SDK source and package transactions
        run: python3 source/host/tests/miniapp_authoring_sdk_test.py
  bot-tool-github:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      MINIAPP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reserve compiler, dependency, cache and fixture storage
        run: python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+12884901888"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MINIAPP_SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: miniapp-bot-authoring-1.97.1
      - name: Reserve disk and prepare an exclusively owned disposable Bot workspace
        run: |
          python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+8589934592"
          test ! -e /workspace
          sudo install -d -m 700 -o "$(id -un)" /workspace
      - name: Run the real Bot tool chain and permission/cancellation controls
        env:
          FABUSHI_MINIAPP_BOT_EXECUTION: '1'
          FABUSHI_MINIAPP_EXPORT: ${{ runner.temp }}/bot-miniapp-export.json
        run: cargo test --locked --features actions-miniapp-bot --manifest-path source/host/Cargo.toml --test miniapp_authoring_tool_contract
      - name: Verify remote GitHub source, exact preparation and owned branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          FABUSHI_MINIAPP_EXPORT: ${{ runner.temp }}/bot-miniapp-export.json
          MINIAPP_GITHUB_REPORT: ${{ runner.temp }}/bot-miniapp-github-report.json
        run: python3 scripts/miniapp-github-roundtrip.py
      - uses: actions/upload-artifact@v7
        with:
          name: bot-miniapp-github-${{ env.MINIAPP_SOURCE_SHA }}
          path: ${{ runner.temp }}/bot-miniapp-github-report.json
          if-no-files-found: error
