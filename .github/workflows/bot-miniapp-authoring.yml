name: Bot Mini App authoring and GitHub delivery
on:
  pull_request:
    paths:
      - 'source/host/src/runner/tools/miniapp*'
      - 'source/host/src/runner/tools/mod.rs'
      - 'source/host/src/runner/tools/turn_toolset.rs'
      - 'source/host/src/runner/system_prompt_assembly.rs'
      - 'source/host/src/runner/system_prompt.rs'
      - 'source/host/src/runner/box_reference_docs.rs'
      - 'source/host/src/runner/box_tool_access.rs'
      - 'source/host/src/runner/remote_box_resources.rs'
      - 'source/host/src/ports/box.rs'
      - 'source/host/src/box/loopback_sand_box.rs'
      - 'source/host/tests/remote_box_resources_contract.rs'
      - 'source/host/tests/box_foundation_contract.rs'
      - 'source/host/tests/miniapp*'
      - 'scripts/miniapp-github-roundtrip.py'
      - '.github/workflows/bot-miniapp-authoring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Reserve bounded SDK fixture storage
        run: python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+2147483648"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: SDK source, import/read and package transactions
        run: python3 source/host/tests/miniapp_authoring_sdk_test.py
      - name: Generated GitHub publication and uncertainty contracts (no model or user credentials)
        run: python3 source/host/tests/miniapp_publication_test.py
  bot-tool-github:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      MINIAPP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reserve compiler, dependency, cache and fixture storage
        run: python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+12884901888"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MINIAPP_SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/host -> target
          shared-key: miniapp-bot-authoring-1.97.1
      - name: Install existing Linux native computer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev
      - name: Reserve disk and prepare an exclusively owned disposable Bot workspace
        run: |
          python3 -c "import shutil; u=shutil.disk_usage('.'); assert u.free >= max(1073741824,u.total//20)+8589934592"
          test ! -e /workspace
          sudo install -d -m 700 -o "$(id -un)" /workspace
      - name: Run the real Bot tool chain and permission/cancellation controls
        env:
          FABUSHI_MINIAPP_BOT_EXECUTION: '1'
          FABUSHI_MINIAPP_EXPORT: ${{ runner.temp }}/bot-miniapp-export.json
        run: |
          cargo metadata --locked --format-version 1 --manifest-path source/host/Cargo.toml > /dev/null
          cargo test --locked --features actions-miniapp-bot --manifest-path source/host/Cargo.toml --test miniapp_authoring_tool_contract --test remote_box_resources_contract --test box_foundation_contract
      - name: Preserve resolved lockfile for exact-source reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-miniapp-resolved-lock-${{ env.MINIAPP_SOURCE_SHA }}
          path: source/host/Cargo.lock
          if-no-files-found: error
      - name: Verify remote GitHub source, exact preparation and owned branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          FABUSHI_MINIAPP_EXPORT: ${{ runner.temp }}/bot-miniapp-export.json
          MINIAPP_GITHUB_REPORT: ${{ runner.temp }}/bot-miniapp-github-report.json
        run: python3 scripts/miniapp-github-roundtrip.py
      - uses: actions/upload-artifact@v7
        with:
          name: bot-miniapp-github-${{ env.MINIAPP_SOURCE_SHA }}
          path: ${{ runner.temp }}/bot-miniapp-github-report.json
          if-no-files-found: error
