name: Install-owned Mini App native runtime
on:
  pull_request:
    paths:
      - 'source/electron-main/mcp/miniapp-native-runtime*'
      - 'source/electron-main/mcp/miniapp-production*'
      - 'source/electron-main/mcp/miniapp-window*'
      - '.github/workflows/miniapp-native-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'source/electron-main/mcp/miniapp-native-runtime*'
      - 'source/electron-main/mcp/miniapp-production*'
      - 'source/electron-main/mcp/miniapp-window*'
jobs:
  native-runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npx --yes tsx@4.21.0 --test source/electron-main/mcp/miniapp-native-runtime.contract.test.ts source/electron-main/mcp/miniapp-production.contract.test.ts source/electron-main/mcp/miniapp-window.contract.test.ts
